# Milexium local development stack (ADR-0026).
#
# Brings up the data-plane dependencies the platform targets: PostgreSQL/PostGIS
# (authoritative operational + geospatial state) and MinIO (S3-compatible object
# storage for immutable artifacts). An OpenTelemetry collector is included for
# the cross-language observability story.
#
# Requires Docker (not yet installed on the dev machine -- WSL2 needs fixing
# first; see IMPLEMENTATION_STATUS infra notes). Run once Docker is available:
#     docker compose -f infra/compose/docker-compose.yml up -d
#
# Secrets are supplied externally via env vars (never baked into the image),
# per the security posture in blueprint/10. Copy infra/compose/.env.example to
# infra/compose/.env and set real values before `up`.

services:
  postgres:
    # PostGIS image = PostgreSQL 16 + PostGIS 3.4. Pin to a digest for
    # reproducibility once first pulled (docker inspect ... --format '{{index .RepoDigests 0}}').
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milexium_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-milexium_dev}
    ports:
      # Host 5433 (not 5432) so the containerized PostGIS coexists with the
      # natively-installed PostgreSQL 17 that already holds 5432 (ADR-0006).
      - "5433:5432"
    volumes:
      - milexium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milexium_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/compose/.env}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - milexium_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - postgres

# Named volumes so state survives `down` (use `down -v` to wipe).
volumes:
  milexium_pgdata:
  milexium_minio:
