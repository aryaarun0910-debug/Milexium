[project]
name = "milexium"
version = "0.1.0"
description = "Milexium: explainable demand forecasting and scheduling evidence for paratransit and NEMT operators."
# 3.14 because app/canonical uses the stdlib uuid.uuid7() added there;
# this repo's scripts already run under `py -3` -> 3.14 (see __pycache__ tags).
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.0",
    "numpy==2.3.5",
    "xgboost==3.2.0",
    "scikit-learn==1.8.0",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "fastapi==0.136.3",
    "matplotlib==3.10.8",
    # GTFS-Realtime adapter (app/connect/gtfs_realtime.py): Google's official
    # protobuf bindings for the FeedMessage schema, plus its protobuf runtime.
    "gtfs-realtime-bindings==2.1.0",
    "protobuf==6.33.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
# Added only when Program C actually connects to the installed PostgreSQL
# instance (see knowledge/architecture/decisions/0004-sqlite-now-postgres-production.md);
# not installed yet, listed here so the intended pin is visible.
postgres = [
    "psycopg[binary]>=3.2,<3.3",
]
# CP-SAT backend for the Program F solver portfolio (ADR-0060). MUST be
# installed in CI: without it every CP-SAT test skips, and a suite that is green
# because it ran nothing is the exact failure mode this repo keeps finding. The
# 9.15 pin is deliberate -- it is the first release publishing a native CPython
# 3.14 ABI wheel (cp314), and it renamed CpSolver.DeterministicTime() to the
# deterministic_time property, so code written against older docs breaks on it.
solver = [
    "ortools>=9.15,<10",
]
# S3-compatible object storage (app/estate/object_store.py, ADR-0032):
# the dev MinIO container from platform/infra/compose. Optional -- the object-store test
# skips when it's absent, so CI (which doesn't install this extra) stays green.
objectstore = [
    "minio>=7,<8",
]
# Formal methods (Program G, knowledge/architecture/formal/): the free z3 SMT solver used
# to machine-check the ServiceRequest state-machine and hash-chain invariants
# (ADR-0033). The conformance test importorskip's z3 so a machine without it
# skips cleanly; CI installs this extra so the proofs actually RUN there.
formal = [
    "z3-solver==5.0.0.0",
]

[tool.pytest.ini_options]
# "." makes `app.*` (and the `demo`/`research` scripts) importable, as before the
# MX-REPO-REORG-014 layout change. The other two entries keep the module NAMES of
# the two non-app trees stable across that move rather than renaming 45 imports:
#   evidence/  -> `conformance.*` (evidence/conformance/__init__.py)
#   platform/  -> `tools.*`       (evidence/conformance imports two tool modules)
# `platform.tools` is not an option: `platform` is a stdlib MODULE, so it can
# never be a package prefix. A bare `platform/` directory does not shadow it
# (a directory without __init__.py is only a namespace portion, and a real
# module found later on sys.path still wins), but `import platform.tools` would
# always fail with "'platform' is not a package".
pythonpath = [".", "evidence", "platform"]
testpaths = [
    "app", "evidence/conformance", "realdata",
    "business/ntd", "business/reference_agency", "platform/tools",
]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
