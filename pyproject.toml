[project]
name = "milexium"
version = "0.1.0"
description = "Milexium: explainable demand forecasting and scheduling evidence for paratransit and NEMT operators."
# 3.14 because themis/canonical uses the stdlib uuid.uuid7() added there;
# this repo's scripts already run under `py -3` -> 3.14 (see __pycache__ tags).
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.0",
    "numpy==2.3.5",
    "xgboost==3.2.0",
    "scikit-learn==1.8.0",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "fastapi==0.136.3",
    "matplotlib==3.10.8",
    # GTFS-Realtime adapter (themis/connect/gtfs_realtime.py): Google's official
    # protobuf bindings for the FeedMessage schema, plus its protobuf runtime.
    "gtfs-realtime-bindings==2.1.0",
    "protobuf==6.33.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
# Added only when Program C actually connects to the installed PostgreSQL
# instance (see forge/knowledge/architecture/decisions/0004-sqlite-now-postgres-production.md);
# not installed yet, listed here so the intended pin is visible.
postgres = [
    "psycopg[binary]>=3.2,<3.3",
]
# CP-SAT backend for the Program F solver portfolio (ADR-0060). MUST be
# installed in CI: without it every CP-SAT test skips, and a suite that is green
# because it ran nothing is the exact failure mode this repo keeps finding. The
# 9.15 pin is deliberate -- it is the first release publishing a native CPython
# 3.14 ABI wheel (cp314), and it renamed CpSolver.DeterministicTime() to the
# deterministic_time property, so code written against older docs breaks on it.
solver = [
    "ortools>=9.15,<10",
]
# S3-compatible object storage (themis/estate/object_store.py, ADR-0032):
# the dev MinIO container from talos/infra/compose. Optional -- the object-store test
# skips when it's absent, so CI (which doesn't install this extra) stays green.
objectstore = [
    "minio>=7,<8",
]
# Formal methods (Program G, forge/knowledge/architecture/formal/): the free z3 SMT solver used
# to machine-check the ServiceRequest state-machine and hash-chain invariants
# (ADR-0033). The conformance test importorskip's z3 so a machine without it
# skips cleanly; CI installs this extra so the proofs actually RUN there.
formal = [
    "z3-solver==5.0.0.0",
]

[tool.pytest.ini_options]
# "." makes the five authority packages (`themis.*`, `metis.*`, `aletheia.*`,
# `argus.*`, `talos.*`) plus `data.curated` importable.
#
# "aletheia" is the ONE workaround that survives MX-REPO-AUTHORITY-RENAME-015.
# It keeps the conformance tree's module identity byte-identical: pytest names a
# test under aletheia/conformance/fixtures/ by walking up while __init__.py
# exists, which stops at aletheia/ (a namespace portion, no __init__.py), so the
# module is `conformance.fixtures.test_*` and the 46 `from conformance.fixtures
# ...` imports resolve against the SAME module object. Renaming them to
# `aletheia.conformance.*` would instead require aletheia/__init__.py, which
# would give every fixture module two identities at once.
#
# The `platform` entry is GONE. ADR-0075 needed it because `platform` is a stdlib
# MODULE and `platform.tools` could never be a package prefix. `talos` is not,
# so the two `from tools.*` imports became `from talos.tools.*` and the entry --
# with the top-level shadowing surface it created (contracts, infra, ops) -- was
# deleted rather than renamed.
pythonpath = [".", "aletheia"]
testpaths = [
    # the same scope as before, redistributed: `app` was the four authority
    # packages, `evidence/conformance` is now `aletheia/conformance`.
    "themis", "metis", "aletheia", "argus",
    "data/curated",
    "forge/business/ntd", "forge/business/reference_agency", "talos/tools",
]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["themis*", "metis*", "aletheia*", "argus*"]
