id: MX-I-VERIFICATION-FOLD-IN-002
status: completed
completed_date: "2026-07-23"
objective: >
  Extend EvidencePacket's integrity_verified to aggregate schema and
  state-transition verification alongside the existing hash-chain check,
  closing (or honestly documenting as structurally inapplicable) the gap
  Packet MX-I-EVIDENCE-EXPERIENCE-IR-001 flagged in its own report.
owned_paths:
  - aletheia/evidence/models.py
  - aletheia/evidence/builder.py
  - forge/knowledge/architecture/decisions/0012-evidence-state-check-structural-gap.md
read_only_dependencies:
  - themis/canonical/ (DecisionEvent, Outcome, ServiceRequestState -- schema only)
  - aletheia/verify/ (verify_against_schema, verify_state_sequence, verify_chain -- called, not reimplemented)
normative_contracts:
  - blueprint/07-explain-replay-and-evidence.md (expansion plan)
  - forge/knowledge/architecture/decisions/0009-evidence-ir-v0-1-conventions.md
inputs_and_fixtures:
  - aletheia/conformance/fixtures/evidence_builders.py
required_outputs:
  - aletheia/evidence/models.py (schema_violations, state_check_applicable, state_violations fields)
  - aletheia/evidence/builder.py (aggregated integrity_verified)
  - aletheia/conformance/property-tests/test_evidence_packet_verification.py
  - aletheia/conformance/adversarial/test_evidence_schema_tamper.py
acceptance_commands:
  - "py -3 -m pytest aletheia/evidence/ aletheia/conformance/property-tests/test_evidence_packet_verification.py aletheia/conformance/adversarial/test_evidence_schema_tamper.py -v"
performance_budget: {}
security_and_privacy_invariants:
  - "integrity_verified is true only when every applicable independent check passes -- never a claim, always the actual aggregated result"
failure_injections:
  - "DecisionEvent built via model_construct (bypassing validation) with an invalid actor_type -> schema check catches it while hash chain stays intact"
  - "build_experience_packet refuses a schema-invalid packet, same as it already refuses a hash-broken one"
compatibility_matrix: []
evidence_to_emit:
  - "5 new passing tests; all pre-existing evidence tests pass unmodified (new fields have defaults)"
forbidden_interface_changes:
  - "build_evidence_packet's (events, raw_rows, outcome=None) signature is unchanged"
upstream_blockers:
  - "state-transition check has no reconstructable ServiceRequestState sequence in this builder's inputs -- structural gap, see ADR-0012"
downstream_consumers:
  - Future Program H (replay) evidence consumption
