id: MX-EVIDENCE-REGISTRY-001
status: completed
completed_date: "2026-07-24"
objective: >
  A machine-readable registry mapping every public Milexium number to its
  source, hash, split, status, and limitation, plus a verifier -- so a third
  party can trace/verify every claim without a pilot.
owned_paths: [talos/tools/build_evidence_registry.py, aletheia/artifacts/evidence-registry/, forge/knowledge/architecture/decisions/0025-machine-checkable-evidence-artifacts.md]
read_only_dependencies: [data/curated/metrics_real.json, data/curated/metrics_ntd_monthly.json, data/curated/manifests/*.json, data/curated/leakage_audit_report.json, aletheia/benchmarks/quality/darp_results.json, forge/knowledge/docs/MODEL_CARDS.md, themis/canonical/__init__.py]
normative_contracts: [blueprint/09, forge/knowledge/docs/MASTER_ROADMAP.md (evidence-registry concept)]
required_outputs: [talos/tools/build_evidence_registry.py, aletheia/artifacts/evidence-registry/{registry.json,README.md}, aletheia/conformance/property-tests/test_evidence_registry.py]
acceptance_commands: ["py -3 -m pytest aletheia/conformance/property-tests/test_evidence_registry.py -v"]
security_and_privacy_invariants:
  - "generated never authored: a value is emitted only if read from a committed source"
  - "verify_evidence_registry checks every source exists, every present-panel sha256 matches, every claim has a limitation + status; untraceable claim flagged"
failure_injections: ["4 deliberately-broken registries (missing source, empty sources, blank limitation, bad status, sha256 mismatch) each flagged"]
evidence_to_emit: ["9 tests; 20 claims + 8 provenance manifests; self-verifies clean; surfaced README-vs-metrics drift"]
upstream_blockers: []
downstream_consumers: [YC/procurement evidence; the anti-overclaim single source of truth]
