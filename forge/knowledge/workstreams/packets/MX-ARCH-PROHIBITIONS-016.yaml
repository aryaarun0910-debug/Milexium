  # were never edited: probes were NEW throwaway modules inside the tree, or
  # in-memory mutations of the live model objects.
  dependency_direction:
    - "metis/forecast/*.py importing argus.sdk -> RED, names file, line, statement and the metis rule"
    - "themis/canonical/*.py importing aletheia.verify -> RED on the shipping rule AND on the themis keystone test"
    - "themis/canonical/*.py importing forge.knowledge.research -> RED on all three (shipping, themis, forge)"
    - "the same import placed inside `def build(): if: try:` -> RED, line 4 -- the walker is not reading the header block"
    - "a docstring naming argus/talos/forge plus `COMMENT = 'argus'` -> GREEN (correct: prose is not an edge)"
    - "a new argus/ui/ tree -> POLICED by default (the fail-safe), not exempted"
    - "argus/sdk/*.py doing spec_from_file_location on a forge path -> RED as a third forge executor"
    - "a forge path read with .read_text() and no loader -> GREEN (correct: a citation is not a dependency)"
    - "spec_from_file_location on a talos path -> GREEN (correct: the target is not forge)"
  metis:
    - "from themis.canonical.storage import SqliteCanonicalStore -> RED"
    - "import sqlite3 -> RED (the channel a Themis-module deny list cannot see)"
    - "from themis.core.model_registry import PersistentModelRegistry -> RED"
    - "from themis.canonical.state_machine import next_state -> RED (authorisation)"
    - "from themis.canonical.events import compute_hash -> RED (a non-writer, not on the allow list)"
    - "from themis.connect.adapter import SourceAdapter -> RED on the allow list ONLY, isolating it from the deny list"
    - "store.append_event(...) on a duck-typed argument with no import -> RED"
    - "registry.promote('model-1') -> RED"
    - "open(Path('out.json'), 'w') -> RED"
    - "list.append / set.add / dict.update / str.replace -> GREEN (correct: a rule that fired here would be deleted)"
    - "WRITER_DEFINITIONS and DRIVERS emptied -> RED, naming all 9 stores it stopped classifying"
  themis:
    - "SnapshotFact.quality given a default -> RED"
    - "MatchCandidate.probability defaulted to 1.0 -> RED"
    - "a new ontology model with a probability, no source, embedded nowhere -> RED"
    - "the same model embedded in a receipt-stamped record -> GREEN (correct: traceable through its holder)"
    - "... and additionally in one careless container -> RED (traceability through holders is ALL, not ANY)"
    - "MatchCandidate unfrozen and opened to extra fields -> RED"
    - "source_record_id made required (the optional/required split moves) -> RED"
    - "the model survey narrowed to one module -> RED"
    - "UNCERTAIN_VALUE_FIELDS pointed at a name nothing uses -> RED"
    - "resolving to a unique top candidate at 0.61 -> GREEN, and the MUTATION was wrong (FINDING 4)"
  argus:
    - "RowValidation(reason='most likely a capacity constraint') -> RED"
    - "RowValidation(confidence=0.87) -> RED on both the traceability and the claim rule"
    - "RowValidation(failed_field=f'{column} looks wrong') -> RED"
    - "import anthropic in argus/api -> RED, with the message demanding the traceability rule be extended first"
    - "import xgboost -> RED on the model/solver rule only"
    - "import pandas -> RED on the numeric-library rule only (the weakest of the three, and it says so)"
    - "class DenialReason(str, Enum) in argus -> RED"
    - "random.shuffle(rows) -> RED; random.Random(SEED).shuffle(rows) -> GREEN (correct: the seeded form is in use today)"
    - "an SDK method returning 'vehicle capacity exhausted' / 0.9 / an f-string / a bare 1 -> RED (4 of them)"
    - "canonical_columns replaced with an EQUAL but non-identical tuple -> RED (`is`, not `==`, is what catches the copy)"
    - "a new unclassified *Response model in argus/api/app.py -> RED"
    - "honest pass-through: len(x) == 0, `None if q is None else q.reason`, a comprehension over an input, an imported constant -> GREEN"

anti_vacuity_measures:
  - "Every file asserts the population it walked. 225 modules, 80+ shipping, 10+ ontology models, 20+ response fields, 8+ claim arguments, 8+ SDK returns -- floors, not counts, so deleting a module does not fail the suite spuriously but a moved root does."
  - "Every 'the offender list is empty' rule has a paired test that feeds the SAME checker a violating case, because a checker that never returns anything satisfies every such assertion."
  - "Every over-approximating detector is shown BOTH sides. The forge-executor detector must fire on a dynamic load and must NOT fire on a citation; the write-call detector must fire on store.append_event and must NOT fire on list.append; the randomness detector must fire on random.shuffle and must NOT fire on random.Random(SEED).shuffle. A permanent red gets deleted, and deleting it would be the right call."
  - "The would_resolve property test counts both branches (>=2 resolved, >=4 refused). A threshold of 0.0 or 1.0 would make one branch unreachable and the assertion would still be green."
  - "Every cross-product refusal has a positive control. Without it, a validator that refused EVERY repair would satisfy all 32 refusals and the package would have silently lost the ability to record a legitimate unit normalisation."
  - "The Themis persistence surface is DERIVED from Themis and checked in both directions -- a known-writer list it must contain and a known-types list it must not -- so it can neither collapse to nothing nor swell to everything."
  - "Grandfather clauses are pinned in BOTH directions: the forge-executor set fails on a third entry AND on a removed one; the Metis finding fails if the import it records disappears."

status_honesty:
  fully_enforced:
    - "Metis: alters no canonical state, authorises no operation. 8 independent checks, 11 probes."
    - "forge isolation: no import anywhere; the dynamic-load channel pinned to its 2 known cases."
    - "dependency direction: asserted against the AST for every module in the five layers."
  partially_enforced:
    - >
      Themis: an inference that DECLARES itself cannot be stored as an observation.
      An inference that LIES cannot be caught -- the value is a float and Python
      cannot tell a measured 12.0 from a guessed one. Stated in the module
      docstring in exactly those words. The honest claim is that Themis makes an
      honest ingest impossible to get wrong, and does not make a dishonest one
      impossible.
    - >
      Argus: the API response surface, the SDK return surface and four whole-layer
      guards. NOT covered: the demo's narrative prose (composed by f-string from
      measured counts -- traceable, but not in a structure a test can follow), the
      generated TypeScript SDK (gated by test_api_contract_drift.py), and
      argus/command_centre internals (its own packet's, and its own types').
  already_enforced_elsewhere_and_not_duplicated:
    - "Aletheia: test_pack_third_party_verification.py asserts the standalone verifier's independence against its own AST. This packet copied its approach and added nothing to it."
    - "Talos: the OpenAPI contract-drift gate (test_api_contract_drift.py) plus the TS SDK drift gate. Talos's prohibition is about shipping an incompatible change, and it is the one prohibition that already had a mechanism."
  status_label: >
    Demonstrated at most. These are structural tests over this repository's own
    source; they say nothing about operator data, of which there is none. Nothing
    here is Validated.

acceptance_commands:
  - "py -3 -m pytest aletheia/conformance/property-tests/test_dependency_direction.py aletheia/conformance/property-tests/test_layer_metis.py aletheia/conformance/property-tests/test_layer_themis.py aletheia/conformance/property-tests/test_layer_argus.py -q   # 141 passed, 0 skipped"
  - "py -3 -m pytest -q   # full suite"

forbidden_interface_changes:
