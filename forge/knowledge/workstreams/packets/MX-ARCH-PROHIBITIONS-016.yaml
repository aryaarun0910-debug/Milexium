id: MX-ARCH-PROHIBITIONS-016
status: completed
completed_date: "2026-07-26"
dispatched_date: "2026-07-26"
adr: null   # ADRs are the orchestrator's to write; this packet was told to write none
result: >
  141 new tests across 4 files, 0 skipped. All five layer prohibitions and the
  dependency direction are now asserted against the AST or against the live
  model objects rather than stated in prose. 34 violating cases were constructed
  against the real tree and every one came back RED, plus 9 more fed to the
  walkers directly and 6 honest-code controls that must stay GREEN. One mutation
  came back GREEN and the MUTATION was wrong, not the test -- recorded below as
  FINDING 4 and now an assertion in its own right.
  Three prohibitions are FULLY enforced (Metis, forge isolation, dependency
  direction); two are PARTIAL with the uncovered half named in the docstring
  (Themis, Argus). Four findings, none fixed: this packet owned tests only.

objective: >
  ADR-0076 renamed the repository into five authority layers, each with a stated
  prohibition, and recorded plainly in its own Honest Limitations that "the layer
  prohibitions are documented, not all enforced". In this codebase a rule in
  prose is a rule that decays -- most recently "append-only", which turned out to
  be a coding convention a direct SQL UPDATE walked straight through (ADR-0063 ->
  ADR-0074). Turn the prohibition table into tests, and write Argus's BEFORE
  Argus exists.

