  - aletheia/conformance/property-tests/test_dependency_direction.py   # 24 tests
  - aletheia/conformance/property-tests/test_layer_metis.py            # 22 tests
  - aletheia/conformance/property-tests/test_layer_themis.py           # 78 tests
  - aletheia/conformance/property-tests/test_layer_argus.py            # 17 tests
  - forge/knowledge/workstreams/packets/MX-ARCH-PROHIBITIONS-016.yaml

read_only_dependencies:
  - README.md                                                       # the prohibition table
  - forge/knowledge/architecture/decisions/0076-authority-rename-and-data-merge.md
  - aletheia/conformance/property-tests/test_pack_third_party_verification.py  # the AST model copied
  - aletheia/conformance/property-tests/test_ontology_v1.py         # what Themis already covers, not repeated
  - themis/**, metis/**, aletheia/**, argus/**, talos/**            # READ ONLY -- not one line modified

normative_contracts:
  - ADR-0076   # the authority boundaries and the direction
  - ADR-0074   # why a prose rule is not a rule here
  - ADR-0028   # the formal provers' independence, which FINDING 3 turns on
  - ADR-0034   # Program D owns drift; metis reads it read-only
  - ADR-0041, ADR-0048   # promotion is an audited decision, not a serving-path act

problem: >
  Five prohibitions and one dependency direction, all documented. Two were said
  to "already hold": Aletheia's is genuinely AST-tested (the standalone verifier),
  and Metis's held by construction with nothing checking it. Themis's and Argus's
  had no test at all, and ADR-0076 named Argus's as the one most likely to be
  violated "because that is where an LLM will eventually sit". Nothing anywhere
  asserted the direction itself -- the rule that protects all the others.

what_was_built:
  dependency_direction: >
    An AST walk over every module in the five layers, one permitted-target set per
    layer, failing with the file, the line, the import statement and the rule
    broken. Exemption is OPT-IN: a module in no declared exemption is product code
    and is policed, so a new tree is bound by the direction from its first commit.
    That default was chosen deliberately mid-packet -- see mid_flight_change.
  metis: >
    The persistence surface of Themis is DERIVED from Themis (a module counts if
    it defines a writer method or imports a driver) rather than hand-listed, and
    the derivation is checked in both directions so it can neither collapse to
    empty nor swell to everything. Metis is then held to: no persistence import,
    no driver, no writer call, no file opened for writing, no authorisation
    module, and an allow list of the exact six Themis modules it reads.
  themis: >
    Not a repeat of test_ontology_v1's instance refusals. One level up: every
    provenance field stays mandatory, every model carrying a number can say where
    it came from (itself or through EVERY record that embeds it), no degree of
    belief is defaulted into a number, and the imputation and repair refusals are
    exercised across their whole cross product rather than at one corner. The
    model survey is DISCOVERED from themis/ontology/*.py rather than listed --
    a fixed list would have silently missed themis/ontology/episode.py, which
    landed mid-packet, and a generalisation that does not bind models nobody has
    written yet is not a generalisation. 21 models across 10 modules, 6 of them
    carrying a number.
  argus: >
    Every value the API renders must be an expression rooted in something the
    function was handed -- no string literal, no float, no f-string. Plus four
    forward guards for the layer that had not arrived: no text generator, no model
    or solver of its own, no numeric library, no unseeded randomness, no vocabulary
    of its own, and the operator-facing column and PII lists must be the Themis
    objects by IDENTITY, not a copy that agrees today. The three import bans are
    SEPARATE tests, weakest one labelled as such, so the hard rule about language
    models cannot be relaxed by arguing about pandas.

findings:
  - id: FINDING 1
    severity: material
    where: aletheia/verify/formal.py
    what: >
      A SHIPPING module loads and EXECUTES Python out of forge/ --
      forge/knowledge/architecture/formal/{state_machine_smt,hash_chain_smt}.py, by
      file path, at module import time. "Nothing may import forge" is enforced
      against the `import` statement, and a dynamic load is not one, so an AST
      import walk is blind to it. This is the same shape as ADR-0074's defect: the
      rule held for the mechanism anyone thought to check.
    mitigations_that_are_real: >
      aletheia/verify/__init__.py does NOT import `formal`, so `import
      aletheia.verify` does not drag forge in; and the loaded modules are z3
      provers whose independence from themis is the point of ADR-0028.
    handled_how: >
      NOT fixed -- this packet owns tests. Pinned in
      test_no_layer_loads_and_executes_python_from_forge_beyond_the_two_known_cases,
      which fails on a THIRD such module and ALSO fails if one of the two is fixed
      without updating the list, so the grandfather clause cannot outlive its case.
      The second known case is aletheia/conformance/property-tests/test_panel_findings.py
      (the test tree loading forge/business/outreach scripts) -- same mechanism,
      much less severe.
  - id: FINDING 2
    severity: material
    where: metis/forecast/runtime.py:27, metis/forecast/serve_drift.py:76
    what: >
      The README, ADR-0076 and this packet's own brief all state that Metis imports
      only entities, ids, time and vocab from Themis. That is not what the tree
      says. Metis also imports themis.core.drift (pure statistics -- harmless) and
      themis.core.model_registry, which defines register() and promote() and whose
      module also carries PersistentModelRegistry over a real CoreDatabase. Metis
      calls exactly one method on it -- champion(task), a read -- so the
      prohibition survives on discipline rather than on structure in that one
      place.
    handled_how: >
      Pinned as the single allowed exception, with two tests holding it to account:
      Metis may name only ModelRegistry from that module (never
      PersistentModelRegistry or CoreDatabase), and may call neither register nor
      promote -- with those two names derived from the live class so the check
      cannot go stale. test_the_recorded_finding_is_still_the_finding fails if
      Program E removes the import, so the exception cannot outlive its cause.
  - id: FINDING 3
    severity: minor, but the table is wrong
    where: talos/contracts/generate.py, talos/tools/ (4 modules), aletheia/benchmarks/ (21 sites)
    what: >
      "talos -> nothing" and "aletheia -> themis" are both inaccurate as written.
      talos/contracts/generate.py imports argus.api.app to emit its OpenAPI
      document; 4 talos modules import themis (6 sites) across contracts/ and
      tools/; aletheia/benchmarks/ imports metis in 21 places. The load-bearing half of the direction is clean:
      themis imports nothing above it, metis reaches nothing above it, the aletheia
      evidence library (evidence/verify/replay) reaches only themis, argus reaches
      only down, and no `import forge` exists anywhere.
    handled_how: >
      Carved out by name with the reason written beside each entry, and
      test_the_carve_out_is_load_bearing_and_not_decorative asserts the carve-out
      is actually carrying violations -- if it ever stops, it is dead weight and
      the test says to delete it.
  - id: FINDING 4
    severity: minor, and a documentation defect
    where: themis/ontology/provenance.py -- IdentityResolution
    what: >
      DEFAULT_MATCH_THRESHOLD (0.95) is NOT enforced at construction. It lives in
      would_resolve(), which proposes. The constructor enforces only that the
      resolution is the UNIQUE STRONGEST candidate and that it names the rule it
      was made under. So a 0.61-vs-0.39 merge IS recordable, while the class
      docstring reads as though it is impossible ("this class does none of them").
      That design is defensible -- a dispatcher who phones the rider has evidence
      the scorer cannot see, and a hard gate would refuse the one match anybody is
      confident about -- but the prose overstates it.
    how_it_was_found: >
      By a mutation that came back GREEN. The parametrised refusal test asserted
      that resolving to a 0.61 top candidate raises ForcedMatchError; it did not.
      Per the packet's instruction, the MUTATION was checked before the code:
      the mutation was wrong. The case is now
      test_the_match_threshold_is_advisory_and_the_recorded_rule_is_what_binds,
      which asserts the real behaviour in both directions and fails if either side
      of it changes.

mid_flight_change:
  argus_command_centre: >
    argus/command_centre/ (3,023 lines: attribution, picture, render) landed from a
    concurrent packet while this one was being written. The first design of
    test_every_module_is_classified DEMANDED that every tree be declared shipping
    or non-shipping, and it went red on the new directory -- for a reason that had
    nothing to do with the authority direction. Changed to a FAIL-SAFE default:
    exemption is opt-in, everything else is policed. The command centre is
    therefore bound by the direction from its first commit and passes, and the
    anti-inheritance property (a new tree cannot silently acquire the exemption)
    is preserved and asserted directly.

  themis_ontology_episode: >
    themis/ontology/episode.py (1,227 lines) landed from another concurrent packet.
    Its `ForeclosedOpportunity` carries a `weight` -- a capacity-attribution share
    wired from metis.decide.exposure -- and REQUIRES a `basis` naming the producing
    procedure, its version and whether its enumeration was exhaustive. That is
    provenance in exactly the sense this packet's generalisation means, written
    with no reference to it. `basis` was added to PROVENANCE_FIELDS and the module
    passes. A generalisation independently satisfied by a module written after it
    is the best evidence available that the generalisation is the right one.

    It is also the reason the Themis survey is discovered rather than listed: the
    fixed list this packet started with would have skipped 1,227 lines and 6 models
    without saying so.

  argus_command_centre_attribution: >
    Its attribution.py independently implements the RUNTIME half of Argus's
    prohibition -- a Figure cannot be constructed without a Source, over a closed
    origin set, with attribution following the weakest input. That is stronger than
    anything here for values that pass through it. The two are complements: theirs
    binds values that opted into Figure, at run time; this packet's binds the API
    and SDK surfaces structurally whether or not the author opted in. No test here
    is pinned to command_centre internals -- it is under active construction and a
    conformance file naming its types would break on every rename for no gain.

failure_injections:
