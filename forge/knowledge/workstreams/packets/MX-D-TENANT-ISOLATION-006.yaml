notes: >
  THE IN-MEMORY REFERENCE CLASSES WERE LEFT TENANT-FREE, DELIBERATELY -- the choice the
  brief asked to be named. `FeatureStore` and `PromotionController` are single-process
  reference implementations held by one caller; there is no shared table for a second
  operator's rows to sit in, and the entire gap being closed is that a shared TABLE
  existed. Giving them a tenant parameter would add a dimension they cannot enforce (a
  dict key is not a boundary) and would advertise an isolation guarantee that only the
  persistent classes actually make. It would also have broken the method-for-method
  signature parity test_core_persistence.py checks structurally. So the tenant enters
  through the CONSTRUCTOR of the persistent classes -- which that parity check already
  excludes, since one takes a database and the other takes nothing -- and the two
  implementations stay honestly comparable. This keeps the diff to the code that owns a
  real boundary.

  WHY THE SEQUENCE COLUMNS BECAME PER-TENANT, since it is the least obvious change here.
  It is forced by the isolation boundary, not stylistic. `decision_sequence`,
  `rollback_sequence`, `stack_position` and `enrol_sequence` are assigned by
  COALESCE(MAX(...), 0) + 1. Under RLS that MAX() can only see the ACTING tenant's rows,
  so a GLOBAL counter would be re-derived independently per tenant and the second
  operator would collide on the primary key -- the isolation boundary and a global
  counter cannot both hold. Hence tenant_id LEADS every primary key. It is also the
  better ledger: a global counter would let one operator infer another's activity from
  the gaps in its own, and "complete and in order" is a claim about ONE operator's audit
  trail -- one that mixed two would be evidence for neither.

  tenant_id leads the as-of index too, so the tenant predicate and the leakage predicate
  are served by ONE index and `knowledge_time < t` is not demoted to a filter over a
  wider scan.

  HONEST LIMITS (v0.1, Demonstrated -- never operator-Validated):
  - SQLITE HAS NO POLICY, and cannot. On SQLite the boundary is the stores' own
    `tenant_id = ?` predicates -- application code. Only PostgreSQL, the production
    target, is claimed to enforce isolation BELOW the application. This is the same
    split ADR-0018 made for the canonical stores, and it is why the parametrised
    store-level tests and the Postgres-only policy tests are separate sections rather
    than one suite pretending both engines prove the same thing.
  - NO MIGRATION PATH. Every CREATE is IF NOT EXISTS, so a database written by the
    pre-tenant ADR-0041 schema is NOT upgraded by reopening it -- the old tables simply
    stay as they are and the new columns never appear. There is no migration framework
    in this repository yet and this packet did not own inventing one. A pre-existing
    Program D database must be recreated. Acceptable only because these tables have
    never held operator data.
  - tenant_id is TEXT with no foreign key to the canonical `tenants` table, because the
    canonical schema may not exist in the database a Program D store is opened against
    (that independence is ADR-0041's, and the conformance suite depends on it). So a
    Program D row can name a tenant that was never registered. The value is validated as
    a well-formed canonical TenantId in Python; it is not validated as an EXISTING one.
  - THE CONTROLLER STILL DOES NOT CHECK A MODEL VERSION'S OWN TENANT.
    `_require_registered_for_task` checks the task and not `ModelVersion.tenant_id`, so a
    controller acting for tenant A could enrol a ModelVersion object stamped for tenant B
    if a caller put one in its in-memory registry. This is deliberately NOT fixed here:
    ADR-0040 reserves a platform tenant whose models every tenant may legitimately run,
    so the correct rule is "own tenant OR platform", which is a model-registry decision
    and model_registry.py is owned by a concurrent packet. The exposure is bounded --
    ModelRegistry is in-process and per-caller, and no row crosses the database boundary
    -- but it is named rather than left to be discovered.
  - PERSISTENCE, NOT CONCURRENCY, still. The per-tenant sequences are read-then-insert:
    correct for one writer per tenant, racy for several. Unchanged from ADR-0041 and the
    same stance as canonical decision_events.sequence.
  - The GUC is set on EVERY store operation rather than cached, matching
    PostgresCanonicalStore. That costs one extra round trip per operation on PostgreSQL.
    A cache was rejected: anything else on the same connection (including these very
    tests) can move the GUC, and a stale cached value would silently read the wrong
    tenant's rows -- the exact failure this packet exists to prevent.
  - The GUC is the identity. A session that sets milexium.tenant_id to a given tenant IS
    that tenant, as everywhere else in this repository. What is excluded is a session
    acting as one operator reaching another's rows -- not an attacker who already holds
    the application credential AND can choose the GUC.
  - core_rls_postgres.sql is loaded by module-relative path and is not declared setuptools
    package-data -- the identical pre-existing exposure core_v0_1.sql and
    schema_v0_1.sql have. Fixing it means editing pyproject, which this packet does not
    own.
  - drift.py is unchanged and remains in-memory / stateless by design, so it has no
    tenant dimension to close.
  - Do NOT edit model_registry.py or drift.py, themis/canonical/**, argus/api,
    argus/sdk, aletheia/evidence, aletheia/replay, themis/connect, contracts,
    pyproject, CI, IMPLEMENTATION_STATUS, JOURNAL, any ADR, or git -- the orchestrator
    and concurrent packets own those.
