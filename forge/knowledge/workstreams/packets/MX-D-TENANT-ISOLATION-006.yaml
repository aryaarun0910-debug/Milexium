security_and_privacy_invariants:
  - "TENANT ISOLATION IS A DATABASE BOUNDARY ON POSTGRESQL, NOT A WHERE CLAUSE. themis/core/sql/core_rls_postgres.sql ENABLEs *and* FORCEs row-level security on all seven Program D tables with a symmetric tenant_isolation policy keyed on the milexium.tenant_id GUC. FORCE is load-bearing because milexium_dev OWNS these tables (CoreDatabase.postgres creates the schema itself) and a table owner bypasses RLS by default -- without it every isolation test would pass for the wrong reason. Proved by lifting FORCE per table, watching the boundary collapse, and restoring it."
  - "DEFAULT IS DENY, AND THE EMPTY-STRING TRAP IS ASSERTED EXPLICITLY. current_setting('milexium.tenant_id', true) returns NULL only when the GUC was NEVER set; after RESET it returns the EMPTY STRING, which an IS NOT NULL guard accepts. No clause in core_rls_postgres.sql is written as IS NOT NULL; each is a plain equality. Both cases have their own test, and the reset case asserts value == '' AND is_null is False before asserting deny-all, so a future 'fix' cannot silently open the door."
  - "THE LEAKAGE GUARANTEE IS UNCHANGED IN STRENGTH. An as-of read at label time t still returns only values whose knowledge_time is STRICTLY < t, still as a SQL predicate over fixed-width canonical ISO-8601 UTC text. tenant_id = ? is an ADDITIONAL conjunct of the same predicate, never a substitute: the rows returned are the INTERSECTION of 'my tenant's' and 'strictly past', and neither conjunct can rescue a row the other excludes. Proved three ways -- a cross-tenant as-of read at a deliberately PERMISSIVE timestamp returns nothing (with a positive control proving the timestamp really would have admitted it), an as-of read at exactly the stamp still returns the prior value, and a second tenant flooding the SAME (entity, feature) with garbage at every knowledge time leaves the first tenant's every past read bit-identical on the real AAR panel."
  - "WRITES ARE BOUNDED TOO (the WITH CHECK half). A session acting as one tenant cannot INSERT a row stamped with another tenant's id into any of the seven tables -- refused by the database with InsufficientPrivilege, not by Python. A forged promotion_decisions row is a forged audit trail and a forged promotion_champions row would change which model serves another operator's riders, so this is tested per table, not once."
  - "AN UNQUALIFIED DELETE CANNOT REACH ANOTHER TENANT. The USING clause governs DELETE as well as SELECT, so 'DELETE FROM <table>' with no WHERE clause -- the shape a careless cleanup script takes -- removes only the acting tenant's rows. For the two append-only ledgers a cross-tenant delete would be destruction of another operator's audit trail."
  - "NO UNSCOPED PATH EXISTS IN PYTHON. tenant_id is a REQUIRED constructor argument on both persistent classes (no default, no None) and is validated as a canonical TenantId, so a typo cannot become a silently distinct, permanently unreadable partition of the table. Exposed read-only as a property; there is no setter."
  - "No raw PII: features remain keyed by opaque entity ids only. entities() is now tenant-scoped -- an unscoped SELECT DISTINCT entity_id would have disclosed how many entities another operator runs, which is a membership disclosure even with opaque ids."
  - "Append-only is unchanged: no UPDATE and no DELETE is issued against feature_values, promotion_decisions or promotion_rollbacks anywhere in themis/core."
  - "PostgreSQL access is as the non-superuser milexium_dev role only (ADR-0006); asserted in-test (rolsuper is False, rolbypassrls is False) BEFORE any isolation result is claimed, because both are checked ahead of ownership and FORCE and would make every policy inert."
failure_injections:
  - "FORCE lifted per table -> the owning role reads the other tenant's rows -> FORCE restored -> the boundary comes back (test_force_row_level_security_is_load_bearing, x7)"
  - "raw unfiltered SELECT as tenant B returns none of tenant A's rows, paired per table with a positive control proving A's own row IS visible (so the denial is not an empty table)"
  - "RESET milexium.tenant_id -> the GUC reads back as the EMPTY STRING (asserted) and every table returns zero rows"
  - "a SEPARATE connection that never set the GUC -> current_setting returns NULL (asserted) and count(*) is 0 on every table"
  - "INSERT stamped with a foreign tenant_id -> psycopg.errors.InsufficientPrivilege, per table"
  - "unqualified DELETE as tenant B -> tenant A's rows survive, per table"
  - "tenant-crossing as-of read at a timestamp that WOULD admit the value -> nothing; same read as its own tenant -> the value (control); own-tenant read at exactly the stamp -> nothing (strict < intact)"
  - "REAL DATA: a second tenant writes garbage over the SAME (entity, feature) at every knowledge time in the first tenant's past AND future -> every one of the first tenant's as-of reads is bit-identical, with a control proving the second tenant's rows really are there and really are different"
  - "in-place raw-SQL corruption of stored future rows (test_core_persistence.py) now also asserts the tamper LANDED -- under RLS an UPDATE issued with the wrong tenant in scope matches zero rows, which would have made the bit-identical assertions vacuous"
  - "PersistentFeatureStore / PersistentPromotionController constructed with no tenant -> TypeError; with a non-UUID or a UUIDv4 -> ValueError"
compatibility_matrix:
  - "core_v0_1.sql still runs UNMODIFIED on SQLite and PostgreSQL 17. Verified by executing the FILE'S OWN BYTES twice against a bare sqlite3 in-memory connection (all seven tables created, tenant_id present on each, re-application idempotent), and by the [sqlite] parameter of every store-level test."
  - "core_rls_postgres.sql is applied ONLY by CoreDatabase.postgres, after the portable schema, inside the same disposable schema. SQLite gets no policy -- there is none to get -- so on SQLite the boundary is the stores' own tenant_id predicates alone. That asymmetry is the same split ADR-0018 made for the canonical stores and is stated in CoreDatabase's docstring rather than implied."
  - "core_rls_postgres.sql is idempotent (DROP POLICY IF EXISTS before each CREATE POLICY) because CoreDatabase.postgres(schema=...) REOPENS a named schema -- that is how 'survives a restart' is testable at all, and CREATE POLICY is not idempotent. rls_postgres.sql needs no such guard because PostgresCanonicalStore always creates a fresh schema. Proved by a reopen test that re-reads the policy set and the surviving row."
  - "The Postgres-only tests skip cleanly (never fail) when milexium_dev on 5432 is unreachable, so CI stays green; the store-level tests are parametrised [sqlite]/[postgres] and their SQLite parameter always runs."
