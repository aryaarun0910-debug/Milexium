objective: >
  Close the tenant-isolation gap ADR-0041 recorded in its own limitations. Program D's
  newly-persistent tables -- feature_values, promotion_decisions, promotion_rollbacks,
  promotion_champions, promotion_champion_history, promotion_challengers,
  promotion_canaries in themis/core/sql/core_v0_1.sql -- had NO tenant column and NO
  row-level security, while every other tenant-scoped table in the repository is guarded
  (ADR-0018/0037/0043/0046). A second operator's feature values and promotion ledger
  would have sat in the same tables as the first's with nothing between them. Add the
  column, thread the tenant through both persistent stores, install a Postgres-only RLS
  file mirroring rls_postgres.sql's pattern, and prove the boundary adversarially --
  without weakening the leakage guarantee that is ADR-0041's load-bearing invariant.
