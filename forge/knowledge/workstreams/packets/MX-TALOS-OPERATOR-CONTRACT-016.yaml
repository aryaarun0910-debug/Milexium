full_suite_result: >
  2927 passed, 1 skipped, 980s, run with three concurrent packets' work also
  present in the tree. Two failures appeared in that run, BOTH in
  aletheia/conformance/property-tests/test_dependency_direction.py -- a file this
  packet does not own and did not touch, landed by the concurrent
  MX-ARCH-PROHIBITIONS-016 while the suite was running, so its module census was
  taken against a tree that was still moving. Re-run in isolation afterwards:
  24 passed. The 280-test slice most adjacent to this packet
  (test_operator_contract, test_api_contract_drift, test_operator_export,
  test_messy_operator_data, test_dependency_direction, test_claim_discipline,
  test_adapter_vehicle_references) is green.

  ONE COORDINATION ITEM for that concurrent packet: its docstring says "4 talos
  modules import themis (6 sites)". This packet adds a fifth
  (validate_operator_export.py imports classify_pii_column and two helpers), so
  that sentence is now stale. Nothing is asserted on the count -- the test pins
  only `reaches['argus'] == {talos/contracts/generate.py}`, which this packet does
  not touch -- so it is a prose fix in their owned file, not a failure.

drift_gate: >
  The two new artifacts are generated by the EXISTING `talos/contracts/
  generate.py`, so the existing CI gate (`git diff --exit-code -- talos/
  contracts/`) covers them with no workflow change. Rendering is deterministic:
  no clock is read, no set is iterated, JSON is sorted and indented, newline is
  forced to "\n". `test_rendering_is_deterministic` and
  `test_the_committed_artifacts_match_a_fresh_render` are the local half, and
  the latter deliberately WRITES NOTHING -- a test that regenerated the artifact
  would repair the drift it exists to report and pass for the wrong reason.

scope_honesty:
  what_this_is: >
    A statement of what to ask an operator for, in two renderings from one
    source, plus a tool that checks whether an arriving sample satisfies it.
  what_this_is_NOT:
    - "NOT a connector. Nothing in themis/connect was modified; no scheduling system is contacted; no operator format is parsed that themis/connect/operator_export.py does not already parse."
    - "NOT an ingest path. The validator persists nothing, repairs nothing and imports nothing. It reads a sample and prints."
    - "NOT wired into the ontology. `themis/ontology/` is where a knowledge timestamp would eventually live; this packet does not add the column, the adapter or the migration -- it establishes whether the data would exist to fill it."
    - "NOT an agreement. The companion document says on page one that it cannot create one, and the signed data-sharing agreement, contracting entity, secure transfer and the operator-side privacy assessment remain founder/legal tasks (ADR-0038 §7)."
    - "NOT evidence of anything. No operator has seen it, answered it, or sent a file."
  status_label: >
    Exists. Demonstrated on SYNTHETIC fixtures only. Nothing here is Validated,
    there are zero operator customers and zero pilots, and the contract states
    that in its own first section rather than in a footnote.

limitations:
  - "NO OPERATOR HAS SEEN THIS. Every field is a request, several are requests we expect to be answered 'we do not record that', and the requirement levels are OUR judgement about what makes a claim defensible. An operator may reasonably disagree about which fields are worth the effort; that disagreement is the conversation this is meant to start."
  - "THE FIELD LIST IS DERIVED FROM WHAT THIS REPOSITORY CAN CONSUME, not from any real vendor export. No Ecolane, TripSpark, RouteMatch or Trapeze extract has been inspected. Field NAMES an operator would actually see are unknown, which is why the validator takes a column_map instead of assuming headers."
  - "THE VALIDATOR REPORTS ON THE SAMPLE. A column populated in 200 rows may be null in the other two million, and a clean report is the most dangerous output it can produce -- which is why the report carries its own limits section."
  - "THE IDENTITY GATE IS A BACKSTOP, NOT A SCANNER. It catches columns that announce themselves, emails that look like emails and zones shaped like addresses. A rider's name in a column called `ref2` passes, and nothing detects it."
  - "THE ADR-0057 CLASSIFIER GAP IS STILL OPEN. `classify_pii_column` does not catch hack_license / medallion / license_plate / vin; the vocabulary is applied LOCALLY here, exactly as tlc_trips.py does, because widening the shared classifier would change what the ingest adapter quarantines for unrelated reasons -- and that path is another packet's. Two local copies of the same vocabulary now exist and should converge."
  - "THE DEGENERACY THRESHOLDS ARE STATED RULES, NOT TUNED PARAMETERS, and they are guesses about data nobody has seen. A live feed exported weekly could trip BACKFILL_SIGNATURE legitimately, which is why the finding names the two spans and asks rather than concluding."
  - "TIMESTAMP PARSING IS DELIBERATELY THINNER THAN THE ADAPTER'S. The validator does not implement ADR-0051's ten repair rules; an unparseable value is reported as unparseable. Duplicating the repair layer would give an operator two different answers about the same file, but it does mean a file the adapter would happily repair can look worse here than it is."
  - "CAPABILITY VERDICTS ARE ABOUT THE DATA, NOT ABOUT US. 'Supported' means the file would support the analysis. It does not mean the analysis has ever been run on operator data, and the report says so in the output itself."
  - "NO DECLARATION SCHEMA IS ENFORCED. `--declarations` takes free-form JSON keyed by field name. Answers are read as prose (yes/no detection is word-based and fails closed), so a typo'd key is silently an unanswered question rather than an error."
  - "THE RUN ROSTER AND CANDIDATE LOG ARE DECLARED, NOT PARSED. The validator accepts the operator's word that they were sent; it does not read them. Their contents are unspecified beyond a column list, because specifying a schema for a file no one has seen is the guess this packet exists to avoid."
  - "ONE OMISSION IS A REAL ANALYTICAL LOSS AND IS NOT PAPERED OVER: with no per-trip accessible-vehicle-required flag, unmet ACCESSIBLE demand cannot be measured directly -- only the subset the operator's own system already labelled as an accessibility denial. Given who the introduction came from, that limitation should be discussed early rather than discovered late."

forbidden_interface_changes_observed:
  - "themis/, metis/, argus/ and aletheia/ SOURCE not modified (three concurrent packets). Only read-only imports of themis.connect.operator_export."
  - "forge/knowledge/docs/OPERATOR_DATA_INTAKE.md NOT modified -- the contract extends it and is asserted against the adapter it describes."
  - "No ADR written. No git add / commit / push. IMPLEMENTATION_STATUS.md and forge/knowledge/docs/JOURNAL.md NOT edited -- the orchestrator's to make."
  - "The existing generated artifacts (canonical-v0.1.json, milexium-api-v0.1.json) regenerate byte-identical; the drift gate was extended, not disturbed."
  - "No claim of savings, ROI, validation or a pilot appears in either artifact, and a test asserts it."

downstream_consumers:
  - "Outreach: the companion document is the answer to 'what exactly do you need from us?' and can be sent as-is."
  - "Program B (adapters): the validator's capability verdicts say what an adapter would have to be written for, and what it could never recover."
  - "themis/ontology (ADR-0072): `record_created_known_at` is the column its receipt-time proxy needs. If an operator answers yes, the ontology needs one nullable column and one extra conjunct -- stated as low cost IF asked before the history loads, which is what this packet does."
  - "Program H (replay): the contract states plainly which exports can and cannot support a counterfactual, so a replay is never run against data that cannot carry it."

notes: >
  ONE THING WORTH THE ORCHESTRATOR'S ATTENTION. This packet takes a position that
  should be checked before it is sent to anyone: the required COLUMN list is
  frozen at ADR-0038's, and everything this packet adds is either a question
  answerable by email or a HELPFUL field. That is deliberate -- an operator who
  has read the intake document and then reads this one must not find a longer
  mandatory ask -- but it means the single most important field in the whole
  packet, the knowledge timestamp, is NOT mandatory. The contract's answer is to
  withdraw the claim instead of the data, and to say so in the output. If the
  orchestrator disagrees and wants it mandatory, that is a one-line change to
  `Requirement` on one field plus the test that pins it, and it will cost some
  operators who would otherwise have sent something.
