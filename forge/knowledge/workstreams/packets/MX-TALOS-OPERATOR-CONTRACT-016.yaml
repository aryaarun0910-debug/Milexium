id: MX-TALOS-OPERATOR-CONTRACT-016
status: completed
completed_date: "2026-07-26"
dispatched_date: "2026-07-26"
adr: null   # ADRs are the orchestrator's to write; this packet wrote none.

result: >
  A machine-readable operator data contract, a human-readable companion
  generated from the same source, and a validator that reads a sample export and
  reports capability by capability what it can and cannot support. 65 tests, 0
  skipped. 33 mutations applied and checked: 29 RED first time, 4 came back
  GREEN and ALL FOUR were real test gaps -- one of which caused a redundant
  branch to be DELETED rather than covered. No operator data exists in this
  repository; every fixture is synthetic and labelled.

objective: >
  Milexium has ZERO operator data. A former WMATA accessibility chief has invited
  us to evaluate live agency deployments, and the thing that converts that
  invitation into data is a precise, honest answer to "what exactly do you need
  from us?". This packet writes that answer down so it can be put in front of an
  agency and ANSWERED -- line by line, yes / no / we-do-not-record-that.

  It is a CONTRACT, NOT A CONNECTOR. No integration to any scheduling system was
  built, because no such system has been talked to. Its value is that it states
  precisely what we must ask for and what each field buys.

