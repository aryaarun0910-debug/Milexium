id: MX-I-PERIOD-INCIDENT-PACKS-004
status: completed
completed_date: "2026-07-24"
objective: >
  Period + incident evidence bundles (multi-decision) and a procurement
  scaffold, each independently verifiable, reusing the single-pack machinery.
owned_paths: [aletheia/evidence/packs.py, aletheia/evidence/__init__.py, forge/knowledge/architecture/decisions/0020-period-incident-procurement-packs.md]
read_only_dependencies: [aletheia/evidence/export.py, builder.py, models.py, aletheia/verify/, themis/canonical/]
normative_contracts: [blueprint/07-explain-replay-and-evidence.md, blueprint/10-security-privacy-and-ai-governance.md]
required_outputs:
  - aletheia/evidence/packs.py
  - aletheia/conformance/property-tests/test_period_incident_packs.py
acceptance_commands: ["py -3 -m pytest aletheia/conformance/property-tests/test_period_incident_packs.py -v"]
security_and_privacy_invariants:
  - "verify_* recomputes outer checksum AND re-runs every embedded pack's own chain"
  - "independently_verifiable propagates (a redacted embedded pack makes the bundle non-verifiable)"
  - "procurement bundle makes NO compliance claim; separates available vs requires-external-input"
  - "cross-tenant bundles refused at build time"
failure_injections:
  - "tampered embedded event -> outer checksum fails"
  - "re-anchored outer checksum -> embedded pack self-verification still fails"
  - "lying rollup re-anchored -> re-tally catches it"
evidence_to_emit: ["15 tests"]
upstream_blockers: []
downstream_consumers: [partner/procurement evidence hand-off]
