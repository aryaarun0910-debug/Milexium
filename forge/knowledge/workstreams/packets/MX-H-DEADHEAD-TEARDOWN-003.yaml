id: MX-H-DEADHEAD-TEARDOWN-003
status: completed
completed_date: "2026-07-24"
adr: forge/knowledge/architecture/decisions/0039-deadhead-teardown.md
result: '35 tests; demonstrated on a real TLC week (8.89% empty); refuses to guess a recovery rate; no "operator" provenance value exists'
dispatched_date: "2026-07-24"
objective: >
  Program H depth (weakest spine program, ~15%). Build the deliverable the
  outreach has already promised 15 operators in writing: "I can show you which
  hours and which runs." NTD is annual aggregate and cannot answer that, so this
  packet builds a repeatable DEADHEAD TEARDOWN that ingests an operator's
  trip-level export and localises empty vehicle-time to specific hours, days and
  runs -- plus a modelled "what if this were reduced" comparison that reuses the
  existing replay/comparison discipline (ADR-0019: modelled, never causal).
owned_paths:
  - aletheia/replay/teardown.py
  - aletheia/replay/__init__.py           # export the new surface only
  - aletheia/conformance/property-tests/test_teardown.py
read_only_dependencies:
  - aletheia/replay/replay.py, aletheia/replay/comparison.py  (reuse; do NOT modify)
  - themis/canonical/entities.py (ServiceRequest, Outcome, VehicleObservation)
  - themis/connect/ (adapters that already produce canonical records)
  - data/curated/, data/ (real public data for the demonstration)
normative_contracts:
  - blueprint/06-simulate-and-replay.md
  - ADR-0019 (replay + baseline comparison; modelled-not-causal wording is binding)
required_outputs:
  - aletheia/replay/teardown.py
  - aletheia/conformance/property-tests/test_teardown.py
acceptance_commands:
  - "py -3 -m pytest aletheia/conformance/property-tests/test_teardown.py -q"
  - "py -3 -m pytest themis/ metis/ aletheia/ argus/ -q   # whole suite still green (603 baseline)"
what_it_must_answer:
  - "WHICH HOURS: empty vehicle-time bucketed by hour-of-day and day-of-week, so an operator sees the shape of their own dead time, not a single annual percentage."
  - "WHICH RUNS: the individual vehicle/run/block segments contributing most empty time, ranked, so the answer is actionable rather than descriptive."
  - "HOW MUCH: empty time costed at the operator's own cost-per-hour, with the SAME hedging the outreach used -- fixed costs do not fall proportionally, so this is a modelled envelope, never a promised saving."
security_and_privacy_invariants:
  - "NO rider PII. Operates on trip STRUCTURE only (times, zones, vehicle/run ref, outcome). If an input carries a rider identifier it must be ignored or rejected, never persisted in output."
  - "Every figure traceable: the teardown emits its own inputs + method alongside results so an operator can re-derive it, matching the repo's evidence discipline."
  - "Wording is MODELLED, not causal, and not a guaranteed saving (ADR-0019 + the outreach hedge). A teardown that overstates recoverable cash in front of a director who knows their books is unrecoverable."
failure_injections:
  - "empty input / single trip / all-deadhead / zero-deadhead inputs behave sanely rather than dividing by zero"
  - "missing vehicle or run identifier -> the run-level ranking degrades honestly (reports 'unattributable') rather than silently guessing"
  - "an input with a rider identifier column is rejected or the column dropped, proven by test"
compatibility_matrix:
  - "Demonstrated end-to-end on REAL public data already in this repo (e.g. the TLC trip records or an existing Connect adapter's output). Label real-vs-synthetic in-artifact. NO operator data exists yet -- do not imply otherwise."
evidence_to_emit:
  - "test count; a worked example on real public data showing the hour-of-day shape and the top contributing runs"
upstream_blockers: []
downstream_consumers:
  - "the design-partner funnel step 3 (free analysis) in forge/business/outreach/design_partner_pitch.md"
  - "Program I evidence packs, once a real operator's teardown exists"
notes: >
  Disjoint from the intake packet (themis/connect, themis/estate) and the
  canonical-debt packet (themis/canonical). Do NOT touch pyproject, CI, shared
  docs, ADRs, or git. Status stays Demonstrated. Reuse comparison.py rather than
  reimplementing the baseline-vs-Milexium logic.
