the_mechanism:
  - "A SCHEMA-VERSION RECORD. `core_schema_migrations` holds ONE ROW PER VERSION REACHED, not one mutable row saying 'the' version. The current version is MAX(version); the individual rows are the audit trail -- when the database reached each version, and for version 2 WHOSE DATA the pre-tenant rows were declared to be. A single overwritten row would answer the first question and destroy the second. `applied_by` distinguishes 'created' (empty database created AT this version, no rows moved), 'migrated' (transformed from an earlier version) and 'adopted' (already had this shape but predates the ledger; recognised and stamped, nothing changed)."
  - "STRUCTURAL DETECTION FOR THE DATABASES THAT PREDATE THE LEDGER, which is all of them. No core tables -> version 0; the seven tables without tenant_id -> version 1; with it -> version 2; anything else -> UNKNOWN. What was inferred is then STAMPED, so the guess happens exactly once in a database's life and every later open reads a recorded fact."
  - "ORDERED, IDEMPOTENT CHAIN. `_MIGRATIONS` is applied in version order; each Migration carries an `apply` and a `precheck`. Re-running takes NO action rather than 'reapplying harmlessly' -- the ledger says there is nothing to do. `version` is the ledger's PRIMARY KEY, so a duplicate stamp is refused by the database, not merely skipped by Python."
  - "REBUILD, NOT ALTER, because it has to work on both engines. SQLite will not ADD COLUMN ... NOT NULL without a default and cannot change a primary key at all, and every one of the seven tables needs tenant_id to LEAD its primary key (ADR-0048: under RLS the MAX() that assigns each sequence sees only the acting tenant's rows, so a global counter would collide). So: rename aside -> drop the old index -> create from the current DDL -> INSERT ... SELECT through -> drop the old table. One code path, both engines."
the_tenant_decision:
  - "DECIDED EXPLICITLY, AND RECORDED: pre-existing rows get NO tenant unless a human names one. If any of the seven tables holds a row and no `legacy_tenant_id` was supplied, the migration RAISES `LegacyTenantRequiredError` naming every populated table and its row count -- it does not proceed with a chosen default."
  - "WHY EVERY AVAILABLE DEFAULT IS WRONG, which is why refusing is the decision rather than a dodge. (a) An invented UUID gives operator data a tenant that names nobody: the rows become unreadable by every real tenant while still counting against every scan, and the mistake is only discovered when someone asks where their history went. (b) The ADR-0040 platform tenant would declare an operator's private feature values and promotion ledger PLATFORM-OWNED -- and platform-owned rows are readable by every tenant, so the 'safe' default is the one that leaks. (c) The empty string is precisely the value core_rls_postgres.sql's deny-all default assumes no row ever holds (see the empty-string trap in themis/canonical/sql/rls_postgres.sql), so it would defeat the policy it was being inserted under."
  - "WHAT THE CALLER SAYS IS VALIDATED AND KEPT. The value is validated as a canonical TenantId (a typo would otherwise become a silently distinct, permanently unreadable partition of seven tables -- and unlike a bad row it would be the ONLY copy), and the attribution is written into the ledger note permanently: '7 pre-tenant row(s) were attributed to tenant <id>, declared by the caller via legacy_tenant_id (feature_values=1, ...)'. 'We decided these rows belong to X' survives as a RECORDED decision rather than as an inference from the data it produced."
  - "AN EMPTY VERSION-1 DATABASE NEEDS NO DECISION AND IS ASKED FOR NONE. That is the only case ADR-0048 claims has ever existed ('these tables have never held operator data'), and the ledger note for it says so explicitly: 'no rows existed ... and none was invented'."
security_and_privacy_invariants:
  - "ROW-LEVEL SECURITY SURVIVES THE MIGRATION -- the single most dangerous thing this packet could have got wrong. A rebuilt table is a NEW RELATION on PostgreSQL: relrowsecurity, relforcerowsecurity and the tenant_isolation policy do NOT follow the data through. A migration that stopped after copying the rows would leave seven tables full of real operator data with tenant isolation SILENTLY REMOVED -- strictly worse than the un-migrated database it started from, and green on any test that only checked the rows arrived. `migrate()` therefore re-applies core_rls_postgres.sql at the END of EVERY PostgreSQL run, migration or not, and the suite asserts relrowsecurity AND relforcerowsecurity out of pg_class for all seven tables AFTER migrating, plus exactly one policy named tenant_isolation per table."
  - "THE ORDER IS LOAD-BEARING: rows are copied BEFORE the policies are installed. Reversed, the WITH CHECK half would reject every inserted row (no GUC is set during a migration) and the migration would move NOTHING while reporting success -- the same class of vacuity ADR-0048 found in the in-place-corruption test."
  - "A CROSS-TENANT READ IS STILL BLOCKED AFTER MIGRATING, proved per table by a RAW UNFILTERED scan (no tenant_id predicate at all) as a tenant the rows were not attributed to, each paired with a positive control proving the row exists and IS visible to its own tenant. A cross-tenant WRITE is refused per table with InsufficientPrivilege -- the WITH CHECK half had to come back too, because a forged promotion_champions row would change which model serves another operator's riders."
  - "FORCE IS PROVED LOAD-BEARING ON A MIGRATED TABLE, not assumed to have returned: FORCE is lifted on feature_values, the other tenant's row becomes visible (asserted), and FORCE is restored and the boundary comes back. Preceded by assertions that the acting role is non-superuser and non-BYPASSRLS (ADR-0006/0046) and that it OWNS the REBUILT tables -- ownership has to be re-established for FORCE to be what stands in the way rather than an ordinary privilege error."
  - "THE EMPTY-STRING TRAP IS RE-CHECKED ON THE REBUILT TABLES. current_setting(name, true) returns NULL only if the GUC was NEVER set; after RESET it returns the EMPTY STRING. The test asserts value == '' AND is_null is False EXPLICITLY before asserting deny-all across all seven tables, and no guard added by this packet is written as IS NOT NULL."
  - "THE VERSION LEDGER IS DELIBERATELY NOT TENANT-SCOPED AND CARRIES NO POLICY, and that is tested rather than merely commented. Under a tenant policy, a connection that has not yet set milexium.tenant_id -- which is its state at the instant it is opened, exactly when the version is read -- would read ZERO rows; zero rows is indistinguishable from 'never stamped'; and the runner would try to migrate an already-migrated database. Deny-all is the right default for operator rows and the wrong default for the record that says what shape those rows are in."
  - "EVERY REFUSAL HAPPENS BEFORE THE FIRST WRITE, including before the ledger table is created. Each pending migration's `precheck` runs first, so a database that needs a human decision is left BYTE-IDENTICAL rather than stamped-then-abandoned -- asserted directly (after a refusal: still version 1, no ledger table, rows intact)."
  - "No raw PII: features remain keyed by opaque entity ids only; the migration copies values and never inspects them."
  - "PostgreSQL access is as the non-superuser milexium_dev role only (ADR-0006), asserted in-test before any isolation result is claimed."
failure_injections:
  - "a pre-tenant database WITH ROWS opened with no legacy tenant -> LegacyTenantRequiredError naming every populated table and count -> and the database is then re-inspected and found untouched (still version 1, no ledger table, row still present)"
  - "legacy_tenant_id='not-a-uuid' -> ValueError, raised in the precheck before any table is renamed"
  - "a ledger row stamped version 99 -> FutureSchemaVersionError on reopen, naming both 99 and the version this code understands"
  - "a version-1 database with promotion_canaries DROPPED (some tables present, some absent) -> UnknownSchemaVersionError; no version ever looked like that"
  - "a version-1 feature_values with an extra column -> UnknownSchemaVersionError; shape detection is exact, not 'close enough'"
  - "a ledger stamped version 2 over tables shaped like version 1 -> SchemaShapeMismatchError; the condition the ledger exists to CATCH, and worse than no record at all because everything downstream trusts the stamp"
  - "a half-finished migration (feature_values already renamed to mx_core_v1_feature_values) -> UnknownSchemaVersionError whose message NAMES the rebuild table, because starting a second rebuild on top of it would overwrite the only surviving copy of that data"
  - "FORCE lifted on a migrated feature_values -> the other tenant's row becomes visible -> FORCE restored -> the boundary returns"
  - "RESET milexium.tenant_id after migrating -> the GUC reads back as the EMPTY STRING (asserted) and all seven rebuilt tables return zero rows"
  - "a cross-tenant INSERT into each of the seven rebuilt tables -> psycopg.errors.InsufficientPrivilege"
  - "CONTROL that the RLS assertions are not vacuous: the SAME seven tables are asserted relrowsecurity=False AND relforcerowsecurity=False BEFORE the migration (a version-1 table predates core_rls_postgres.sql entirely), so 'RLS is on afterwards' is evidence about the migration rather than about the fixture"
  - "CONTROL that the real-panel comparison is not None == None: after migrating, a read at the last stamp returns the second-to-last value and a read at the first stamp returns None"
compatibility_matrix:
  - "core_v0_1.sql, core_schema_migrations.sql and the historical core_v0_1_pre_tenant.sql all run UNMODIFIED on SQLite -- verified by executing the FILES' OWN BYTES against a bare sqlite3.connect(':memory:'), with no CoreDatabase and no helper in the way, and applied TWICE because a DDL file that could only be applied once would not survive a reopen."
  - "ONE migration code path serves both engines. The only per-engine difference this packet adds is CoreDatabase.table_exists (sqlite_master vs information_schema.tables scoped to current_schema()), kept beside the placeholder where the other genuine engine differences already live. column_names() is portable by construction -- a zero-row SELECT * and the DB-API cursor.description both engines must populate -- rather than PRAGMA table_info on one side and information_schema.columns on the other, which would be two chances to disagree."
  - "split_statements() is used for BOTH engines rather than only for SQLite (whose sqlite3.execute takes one statement, and whose executescript COMMITs first and would silently break a migration into pieces), so the splitter is exercised against PostgreSQL too. Its assumption -- no ';' or '--' inside a string literal -- is PINNED: the suite asserts the exact statement count of all four SQL files, so a future file that breaks the assumption fails there instead of silently truncating a schema."
  - "The Postgres-only tests skip cleanly (never fail) when milexium_dev on 5432 is unreachable, so CI stays green; the migration tests themselves are parametrised [sqlite]/[postgres] and their SQLite parameter always runs."
  - "test_core_persistence.py and test_core_tenant_isolation.py were NOT edited and pass unchanged -- which is itself the compatibility claim, since CoreDatabase.sqlite()/postgres() now run a migration on every open."
evidence_to_emit:
  - "relrowsecurity AND relforcerowsecurity read from pg_class for all seven tables AFTER migrating, with the same two bits asserted FALSE before it"
  - "exactly one policy named tenant_isolation per rebuilt table"
  - "the migrated shape compared column-by-column against a REAL freshly-created database, not against a list written down a second time"
  - "the ledger's (version, applied_by) sequence: [(1, 'adopted'), (2, 'migrated')] for an upgraded database, [(2, 'created')] for a new one"
  - "the recorded tenant attribution note, containing the declared TenantId"
  - "test counts, and which engine parameters ran vs skipped"
