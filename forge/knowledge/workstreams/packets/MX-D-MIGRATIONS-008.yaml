notes: >
  WHAT PRE-TENANT ROWS' TENANT WAS DECIDED TO BE, AND WHY -- the question the brief asked
  to be answered explicitly. THE DECISION IS: nothing, unless a human says. The migration
  refuses. If any of the seven tables holds a row and the caller did not pass
  legacy_tenant_id, it raises rather than choosing, and the message names every populated
  table and its count so whoever is asked has the information to answer. When a tenant IS
  declared it is validated as a canonical TenantId and written permanently into the
  migration ledger's note, so the attribution is a recorded decision rather than something
  later inferred from the rows it produced. An EMPTY version-1 database -- the only case
  ADR-0048 claims has ever existed -- migrates with no question asked and records that no
  attribution was required.

  Refusal is the decision, not an evasion of it, because every candidate default is wrong
  in a way that would be discovered late and would be expensive: an invented UUID names
  nobody and quietly orphans the data; the ADR-0040 platform tenant would declare an
  operator's private feature values and promotion ledger platform-owned, and platform-owned
  rows are readable by EVERY tenant, so the most innocuous-looking default is the one that
  leaks; and the empty string is exactly the value core_rls_postgres.sql's deny-all default
  assumes no row ever holds, so it would defeat the policy it was being written under. The
  one thing this code genuinely cannot know is whose data it is holding, and inventing an
  answer to that is how a migration turns a schema problem into a data-ownership problem.

  RLS SURVIVING THE MIGRATION IS CONFIRMED, and it was the thing most likely to go wrong.
  The rebuild technique that makes the migration portable is precisely what endangers the
  boundary: a rebuilt table is a new relation, and ENABLE, FORCE and the policy do not
  follow the rows into it. migrate() re-applies core_rls_postgres.sql at the end of every
  PostgreSQL run, after the copy (never before -- the WITH CHECK half would reject every
  row, and the migration would move nothing while appearing to succeed). The suite proves
  it rather than asserting it: both pg_class bits per table, exactly one policy per table,
  a raw unfiltered cross-tenant read returning nothing with a positive control, a
  cross-tenant write refused with InsufficientPrivilege per table, the RESET/empty-string
  case, a FORCE-lifted collapse and its return, and -- so none of that is a fixture
  artefact -- the same two bits asserted FALSE on the same tables BEFORE migrating.

  HONEST LIMITS (v0.1, Demonstrated -- never operator-Validated):
  - ONE MIGRATION EXISTS. The chain is 1 -> 2. The mechanism is general (ordered Migration
    records with precheck/apply/stamp) but has been exercised over exactly ONE step; a
    three-step chain is not proved by a one-step one, and the first multi-step upgrade
    should expect to find something here.
  - A FUTURE DATA-MOVING MIGRATION ON POSTGRESQL WILL HIT RLS, and this is the trap most
    likely to catch the next person. From version 2 onward these tables are FORCEd, so a
    migration that counts or copies rows with no milexium.tenant_id in scope sees ZERO rows
    and "succeeds" having moved nothing -- the same vacuity ADR-0048 found in the
    in-place-corruption test. The 1 -> 2 migration is safe only because version 1 predates
    RLS entirely. Any 2 -> N migration must either drop the policies for its duration or
    copy per tenant, and must assert row counts before and after. Named now rather than
    discovered later.
  - ATOMICITY IS CLAIMED ON POSTGRESQL ONLY. There DDL is transactional and the whole
    migration commits or rolls back as one. On SQLite it is not: statements are issued
    individually and Python's sqlite3 may commit around DDL. A crash mid-rebuild leaves the
    rows in mx_core_v1_* and the next open REFUSES (shape unknown) naming those tables, so
    data is not lost -- but recovery is manual, and this is a safety net rather than a
    transaction.
  - ONE REFUSAL BRANCH IS CURRENTLY UNREACHABLE AND THEREFORE UNTESTED. `migrate()` refuses
    a STAMPED version that is not in KNOWN_SCHEMA_VERSIONS, but with versions 1 and 2
    contiguous and CURRENT = 2, every integer the ledger's CHECK (version >= 1) permits is
    either known or greater than CURRENT (which raises FutureSchemaVersionError first). The
    guard is written for the first time the chain has a gap; what IS exercised today is the
    UNSTAMPED unknown-SHAPE branch, three ways (a missing table, an extra column, and a
    half-finished rebuild). Stated rather than counted as coverage it does not have.
  - SHAPE DETECTION COMPARES COLUMN NAMES ONLY -- not types, primary keys, CHECK constraints
    or indexes, none of which have portable introspection that behaves identically on both
    engines. For the versions that exist this separates them cleanly (version 2 differs from
    version 1 by a column on every table), but a database whose columns match version 2 and
    whose PRIMARY KEY does not would be ADOPTED as version 2.
  - A MIGRATED POSTGRESQL TABLE IS NOT CATALOG-IDENTICAL TO A FRESH ONE. Its auto-generated
    primary-key constraint is named feature_values_pkey1 rather than feature_values_pkey,
    because the renamed-aside table still held the base name when the new one was created.
    Behaviourally identical (same columns, same uniqueness, same policy) and nothing in this
    repository references a constraint name, but it is a real difference and it is stated
    rather than left to be noticed.
  - NO LOCKING. Two processes opening the same pre-tenant database at once could both start
    the rebuild; the loser's ALTER TABLE ... RENAME fails loudly and the ledger's PRIMARY KEY
    on version is a second backstop, but that is refusal, not coordination. Same stance as
    ADR-0041's read-then-insert sequences: persistence, not concurrency.
  - DOWNGRADE IS NOT SUPPORTED, deliberately. A database stamped NEWER than this code
    understands is refused, never rewritten backwards. "Upgrade the code, do not downgrade
    the database" is in the error message.
  - THE DECLARED LEGACY TENANT IS VALIDATED AS WELL-FORMED, NOT AS EXISTING. tenant_id is
    TEXT with no foreign key to the canonical `tenants` table, which may not exist in the
    database at all (that independence is ADR-0041's and the conformance suite depends on
    it). So a migration can attribute rows to a tenant that was never registered.
  - THE ATTRIBUTED TENANT ID SITS IN AN UN-POLICIED TABLE. core_schema_migrations carries no
    RLS for the reason above (a policied version record would be unreadable at the moment it
    must be read), and the version-2 note names the tenant. Any session holding the
    application credential can read it. Bounded -- one opaque UUIDv7, recorded once, and this
    repository's threat model already treats the application credential as trusted -- but it
    is a real disclosure and the alternative would break version detection outright.
  - THE IN-MEMORY REFERENCE CLASSES ARE UNAFFECTED AND UNCHANGED. They have no schema to
    version.
  - migrations.py's SQL files are loaded by module-relative path and are not declared
    setuptools package-data -- the identical pre-existing exposure core_v0_1.sql and
    schema_v0_1.sql already have. Fixing it means editing pyproject, which this packet does
    not own.

  FOLLOW-UP, NOT FIXED HERE: themis/canonical/sql/schema_v0_1.sql HAS THE SAME CLASS OF
  PROBLEM, AND IN ONE RESPECT A WORSE ONE. Its CREATE TABLEs carry no IF NOT EXISTS at all,
  so re-applying that file to an existing database ERRORS rather than silently no-ops --
  which sounds safer and is not, because SqliteCanonicalStore and PostgresCanonicalStore
  sidestep it by always creating a FRESH schema. The consequence is that the canonical
  contract has never had to answer the question this packet just answered for Program D:
  what happens to an EXISTING database when the schema changes. It has no version record,
  no upgrade path, and the same "recreate it" remedy that stops being a remedy the moment
  operator data lands. That is deliberately out of scope here -- themis/canonical is owned
  by a concurrent packet and this packet touched none of it -- and it is named rather than
  quietly left. The recommended shape is the same mechanism with a distinct ledger table
  name, which is exactly why this one is called `core_schema_migrations` and not
  `schema_migrations`: a Program D store can be opened against a database that also carries
  the canonical contract, and two version ledgers sharing one table name would each read the
  other's rows as its own.

  ALSO OUT OF SCOPE, PER THE BRIEF: themis/core/promotion.py, model_registry.py and
  drift.py were not edited (PersistentPromotionController composes CoreDatabase and is
  carried along by the migration without needing a change), nor were themis/canonical,
  themis/connect, aletheia/replay, aletheia/benchmarks/, contracts, pyproject, CI,
  IMPLEMENTATION_STATUS, JOURNAL, any ADR, or git. No new dependencies.
