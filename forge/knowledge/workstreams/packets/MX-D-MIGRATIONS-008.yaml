objective: >
  Close the gap ADR-0048 recorded in its own limitations, and named the expiry date of:
  "No migration path. Every CREATE is IF NOT EXISTS, so a pre-tenant ADR-0041 database is
  not upgraded by reopening. Acceptable ONLY because these tables have never held operator
  data -- and that ceases to be true the moment they do." A design partner's export is that
  moment, and the current outreach is trying to cause it. `CREATE TABLE IF NOT EXISTS` is
  not a weak migration mechanism; it is the ABSENCE of one -- it makes reopening an
  out-of-date database SUCCEED, quietly, with application code running against a shape it
  was not written for. Build a real mechanism: a recorded schema version, an ordered
  idempotent upgrade from the ADR-0041 pre-tenant shape to the ADR-0048 tenant-scoped one,
  an EXPLICIT and RECORDED decision about whose data pre-existing rows are, and -- the part
  IF NOT EXISTS could never provide -- a refusal to open a database whose version this code
  does not understand. Without weakening ADR-0002 portability, ADR-0041's leakage
  guarantee, or ADR-0048's row-level security.
