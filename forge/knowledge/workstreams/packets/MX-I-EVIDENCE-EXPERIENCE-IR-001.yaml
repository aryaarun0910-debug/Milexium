id: MX-I-EVIDENCE-EXPERIENCE-IR-001
status: completed
completed_date: "2026-07-23"
objective: >
  Implement a first Evidence IR (EvidencePacket) and Experience IR
  (ExperiencePacket) that reconstruct, purely from an aggregate's recorded
  DecisionEvent history and an independent hash-chain check, what was known,
  proposed, verified, approved/overridden, executed, and observed -- proving
  the "independent reviewer can reconstruct the decision" integration
  requirement from blueprint 07/14 Program I.
owned_paths:
  - aletheia/evidence/
  - forge/knowledge/architecture/decisions/0009-evidence-ir-v0-1-conventions.md
read_only_dependencies:
  - themis/canonical/entities.py, ids.py, time.py, vocab.py (schema only)
  - aletheia/verify/hash_chain_verifier.py (verify_chain -- called, not reimplemented)
normative_contracts:
  - blueprint/07-explain-replay-and-evidence.md (expansion plan)
  - blueprint/14-execution-roadmap.md, Program I
  - blueprint/01-north-star-and-boundaries.md ("a generated natural-language
    explanation is never the authoritative decision record")
inputs_and_fixtures:
  - aletheia/conformance/fixtures/evidence_builders.py
required_outputs:
  - aletheia/evidence/{models,builder}.py
  - aletheia/conformance/property-tests/test_evidence_packet.py
  - aletheia/conformance/adversarial/test_evidence_tamper.py
acceptance_commands:
  - "py -3 -m pytest aletheia/evidence/ aletheia/conformance/property-tests/test_evidence_packet.py aletheia/conformance/adversarial/test_evidence_tamper.py -v"
performance_budget: {}
security_and_privacy_invariants:
  - "integrity_verified/chain_violations are the actual aletheia.verify.verify_chain result, never asserted true by fiat"
  - "build_experience_packet refuses to run against an EvidencePacket that failed integrity verification"
failure_injections:
  - "tampered payload in the source chain -> integrity_verified=False, specific ChainViolation surfaced, build_experience_packet raises"
  - "raw_rows spanning multiple aggregates -> violations from other aggregates do not leak into this packet"
compatibility_matrix: []
evidence_to_emit:
  - "11 passing tests"
forbidden_interface_changes: []
upstream_blockers:
  - "DecisionAlternative has no themis.canonical store method yet -- worked around via a v0.1 payload convention, see ADR-0009"
downstream_consumers:
  - Future Program H (replay) and Program D/J (semantic precedent retrieval via ExperiencePacket)
