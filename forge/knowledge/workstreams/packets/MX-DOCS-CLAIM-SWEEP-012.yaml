id: MX-DOCS-CLAIM-SWEEP-012
status: completed
dispatched_date: "2026-07-26"
completed_date: "2026-07-26"
adr: >
  none — this packet writes no ADR. It repairs claim language in outward-facing
  documents against an existing normative contract (ADR-0001) and an existing
  measurement (ADR-0058). It introduces no platform mechanism, no contract and
  no runtime behaviour. The one durable addition — the standing status-contract
  rule in forge/knowledge/docs/COMPETITIVE_POSITIONING.md — restates ADR-0001 at the place copy
  actually gets written; it does not amend it.
objective: >
  Close the highest business-risk defects in the 2026-07-26 internal audit: the
  active YC application draft and the positioning guide were making claims the
  product cannot support, in documents read by investors and by a 40-year
  industry expert currently corresponding with the founder. Specifically:
  remove every active use of "Validated"/"validated" for a Milexium capability,
  delete the $94M deadhead opportunity figure now known to rest on a
  relationship that does not exist in the data, replace both with claims that
  trace to a named artifact, and leave behind a standing rule so the next
  person writing copy cannot reach for "validated" by accident. Repair, not
  retreat: the draft should end up more persuasive, not shorter and apologetic.
owned_paths:
  - forge/knowledge/docs/yc/application-draft.md
  - forge/knowledge/docs/COMPETITIVE_POSITIONING.md
  - forge/knowledge/docs/MODEL_CARDS.md
  - forge/knowledge/docs/README.md
  - README.md
  - forge/knowledge/workstreams/packets/MX-DOCS-CLAIM-SWEEP-012.yaml
read_only_dependencies:
  - MILEXIUM_INTERNAL_AUDIT_2026-07-26.md          # the defect list
  - forge/knowledge/architecture/decisions/0001-adopt-expansion-blueprint-and-control-plane.md
  - forge/knowledge/architecture/decisions/0058-panel-findings-gate.md
  - forge/knowledge/architecture/decisions/0060-solver-portfolio-cpsat.md
  - forge/knowledge/architecture/decisions/0066-standalone-pack-verification.md
  - forge/knowledge/architecture/decisions/0068-demo-walkthrough.md
  - forge/business/outreach/panel_findings.json                   # gate-passed sector findings
  - forge/research/h5b_structure_vs_cost.json            # deadhead-vs-cost null
  - forge/research/h5e_ridesharing.json                  # occupancy / lost ride-sharing
  - forge/research/h5c_cost_decomposition.json
  - data/curated/metrics_real.json
  - forge/business/ntd/market_sizing.md
  - aletheia/benchmarks/optimization/portfolio_summary.md
  - app/**                                    # NOT touched — agents concurrent
  - aletheia/conformance/**                                 # NOT touched
  - forge/research/**                                    # NOT touched — read only
  - forge/business/outreach/**                                    # NOT touched — read only
normative_contracts:
  - >
    ADR-0001 status vocabulary: Exists / Specified / Demonstrated / Validated /
    Production. Validated requires consented operator data against a declared
    baseline. Milexium has none, so no document may claim it. Public aggregate
    data can DEMONSTRATE an aggregate forecasting task; it can never VALIDATE
    operator capacity planning, scheduling, denial explanation or economic
    impact.
  - >
    Every published figure must name the repository artifact it came from:
    forge/business/outreach/panel_findings.json (gate-passed), forge/research/*.json, a benchmark
    artifact, an ADR, or data/curated/metrics_real.json. An unsourceable claim is
    deleted, not softened.
  - >
    No savings, ROI or "opportunity" figure may be published while no operator
    fixed/variable cost split exists. aletheia/replay/teardown.py already
    refuses to emit a savings envelope without one; copy does not get a lower
    standard than code.
required_outputs:
  - >
    forge/knowledge/docs/yc/application-draft.md with zero "validated" claims about a Milexium
    capability, no $94M figure, and the genuine strengths stated confidently
    with artifact citations.
  - >
    forge/knowledge/docs/COMPETITIVE_POSITIONING.md carrying an explicit, standing status
    contract ahead of the claims-discipline list, so the instruction a writer
    reads first is the constraint rather than the slogan.
  - Root README.md and forge/knowledge/docs/MODEL_CARDS.md free of "production model" language.
  - forge/knowledge/docs/README.md maintenance rule pointing every future writer at the contract.
acceptance_commands:
  - "grep -rn 'validated' forge/knowledge/docs/yc/application-draft.md   # only the status contract's own prohibition"
  - "grep -rn '94M' forge/knowledge/docs/yc/application-draft.md         # no match"
  - "grep -rn 'production model' README.md forge/knowledge/docs/MODEL_CARDS.md  # no capability claim"
security_and_privacy_invariants:
  - "Documentation only. No code, no contract, no schema, no test touched."
  - "No git add / commit / push. No email sent, no draft created."
  - >
    app/**, aletheia/conformance/**, forge/research/** and forge/business/outreach/** untouched — four
    concurrent agents own those trees. Violations found there are REPORTED with
    file:line, not edited.
failure_injections:
  - >
    Every replacement number was re-read from its artifact rather than carried
    from the audit prose. Two figures supplied in the dispatch brief were NOT
    written because they could not be traced to an artifact: the balanced-panel
    trips (-15%) and opex (+49%) endpoints appear only in forge/knowledge/docs/HANDOFF.md, a
    document the same audit marks stale, and the deadhead cost-per-trip QUINTILE
    medians ($53.10/$48.30/$52.21/$53.10/$55.00) are not in
    forge/research/h5b_structure_vs_cost.json. The gate-passed QUARTILE medians
    ($48.53 lowest -> $54.09 highest, forge/business/outreach/panel_findings.json) were used
    instead. Deleting beats softening; softening beats inventing.
  - >
    The Pearson/OLS pair is quoted from forge/research/h5b_structure_vs_cost.json
    (n=405) and the quartile medians from forge/business/outreach/panel_findings.json (n=406).
    The two panels differ by one operator and that is stated nowhere in the copy
    because neither number is presented as depending on the other — but it is
    recorded here so a future reader does not "fix" one to match.
  - >
    forge/knowledge/docs/JOURNAL.md was deliberately NOT edited despite carrying the $94M figure
    at line 1347. It is an append-only dated record of what was believed on the
    day, and rewriting it would destroy the evidence that the claim was made and
    later killed. forge/knowledge/docs/archive/** left for the same reason.
compatibility_matrix:
  - "6 confirmed claim defects repaired across 5 documents."
  - >
    4 further defects found OUTSIDE owned paths and reported rather than edited:
    talos/tools/build_model_cards.py (regenerates two of the strings just fixed),
    forge/business/ntd/market_sizing.md, forge/business/ntd/savings_calculator.py + forge/business/ntd/build_outreach_targets.py,
    forge/business/outreach/design_partner_pitch.md.
evidence_to_emit:
  - >
    REPLACED, not merely removed. The $94M deadhead opportunity gave way to the
    gate-passed cost trend (cost per trip $29.19 -> $51.70 on a balanced panel
    of 1,606 agencies, +77% nominal / +34% real against CPI-U, ~81% price of an
    hour and ~19% lost productivity) and to the scoped occupancy finding
    (passenger miles per vehicle mile 1.213 -> 1.092, -10.0%, on the 355
    operators filing passenger miles in both years; trips got SHORTER, -4.6%;
    66.8% of those agencies lost occupancy). The occupancy finding is published
    with its selection bias in the same sentence: those 355 are a non-random 26%
    of the panel by agency count though 66% of its trips, so it is scoped to
    larger operators and labelled a hypothesis for shadow mode.
  - >
    The killed deadhead hook is now an ASSET in the draft rather than an
    omission: the application states that we tested our own lead claim, measured
    Pearson +0.017 / OLS R2 0.0003 (n=405), and deleted the headline figure it
    was carrying. To the two audiences in question, killing your own hook in
    public reads better than the hook did.
  - >
    Genuine strengths stated confidently and with citations, because they are
    real: 2,337 passing tests; a CP-SAT portfolio reproducing the published
    Cordeau DARP optima at 0.00% gap to a SELF-COMPUTED bound (ADR-0060) — and
    the more useful corollary, that it exposed the previous in-house heuristic
    as 1.6-8.0% off optimal; an evidence pack whose standalone verifier
    re-derives claims from primitive rows in an interpreter that cannot import
    Milexium (ADR-0066); a 2.5-second demo whose six best moments are refusals
    (ADR-0068).
upstream_blockers: []
downstream_consumers:
  - The YC Fall 2026 submission (human review before send).
  - The Christian Kent correspondence and any expert-facing material.
  - >
    Any future deck, landing page or proposal — forge/knowledge/docs/COMPETITIVE_POSITIONING.md
    is now the single place the status contract is stated for copy, and
    forge/business/outreach/panel_findings.json remains the only sanctioned source of sector
    numbers, with its `rejected` list the record of what may not be said.
notes: >
  Deliberately NOT done, and why. No ADR (this packet writes none). No git
  operations. The YC draft was repaired rather than trimmed: it is longer than
  it was, because two of the strongest things Milexium can honestly say — the
  self-computed optimality bound and the fact that it killed its own headline
  claim on measurement — were simply not in it. Four defects outside the owned
  paths were reported with file:line and left alone, the most consequential
  being talos/tools/build_model_cards.py, which regenerates forge/knowledge/docs/MODEL_CARDS.md and
  will reintroduce "validated as the right objective" on the next run unless a
  packet that owns talos/tools/ changes the two string literals at lines 41 and 113.
  forge/business/ntd/savings_calculator.py and forge/business/ntd/build_outreach_targets.py are the live
  generators of the per-agency deadhead-dollar claim and are the same defect as
  the $94M figure at agency scale; they now outrank the YC draft for business
  risk, because their output is sent to prospects rather than read by them.
