# ==========================================================================
problem: >
  Program F could route and it could prove. It could not reason about SHARING as
  an object.

  (1) There was no representation of which trips can ride together. Pooling was an
  emergent side-effect of insertion heuristics -- `darp_solver` puts a request
  wherever it is cheapest and whatever pooling results is incidental. Nothing in
  the package could answer "which trips CAN share, at what cost, and to whom", so
  nothing could target the quantity the sector has actually lost.

  (2) `metis/decide/exposure.py` (ADR-0065) measures who bore the cost of not
  seeing the future, and `attribute_capacity` names the earlier commitments that
  consumed a denied rider's capacity -- but both are RETROSPECTIVE by
  construction. They need the denial to have already happened. That is an
  excellent audit and no help at all at 09:00, which is when the decision that
  causes the 16:00 denial is taken.

  (3) `feasibility.check_darp_feasibility` sweeps a signed integer load and knows
  nothing about mobility devices. Under it a wheelchair user is one unit of load
  like anyone else, every ride-share is equally available to them, and the
  distributional question is vacuous by construction.

what_was_built:
  compatibility_graph: >
    `metis/decide/compatibility.py` -- requests as nodes; an EDGE means two
    trips can feasibly share a ride and a HYPEREDGE that k of them can. Every edge
    carries a materialised feasibility proof plus features re-derived from that
    proof: added detour time, resulting ride time per rider, equipment contention
    (peak floor units against capacity, positions used against positions
    available), time-window slack consumed, vehicle miles saved against solo
    service, passenger miles, occupancy, shared vehicle miles, and -- filled in by
    `capacity_value` -- the effect on future capacity.

  the_feasibility_authority: >
    The separation the brief demanded, made STRUCTURAL rather than conventional.
    A scorer is handed a `ProposalView` and returns a `float`. `ProposalView`
    carries coordinates, windows, direct ride times and mobility needs, and has NO
    field a feasibility verdict could be written into -- no schedule, no violation
    list, no certificate; the suite pins its exact field set. A share becomes real
    only as a `Certificate`, whose `__post_init__` demands a module-private
    witness token held by exactly two functions, which mint one only after BOTH
    independent checkers return nothing on a concrete schedule. The certificate
    carries that schedule, so the proof travels with the claim, and
    `CompatibilityGraph` re-runs both checkers on admission -- a forged
    certificate is not merely discouraged, it is rejected.

  equipment_contention: >
    `check_equipment_feasibility` -- an ADDITIVE layer alongside the unmodified
    routing checker, saying the two things the integer sweep cannot: a wheelchair
    rider requires a vehicle with a POSITION, and a deployed station occupies
    `wheelchair_footprint` SEAT-EQUIVALENTS of the same floor the ambulatory seats
    come from. Same vehicle model `commingled.py` uses (a cutaway van where a
    station is made by folding up a bench), applied to the routed problem.
    `feasibility.py` is untouched; a group must pass both checkers.

  future_capacity_value: >
    `metis/decide/capacity_value.py` -- the opportunity cost of committing a
    vehicle now, expressed in FUTURE TRIPS FORECLOSED:

        reach(state)       = how many sampled future requests admit a CERTIFIED
                             insertion into the fleet as it stands
        foreclosed(a -> b) = reach(a) - reach(b)

    stratified by accessibility requirement. Scenario trips are SPLICED INTO THE
    REAL INSTANCE (`_extend` rebuilds a `DarpInstance` containing both real and
    hypothetical requests) rather than judged by a bespoke stand-in, so they are
    evaluated by the same two checkers on identical terms. The FEASIBILITY half of
    the estimate is therefore exact; only the demand half is uncertain, and the
    sampling error is reported (`stderr`, `distinguishable_from`).

  the_planner_and_the_evaluation: >
    `metis/decide/pooling.py` -- an online, irrevocable insertion planner whose
    cost function is `added vehicle miles + capacity_weight * trip_value * (trips
    foreclosed + accessible_weight * accessible trips foreclosed)`, and a
    `PlanMetrics` evaluation that judges the PLAN: trips served, passenger miles
    per vehicle mile, vehicle miles per served trip, accessible capacity
    preserved, feasibility violations -- every service metric stratified by
    accessibility requirement. `diff_plans` answers the packet's own standard: did
    the assignment actually change?

design_calls_recorded:
  - "A SCORE PROPOSES; ONLY THE AUTHORITY ESTABLISHES, AND THE TYPES ENFORCE IT. The scorer's input
     type has no field a feasibility verdict could be written into and its output type is a float.
     `Certificate.__post_init__` refuses any construction without a module-private witness, which only
     the two certifying functions hold and only mint after both independent checkers return nothing.
     The certificate carries its witness schedule, and the graph re-runs both checkers on admission.
     Tested by ATTACK: an adversarial scorer that ranks infeasible groups highest, plus random and
     constant scorers, must all produce the IDENTICAL order-2 edge set AND the identical certificates.
     Asserted as set equality, because a count would pass while the contents drifted."

  - "AN EDGE MEANS A SHARED RIDE, NOT A SHARED ROUTE -- and getting this wrong made the equipment
     layer INERT. The first build certified any ordering one vehicle could serve, including picking A
     up, dropping A off, then collecting B. That is route CONSOLIDATION: it saves deadhead, raises no
     occupancy, and recovers none of the sector's lost ride-sharing. It also meant two wheelchair
     riders were never aboard at once and therefore never contended for the one position -- the first
     build reported ZERO equipment rejections on every instance. `shares_a_ride` now requires the
     group's onboard-overlap graph to be CONNECTED, which admits a genuine chain (A+B, then B+C) while
     rejecting back-to-back service. Equipment rejections went from 0 to non-zero on every instance
     immediately, and the graph shrank by roughly 93% on a2-16 -- most pairs genuinely cannot pool."

  - "POOLING IS NOT FREE, AND A TEST OF MINE ASSERTING OTHERWISE FAILED. `vehicle_miles_saved` was
     written as an invariant -- a share can never cost more than serving the group separately -- and
     it is FALSE once a genuine shared ride is required. Separate depot-anchored trips are always
     available; a pooled ordering must additionally keep both riders aboard together, and when their
     origins and destinations are not aligned that detour costs more than it saves. The test now
     asserts BOTH directions on real data and would fail if either disappeared. This is exactly why
     occupancy and vehicle miles must both be reported: a planner chasing occupancy alone will buy it
     with miles."

  - "THE CAPACITY ESTIMATE IS EXACT WHERE IT CAN BE AND HONEST WHERE IT CANNOT. Which future trips ask
     is a guess -- a placeholder prior that resamples observed requests and displaces them in space
     and time, NOT a forecast, and Program E's stack is deliberately not wired in. Whether a given
     trip fits is not a guess: it goes through the same authority as everything else. Splicing
     scenario requests into a rebuilt `DarpInstance` rather than writing a bespoke 'would this fit'
     routine is what buys that -- a private copy of the constraint system is how a generator and a
     checker drift into agreeing with each other and no one else."

  - "NO LOOKAHEAD IS A SIGNATURE PROPERTY, NOT A PROMISE. `prior_from_observed` takes the observed set
     and the instance geometry and has NO parameter through which the unobserved remainder could
     enter; the suite pins the parameter list. The observable consequence is pinned too: two runs
     agreeing on the observed prefix produce byte-identical priors and scenario draws however
     violently their futures differ. Without this the planner would be an offline re-planner reporting
     online numbers."

  - "THE A/B ISOLATES ONE TERM. Both policies run through ONE harness, on ONE arrival order, with ONE
     feasibility authority, and differ only in `capacity_weight`. At zero the cost collapses to added
     vehicle miles -- the rule `darp_solver._scan_insertions` already applies -- so the baseline is
     current practice rather than a strawman built to lose. Comparing against the offline LNS or
     CP-SAT instead would have conflated the capacity term with FORESIGHT and said nothing about
     either; those are reported separately and LABELLED as a different information regime."

  - "THE WEIGHT IS DIMENSIONLESS BECAUSE THE TWO TERMS SHARE A UNIT. A foreclosed future trip is
     charged `trip_value` -- the mean vehicle miles a request needs when served ALONE -- so at weight
     1.0, foreclosing one likely future trip costs what serving one trip costs. Had the terms been
     added in different units the weight would have been an arbitrary knob and every result a tuning
     artefact."

  - "IT CANNOT RATION, STRUCTURALLY, AND THE GUARD IS REACHABLE. A policy that declines a rider it
     could serve makes the run RAISE and produce nothing -- and the exception is
     `metis.decide.online.RationingRefused`, imported rather than re-declared, so the commingled
     harness and this one cannot drift into different definitions of the same refusal. The placement
     policy was made pluggable specifically so a test could hand the harness a rationing policy and
     prove the guard fires; a guard nothing can reach is prose."

  - "THE COMMITMENT LOG RECORDS THE ROUTE AFTER EACH COMMITMENT, so the whole run can be REPLAYED and
     each decision re-examined against the fleet as it actually stood. This was added because a
     mutation exposed that the suite was reading the harness's own bookkeeping back to it (see
     mutation_checks.survived_then_fixed). The harness must not be the only witness to its most
     important claim."

  - "STRATIFY WHAT IS STRATIFIABLE AND SAY WHY THE REST IS NOT. Occupancy and vehicle-miles-per-trip
     are FLEET ratios over shared vehicle miles; splitting them by rider needs an allocation rule and
     no rule is more true than another. So the cohort type reports the rider-level facts that need
     none (service rate, ride time, detour ratio, passenger miles) PLUS allocated vehicle miles under
     one stated rule -- each arc divided among the people aboard, empty arcs deadhead belonging to
     nobody -- and the rule is printed wherever the number is."

  - "PASSENGER MILES COUNT PEOPLE; CAPACITY COUNTS FLOOR. A wheelchair rider occupying two
     seat-equivalents is still ONE passenger. Conflating the two would have inflated occupancy exactly
     where this packet is trying to measure it honestly, and it is pinned by a test that gives the
     same route two different accessibility profiles and requires identical passenger miles."

  - "ACCESSIBLE CAPACITY PRESERVED IS REPORTED TWO WAYS ON PURPOSE. The scenario-based residual reach
     is decision-relevant but inherits the prior; `free_accessible_position_minutes` needs no demand
     assumption at all. Carrying both lets a reader see whether the conclusion survives disbelieving
     the prior."

  - "`None` MEANS NOT ESTIMATED, NEVER ESTIMATED AT ZERO. The two future-capacity feature fields and
     `accessible_capacity_preserved` default to None. A metric defaulting to 0.0 would let an
     unmeasured plan read as a saturated one, which is the direction that flatters a bad plan."

# ==========================================================================
decision_level_evaluation:
  artifact: "aletheia/benchmarks/optimization/pooling_results.json + pooling_summary.md"
  setup: >
    3 instances (a3-18, a4-16, a4-24) x 3 arrival seeds. One accessible vehicle
    per fleet, 35% wheelchair share, station footprint 2 seat-equivalents, 1
    position -- ALL ASSIGNED. Both online policies run through one harness on one
    arrival order with one feasibility authority and differ only in
    `capacity_weight` (0.0 vs 1.0, accessible_weight 2.0). Planner ensemble 3
    draws x 10 scenarios; evaluation ensemble 5 draws x 12 scenarios, one fixed
    seed shared by every planner so no comparison is decided by sampling.

  did_the_assignment_change:
    changed: "7 of 9 runs"
    identical: "2 of 9 (a4-16 seed 3, a4-24 seed 2) -- reported as identical rather than dressed up"
    requests_moved_to_another_vehicle: "0 to 9 per run (30 in total)"
    requests_with_different_pooling_partners: "0 to 10 per run (34 in total)"
    requests_lost: "0 in every run"

  service_totals_across_the_9_runs:
    trips_served: "145 -> 149 of 174 demanded"
    wheelchair_cohort: "31 -> 35 of 60 (+4 -- every gained trip)"
    ambulatory_cohort: "114 -> 114 of 114 (unchanged and complete; nobody paid for the gain)"
    per_run_trip_deltas: "+1 (a4-16 s2), +1 (a4-24 s1), +2 (a4-24 s3), 0 elsewhere; never negative"

  occupancy_passenger_miles_per_vehicle_mile:
    mean: "0.6834 -> 0.6757 (-1.1%)"
    per_run: "+0.0606, +0.0511, +0.0331, 0.0, 0.0, -0.0416, -0.0435, -0.0488, -0.0801"
    honest_reading: >
      Essentially flat, direction not consistent. The capacity term is NOT an
      occupancy lever and the packet does not claim it is. Occupancy is delivered
      by the pooling machinery both policies share; the capacity term spends some
      of it to reach riders the baseline could not.

  vehicle_miles_per_served_trip:
    mean: "19.601 -> 19.545 (-0.3%)"

  accessible_capacity_preserved:
    definition: >
      Mean scenario trips needing a wheelchair-accessible vehicle that the
      FINISHED plan can still absorb (5 draws x 12 scenarios, fixed seed).
      Reported alongside `free_accessible_position_minutes`, which needs no demand
      assumption at all.
    mean: "1.178 -> 1.756 scenario trips (+49%)"
    per_run_delta: "+1.4, +1.2, +1.2, +0.8, +0.6, 0.0, 0.0, 0.0, 0.0 -- never negative"

  feasibility_violations:
    online_policies: "0 in every one of the 18 plans, routing AND equipment"
    note: "Re-verified by both independent checkers in the evaluation, not taken from the planner's self-audit."

  offline_yardsticks_different_information_regime:
    a3-18: "lns 18/18 occ 0.7686 vmt/trip 17.56 -- 11 equipment violations, 0 routing; cpsat-darp 18/18 occ 0.7974 vmt/trip 16.69 -- 16 equipment violations, 0 routing. Both leave 0.0 accessible capacity."
    a4-16: "lns 16/16 occ 0.7086 -- 16 equipment violations; cpsat-darp 16/16 occ 0.7105 -- 14 equipment violations."
    a4-24: "lns 24/24 occ 0.8202 -- 13 equipment violations; cpsat-darp 24/24 occ 0.8788 -- 14 equipment violations."
    reading: >
      These see EVERY request before committing to any, so they are a distance
      yardstick and not a like-for-like opponent -- the online policies work with
      strictly less information and the gap between them is the cost of
      irrevocable commitment, exactly as ADR-0065 frames it. Their zero routing
      violations show their own contract is intact. Their equipment violations say
      the current planner does not model that a wheelchair position is not a seat.
      Since the labels are ASSIGNED, this is a statement about the model, never
      about a real fleet.

  the_compatibility_graph:
    a3-18: "18 nodes, 17 edges, 8 hyperedges from 167 proposals; 142 rejected by the exact scheduler, 0 by the routing checker, 2 by EQUIPMENT; 2 isolated riders; enumeration not truncated; 0.27s"
    a4-16: "16 nodes, 23 edges, 12 hyperedges from 177 proposals; 141 / 0 / 6; 1 isolated; 1.00s"
    a4-24: "24 nodes, 31 edges, 13 hyperedges from 322 proposals; 278 / 0 / 2; 1 isolated; 1.02s"
    reading: >
      Shareability is scarce: 17 of 153 candidate pairs on a3-18, and some riders
      can pool with nobody at all. `isolated` is worth naming, because an
      occupancy target that ignores those riders is a target that will be met by
      declining them. The routing checker's zero count is honest and expected --
      `exact_schedule` is exact, so it is a redundant second opinion on this
      codebase; see mutation_checks.not_mutation_testable_here for how it is
      exercised anyway.

  cost:
    graph_build: "0.27 - 1.02s per instance"
    baseline_plan: "0.13 - 0.39s"
    capacity_aware_plan: "3.0 - 9.1s (roughly 10-25x the baseline; a scenario ensemble is refitted and evaluated at every arrival)"
    note: "Measured on a machine concurrently running other agents' suites. Indicative only."

