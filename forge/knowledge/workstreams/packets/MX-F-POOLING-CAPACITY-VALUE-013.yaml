id: MX-F-POOLING-CAPACITY-VALUE-013
status: completed
completed_date: "2026-07-26"
dispatched_date: "2026-07-26"
adr: null   # ADRs are the orchestrator's to write; this packet wrote none by instruction

result: >
  THE DECISION CHANGES, AND THE GAIN GOES ENTIRELY TO THE COHORT THAT NEEDS THE
  SCARCE VEHICLE. Across 9 runs (a3-18, a4-16, a4-24 x 3 arrival seeds), pricing
  the future changed the plan in 7 and left it byte-identical in 2. Trips served
  145 -> 149 of 174 demanded. **All four gained trips went to riders needing a
  wheelchair-accessible vehicle** (31 -> 35 of 60); ambulatory service was 114/114
  under both policies, so nobody lost a trip to pay for it -- in total or in
  either cohort. Accessible capacity preserved rose 1.178 -> 1.756 scenario trips
  (+49%). Feasibility violations: ZERO under both policies, every plan accepted by
  both independent checkers.

  THE COST IS OCCUPANCY, AND IT IS REPORTED RATHER THAN BURIED. Mean occupancy
  fell 0.6834 -> 0.6757 (-1.1%), swinging both ways per run (+0.061 to -0.080).
  Vehicle miles per served trip were flat (19.60 -> 19.55). **The capacity-value
  term is not an occupancy lever and this packet does not claim it is** -- it buys
  accessible SERVICE, and the evaluation was built to make exactly that trade
  visible instead of letting an aggregate hide it.

  THE SHARPEST FINDING IS ABOUT THE PLANNER WE ALREADY HAD. The offline solvers
  from ADR-0060 win on every headline number -- they serve every request, at the
  best occupancy in the table (CP-SAT 0.7974 / 0.7105 / 0.8788) and the lowest
  vehicle miles per trip -- and they produce **11-16 equipment violations each**,
  on every instance, while their own routing contract holds perfectly (0 routing
  violations). Under an equipment model where a wheelchair position is not a seat,
  the distance-optimal routing is infeasible in 14 places on a3-18, and the
  occupancy it reports is partly achieved by pooling a real accessible fleet could
  not perform. On a3-18 both offline plans also leave 0.0 accessible capacity
  behind, against 2.2-2.6 for the capacity-aware online plan. The labels are
  ASSIGNED, so this is a statement about what the current planner does not model,
  never about a real fleet.

  THE GRAPH IS SMALL AND THAT IS THE POINT. On a3-18 only 17 of 153 candidate
  pairs are certifiably poolable; 2 riders can share with nobody at all. Equipment
  contention rejects 2-6 pairs per instance -- non-zero on every instance, which
  it was NOT until the shared-ride requirement was added (see design_calls).

  121 tests (55 compatibility + 22 capacity-value + 44 pooling), 0 skipped, 0
  failed. 26 mutations applied: 22 caught first time, 4 survived -- 3 genuine test
  gaps (one of them a one-line rationing policy that passed the entire suite) and
  1 wrong mutation. All four closed and re-verified RED.

objective: >
  Build the model that finds and values shareable trips, and the model that
  prices what committing a vehicle NOW costs a rider LATER -- then evaluate both
  as a DECISION rather than as a score.

  The motivation is a finding from this week's research
  (`forge/research/h5e_ridesharing.py`, read only, verified against its committed JSON):
  across the 355 US agencies reporting passenger miles in both years, 2015 -> 2024
  average trip length FELL 4.61% (9.289 -> 8.861 passenger miles per trip) while
  OCCUPANCY fell 9.97% (1.2134 -> 1.0924 passenger miles per vehicle mile).
  66.8% of agencies lost occupancy. In that source's own decomposition the
  ride-sharing term accounts for 182% of the rise in vehicle miles per trip, with
  trip length OFFSETTING it by 82% -- so the productivity collapse is not merely
  mostly lost ride-sharing, it is lost ride-sharing partly masked by trips getting
  shorter. Occupancy is not a fact about riders that a forecaster predicts; it is
  the thing a scheduling system decides, one share at a time. Program F.

