mutation_checks:
  method: >
    26 mutations were applied to the source, the named test selection run, and the
    source restored. RED means the test caught it. A test that stays green under
    the mutation it claims to guard is proving nothing -- and per the brief, a
    GREEN result was investigated for a WRONG MUTATION before being called a test
    gap. One of the four survivors was exactly that.
  totals:
    applied: 26
    caught_first_time: 22
    survived: 4
    of_which_genuine_test_gaps: 3
    of_which_wrong_mutation: 1
    all_four_closed_and_re_verified_RED: true
  caught_first_time:
    - "compatibility: Certificate's witness check removed (anything can be constructed) -> RED"
    - "compatibility: the EQUIPMENT checker dropped from the authority -> RED"
    - "compatibility: the ROUTING checker dropped from the authority -> RED"
    - "compatibility: shares_a_ride always True (consolidation counted as pooling) -> RED"
    - "compatibility: the wheelchair-position count ignored -> RED"
    - "compatibility: the graph admits certificates without re-verifying them -> RED"
    - "compatibility: can_bind always True (the anti-vacuity guard neutered) -> RED"
    - "compatibility: certify_insertion takes the DEAREST position instead of the cheapest -> RED"
    - "compatibility: passenger miles charge the wheelchair station's footprint as people -> RED"
    - "compatibility: an uncertified group admitted when the scorer ranks it highest -> RED"
    - "capacity_value: the prior fitted on EVERY request instead of only the observed ones -> RED"
    - "capacity_value: the incremental reach ignores the replacement -> RED"
    - "capacity_value: scenario trips never need a wheelchair -> RED"
    - "capacity_value: distinguishable_from always True -> RED"
    - "capacity_value: the extended profile loses the real accessibility labels -> RED"
    - "pooling: the RationingRefused guard removed -> RED"
    - "pooling: the planner's equipment gate removed (plans become infeasible) -> RED"
    - "pooling: deadhead miles not accounted (the allocation stops adding up) -> RED"
    - "pooling: the placement policy picks the WORST option instead of the best -> RED"
    - "pooling: diff_plans ignores pooling partners -> RED"
    - "pooling: occupancy hard-coded to 1.0 -> RED"
    - "pooling: cohort passenger miles not partitioned (each cohort gets the fleet total) -> RED"
  survived_then_fixed:
    - mutation: "compatibility: the shared-FLOOR check deleted, leaving only the position count"
      why_it_survived: >
        Every test that exercised the floor used two wheelchair riders, and with
        one position per vehicle the POSITION check refused those groups anyway.
        The floor check was covered for in every case and could be deleted
        silently.
      fix: >
        Added `test_the_shared_floor_refuses_a_group_the_positions_and_the_load_sweep_both_allow`,
        which isolates it: ONE wheelchair rider (one position, fine) plus two
        ambulatory riders, on a purpose-built instance whose identical pickup and
        drop-off windows force all three aboard simultaneously so no chained
        ordering can dodge the peak. The instance's own integer load sweep counts
        three against a capacity of three and allows it; the floor counts the
        station at two seat-equivalents, totals four, and refuses.
      re_verified: "RED"
    - mutation: "pooling: the irrevocability 'nobody was dropped' check removed"
      why_it_survived: >
        The only way a POLICY could drop an earlier rider was by returning a
        certificate the harness never offered -- which the `InvalidPlacement`
        guard already refuses first. The drop check was guarding a case
        unreachable through the public API, and the existing test passed on the
        wrong exception because it accepted either.
      fix: >
        Split into two tests. The policy-side test now pins `InvalidPlacement`
        specifically. A new test corrupts the AUTHORITY instead
        (`certify_insertion` monkeypatched to return a legitimately certified
        solo route), which makes the offending option genuinely harness-offered --
        a harness/authority bug, which is exactly what the check exists for.
      re_verified: "RED"
    - mutation: "pooling: the planner declines every wheelchair rider (a one-line rationing policy)"
      why_it_survived: >
        THE WORST SURVIVOR, and the most useful. The unserved branch hard-codes
        `options=0` on the commitment it records, so the test asserting
        `served == (options > 0)` was reading the harness's own claim back to it
        and could never contradict it. A one-line change turning the planner into
        a policy that refuses every disabled rider passed the entire suite.
      fix: >
        Stopped believing the harness. `Commitment` now carries `route_after`, so
        a run can be REPLAYED exactly, and
        `test_no_declined_rider_had_a_certified_placement_when_they_arrived`
        reconstructs the fleet at each declined request and re-asks the authority
        on every vehicle from scratch. It also asserts the instance actually
        produces declines, so it cannot pass vacuously.
      re_verified: "RED"
  survived_because_the_mutation_was_wrong:
    - mutation: "pooling: `if not profile.is_accessible(v): continue` removed from free_accessible_minutes"
      why_it_was_not_a_test_gap: >
        EQUIVALENT CODE, not a behaviour change. `positions_on(v)` already returns
        0 for a non-accessible vehicle, and the free-minutes condition requires
        `wc_on < positions`, which is `0 < 0` and never true. The guard is a
        readability and speed optimisation, not a correctness one, so no test
        could have caught its removal and none should have.
      replaced_with: >
        `available = span * profile.num_vehicles` instead of
        `span * len(profile.accessible_vehicles)` -- a real behaviour change to
        the same function.
      re_verified: "RED"
  not_mutation_testable_here:
    - "The planner's final self-audit (both checkers on the finished plan) never fires on a correct
       planner, and any mutation reaching it also breaks the plan, so the independent re-check in
       `evaluate` catches the plan rather than the audit. It is defence in depth against a future bug,
       and it is honestly untested as such."
    - "`feasibility.check_darp_feasibility` inside the authority never actually rejects anything
       `exact_schedule` produces on these instances -- the scheduler is exact for the difference
       system, so the routing checker is a redundant second opinion. Rather than delete it (it is what
       would catch a future scheduler bug) the gate is exercised DIRECTLY by
       `test_the_routing_checker_inside_the_authority_is_live_not_decorative`, which hands `_mint` a
       schedule the checker must refuse. The redundancy on real instances is real and is stated."

# ==========================================================================
known_limitations:
  the_prior_is_the_weakest_link:
    - "The scenario distribution is a PLACEHOLDER: it resamples already-observed requests and displaces them in space and time. It is not a demand model and no forecasting model is wired into it. The ABSOLUTE foreclosure counts inherit that assumption entirely. What is defensible is the ORDERING of placements, because every placement at one arrival is scored against the same draws."
    - "Program E's forecasting stack is NOT connected. That is partly a boundary (this packet may not touch `metis/forecast/**`) and partly a real gap: a learned arrival model belongs behind this interface and would change the scenarios without touching the feasibility path."
    - "`reach` is MARGINAL, not simultaneous: each scenario trip is asked about on its own against the fleet as it stands. Two trips can each be reachable without both being servable together, so reach is an upper bound on what a draw could actually be carried. That is the right quantity for a per-request foreclosure question and it is NOT a forecast of how many trips the day will fit."
    - "Scenario counts are small (8-12 per draw, 3-5 draws) because the estimate runs inside a planning loop. `stderr` is reported and `distinguishable_from` exists precisely because differences at this sample size are often not distinguishable from noise."

  accessibility:
    - "THE ACCESSIBILITY LABELS ARE ASSIGNED, NOT OBSERVED. The published Cordeau instance files carry no accessibility attribute whatsoever (ADR-0065), so the wheelchair/ambulatory split, the accessible share of the fleet, the station footprint and the position count are all invented from a seed. Every stratified number in this packet demonstrates that the METHOD discriminates between cohorts. None of them is evidence about any real disabled rider's access to service, and none may be quoted as such."
    - "The wheelchair footprint of 2 seat-equivalents is a claim about a VEHICLE. A fleet whose stations sit in dedicated floor space has a footprint of 0 against the ambulatory seats, and under that value this whole layer correctly reports no equipment contention. It is a parameter, and the profile's `can_bind` reports honestly when the configuration makes the layer inert."
    - "The arrival ORDER is assigned from a seed too. It is the one thing an operator does not control, so a result from a single order is an anecdote; the benchmark sweeps three seeds, which is better than one and still few."

  the_graph:
    - "Order 2 is enumerated exhaustively; order 3+ is NOT. Triples are proposed by extending certified pairs and only the top `hyperedge_candidates` scored ones are certified, so a group ABSENT from the graph was either rejected by a checker or never proposed -- and the two are not the same. `truncated` records which. SOUNDNESS is unaffected: everything present is proved."
    - "Sub-group closure is deliberately not assumed in either direction, which is correct but means the hyperedge search cannot prune on pair infeasibility and is therefore more expensive than it could be."
    - "Groups above order 3 are not built at all. `certify_group` handles any size (2520 orderings at order 4) but nothing calls it above 3."
    - "The graph certifies each group on a REPRESENTATIVE vehicle, which is sound only because the Cordeau fleet is homogeneous apart from the accessibility this packet assigns. On a heterogeneous fleet the representative would have to be dropped. The planner re-certifies against the actual vehicle and its actual riders before committing anything, so no plan depends on the shortcut."

  the_planner:
    - "It is an ONLINE insertion planner with no improvement phase -- no LNS, no re-optimisation, no regret across requests. It is weaker than the offline solvers by construction and is not offered as a competitive DARP solver. On a2-16 it serves 14 of 16 where the offline optimum serves all 16; that gap is the cost of irrevocable commitment, not a defect."
    - "`capacity_weight` and `accessible_weight` were not tuned. The reported A/B uses 1.0 and 2.0 because they are round numbers in defensible units; no sweep was run and no claim is made that they are good values."
    - "The capacity-aware policy is roughly 10-20x slower than the baseline (a scenario ensemble is refitted and evaluated at every arrival). Measured wall times are in the artifact and were taken on a machine running other agents' suites concurrently -- indicative only."

  the_evaluation:
    - "Occupancy and vehicle-miles-per-trip are fleet ratios and are NOT stratified by cohort, because splitting them requires an allocation rule and no rule is more true than another. Allocated vehicle miles ARE reported per cohort under one stated rule (each arc split among the people aboard; empty arcs are deadhead belonging to nobody), and the rule must be quoted with the number."
    - "`accessible_capacity_preserved` inherits the prior. `free_accessible_position_minutes` does not and is reported alongside it for exactly that reason."
    - "The benchmark covers 3 of the 24 instances in the acquired archive. The other 21 are NAMED in both the JSON and the summary as not covered, never silently dropped."
    - "The LNS baseline runs on a deliberately SHORT LEASH (40 iterations, 30s wall cap), and its construction phase is not interruptible at all. Its objective is its answer at that budget, not its best. It is present as an accessibility-blind comparison, not as a distance champion, and ADR-0060 already established that it is 1.6-8.0% off the proven optimum at larger budgets."

  test_cost:
    - "121 tests across the three modules; the pooling module alone is ~25-75s (dominated by one LNS baseline run at 28s and one shared a4-24 fixture at 19s). Heavy for CI, in a Program F suite that was already heavy."

  reproducibility:
    - "The capacity term is a MONTE CARLO estimate. Every draw is seeded from (instance, observed prefix, seed), so a plan and its metrics reproduce exactly -- pinned by a test that allows ONLY `wall_time_s` to differ. That is same-machine reproducibility; it has not been checked on a second machine, the same gap ADR-0060 records."
    - "Wall times in the artifact were measured while other agents' suites were running on the same machine. Indicative only."

scope_honesty:
  what_this_is: >
    A compatibility graph over requests in which every edge is a materialised
    feasibility proof; a structural separation that stops any scorer -- learned or
    otherwise -- from standing in for that proof; an equipment-contention layer
    that makes a wheelchair position non-fungible with an ambulatory seat; a
    decision-time estimate of which likely future trips a commitment forecloses,
    stratified by who needs an accessible vehicle; and an evaluation that judges
    plans rather than objective values.
  what_this_is_NOT: >
    No learned model is shipped and none was trained -- `geometric_affinity` is a
    hand-written heuristic and says so; the interface is the deliverable. Not a
    demand forecast. Not a competitive DARP solver. Not a solution to online
    stochastic scheduling, which this repository has said twice it does not
    consider solved and still does not.
  status_label: >
    **Demonstrated** at most. The Cordeau instances are SYNTHETIC academic
    benchmarks and the accessibility labels on them are ASSIGNED by this packet,
    not observed -- the published files carry no accessibility attribute at all
    (ADR-0065). Everything here supports ALGORITHMIC claims only. Nothing is
    Validated and nothing is close. No number produced by this packet may be
    cited as evidence about any real operator's service, riders, vehicles or
    costs, and the STRATIFIED figures in particular must never be quoted as a
    statement about real disabled riders' access to service.
  framing: >
    RELEASING CAPACITY, NEVER RATIONING IT. The planner structurally cannot
    decline a rider it could serve; the module docstrings say so; and every
    evaluation reports trips served next to occupancy, stratified, so that an
    occupancy gain paid for with somebody's trip is visible as the defect it
    would be. Restricting transit use is not the objective.

