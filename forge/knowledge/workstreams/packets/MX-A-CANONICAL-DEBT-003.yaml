id: MX-A-CANONICAL-DEBT-003
status: completed
completed_date: "2026-07-24"
adr: forge/knowledge/architecture/decisions/0037-canonical-debt-alternatives-observations-rls.md
result: "36 tests, 0 skipped; RLS RAN against native PG17 incl. a FORCE-is-load-bearing test; schema_v0_1.sql 0-line diff"
dispatched_date: "2026-07-24"
objective: >
  Clear the three canonical gaps IMPLEMENTATION_STATUS has carried as explicit
  flagged debt, all of which now have a consumer that needs them. Program A + C.
owned_paths:
  - themis/canonical/storage.py            # SQLite store: add the missing methods
  - themis/canonical/postgres_storage.py   # Postgres store: same contract
  - themis/canonical/observation_store.py  # add StopTimeObservation persistence
  - themis/canonical/sql/rls_postgres.sql  # extend RLS to the observation tables
  - aletheia/conformance/property-tests/test_decision_alternatives.py
  - aletheia/conformance/property-tests/test_stop_time_observation_store.py
read_only_dependencies:
  - themis/canonical/entities.py (DecisionAlternative, StopTimeObservation, ModelVersion)
  - themis/canonical/sql/schema_v0_1.sql (tables already defined -- do NOT change the schema)
  - aletheia/evidence/ (the ADR-0009 workaround this unblocks; do not modify)
normative_contracts: [blueprint/04-canonical-state.md, ADR-0002, ADR-0009, ADR-0010, ADR-0018]
debt_1_decision_alternatives:
  problem: >
    schema_v0_1.sql has defined the `decision_alternatives` table since v0.1, but
    NEITHER store ever reads or writes it. Program I worked around this with a
    v0.1 convention (alternatives embedded in a RECOMMENDATION event payload,
    ADR-0009) and ADR-0012 recorded the resulting state-transition check as
    "structurally inapplicable". "Why not the alternatives?" is a load-bearing
    explainability claim with no storage behind it.
  required: >
    Add append + read methods for DecisionAlternative to BOTH stores against the
    existing table, with the same method contract (mirroring how SqliteCanonicalStore
    and PostgresCanonicalStore already parallel each other). Do NOT migrate or
    change the ADR-0009 embedded-payload convention -- both can coexist; this
    packet makes the table usable, it does not force a cutover.
debt_2_stop_time_observation:
  problem: >
    ADR-0035 landed VehicleObservation with a PostGIS spatial round-trip, but
    StopTimeObservation has NO store method at all -- half the operational entity
    family is unpersistable.
  required: >
    Add StopTimeObservation insert + read to observation_store.py, following the
    VehicleObservation pattern (disposable mx_<uuid> schema, portable columns).
    No geometry: a stop-time observation has no position of its own.
debt_3_rls_on_observations:
  problem: >
    rls_postgres.sql guards every other tenant-scoped table with ENABLE + FORCE
    ROW LEVEL SECURITY, but the two observation tables added by ADR-0035 are
    NOT covered. A tenant-scoped table with no policy is precisely the false
    assurance ADR-0018 exists to prevent.
  required: >
    Extend rls_postgres.sql to vehicle_observations and stop_time_observations
    using the identical `tenant_id = current_setting('milexium.tenant_id', true)`
    USING + WITH CHECK pattern, ENABLE **and** FORCE. Add an adversarial test
    proving cross-tenant reads are blocked, mirroring the existing RLS test.
acceptance_commands:
  - "py -3 -m pytest aletheia/conformance/property-tests/test_decision_alternatives.py aletheia/conformance/property-tests/test_stop_time_observation_store.py -q"
  - "py -3 -m pytest themis/ metis/ aletheia/ argus/ -q   # whole suite still green (603 baseline)"
security_and_privacy_invariants:
  - "RLS must use FORCE, not just ENABLE -- the application role OWNS these tables and a table owner bypasses RLS by default. Without FORCE every isolation test passes for the wrong reason (ADR-0018)."
  - "Postgres-dependent tests skip cleanly when the instance is absent, matching the existing suite, so CI stays green."
  - "schema_v0_1.sql stays untouched and portable -- this packet adds no columns."
failure_injections:
  - "cross-tenant read of vehicle_observations / stop_time_observations returns nothing under the acting GUC"
  - "an unset milexium.tenant_id GUC yields deny-all, not allow-all"
  - "writing a DecisionAlternative for a schedule_run belonging to another tenant is rejected"
compatibility_matrix: ["SQLite and PostgreSQL stores expose the same DecisionAlternative method contract"]
evidence_to_emit: ["test counts; confirmation the RLS tests RUN (not skip) against the local Postgres"]
upstream_blockers:
  - "ModelVersion.tenant_id for platform-trained models (ADR-0010) is NOT in this packet -- it is a convention decision the orchestrator will make and record in an ADR, because it changes what the RLS policy on model_versions means."
downstream_consumers: [Program I explainability, Program F once a real scheduler writes alternatives]
notes: >
  Disjoint from the teardown packet (aletheia/replay) and the intake packet
  (themis/connect, forge/knowledge/docs/). Do NOT touch pyproject, CI, shared docs, ADRs, or
  git. Do NOT change schema_v0_1.sql.
