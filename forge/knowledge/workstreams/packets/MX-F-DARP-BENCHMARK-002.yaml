failure_injections: ["property test: independent checker never accepts an infeasible benchmark solution"]
evidence_to_emit: ["proven optimum reached on Cordeau a3-18 (0.00% gap); 7.97% on a2-16; both feasible; existing 124 F tests preserved"]
compatibility_matrix: ["pure Python; ortools NOT added"]
upstream_blockers: []
known_limitations: ["only 2 instances counted (time budget) -- broader sweep is a straightforward follow-up the harness supports"]
downstream_consumers: [YC/technical-reviewer credibility; future CP-SAT/MILP backends]
