id: MX-F-DARP-BENCHMARK-002
status: completed
completed_date: "2026-07-24"
objective: >
  Build a scalable DARP solver and benchmark it against published Cordeau
  dial-a-ride instances, reporting REAL optimality gaps -- checkable technical
  credibility without a pilot.
owned_paths: [metis/decide/ (darp_ir, darp_solver, darp_loader, darp_bridge; feasibility.py appended), aletheia/benchmarks/quality/, data/acquired/catalog/cordeau-darp.*, forge/knowledge/architecture/decisions/0024-darp-solver-benchmark.md]
read_only_dependencies: [metis/decide/ir.py, solver.py (existing v0.1 kept intact), themis/estate (acquisition), themis/canonical/vocab]
normative_contracts: [blueprint/09-benchmark-data-and-research.md, blueprint/06]
required_outputs:
  - metis/decide/darp_{ir,solver,loader,bridge}.py
  - aletheia/benchmarks/quality/{darp_benchmark.py,darp_results.json,darp_summary.md,best_known.json}
  - aletheia/conformance/property-tests/test_darp_benchmark.py
acceptance_commands: ["py -3 -m pytest aletheia/conformance/property-tests/test_darp_benchmark.py -v"]
