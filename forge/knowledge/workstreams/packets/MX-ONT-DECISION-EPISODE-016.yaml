problem: >
  ADR-0072 shipped 10 modules, 9 tables and 147 tests and connected to nothing.
  It was excellent scaffolding with no traffic through it, and scaffolding that
  has never carried load is scaffolding whose defects are undiscovered. Two of
  its own closing notes were the specific gaps: nothing wired it to the solver,
  and `alternatives=()` could not distinguish "nothing was on the table" from
  "the producing system does not tell us".

the_chain_that_now_flows:
  1_snapshot: >
    `OntologyStore.take_snapshot(as_of=T, scope=...)` materialises the
    information set under `receipt_time < T` and persists its content hash.
  2_decision: >
    A decision is made FROM THE SNAPSHOT ONLY. The ontology cannot verify that --
    it did not make the decision -- but it makes the claim FALSIFIABLE: every
    action cites the snapshot's id AND its content hash, and the reconstruction
    re-derives and re-checks both.
  3_action: >
    `record_decision_episode` writes, per placement: an ASSIGNMENT object (the
    thing the decision brought into existence, which by construction did not
    exist at `as_of`), ASSIGNMENT_SERVES_REQUEST and VEHICLE_PERFORMS_ASSIGNMENT
    edges, one ASSIGN `ActionRecord` carrying alternatives + provenance +
    verifier verdict + policy version + authority, and the solver's optimality
    claim as four DERIVED facts. Per denial: a TRIP_DENIED event carrying the
    binding constraints and citing the snapshot. Per foreclosed opportunity: an
    ASSIGNMENT_FORECLOSED_POOLING_WITH edge carrying its weight.
  4_outcome: >
    `record_outcome` writes a SEPARATE row at its own horizon, with its own
    receipt time, necessarily later than the decision's.
  5_reconstruction: >
    `reconstruct_episode(store, action_id)` reads the action row, RE-DERIVES the
    information set through `load_snapshot`, compares the re-derived content hash
    against the one the ACTION pinned (a different claim from the one
    `load_snapshot` already checked against the SNAPSHOT row), and gathers the
    denials of the same decision, the foreclosed opportunities of the same
    assignment, and the outcomes of the same action.

the_seam:
  constraint: >
    `metis/` may import TYPES from `themis/` and never a store or a writer, and a
    concurrent packet is about to enforce it. So the reverse edge must not exist
    either: `themis/ontology` imports nothing from `metis`, holds no solver
    reference, and knows nothing about CP-SAT.
  how: >
    What crosses is PLAIN DATA -- `DecisionResult` and its parts -- and two
    STRUCTURAL adapters (`decision_result_from_solution`,
    `foreclosures_from_attribution`) that read a producer's output by attribute
    name. Neither side imports the other; an integration layer holding both calls
    `record_decision_episode`. The two sides share `themis/canonical.vocab`'s
    `ReasonCode` and `ScheduleRunStatus`, which both already depended on: the seam
    is a vocabulary in the layer BENEATH both, not a type owned by one of them.
  why_structural_and_not_a_protocol: >
    A `typing.Protocol` documents the shape and checks nothing at runtime, and
    the failure mode of a silently mismatched field is an episode recording the
    wrong vehicle. The adapters read each attribute by name and raise
    `DecisionSeamError` naming the missing one, so a producer that drifts from the
    contract fails AT the seam. Pinned by a test that constructs a real
    `metis.decide.ir.DecisionSolution` -- not a stub -- and reads it through.
  asserted_by:
    - "AST walk over every module in themis/ontology: zero imports of `metis`."
    - "AST walk over every module in metis: zero imports of `themis.ontology`."
    - "AST walk over episode.py's string constants: zero INSERT/UPDATE/DELETE/TRUNCATE/DROP/ALTER/CREATE. Every write goes through a typed OntologyStore method."
    - "`OntologyStore` has no `reconstruct_episode` and no `load_action`: the store's pinned public surface is UNCHANGED by this packet."

unknown_versus_empty_alternatives:
  what_adr_0072_said: >
    "whether their scheduler logs rejected candidates at all -- if not,
    `alternatives=()` reads as 'nothing considered' when it means 'unknown',
    which needs a third state before any backfill."
  what_was_built: >
    `AlternativesProvenance` with three members -- ENUMERATED, NONE_CONSIDERED,
    NOT_RECORDED -- on `ActionRecord`, persisted as a column with a CHECK, and
    resolved by ONE function (`resolve_alternatives_provenance`) shared by the
    model's pre-validator and the store's write path so the persisted value and
    the in-memory field cannot disagree.
  the_default_claims_least: >
    Omitted, a NON-EMPTY tuple deduces ENUMERATED (nothing else could have
    produced it) and an EMPTY tuple falls to NOT_RECORDED. An empty tuple IS
    absence of evidence; upgrading it to "the choice was forced" is an assertion
    a caller must make under their own name. This CHANGES the reading of every
    pre-existing empty tuple in the repository from "nothing was considered" to
    "unknown", which is the safe direction and the point.
  the_adapter_cannot_be_argued_with: >
    `decision_result_from_solution` produces NOT_RECORDED whenever `considered`
    is empty and there is NO PARAMETER through which a caller could turn that into
    NONE_CONSIDERED -- pinned by `inspect.signature`, because the distinction
    matters most during a backfill, where one default would assert "the choice was
    forced" over an operator's entire history.
  the_one_deduction_made_and_why: >
    ENUMERATED is a claim about the RESULT, and an action needs the claim about
    its own row. `DecisionResult.provenance_for` reads a request with NO listed
    options inside an ENUMERATED result as NONE_CONSIDERED, not NOT_RECORDED --
    a producer that enumerates would have listed them if there were any, so their
    absence is evidence and the placement was forced. Reading it as unknown
    instead would discard a real observation on every forced placement, which in
    a fleet where most trips have one feasible accessible vehicle is most of them.
    The cost, stated on the method: a producer that enumerates only SOME of its
    decisions must send two results or send NOT_RECORDED for the batch.
  enforced_three_ways:
    - "pydantic: ENUMERATED requires a non-empty tuple; the other two require an empty one. Both directions."
    - "SQL: `CHECK ((alternatives_provenance = 'enumerated') = (alternatives_json <> '[]'))`, attacked directly with raw SQL after dropping the append-only trigger -- because a rule only in pydantic is a rule a replay importer walks around."
    - "round trip: all three states written, read back through `load_action` from the raw rows, and still three distinct states."

leakage_probe:
  probe: >
    Two facts carrying a unique string and a unique number are written AFTER the
    decision, into the same tenant, the same scope and the same subject. The
    episode is then reconstructed and its information set, its `to_record()`
    export, its `provenance_manifest()` and its `feature_vector()` are all
    searched for both sentinels.
  result: "Absent from all four, and the re-derived content hash still equals the one the action pinned."
  two_positive_controls_because_the_assertion_alone_is_vacuous:
    - "`store.fact_history(...)` MUST show the sentinel -- otherwise the poisoning write silently failed and every no-leak assertion was passing for the wrong reason."
    - "a snapshot taken AFTERWARDS over the SAME SCOPE must ADMIT it -- which rules out the scope, the attribute name and the tenant as the thing that excluded it, leaving only the receipt boundary."
  the_asymmetry_that_makes_an_episode_an_episode: >
    The information set is cut at `as_of`; everything that followed is not. They
    cannot be confused because they arrive by different routes -- the snapshot
    through `load_snapshot`, which applies the boundary; the outcome through the
    action, which is not a read path a snapshot holder has. Asserted directly:
    the label is present in `episode.outcomes` and absent from the information
    set and its feature vector at the same instant.
  additional_refusals_proven:
    - "a snapshot forged with `model_copy(update={'facts': later_facts})` -> ForgedSnapshotError from the episode write path"
    - "a snapshot re-tenanted with `model_copy` -> refused before any write"
    - "an admitted fact DELETED with the trigger dropped -> SnapshotDriftError, proving the reconstruction re-derives rather than caches"
    - "the action's pinned hash FORGED with the trigger dropped -> EpisodeIntegrityError (and note that load_snapshot's own drift check does NOT fire, because the snapshot row is untouched -- which is why it is a separate step)"

reused_not_reinvented:
  - "ADR-0065 `exposure.CapacityAttribution` -> `foreclosures_from_attribution`. `participation` (the fraction of MINIMAL BLOCKING SETS a commitment appears in) becomes the relationship weight; `servable_in_isolation=False` produces NO edges, inheriting exposure's own refusal to blame a rider's trip for a structural gap in the service; `enumeration_complete` is carried into `asserted_by` as `/exhaustive` or `/bounded`, because a bounded search makes every weight a lower bound and a relationship row has nowhere else to say so."
  - "ADR-0060's bounded optimality claim -> four DERIVED facts on the assignment (`solver_objective_value`, `solver_bound`, `solver_gap`, `solver_proven_optimal`). An unclaimed bound is stored as `MissingnessReason.NOT_APPLICABLE`, never as 0.0: a zero bound claims the objective cannot go below zero, an absent one refuses to claim anything, and a learner that cannot tell them apart reads every timeout as a proof. `DecisionResult` refuses `proven_optimal` with a non-zero gap or a non-OPTIMAL status."
  - "`ScheduleRunStatus.TIMEOUT` -> `ReasonCode.SOLVER_TIMEOUT` on the action, using the closed scheduling vocabulary that already existed rather than a new one."
  - "`themis/core/feature_store._iso_utc`, `themis/canonical/events.compute_hash`, `themis/canonical/vocab.ReasonCode` -- all inherited through the existing ontology modules, none re-implemented."

mutations_checked:
  method: >
    13 single-point source mutations, applied one at a time to the shipped source
    (including the .sql), with the four ontology test files re-run and the file
    restored afterwards. Run twice: once with `-x`, once WITHOUT, so that the
    test which catches each mutation could be identified rather than assumed.
    Harness lived in the scratchpad, not the repo.
  all_red_first_time:
    - "M1  an empty alternatives tuple defaults to NONE_CONSIDERED    -> RED (test_the_action_record_refuses_the_same_contradiction)"
    - "M2  the action-side content-hash comparison deleted            -> RED (test_reconstruction_refuses_an_action_whose_information_set_no_longer_matches)"
    - "M3  denials no longer keyed on the decision's snapshot id      -> RED (test_the_denials_of_one_decision_are_not_the_denials_of_another)"
    - "M4  outcomes no longer keyed on the action id                  -> RED (test_an_outcome_belongs_to_its_own_action_and_no_other, + both-engines)"
    - "M5  proven_optimal no longer requires a closed gap             -> RED (test_a_proven_optimum_cannot_be_claimed_with_a_gap_that_did_not_close)"
    - "M6  the SQL CHECK pairing provenance to the list removed       -> RED (test_the_database_refuses_the_contradiction_independently_of_the_model)"
    - "M7  a structurally-unservable denial gets attributed anyway    -> RED (test_an_unattributable_denial_produces_no_foreclosure_edges)"
    - "M8  an unresolvable subject is minted instead of refused       -> RED (test_the_episode_will_not_mint_an_identity_to_make_a_write_succeed)"
    - "M9  ENUMERATED-with-an-empty-list check removed                -> RED (test_the_action_record_refuses_the_same_contradiction)"
    - "M10 the row reader hardcodes NOT_RECORDED                      -> RED (2 tests)"
    - "M11 the `receipt_time < ?` boundary removed from the facts query -> RED (the leakage probe, + 7 pre-existing)"
    - "M12 a denial need not name its binding constraint              -> RED (test_a_denial_must_name_the_constraint_that_bound)"
    - "M13 an ENUMERATED result's unlisted request reads as unknown    -> RED (test_the_three_states_survive_the_round_trip_through_the_database)"
  came_back_green: []
  note_on_M1: >
    M1 is caught ONLY by the direct-`ActionRecord`-construction test, not by any
    episode-level test, and that is correct rather than a gap:
    `record_decision_episode` always passes an EXPLICIT provenance, so the default
    rule is unreachable through the writer. The path that reaches it is the one
    that matters -- an evidence-pack reader or replay importer constructing an
    `ActionRecord` directly -- which is exactly the path ADR-0072's own M22 found
    unexercised. It is covered here, in both directions.

