normative_contracts:
  - ADR-0002   # portable DDL: the new column and both CHECKs run unmodified on SQLite and PostgreSQL 17
  - ADR-0004   # the episode is exercised on BOTH engines, same assertions
  - ADR-0034   # the strict `<` as-of read, inherited unchanged
  - ADR-0060   # optimality is claimed only against a self-computed bound; carried, never re-derived
