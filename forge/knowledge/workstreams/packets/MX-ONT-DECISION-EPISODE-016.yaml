honest_limitations:
  - claim: "NOTHING HERE IS VALIDATED."
    detail: >
      Every episode this module has carried is synthetic. The vignette's times,
      references, weights and reason codes are invented. Status: Demonstrated.
      In particular, no number here says anything about how any real scheduler
      records rejections, how any real operator names a binding constraint, or
      what any real fleet's foreclosure weights look like.
  - claim: "`ActionKind` HAS NO 'DENY', SO A DENIAL IS AN EVENT AND NOT A PERMISSIONED ACTION."
    detail: >
      The eleven action kinds do not include one. Rather than borrow a near-miss
      kind, denials are `EventKind.TRIP_DENIED` -- the vocabulary's own home for
      them, carrying `reason_codes` -- with the snapshot id in the payload as the
      episode key. But a denial IS a decision with a subject, an authority, an
      information set and an appeal, and recording it as an event means it has no
      `Authority` permission check, no verifier verdict and no alternatives. This
      is a real gap in ADR-0072's vocabulary, not a design choice, and it should
      be closed by adding a twelfth action kind + permission + CHECK member.
  - claim: "THE EPISODE IS KEYED ON THE SNAPSHOT ID, WHICH ASSUMES ONE SNAPSHOT PER SOLVER RUN."
    detail: >
      Correct for a batch solve. An online scheduler that re-snapshots per arrival
      produces one episode per arrival, which is right; but a solver that takes
      two snapshots for one decision (e.g. a re-read after a slow feasibility
      check) would split into two episodes with no link between them. There is no
      `episode_id` and no `supersedes_action_id` on `ActionRecord` -- the override
      in the vignette is linked by an `OVERRIDE_REPLACED_RECOMMENDATION` edge
      between OBJECTS, which is the ontology's intended mechanism but is not
      checkable from the action alone.
  - claim: "ADR-0073's `capacity_value` IS READ BUT NOT WIRED; ADR-0065's `exposure` IS."
    detail: >
      `CapacityValue` reports a MEAN COUNT of foreclosed trips across scenario
      draws with a standard error. It does not identify WHICH future trips, so it
      cannot produce the per-opportunity edges
      `ASSIGNMENT_FORECLOSED_POOLING_WITH` requires -- the per-scenario identity is
      derivable from `CapacityLens.reach_matrix` but only by reaching into
      internals this packet may not touch. `exposure.CapacityAttribution` DOES
      name specific commitments, so it is the one wired. Consequence: the episode
      currently carries RETROSPECTIVE attribution (which earlier commitment
      consumed the capacity a denied trip needed) and not the DECISION-TIME
      estimate (which likely future trips this placement forecloses). Closing that
      needs either a per-scenario accessor on `capacity_value` or a small
      aggregation helper in metis -- both outside this packet's owned paths.
  - claim: "THE FORECLOSURE WEIGHT IS A PARTICIPATION SHARE, NOT A PROBABILITY."
    detail: >
      `Relationship.weight` is described as "how strongly the edge is asserted,
      where the assertion is probabilistic". What is stored is exposure's
      `participation`: the fraction of minimal blocking sets a commitment appears
      in. 1.0 means every route to freeing capacity ran through it. That is a
      strength-of-assertion and it is documented as such on
      `ForeclosedOpportunity`, but a reader who takes `weight` for a probability
      of the trip having happened will be wrong. A separate weight SEMANTICS field
      would be the honest fix and is not built.
  - claim: "`themis.ontology.episode` IS A WRITE PATH THAT THE CONCURRENT LAYERING SUITE DOES NOT CLASSIFY."
    detail: >
      `test_layer_metis.py` derives which Themis modules are "persistence" from
      the WRITER METHOD NAMES they define. `episode.py` defines none of them -- it
      delegates every write to `OntologyStore` -- so the derivation does not
      classify it, and `from themis.ontology.episode import
      record_decision_episode` in the solver would pass the layering suite while
      handing Metis a write path to canonical state. Closed from this side by
      `test_the_solver_does_not_reach_into_the_ontology_either`, which asserts by
      AST that metis imports nothing from `themis.ontology`. The layering packet
      should classify the module properly; this packet did not edit its file.
  - claim: "NO CONCURRENCY TESTING, INHERITED."
    detail: >
      Single-writer-per-tenant remains an untested assumption. Two processes
      recording episodes for one tenant would contend on the receipt ledger; what
      happens then is not known and is not tested here either.
  - claim: "THE OPTIMALITY CLAIM IS CARRIED, NEVER CHECKED."
    detail: >
      `DecisionResult.proven_optimal` is the producer's claim. This packet checks
      it for INTERNAL consistency (a proven optimum must have a closed gap and an
      OPTIMAL status) and nothing more. Establishing it is ADR-0060's job and
      nothing in the ontology can or should second-guess it.
  - claim: "`record_decision_episode` CANNOT VERIFY THAT THE DECISION USED ONLY THE SNAPSHOT."
    detail: >
      It did not make the decision. What it does is make the claim falsifiable:
      the action pins the snapshot's id, hash and `as_of`, and the reconstruction
      re-derives and re-checks. A decision that reached outside its snapshot
      leaves a record that says what it claims to have used, and the gap becomes
      an auditable question rather than an invisible one. That is weaker than
      enforcement and it is the strongest thing available from this side of the
      seam.

guesses_about_operator_data:
  preamble: >
    Places where this packet had to assume a shape for data nobody has handed us.
    ADR-0072's own list still stands unchanged; these are the ones this packet
    ADDS. All are Demonstrated on synthetic data only.
  ask_the_first_operator_for:
    - guess: "THEIR SCHEDULER CAN SAY WHETHER IT ENUMERATES REJECTIONS -- FOR A WHOLE BATCH."
      assumed: >
        `AlternativesProvenance` is per-ACTION, but `DecisionResult` carries one
        value for the whole result and `provenance_for` deduces the per-action
        value from it. That deduction rests on ENUMERATED meaning "complete for
        every request in this result".
      cost_if_wrong: >
        A scheduler that enumerates for some decisions and not others (a common
        shape: the exact solver logs candidates, the greedy fallback does not)
        would either have to split its export, or would have every fallback
        decision recorded as a FORCED placement when it is actually unknown. That
        is the exact error this field exists to prevent, reintroduced one level up.
      ask_for: >
        Whether rejected-candidate logging is a property of the SCHEDULER or of
        the DECISION -- i.e. does it depend on which code path ran? And if it does,
        can the export say which path ran, per decision?
      change_cost: "LOW if asked before backfill: a per-request provenance on `ConsideredOption`, or a per-assignment override on `DecisionResult`. Retrofitting after a history is loaded is impossible."
    - guess: "A DENIAL HAS ONE BINDING CONSTRAINT SET, KNOWN AT DECISION TIME."
      assumed: "`ProposedDenial.binding_constraints` is non-empty and is recorded WITH the decision."
      cost_if_wrong: >
        Many dispatch systems record a denial and its reason SEPARATELY, often
        with the reason keyed in later by a person. If the reason arrives hours
        after the denial, its receipt time is later, and a snapshot taken between
        the two correctly cannot see it -- so a replay would score the dispatcher
        as having denied a trip for no stated reason.
      ask_for: "Whether the denial reason is captured in the same transaction as the denial, or later. If later: by whom, and how much later."
      change_cost: "MEDIUM. It would mean the binding constraint is a separate receipt-stamped fact rather than a field on the denial event, which changes the episode's shape."
    - guess: "AN OPERATOR CAN NAME WHICH EARLIER TRIP CONSUMED THE CAPACITY A DENIED TRIP NEEDED."
      assumed: >
        `ASSIGNMENT_FORECLOSED_POOLING_WITH` edges are computed by Milexium from
        ADR-0065's search, over Milexium's own model of the fleet.
      cost_if_wrong: >
        The attribution is only as good as the feasibility model behind it. If the
        real fleet has constraints Milexium does not model (a driver's break, a
        depot bay, a securement type), the minimal blocking sets are wrong and the
        weights are confident nonsense. Nothing in the record would show it.
      ask_for: >
        Their own account of why a specific denied trip was denied, for 20-30
        real denials, so the attribution can be scored against a human's answer
        before any of it is quoted.
      change_cost: "N/A -- this is a validation task, not a schema change, and it is the one that decides whether these edges may ever be shown to an operator."
    - guess: "THE POLICY IN FORCE AT A DECISION IS IDENTIFIABLE AND VERSIONED."
      assumed: "`policy_id` + `policy_version` (an integer >= 1) are supplied per action and are stable enough to join on."
      cost_if_wrong: >
        Most operators' service rules live in a contract document and a set of
        habits, not in a versioned record. If the version is invented at ingest,
        every "did the policy change cause this?" question is unanswerable and the
        field is decorative.
      ask_for: "Whether any system records which version of the service rules was in force on a given date, and who changes them."
      change_cost: "LOW mechanically; the risk is data quality, not schema."
