id: MX-ONT-DECISION-EPISODE-016
status: completed
completed_date: "2026-07-26"
dispatched_date: "2026-07-26"
adr: null   # ADRs are the orchestrator's to write; this packet wrote none.

result: >
  41 new tests, 0 skipped, closing ADR-0072's own central limitation ("not wired
  into the solver, forecaster, evidence packs or API"). One complete decision
  episode now flows end to end on synthetic data: a snapshot at T, a decision
  taken from it, ASSIGN actions carrying the alternatives and what their
  emptiness MEANS, TRIP_DENIED events carrying the binding constraint,
  ASSIGNMENT_FORECLOSED_POOLING_WITH edges carrying probability weights read out
  of ADR-0065's minimal-blocking-set search, and an ActionOutcome at +14 minutes
  -- reconstructed from the action back to exactly the information set that
  produced it, on SQLite AND on PostgreSQL 17 with RLS in force (RAN, not
  skipped). 13 mutations applied and checked: 13 RED first time, 0 GREEN.
  Ontology suite 188 passed (147 pre-existing, unchanged, plus 41).

objective: >
  Make ADR-0072's ontology carry traffic. Take one decision episode -- the
  request that arrived, the vehicle expected free, the trips that were
  compatible, the pooling opportunities the assignment consumed, the denial and
  its binding constraint, and the pickup that was 14 minutes late -- from a
  DecisionSnapshot through a decision to an ActionRecord to an ActionOutcome,
  and prove it reconstructs. Build the metis/themis seam so that neither side
  gains an import edge on the other.

owned_paths:
  - themis/ontology/episode.py                  # NEW: the seam, the writer, the reconstruction
  - themis/ontology/vocab.py                    # + AlternativesProvenance (the third state ADR-0072 asked for)
  - themis/ontology/actions.py                  # + ActionRecord.alternatives_provenance, resolve_alternatives_provenance
  - themis/ontology/store.py                    # record_action carries the provenance; _row_columns follows
  - themis/ontology/sql/ontology_v0_1.sql       # + alternatives_provenance column, CHECK, and the pairing CHECK
  - themis/ontology/__init__.py                 # exports
  - aletheia/conformance/property-tests/test_decision_episode.py   # 41 tests
  - forge/knowledge/workstreams/packets/MX-ONT-DECISION-EPISODE-016.yaml

