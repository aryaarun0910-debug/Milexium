id: MX-E-SERVE-TIME-DRIFT-007
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
result: >
  23 new tests (test_serve_time_drift.py), 0 skipped; whole suite 1224 passed.
  REAL demonstration on the committed NYC Access-A-Ride hourly panel + the real
  committed aar_model.json booster: serving on the untouched spring-2026
  validation window against the model's own training-window reference flags
  drift on 8 of 15 monitored features (month PSI 9.00, tmin_c 0.63, tmax_c 0.43
  -- all "significant"; plus precip_mm/lag1/lag7/lag14/roll28 on corrected KS),
  while a random exchangeable split of the SAME training window reports
  no_drift. That is the winter->spring shift ADR-0030 blamed for the AAR
  intervals overcovering (98.1% vs a 90% target) -- now detectable AT SERVE
  TIME instead of in a post-hoc audit.
objective: >
  Connect ADR-0034's drift/change-point service to ADR-0030's forecast runtime.
  Before this packet a model could drift arbitrarily far from its training
  distribution and the runtime would keep serving confident point estimates
  wrapped in valid-looking conformal intervals -- silently wrong, with a number
  that says it is fine. Serve-time drift monitoring now compares the incoming
  feature distribution against the model's training-window reference and
  ATTACHES the verdict to the served forecast, including an explicit statement
  that a drifted interval's coverage guarantee is not supported.
owned_paths:
  - metis/forecast/serve_drift.py
  - metis/forecast/runtime.py (additive: forecast_monitored)
  - metis/forecast/__init__.py (additive exports)
  - aletheia/conformance/property-tests/test_serve_time_drift.py
  - forge/knowledge/workstreams/packets/MX-E-SERVE-TIME-DRIFT-007.yaml
read_only_dependencies:
