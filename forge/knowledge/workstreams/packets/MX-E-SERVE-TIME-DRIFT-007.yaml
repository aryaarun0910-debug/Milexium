normative_contracts:
  - blueprint/05-core-model-runtime-and-forecast.md (drift monitoring; champion/challenger)
  - blueprint/01 + forge/knowledge/architecture/decisions/0001 (honesty: interval is not a probability or a guarantee)
  - ADR-0016 (forecast runtime), ADR-0030 (serve-time conformal + the measured overcoverage)
