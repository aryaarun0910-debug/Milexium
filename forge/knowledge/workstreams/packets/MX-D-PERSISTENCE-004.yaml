  - "a future serve-time drift monitor reading persisted features"
  - "a future reconciliation of the controller's roles with ADR-0010's registry pointer"
notes: >
  DESIGN DEVIATION, STATED DELIBERATELY. themis/canonical ships one contract as
  TWO classes (SqliteCanonicalStore / PostgresCanonicalStore) because its
  PostgreSQL half carries row-level security the SQLite half cannot have
  (ADR-0018), so the two genuinely diverge. Program D's stores have no tenant
  dimension and therefore no RLS: the only engine difference is the DB-API
  placeholder and how a connection is opened. The store logic therefore exists
  ONCE over an engine-parametrised `CoreDatabase` adapter
  (`CoreDatabase.sqlite(...)` / `CoreDatabase.postgres(...)`), rather than as two
  copies of the same SQL. What the canonical pattern asserts -- one contract, two
  engines, proved by [sqlite]/[postgres]-parametrised conformance -- is preserved;
  what is dropped is a duplicate that could only drift.

  `CoreDatabase` and `_iso_utc` live in feature_store.py, imported by
  promotion.py, because this packet owns exactly those two modules; a
  `themis/core/persistence.py` is the natural home once a third persistent
  Program D store exists.

  `PromotionController.evaluate_and_maybe_promote`'s verdict logic was extracted
  into a module-level pure `_evaluate_gate` (and the registry check into
  `_require_registered_for_task`) so the in-memory and persistent controllers
  cannot disagree about what the gate decides -- behaviour-preserving, verified by
  the pre-existing 22 promotion tests before the persistent class was written.

  HONEST LIMITS (v0.1, Demonstrated -- never operator-Validated):
  - Persistence only. NOT concurrency: application-assigned sequence columns are
    computed read-then-insert, which is correct for one writer and racy for
    several. Single-writer is the v0.1 contract, as it is for the canonical
    stores' `sequence`.
  - No tenant column and no RLS on the Program D tables. They carry no
    rider-linked data, but multi-tenant Program D state is a later slice, not
    something this schema is already ready for.
  - The persistent controller composes ModelRegistry, which is still in-memory
    (owned by a concurrent packet): roles survive a restart, the model catalog
    does not, so a caller must re-register its ModelVersions on startup before a
    restored controller can validate them. Named, not hidden.
  - ADR-0034's coexistence stands: the controller still does NOT sync the
    registry's ADR-0010 single-pointer champion.
  - drift.py is unchanged and remains in-memory / stateless by design.
  - The real-panel leakage tests window the AAR panel to its first 300 observed
    days so the PostgreSQL parameter runs in seconds; the invariant is
    per-(entity, feature) and holds pointwise, so the window exercises it exactly
    as the full panel does, just fewer times.
  - Timestamps are stored as fixed-width ISO-8601 UTC TEXT; ordering therefore
    depends on that canonical form, which `_iso_utc` is the single producer of.
  - core_v0_1.sql is loaded by path relative to the module, so it resolves in a
    source checkout (which is how everything in this repo runs) but is not
    declared as setuptools package-data -- exactly the same pre-existing
    exposure themis/canonical/sql/schema_v0_1.sql has. Fixing it means editing
    pyproject, which this packet does not own.
  - Do NOT edit model_registry.py or drift.py, themis/canonical/**, pyproject,
    CI, IMPLEMENTATION_STATUS, JOURNAL, any ADR, or git -- the orchestrator and
    concurrent packets own those.
