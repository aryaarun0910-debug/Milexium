  - "py -3 -m pytest themis/ metis/ aletheia/ argus/ -q  # whole suite still green (838 = 781 baseline + 57)"
security_and_privacy_invariants:
  - "THE LEAKAGE GUARANTEE SURVIVES PERSISTENCE: an as-of read at label time t returns only values whose knowledge_time is STRICTLY < t. The strict `<` is a SQL predicate over fixed-width canonical ISO-8601 UTC text, so a future row is never fetched and then filtered in Python -- it is never fetched. Proved with the ADR-0034 / data/curated/leakage_audit.py future-corruption discipline on the real AAR panel, at three cutoffs, plus a control proving a post-cutoff read does change."
  - "No raw PII: features keyed by opaque entity ids only (mirrors ServiceRequest.rider_ref tokenization). The schema stores the id as opaque TEXT and neither parses nor validates its structure."
  - "Append-only: no UPDATE and no DELETE is issued against feature_values or promotion_decisions / promotion_rollbacks anywhere in themis/core. A correction is a new row at a later (or equal) knowledge time."
  - "PostgreSQL access is as the non-superuser milexium_dev role only (ADR-0006); the password is read from %USERPROFILE%\\.milexium_pg_app_password.txt at connection time, never hardcoded, committed, or logged."
failure_injections:
  - "as-of read at t must NOT see a value stamped exactly at t or later, through the database (test_asof_read_excludes_a_value_stamped_exactly_at_t)"
  - "future rows corrupted IN PLACE in the stored table, connection dropped and reopened: every past as-of read still bit-identical (test_real_panel_stored_rows_corrupted_in_place_leave_past_bit_identical)"
  - "a challenger cannot become champion without passing the evaluated gate; an unregistered challenger cannot be gated at all and records no decision"
  - "canary traffic fraction outside [0, 1) is refused by the controller AND by a CHECK constraint, so a writer that bypassed the controller still cannot store one"
  - "rollback with no prior champion raises and records nothing"
  - "naive (non-UTC) timestamps are rejected before any row is written"
compatibility_matrix:
  - "core_v0_1.sql runs UNMODIFIED on SQLite (on-disk file) and PostgreSQL 17 (native, port 5432, role/db milexium_dev)"
  - "every behavioural test is parametrised [sqlite]/[postgres]; the PostgreSQL parameter skips cleanly (never fails) when the instance is unreachable, so CI stays green where milexium_dev was never provisioned"
  - "on this run the PostgreSQL half RAN -- it was not skipped"
  - "leakage demonstration uses the REAL aggregate panel data/curated/panels/aar_daily.csv (NYC Access-A-Ride daily scheduled trips), labelled REAL DATA in-test; controller fixtures are labelled SYNTHETIC"
evidence_to_emit:
  - "test counts and which engine parameters ran vs skipped"
  - "differential tests proving the persistent backends behave identically to the in-memory references, not merely expose the same signatures"
upstream_blockers: []
downstream_consumers:
