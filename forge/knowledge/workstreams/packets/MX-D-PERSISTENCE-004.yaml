id: MX-D-PERSISTENCE-004
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
adr: null  # ADR is the orchestrator's to write; this packet does not author one.
result: "57 tests (27 parametrised [sqlite]/[postgres] + 3 structural), PostgreSQL half RAN (milexium_dev reachable); leakage guarantee re-proved through the persistent path on the real AAR panel, including in-place corruption of stored rows; whole suite 838 passed (781 baseline + 57)"
objective: >
  Close the gap ADR-0034 left open. Program D's adaptive-memory slice shipped as
  IN-MEMORY reference backends only, so a design partner's feature values,
  promotion decisions and rollback history did not survive a process restart --
  the first thing a real pilot hits. Add persistent backends for the
  point-in-time feature store and the promotion ledger, over a portable SQL
  schema, following this repository's own established store pattern rather than
  inventing one. The leakage guarantee must survive persistence and be proved to,
  not asserted.
