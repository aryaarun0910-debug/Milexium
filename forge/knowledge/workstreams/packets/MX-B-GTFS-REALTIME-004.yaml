id: MX-B-GTFS-REALTIME-004
status: completed
completed_date: "2026-07-24"
objective: >
  A GTFS-Realtime adapter mapping the most widely deployed real-time transit
  standard onto the canonical contract (Phase 3 Connect breadth), surfacing
  any canonical-model gap it reveals.
owned_paths: [themis/connect/gtfs_realtime.py, pyproject.toml (dep only), data/acquired/catalog/gtfs-rt-*, forge/knowledge/architecture/decisions/0031-gtfs-realtime-adapter-and-operational-entity-gap.md]
read_only_dependencies: [themis/connect/adapter.py, themis/canonical/entities.py (Outcome), themis/estate, aletheia/verify]
normative_contracts: [blueprint/03-connect-and-standards.md, ADR-0007]
required_outputs:
  - themis/connect/gtfs_realtime.py
  - aletheia/conformance/fixtures/test_connect_gtfs_realtime.py
  - aletheia/conformance/adversarial/test_connect_gtfs_realtime_malformed.py
acceptance_commands: ["py -3 -m pytest aletheia/conformance/fixtures/test_connect_gtfs_realtime.py aletheia/conformance/adversarial/test_connect_gtfs_realtime_malformed.py -q"]
security_and_privacy_invariants:
  - "parse() works on dicts without the protobuf bindings (guarded import); only the reader needs them"
  - "rights recorded per sample; MBTA commercial clause unverifiable -> documented, review-before-promotion"
failure_injections:
  - "in-transit telemetry, missing stop_id, missing/invalid timestamp, Alerts, empty TripUpdates -> quarantine with clear reasons"
compatibility_matrix: ["real MBTA .pb (564 vehicles) + Apache-2.0 google .asciipb both map to schema-valid Outcomes"]
evidence_to_emit: ["20 tests; real-sample mapping (MBTA 251 arrivals, 314 quarantined)"]
upstream_blockers:
  - "CANONICAL GAP: GTFS-RT is (trip,stop,vehicle)-keyed operational telemetry with no rider request; Outcome is request-keyed -> synthetic request_id + heavy semantic loss. Canonical model lacks a first-class request-independent operational/telemetry entity (VehicleTelemetry/StopTimeObservation). Program A follow-up. TODS deferred for the same reason."
downstream_consumers: [a future canonical operational-entity family; TODS/NeTEx adapters once it exists]
