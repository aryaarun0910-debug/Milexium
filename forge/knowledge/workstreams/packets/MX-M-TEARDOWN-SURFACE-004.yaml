# ---------------------------------------------------------------------------
# THE EXPOSURE DECISION -- what went over HTTP, what did not, and why.
# ADR-0021 excluded ingestion and forecast from HTTP because their inputs are
# Python objects and on-disk files. That reasoning is respected, not routed
# around; it simply does not apply to these two.
# ---------------------------------------------------------------------------
http_exposure_decision:
  teardown_body_shape: >
    JSON POST body, NOT a file upload. A VehicleSegment is four scalars (start,
    end, revenue-or-deadhead, run reference) -- it IS a JSON object, so a JSON
    body is its honest shape rather than a wrapper invented around something
    that is not JSON. Nothing about a teardown input is a Python object or a
    binary artifact, which is exactly what made ingestion and forecast
    unsuitable. Volume is the only real objection, and it is answered by a
    declared ceiling (MAX_TEARDOWN_SEGMENTS = 20k) that returns 413 and points
    the caller at MilexiumClient.teardown_deadhead, which has no ceiling --
    NOT by silently truncating, which would understate every total reported.
  validation_body_shape: >
    JSON list-of-rows -- the same list[dict] the adapter already takes -- plus
    an optional JSON column_map. No Python object crosses the boundary, so
    ADR-0021's objection has nothing to bite on. Bounded at
    MAX_VALIDATION_ROWS = 1000 (413 above it) because this is a pre-flight
    check on a SAMPLE, which is the honest scope rather than a limitation.
  why_not_multipart_csv: >
    Rejected on two grounds. (1) It would move CSV parsing, type coercion and
    header handling into the API -- Connect adapter work with an existing
    owner, and a second weaker copy of the column_map contract ADR-0038 already
    defines. (2) Starlette spools uploads to a temp FILE; an endpoint whose
    headline promise is "nothing is persisted" should not begin by writing the
    operator's export to disk. A JSON body stays in memory, which is what makes
    the non-persistence claim checkable.
  why_no_teardown_from_raw_export_endpoint: >
    Deliberately absent. Turning export rows into segments requires deciding
    which rows are revenue and which are deadhead, and aletheia/replay/teardown
    explicitly refuses to infer that from geometry or timing -- the caller's
    adapter decides. An endpoint that guessed it would be inventing the single
    judgment the module refuses to make. /teardowns therefore takes
    already-classified segments; classification stays the integrator's.
  still_not_over_http: >
    Generic ingestion (a SourceAdapter is a Python object) and forecast (model
    registry + on-disk xgboost artifacts) remain SDK-only and Specified for
    HTTP, unchanged from ADR-0021. Auth, the multi-tenant gateway and rate
    limiting remain OUT of scope and are not faked.
  concrete_adapter_asymmetry: >
    argus/api names OperatorExportAdapter directly while argus/sdk stays
    generic over the SourceAdapter protocol (ADR-0015). This is deliberate, not
    an inconsistency: an HTTP surface must name what it exposes because a
    caller cannot hand a URL a Python class, whereas the SDK must not, or a new
    adapter would require an SDK change.

security_and_privacy_invariants:
  - "REFUSALS SURVIVE THE API BOUNDARY. No endpoint accepts a parameter implying a guaranteed saving or causal proof. TeardownRequest is extra='forbid', so is_guaranteed_saving / causal_proof / is_modelled=False in the body is a 422, not a silently ignored field -- and the published OpenAPI shows a generated client in any language that those fields do not exist."
  - "MODELLED/HEDGED WORDING REACHES THE RESPONSE. POST /teardowns returns the DeadheadTeardown ITSELF, not an API-local projection: interpretation, is_modelled, causal_proof, manifest.note, manifest.replay_discipline_note, cost.hedge and cost.envelope_basis are carried verbatim. Re-projecting would create a second place those fields could be dropped."
  - "NO OPERATOR PROVENANCE OVER HTTP. data_provenance is the DataProvenance Literal, which has no 'operator' value; the OpenAPI enum is exactly [real_public, synthetic]. An HTTP caller cannot mint the label this repo has no right to."
  - "NO INVENTED RECOVERY RATE. CostBasis.avoidable_share_low/high still have no default over HTTP. Omit them and the response carries the accounting value plus envelope_basis stating the recoverable fraction is unknown and is not guessed."
  - "PII FAIL-CLOSED SURVIVES, AND IS TIGHTENED. The validation response NEVER echoes a rejected value. It returns the offending COLUMN NAMES (derived from the adapter's own REDACTION_MARKER substitution, not from a re-implemented PII check), the adapter's reason text (which names columns, never values), counts, and semantic-loss reasons. The adapter's quarantine record is not returned at all, so a rejected rider name cannot reach the response even in redacted form. Semantic-loss notes are projected WITHOUT source_value, so the guarantee does not depend on the adapter's field policy staying as it is."
  - "NOTHING IS PERSISTED BY THE VALIDATION ENDPOINT. Stated in its docstring and proved three ways: the adapter is built against new_id(TenantId) -- an ephemeral tenant registered with no store, so the records it produces have nowhere they could be written; client.ingest issues no write; and the response model's `persisted` field is fixed False and RAISES if set True, the same structural refusal DeadheadTeardown.causal_proof uses."
  - "THE SDK TEARDOWN IS STATELESS. It reads nothing from and writes nothing to the canonical store; recording a teardown is an explicit record_decision, never a side effect of analysing."

failure_injections:
  - "is_guaranteed_saving / causal_proof / guaranteed_saving_usd / is_modelled=False in the body -> 422 (refused, not ignored)"
  - "is_guaranteed_saving nested inside cost_basis -> 422"
  - "data_provenance='operator' -> 422"
  - "rider_name attached to a VehicleSegment -> 422 (extra='forbid' reaches the wire)"
  - "naive timestamp / ended_at before started_at / >48h segment / reduction_fraction=1.5 -> 422 (refused, never clamped or assumed UTC)"
  - "MAX_TEARDOWN_SEGMENTS+1 segments -> 413 naming the SDK escape route, never a truncated teardown"
  - "MAX_VALIDATION_ROWS+1 rows -> 413"
  - "column_map targeting a non-canonical column -> 422 (refused, not guessed)"
  - "a rider_name column, and an email hidden under an innocuous column name -> both quarantined, both reported by column name, neither value present anywhere in the raw response bytes"

evidence_to_emit:
  - "21 new tests; 781 -> 802 repo-wide, all green"
  - "OpenAPI regenerated: +2 paths (/teardowns, /operator-exports/validate), +13 schema components"
  - "PII non-echo asserted against the RAW response text, not a parsed subset"
  - "non-persistence asserted by counting every row in every table of the app's store before and after"

honest_limitations:
  - "Still Demonstrated, not Validated. No operator has sent Milexium data; every fixture in the new test file is synthetic and the PII values were written to be rejected by."
  - "The 20k-segment ceiling is a judgment, not a measured limit -- it was chosen as a plausible mid-size month, not derived from a load test."
  - "The validation endpoint inherits the adapter's honest ceiling: classify_pii_column is NAME-based, so a `notes` column holding a rider's name in free text is not caught. That case is safe HERE regardless -- an unrecognised column becomes an unmapped_extension whose source_value the adapter nulls, and this endpoint drops source_value entirely -- but the adapter is a backstop for forge/knowledge/docs/OPERATOR_DATA_INTAKE.md, not a general PII scanner, and neither layer claims otherwise."
  - "RESIDUAL ECHO, stated rather than hidden: a NON-PII quarantine reason quotes the offending value from a MAPPED operational column (e.g. \"unknown outcome value 'FOO'\", an unparseable timestamp). The PII check runs first and returns early, so no row with a detected identifier ever reaches that path; the residue is an operator putting personal data in, say, the outcome column, which is pathological and is their own submitted value coming back on the same connection. Nothing is stored either way."
  - "No auth. Anyone who can reach the deployment can POST a sample to the validation endpoint. It stores nothing, but that is a property of this app, not a gateway -- ADR-0021's auth boundary is unchanged and still Specified."
  - "argus/sdk-typescript/src/generated/openapi.ts is now stale relative to the new endpoints. It is outside this packet's owned paths and has no drift check; regenerating it is follow-up work."
  - "talos/contracts/jsonschema/canonical-v0.1.json also changed on regeneration, from a CONCURRENT packet's Outcome.vehicle_ref/run_ref addition, not from this one. talos/contracts/generate.py writes both artifacts atomically, so the regeneration includes it -- this FIXES pre-existing drift rather than introducing any."

