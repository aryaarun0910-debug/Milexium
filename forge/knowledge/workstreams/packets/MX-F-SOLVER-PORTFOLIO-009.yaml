status: completed
completed_date: "2026-07-25"
dispatched_date: "2026-07-25"
adr: null   # ADRs are the orchestrator's to write; this packet wrote none by instruction
result: >
  ORTOOLS INSTALLED. `py -3 -m pip install ortools` resolved
  ortools-9.15.6755-cp314-cp314-win_amd64.whl -- a native CPython 3.14 ABI wheel
  -- and `from ortools.sat.python import cp_model` imports and solves. The
  packet's "if it does not install" contingency was not needed; the capability
  check was built anyway and is exercised by fault injection.

  CP-SAT is now a real backend on both problem families, behind a portfolio that
  reports which strategy answered and why.

  Headline benchmark result: on the Cordeau instances it can close, the CP-SAT
  strategy REPRODUCES THE PUBLISHED PROVEN OPTIMA EXACTLY, and does so against a
  lower bound this repository proves for itself rather than one transcribed from
  the paper. Committed artifact (3 instances, complete run): a2-16 294.24795
  (published 294.25), a2-20 344.83407 (344.83), a3-18 300.48318 (300.48) -- each
  certified-optimal within the stated lattice tolerance, gap to our own bound
  0.00%, and every routing accepted by BOTH independent checkers. Observed in
  earlier passes but NOT in the committed artifact: a2-24 431.1204 (431.12) and
  a3-24 344.8336 (344.83), also certified.

  The portfolio changed the answer on every instance. Per-strategy, verified:
  a2-16 regret-construction could not serve all 16, lns 317.710 (+7.97% over
  CP-SAT), cpsat-darp 294.248; a2-20 370.025 (+7.31%) / 350.491 (+1.64%) /
  344.834; a3-18 342.671 (+14.04%) / 307.605 (+2.37%) / 300.483. The
  pure-Python LNS -- the solver Program F had before this packet -- loses to
  CP-SAT on all three. That is exactly the finding a portfolio exists to surface,
  and it is the honest headline: our previous best heuristic was between 1.6%
  and 8.0% off the optimum on the instances we can now prove.

  Tests: 155 in the two new modules (test_decide_portfolio.py 92,
  test_darp_cpsat.py 63), 0 skipped, 0 failed. The 110 pre-existing Program F
  tests still pass unmodified. 14 mutations were applied and re-run: 10 caught
  first time, 4 survived and exposed genuine test gaps (a vacuous capability
  branch, a K=1-only brute force that made the pairing constraint untestable, a
  never-binding route-duration limit, and a certification predicate only ever
  asserted True) -- all four closed and re-verified RED.

  Honest gaps: the committed benchmark artifact covers 3 of the 12 published
  instances, and NAMES the other nine as not covered. The rest were not run
  because the pure-Python LNS does not scale (measured: a2-20 did not finish 400
  LNS iterations in twenty minutes) and because the machine was concurrently
  saturated by other agents' full test suites for the duration of this packet.
  See known_limitations.

objective: >
  Turn `metis.decide`'s single hand-rolled search into a real, benchmarked
  SOLVER PORTFOLIO with honest reporting of which strategy produced the returned
  answer and why. `metis/decide/solver.py` line 24 recorded "CP-SAT / MILP /
  SMT / a portfolio" as Specified; this packet builds the CP-SAT backend and the
  portfolio, and benchmarks the result against the Cordeau dial-a-ride instances
  already acquired under governance. Program F.

