[package]
name = "verifier"
version = "0.1.0"
edition = "2021"
description = "Independent Rust implementation of Milexium's evidence hash-chain verifier, differential-tested for byte-for-byte parity with the Python reference (app/verify)."
license = "MIT"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
