name: CI

# Path-aware cross-language CI (ADR-0026). The Python suite is the current
# gate; Rust and TypeScript jobs activate automatically once their workspace
# files exist (hashFiles guards), so this file is committable before those
# workspaces land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Optional-but-imported test deps so collection never fails on a
          # clean runner (Postgres/API/TLC test modules import these; the tests
          # themselves skip cleanly when the DB/data/artifacts are absent).
          pip install "psycopg[binary]" httpx duckdb
          # Program G formal-methods extra (z3): installed so the machine-checked
          # state-machine + hash-chain proofs (conformance/property-tests/
          # test_formal_smt.py) RUN on CI rather than importorskip-skipping.
          pip install -e ".[formal]"
      - name: Test (platform suite)
        run: python -m pytest packages/ conformance/ -q
      - name: Contract drift check
        run: |
          python contracts/generate.py
          git diff --exit-code -- contracts/ \
            || (echo "::error::contracts/ is stale -- run 'py -3 contracts/generate.py' and commit" && exit 1)

  rust:
    name: Rust (fmt/clippy/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  typescript:
    name: TypeScript (typecheck/test)
    runs-on: ubuntu-latest
    # npm workspaces (not pnpm): corepack's pnpm shim needs admin to install on
    # the dev machine (EPERM), so the SDK uses npm -- ADR-0029.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (frozen)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @milexium/sdk
      - name: Test
        run: npm test -w @milexium/sdk
      # The generated client is derived from contracts/openapi, exactly as the
      # Python-side artifacts are derived from packages/canonical -- but until
      # now nothing checked it. It silently went 835 lines stale while two new
      # endpoints landed (ADR-0042), which is precisely the failure the Python
      # contract-drift check exists to prevent. Same gate, other language.
      - name: SDK type drift check
        run: |
          npm run generate -w @milexium/sdk
          git diff --exit-code -- packages/sdk-typescript/src/generated/ \
            || (echo "::error::generated TS types are stale -- run 'npm run generate -w @milexium/sdk' and commit" && exit 1)
