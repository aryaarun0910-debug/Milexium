name: CI

# Path-aware cross-language CI (ADR-0026). The Python suite is the current
# gate; Rust and TypeScript jobs activate automatically once their workspace
# files exist (hashFiles guards), so this file is committable before those
# workspaces land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Optional-but-imported test deps so collection never fails on a
          # clean runner (Postgres/API/TLC test modules import these; the tests
          # themselves skip cleanly when the DB/data/artifacts are absent).
          pip install "psycopg[binary]" httpx duckdb
      - name: Test (platform suite)
        run: python -m pytest packages/ conformance/ -q
      - name: Contract drift check
        run: |
          python contracts/generate.py
          git diff --exit-code -- contracts/ \
            || (echo "::error::contracts/ is stale -- run 'py -3 contracts/generate.py' and commit" && exit 1)

  rust:
    name: Rust (fmt/clippy/test)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  typescript:
    name: TypeScript (typecheck/test)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
