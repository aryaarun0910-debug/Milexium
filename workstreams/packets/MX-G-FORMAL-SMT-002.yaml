  Phase-3 gate item G. Two machine-checked formal invariants on load-bearing
  properties, proved with the free z3-solver (already installed, z3 5.0.0):
  (1) the ServiceRequest state machine has no illegal reachable transition, and
  (2) the append-only hash chain is tamper-evident. Real proofs, not asserts.
