id: MX-CONF-GOVERNANCE-HOLE-012
status: completed
dispatched_date: "2026-07-26"
completed_date: "2026-07-26"
adr: none — this packet writes no new mechanism. It repairs one conformance test
  under the EXISTING governance (ADR-0053, blueprint 17) and pins the inputs of one
  existing research script. Nothing here needs an architectural decision record;
  saying it does would be padding.
objective: >
  Close two defects from MILEXIUM_INTERNAL_AUDIT_2026-07-26.md. (1) The legacy
  data-governance existence test accepted a manifest whose every recorded path was
  gitignored, so a manifest pointing at nothing could still be certified -- the
  auditor pointed the Chicago manifest at a nonexistent ignored directory and the
  targeted test passed. Make it impossible to pass vacuously WITHOUT reintroducing
  the CI-portability failure the previous repair was written to avoid. (2) The H3
  weather research fetched a live external source with an unpinned, gitignored
  cache, so the committed artifact could not be regenerated from the committed
  code. Pin the observation set, make refresh explicit, and record what the source
  actually does rather than what it plausibly does.
owned_paths:
  - conformance/property-tests/test_realdata_governance.py
  - research/**                          # h3_weather.py, the new pin, the deleted cache
  - .gitignore
  - workstreams/packets/MX-CONF-GOVERNANCE-HOLE-012.yaml
read_only_dependencies:
  - packages/estate/manifest.py     (load_manifest — imported, NOT modified)
  - data/catalog/realdata-*.manifest.json  (read; temporarily mutated for the
    adversarial probes and restored byte-identical — `git status` clean after each.
    This packet does NOT own them and did not repair their content)
  - data/raw/public/ntd-monthly-ridership-all-modes.529952083544f257.csv
    (governed input; sha256-verified on every run, never written)
  - data/catalog/ntd-monthly-ridership-all-modes.acquired.json (cited as the
    acquisition record for that input)
normative_contracts:
  - ADR-0053 (every real dataset in the repository declares its rights)
  - blueprint/17 (governed estate; raw zones stay local, the catalog travels with
    the code as the governance record)
  - "repo standing rule: a test that cannot fail is worse than no test. EIGHT
    vacuous tests were caught this month; defect 1 was the eighth."
required_outputs:
  - conformance/property-tests/test_realdata_governance.py — existence check that
    cannot pass vacuously and still passes on a clean checkout
  - research/h3_weather_observations.json — the pinned, content-hashed observation
    set, COMMITTED (150 KB)
  - research/h3_weather.py — reproduces from the pin with no network; --verify
    drift check; --refresh as a separate, explicit, loudly-reported action
  - research/h3_weather.json — regenerated; every pre-existing key byte-identical,
    provenance block added
acceptance_commands:
  - "py -3 -m pytest conformance/property-tests/test_realdata_governance.py -q  # 17 passed (was 16: +1 plumbing guard)"
  - "py -3 -m pytest conformance/property-tests/test_realdata_governance.py conformance/property-tests/test_us_opendata_manifests.py -q  # 48 passed — the neighbouring manifest suite is untouched and unweakened"
  - "py -3 research/h3_weather.py --verify  # VERIFIED: reproduces exactly from the pinned sample"
  - "py -3 -m pytest conformance/property-tests/ -q -k 'estate or manifest or panel'  # 233 passed in 4m17s — the estate/manifest/panel neighbourhood is green"
  - "py -3 -m pytest conformance/ -q  # 2,680 collected; see notes — the full run did not finish inside this packet's window"
security_and_privacy_invariants:
  - "No secret read, printed or written. NOAA_CDO_TOKEN is reached only through
    lib.env() on the --refresh fallback path, which never prints it; the live
    refresh actually ran was unauthenticated NCEI. CENSUS_API_KEY untouched. .env
    was never opened by this packet."
  - "No raw data committed. The one new committed file is a 150 KB JSON of monthly
    public NOAA weather aggregates for 25 airport stations — no personal data, no
    rights encumbrance (US federal public domain)."
  - "The 70 MB governed NTD input stays gitignored and is now hash-verified rather
    than assumed; a checkout without it stops with an instruction instead of
    analysing a smaller sample."
failure_injections:
  - "PROBE (the auditor's, defect 1): Chicago manifest repointed at
    realdata/panels/definitely_nonexistent_monthly/ — gitignored by the committed
    rule `realdata/panels/*_monthly/`, and nonexistent. BEFORE: passed (0 paths
    checked). AFTER: FAILS, `CASE fictional-in-a-materialised-zone`, naming the
    three sibling ignored panels present in the same zone as the evidence."
  - "M3: recorded path covered by NO ignore rule and absent → FAILS on a clean
    checkout too (`CASE unexplained-absence`). This is the branch that keeps the
    clean-CI mode from being decorative."
  - "M4: a git-TRACKED recorded path deleted → FAILS (`CASE tracked-but-missing`).
    The behaviour the previous repair had is preserved, not traded away."
  - "M5: fictional path laundered by appending a rule to .git/info/exclude → FAILS
    (`CASE uncommitted-excuse`). A local exclude cannot buy a governance record an
    alibi CI cannot see."
  - "M6: the ignore-rule lookup reverted to the Windows `--stdin` text-mode form
    (the bug this fix hit in draft) → the new plumbing guard FAILS, naming 5 of 6
    lost paths. Without that guard the whole 'explained absence' branch would have
    gone silently dead — a ninth vacuous test, in the fix for the eighth."
  - "MUT-A: one TAVG reading edited in the pin without updating its hash → FATAL,
    exit 2. MUT-B: pin deleted → FATAL, exit 2, no fetch attempted. MUT-C: artifact
    edited to n_obs 1886 → --verify exits 1 naming the differing key. MUT-D: the
    governed NTD input's sha256 no longer the pinned one → FATAL, exit 2."
  - "MUT-E: urllib.request.urlopen replaced with a raising stub for a default run →
    still VERIFIED, exit 0. The default path provably does not touch the network."
  - "MUT-F: one declared station made to return nothing during --refresh → refuses
    to write the pin (exit 2) and leaves it byte-unchanged; with --allow-partial it
