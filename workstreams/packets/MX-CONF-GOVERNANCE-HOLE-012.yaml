    analysis on that short pin: 1,886 observations across 19 agencies — the audit's
    rerun numbers, reproduced exactly."
compatibility_matrix:
  - "Dev machine with the ignored estate materialised: 17 passed. Every recorded
    path verified by presence."
  - "Clean checkout (real `git clone` into a scratch dir, no ignored bytes at all):
    17 passed, with three manifests printing NO PATH VERIFIED IN THIS CHECKOUT
    rather than passing silently."
  - "research reproduction: h3_weather.json regenerates byte-identically on rerun;
    every key that existed before this packet is unchanged."
evidence_to_emit:
  - "Defect 1: three of the five legacy manifests (chicago-tnp, mta-afc, nyc-tlc)
    record NO git-tracked path at all, so under the previous repair their existence
    test asserted literally nothing. That is what made the auditor's probe pass."
  - "Defect 1 fix: per-path classification with a named failing case. Tracked ->
    must exist. Neither tracked nor ignored -> must exist. Ignored and present ->
    verified. Ignored and absent -> the absence must be explained by a COMMITTED
    ignore rule, anchored to an existing tracked ancestor directory, and unopposed
    by any sibling ignored path present in the same zone."
  - "Defect 2 root cause, corrected against evidence: the audit attributed the
    1,994 -> 1,886 sample loss to a mutable upstream, and the first draft of this
    packet wrote that down as fact. A full live re-fetch at 2026-07-26T09:01:15Z
    returned a byte-identical observation set (25 stations, 3,300 station-months,
    sha256 e735059a...). Every agency contributes exactly 108 complete
    agency-months; 1,994 - 1,886 = 108 and 20 - 19 = 1. The rerun lost ONE station
    whole. Replaying the fetch with GHCND:USW00094728 (MTA NYCT) failing reproduces
    1,886 / 19 exactly. The cause was a silent partial fetch that the old code
    cached, not an upstream revision."
  - "Committed the pinned set (150 KB) and deleted the 172 KB gitignored cache.
    Evidence a published conclusion rests on belongs in git; a result nobody can
    regenerate costs more than the bytes."
  - "Status: Demonstrated. The governance test is Demonstrated against six controlled
    mutations on two checkout shapes; the research artifact is Demonstrated
    reproducible from committed inputs on this machine. Neither is Validated —
    nothing here has been exercised by an operator or a second machine, and the
    clean-checkout mode still cannot verify bytes it does not have."
upstream_blockers: []
downstream_consumers:
  - "Audit item P1 (legacy governance tests permit false records) — the existence
    half is closed; the rights half is NOT (see notes)."
  - "Audit item P2 (research not fully reproducible) — closed for h3_weather only."
  - "Any future CI 'hermetic lane' (audit P2, second item): the existence test now
    behaves correctly under a clean checkout and says so out loud, so it can be run
    there without either lying or failing for portability reasons."
notes: >
  WHAT WAS DELIBERATELY NOT CLOSED, and why. (a) The rights half of audit P1. The
  auditor also replaced the Chicago rights field with a fabricated sentence
  containing the word "commercial" and the test passed. That test is in this
  packet's owned file, and it was left alone on purpose: the honest fix is a
  captured licence URL, terms hash and acquisition timestamp IN THE MANIFESTS,
  which this packet does not own, and the reachable alternative — a keyword
  whitelist like the stricter one in test_us_opendata_manifests.py — would fail all
  five legacy manifests I cannot repair, or, tuned not to, would just move the
  fabrication one word over. A shallow check here would have become the ninth
  vacuous test. It is named as an open hole instead. (b) On a checkout that never
  fetched the ignored estate, a manifest naming only ignored, nonexistent
  directories still passes; the test now prints NO PATH VERIFIED IN THIS CHECKOUT
  for it. Closing that needs committed per-file inventories (name, size, sha256) in
  the catalog — again manifest content, not test logic. (c) research/h3b_seasonality
  and h4_census_unmet_need share the unpinned-cache shape (acs_urban_area_disability
  .json is still an ignored API cache); the audit found they reproduce, so they were
  left alone rather than swept. (d) TEST COUNT HONESTY: the full `packages/
  conformance/` run this packet's changes should be measured against did not
  complete — conformance/ alone now collects 2,680 tests and two other agents were
  landing code in packages/canonical/** and docs/** throughout, so a whole-suite
  number taken here would have measured their work in flight, not this change. What
  was measured is stated above and is scoped to the change: the edited file (17),
  the neighbouring manifest suite (48 together), and the estate/manifest/panel
  selection (233). This packet touches exactly one test file, plus research/ (which
  no test reads — verified by grep) and .gitignore (which no test parses — likewise
  verified), so that is the blast radius. Do NOT edit the five legacy manifests,
  packages/, docs/, CI, any ADR, or git from this packet.
