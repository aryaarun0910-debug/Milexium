id: MX-C-POSTGRES-STORE-001
status: completed
completed_date: "2026-07-23"
objective: >
  Implement a PostgresCanonicalStore matching SqliteCanonicalStore's exact
  method contract, running against the installed PostgreSQL 17 instance via
  the least-privilege milexium_dev role, proving the portable schema_v0_1.sql
  DDL runs unmodified on the real production-target engine.
owned_paths:
  - packages/canonical/postgres_storage.py
  - architecture/decisions/0008-postgres-test-isolation-strategy.md
read_only_dependencies:
  - packages/canonical/storage.py (contract to mirror, not edited)
  - packages/canonical/events.py (compute_hash/canonical_json -- called, not reimplemented)
  - packages/canonical/entities.py, ids.py, vocab.py
  - packages/canonical/sql/schema_v0_1.sql (applied unmodified)
  - packages/verify/ (verify_chain, used by the new tests)
normative_contracts:
  - blueprint/04-milexiumdb-canonical-state.md (expansion plan)
  - blueprint/14-execution-roadmap.md, Program C
  - architecture/decisions/0004-sqlite-now-postgres-production.md
  - architecture/decisions/0006-dedicated-postgres-dev-role.md
inputs_and_fixtures: []
required_outputs:
  - packages/canonical/postgres_storage.py
  - conformance/property-tests/test_postgres_event_log_properties.py
  - conformance/adversarial/test_postgres_tamper_and_isolation.py
acceptance_commands:
  - "py -3 -m pytest conformance/property-tests/test_postgres_event_log_properties.py conformance/adversarial/test_postgres_tamper_and_isolation.py -v"
performance_budget: {}
security_and_privacy_invariants:
  - "connects only as milexium_dev (non-superuser); password read from a local, gitignored file, never hardcoded or logged"
  - "every query filters by tenant_id in SQL, never in Python after an unfiltered fetch"
failure_injections:
  - "payload tamper -> hash_mismatch"
  - "deleted middle event -> sequence_gap / prev_hash_mismatch"
  - "forged hash matching tampered payload -> prev_hash_mismatch on the next link"
  - "duplicate sequence -> psycopg.errors.UniqueViolation (DB-level rejection)"
  - "cross-tenant history/raw-row read -> empty / disjoint"
compatibility_matrix:
  - "PostgreSQL 17.10 -- Exists (this store)"
  - "SQLite -- Exists (packages/canonical/storage.py, prior packet)"
evidence_to_emit:
  - "10 passing tests; zero leftover mx_* schemas confirmed after repeated runs"
forbidden_interface_changes: []
upstream_blockers: []
downstream_consumers:
  - Any future packet needing a durable, multi-process-safe canonical store
