id: MX-TS-SDK-001
status: completed
completed_date: "2026-07-24"
objective: >
  A strict-mode TypeScript client SDK generated from the OpenAPI contract, so
  JS/web software can integrate Milexium -- types bound to the contract, not
  hand-duplicated.
owned_paths: [package.json, package-lock.json, packages/sdk-typescript/, architecture/decisions/0029-typescript-sdk.md]
read_only_dependencies: [contracts/openapi/milexium-api-v0.1.json, packages/api/app.py]
normative_contracts: [blueprint/08-sdk-api-and-developer-experience.md, ADR-0021, ADR-0026]
required_outputs: [packages/sdk-typescript/{package.json,tsconfig.json,src/*,test/*}, src/generated/openapi.ts]
acceptance_commands: ["npm run typecheck -w @milexium/sdk", "npm test -w @milexium/sdk"]
security_and_privacy_invariants:
  - "types generated from the OpenAPI contract (openapi-typescript), never hand-redeclared"
  - "regeneration byte-stable (no drift)"
failure_injections: ["non-2xx -> MilexiumApiError (.status/.url/.body); URL-encoding + trailing-slash + custom-header tests"]
evidence_to_emit: ["13 tests against mocked fetch; strict mode incl. noUncheckedIndexedAccess/exactOptionalPropertyTypes"]
known_limitations:
  - "npm not pnpm (corepack EPERM without admin) -- CI job uses npm"
  - "typescript pinned 5.9 not 7.0 (openapi-typescript peer-dep)"
  - "2 dev-only js-yaml npm-audit warnings under the codegen tool (never shipped; trusted input)"
compatibility_matrix: ["Python suite unaffected (no Python added)"]
downstream_consumers: [external JS/web integrators; future auth/retry/pagination + npm publish]
