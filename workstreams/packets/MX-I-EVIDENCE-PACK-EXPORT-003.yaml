id: MX-I-EVIDENCE-PACK-EXPORT-003
status: completed
completed_date: "2026-07-23"
objective: >
  Produce a portable, self-contained evidence pack for one decision that a
  third party can independently re-verify without Milexium's running system,
  plus an honest redaction path -- the "undeniable operational evidence you
  can hand a partner" artifact.
owned_paths:
  - packages/evidence/export.py
  - packages/evidence/__init__.py
  - architecture/decisions/0017-evidence-pack-export.md
read_only_dependencies:
  - packages/evidence/builder.py, models.py
  - packages/verify/hash_chain_verifier.py (verify_chain)
  - packages/canonical/events.py (canonical_json)
normative_contracts:
  - blueprint/07-explain-replay-and-evidence.md (machine-verifiable exports)
  - blueprint/01-north-star-and-boundaries.md (tamper-evident, not immutable/certificate)
  - blueprint/10-security-privacy-and-ai-governance.md (redaction is not de-identification)
inputs_and_fixtures: []
required_outputs:
  - packages/evidence/export.py
  - conformance/property-tests/test_evidence_pack_export.py
acceptance_commands:
  - "py -3 -m pytest conformance/property-tests/test_evidence_pack_export.py -v"
performance_budget: {}
security_and_privacy_invariants:
  - "verify_evidence_pack recomputes bundle hash + chain from the pack's own bytes, trusting no manifest claim"
  - "a redacted pack is explicitly marked non-independently-verifiable; masking is not HIPAA de-identification and says so"
failure_injections:
  - "altered pack content -> bundle_hash_matches False"
  - "re-anchored bundle hash after tampering -> inner chain still fails chain_reverified"
  - "redacted pack -> not reverified, reason states redaction"
compatibility_matrix: []
evidence_to_emit:
  - "5 passing tests: round-trip re-verify, tamper detection (2 ways), honest redaction"
forbidden_interface_changes: []
upstream_blockers: []
downstream_consumers:
  - Partner/auditor evidence hand-off; future MilexiumClient.export_pack SDK method
