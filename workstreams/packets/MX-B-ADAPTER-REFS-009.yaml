  - packages/canonical/storage.py + postgres_storage.py (record_outcome/outcomes)
  - packages/canonical/observation_store.py (insert_vehicle_observation/observations_within)
  - packages/replay/teardown.py (VehicleSegment.from_row, teardown_deadhead) -- byte-identical per ADR-0056
  - conformance/fixtures/builders_connect_{tides,tlc,gtfs_flex,gtfs_realtime}.py (READ ONLY -- see the owned-path finding below)
  - conformance/fixtures/test_connect_*.py and conformance/adversarial/test_connect_* (READ ONLY, and the binding constraint on this packet's design)
  - data/standards/tides-sample.*.csv, data/standards/gtfs-flex-on-demand.*.zip, realdata/raw_tlc/fhvhv_tripdata_*.parquet
  - ADR-0054 (the pattern), 0043 (the home), 0039 (unattributable), 0051 (PII fail-closed), 0038, 0031, 0035
normative_contracts:
  - ADR-0007 (nothing is silently dropped; symmetrically, nothing persisted is reported as dropped)
  - ADR-0039 (`unattributable` is a first-class output; missing attribution stays visible)
  - ADR-0043 (one fact, one home -- vehicle_ref/run_ref live on Outcome and NOT on ServiceRequest)
  - ADR-0051 (PII fails closed and is checked FIRST, ahead of every other validation)
  - ADR-0035 (an external agency's identifiers stay plain strings, never canonical typed ids)
per_adapter_findings:
  tides_trips:
    carries_a_reference: "BOTH. vehicle_id is the vehicle that performed the trip; block_id is a day's chained vehicle work -- the run reference, and the same concept Block.block_ref documents as 'GTFS trips.block_id'. Confirmed against the real TIDES trips_performed header at data/standards/tides-sample.*.csv."
    wired: >
      YES. New `parse_performed_trip()` returns a `TidesPerformedTrip` composite
      (request + Outcome + mirrored refs, the OperatorTripRecord shape) carrying
      vehicle_id -> Outcome.vehicle_ref and block_id -> Outcome.run_ref verbatim.
      The chain TIDES row -> Outcome -> MilexiumDB -> read back -> VehicleSegment
      -> teardown_deadhead is proven on BOTH engines.
    deliberately_not_wired: >
      `parse()` was NOT changed to return the composite -- which is what "follow
      ADR-0054's pattern exactly" would have meant. See limitations: this is the
      packet's biggest deviation and it is a consequence of the owned-path
      boundary, not a design preference.
    semantic_loss: "The vehicle_id/block_id `dropped` records are REMOVED from the performed-trip output and replaced by one narrowed record, `<the block or vehicle the reference names>`. On the `parse()` output they REMAIN dropped -- correctly, since a ServiceRequest has no home for them -- but their reasons were narrowed to stop claiming a canonical gap that ADR-0043 closed."
  gtfs_realtime:
    carries_a_reference: "A VEHICLE, not a run. `vehicle.id` is a genuine vehicle identifier. GTFS-RT's TripDescriptor carries trip_id/route_id/direction_id/start_date/start_time/schedule_relationship and NOTHING else -- block_id lives in STATIC GTFS trips.txt, which a realtime feed does not include."
    wired: >
      The vehicle side was ALREADY wired to VehicleObservation.vehicle_ref when
      the observation family landed (ADR-0031) -- this packet did not write that
      line and does not claim it. What this packet adds is the proof the chain
      closes (feed -> observation -> PostGIS -> read back -> VehicleSegment ->
      teardown) and the never-back-filled guarantee, neither of which existed.
    deliberately_not_wired: >
      No run reference is invented. `trip_id` is NOT used as a substitute: a trip
      is one journey along a pattern, a block is a day's chained work, and the
      difference between them is exactly the deadhead being measured -- keying on
      trip_id reports every vehicle's whole day as single-trip runs with no gaps,
      i.e. zero deadhead. Joining a static GTFS feed to recover trips.block_id is
      a real option and is NOT done here (this adapter maps one realtime row and
      holds no static feed). Recorded as `NO_RUN_REFERENCE_FIELD` on every row.
    semantic_loss: "New `<no run or block reference in a GTFS-Realtime feed>` record on every mapped row. The existing `vehicle_id` residual on the TripUpdate path was NARROWED: it said the vehicle 'belongs on VehicleObservation', which implies it survives; it now says it does NOT survive this mapping and survives only if the same feed also publishes a VehiclePosition."
  tlc_trips:
    carries_a_reference: >
      NEITHER, verified rather than assumed. The parquet footers of
      realdata/raw_tlc/fhvhv_tripdata_2019-02.parquet (24 columns) and
      ...2026-05.parquet (25, adding cbd_congestion_fee) were read directly: no
      hack licence, no medallion, no plate, no VIN, no driver id, no vehicle id.
      hvfhs_license_num is the COMPANY's TLC licence (HV0002/3/4/5 -- four values
      across twenty million rows); dispatching_base_num/originating_base_num are
      TLC-licensed BASE STATIONS (businesses).
    wired: "NOTHING, and that is the correct outcome. Recorded as `<no vehicle or run reference column in FHVHV>` on every row, with the consequence stated: NO deadhead can be measured from this source at all, and no better join would change that."
    deliberately_not_wired: "hvfhs_license_num. Chaining by it would place every Uber trip in New York on one vehicle and produce a deadhead figure with no missing value anywhere to warn the reader it was fiction."
    additional_gate: "PERSON_IDENTIFYING_COLUMNS + person_identifying_category() -- see security_and_privacy_invariants."
  gtfs_flex:
    carries_a_reference: >
      NEITHER. GTFS-Flex has no vehicle field anywhere in the standard -- not in
      stop_times, not in trips, not in booking_rules. The only run-shaped field
      GTFS core offers is the OPTIONAL trips.block_id, and it is empty for the
      single trip in the acquired Aspen "Downtowner" feed.
    wired: >
      NOTHING. The reader now carries trips.block_id through so the absence is
      MEASURED per row rather than assumed from the specification text, and the
      value (when a feed has one) is reported as the absence record's
      source_value. It still reaches no canonical field.
    deliberately_not_wired: >
      Even a populated block_id. This adapter emits a ServiceRequest, and
      ADR-0043 put the reference on Outcome and deliberately NOT on
      ServiceRequest; more fundamentally, a GTFS-Flex stop_times row is a
      BOOKABLE SERVICE WINDOW, so attaching a block would assert that a vehicle
      worked a trip nobody has taken. trip_id/service_id/booking_rule_id are not
      used as substitutes.
    semantic_loss: "New `<no vehicle reference in a GTFS-Flex feed; trips.block_id is the only run-shaped field>` record on every mapped row."
the_tlc_pii_reasoning:
  question: "TLC has a hack/licence number which is a *vehicle* but arguably also PII-adjacent. Reason about this explicitly."
  answer_1_it_is_not_a_vehicle: >
    A hack licence is the TLC licence number of a DRIVER -- a person. The
    vehicle-ish identifiers in the taxi world are the medallion (a transferable
    permit, held by a person or a small company) and the plate. So the premise
    that a hack licence is a vehicle id is itself the category error; it is an
    operator reference, and Milexium already has a name for that shape:
    RunPiece.operator_ref, documented as "IS A PERSON REFERENCE AND IS TREATED
    LIKE ONE ... a tokenised badge reference, NEVER a name."
  answer_2_it_is_directly_identifying: >
    TLC publishes a licensee lookup, so the number resolves to a name. This is
    not hypothetical for this dataset -- it is its history. TLC's 2013 taxi
    release published medallion and hack_license as MD5 hashes; because the input
    space is small and enumerable the whole file was de-anonymised within days,
    after which individual drivers' shifts and earnings, and individual
    passengers' trips, were recoverable from it.
  answer_3_even_a_real_vehicle_id_would_be_a_person_id_here: >
    The subtle half, and the one that survives being careful. In a fleet of
    owner-operators -- which is most of the for-hire trade -- vehicle and driver
    are one-to-one, so a genuine vehicle id is a pseudonymous person id.
    vehicle_ref is safe for a transit agency's numbered bus, shared by a
    different operator each shift. It is not safe for a single-vehicle licensee.
    This is why the answer is about the FLEET SHAPE, not about the column name.
  answer_4_where_the_gate_has_to_live: >
    Outcome.vehicle_ref is a plain string with no tokenisation and no redaction.
    It is read straight back out by outcomes() and handed to
    VehicleSegment.run_ref, whose own guard (_reject_rider_identifier) inspects
    the COLUMN NAME a caller points at and would wave through a person id already
    laundered into the canonical field upstream. The only place to stop it is the
    adapter. Hence the gate runs FIRST in TlcTripsAdapter.parse -- ahead of the
    required-column check, ahead of every parse -- and the ORDER is tested as the
    behaviour.
  answer_5_the_conclusion: >
    A hack licence, medallion, plate, VIN or driver id MUST NOT flow through as a
    vehicle reference. It does not -- and FHVHV publishes none anyway, so the
    gate is a standing refusal against schema drift (which is real for this
    source: cbd_congestion_fee appeared in 2025) rather than a live filter. The
    live defect it closes is that such a column would previously have been
    reported as an `unmapped_extension` with source_value=str(value), echoing the
    raw identifier into the loss report.
  a_gap_found_and_not_closed: >
    ADR-0051's classify_pii_column does NOT catch `hack_license`, `medallion`,
    `license_plate` or `vin`. Its `driverlicen` substring catches
    `driver_license` only. The for-hire-trade vocabulary was added LOCALLY in
    tlc_trips.py rather than by widening the shared classifier, because widening
    it changes what operator_export.py quarantines for reasons that have nothing
    to do with taxis. Whether the shared classifier should learn these terms is a
    real question this packet deliberately did not answer.
security_and_privacy_invariants:
  - "ADR-0051 UNTOUCHED IN operator_export.py. Not one line of its PII gate, its ordering, or its repair layer was modified; all 131 operator-export + messy-data tests and the 20 ADR-0054 wiring tests still pass unchanged."
  - "TLC GATE RUNS FIRST, TESTED AS ORDER. A row that is BOTH missing every required column AND carrying a hack licence is refused on the identifier, not on the missing columns -- because 'missing request_datetime' tells the sender to fix their timestamps and re-send the same identifiers. Mutation-checked: moving the gate after the required-column check turns the test RED."
  - "THE VALUE IS REDACTED, NOT PRESERVED. QuarantinedRow keeps the raw row for re-run, so the offending value is replaced with operator_export.REDACTION_MARKER first. Mutation-checked."
  - "NO FALSE POSITIVE ON THE REAL DATA. All 25 published FHVHV columns pass the gate; the three licence/base columns are explicitly NOT on the refusal list. A fail-closed gate that fails closed on the real dataset is worse than none. Mutation-checked by adding hvfhs_license_num to the list -- RED."
  - "NOTHING IS INVENTED, ANYWHERE. A blank/absent reference becomes None -- never '', never the string 'None', never the sibling column, never an adjacent label/plate/trip id. Asserted per adapter, before the write, after the read-back, and again in the teardown ranking."
  - "NO RIDER OR OPERATOR DATA CROSSES THE TIDES HANDOFF. Outcome has no rider field; the TIDES rider_ref is a synthetic per-row placeholder to begin with; and operator_id (a person-adjacent field, and the most plausible wrong 'run' key) reaches neither the Outcome nor the run_ref."
  - "GTFS-RT license_plate stays a reported loss and is never promoted into vehicle_ref on the grounds that it also identifies a vehicle."
failure_injections:
  - "TIDES row names a vehicle but no block -> run_ref is None, NOT back-filled from the vehicle number; the teardown puts those 60 minutes in `unattributable` -- on the SAME vehicle as the identified block, the shape a back-fill bug would otherwise survive"
  - "TIDES row names a block but no vehicle -> the mirror case"
  - "TIDES row names NEITHER -> accepted with both None (unlike operator_export, which quarantines; ADR-0038's mandatory-column rule is an intake contract Milexium negotiates, and TIDES is a published standard it does not)"
  - "TIDES block column never sent at all -> top_runs empty, attributed_run_count 0, whole total in `unattributable`"
  - "TIDES row that does not say what happened (no actual_trip_start, no cancellation) -> QUARANTINED by parse_performed_trip rather than defaulted; parse() still accepts it as a request"
  - "TIDES cancelled trip -> served=False and actual_pickup_at cleared, but the reference still survives (which vehicle was assigned to a trip that did not run is exactly what a teardown needs)"
  - "GTFS-RT position with no vehicle descriptor, alongside vehicle_label / license_plate / trip_id / entity_id -> vehicle_ref stays None against all four"
  - "GTFS-RT TripUpdate carrying a vehicle_id -> it does not reach the stop observation and no vehicle-keyed record is minted from it"
  - "TLC extract carrying hack_license / 'Hack License' / medallion / license_plate / vin / driver_id -> quarantined, value redacted"
  - "TLC extract carrying rider_name -> quarantined by ADR-0051's classifier, which still runs here too"
  - "GTFS-Flex feed with a POPULATED trips.block_id -> reported as the absence record's source_value, still reaching no canonical field and not leaking in as an unmapped_extension"
mutation_checks:
  method: >
    Break the source one way at a time, run the named test, require RED, restore.
    23 mutations, 23 RED, 0 survivors. One mutation initially came back GREEN and
    the mutation, not the test, was wrong: it rewrote the first line of the
    GTFS-RT TripUpdate `vehicle_id` reason while leaving intact the phrase the
    test asserts on. Reverting that reason WHOLE to its pre-packet one-liner is
    RED. Recorded because a mutation that fails to mutate is the exact way a
    vacuous test gets certified as sound.
  checked:
    - "TIDES: back-fill a missing block from the vehicle number -> RED"
    - "TIDES: stop writing run_ref onto the Outcome -> RED (the chain test)"
    - "TIDES: keep reporting the retained reference as dropped -> RED"
    - "TIDES: delete the narrowed residual-loss record (the easy move ADR-0054 warns about) -> RED"
    - "TIDES: default served=True when the row does not say -> RED"
    - "TIDES: carry a stale pickup time onto a cancelled trip -> RED"
    - "GTFS-RT: back-fill vehicle_ref from vehicle_label -> RED"
    - "GTFS-RT: drop the no-run-reference record -> RED"
    - "TLC: run the person-identifying gate AFTER the required-column check -> RED"
    - "TLC: keep the raw identifier in the quarantine record -> RED"
    - "TLC: drop the no-vehicle-reference record -> RED"
    - "TLC: add hvfhs_license_num to the refusal list (false positive on real data) -> RED"
    - "GTFS-Flex: stop measuring trips.block_id in the reader -> RED"
    - "GTFS-Flex: report the block absence without measuring it -> RED"
    - "GTFS-RT: back-fill vehicle_ref from trip_id -> RED"
    - "GTFS-RT: back-fill vehicle_ref from entity_id -> RED"
    - "GTFS-RT: promote license_plate into vehicle_ref -> RED"
    - "GTFS-RT: revert the TripUpdate vehicle_id reason to the misleading pre-packet one -> RED"
    - "TIDES: mint the outcome without linking it to its request -> RED"
    - "TIDES: let parse_performed_trip rebuild its own request instead of reusing parse()'s -> RED (the two-entry-point guard)"
    - "TIDES: report the entity gap even when the row named no reference -> RED"
    - "TLC: skip the general ADR-0051 classifier and keep only the local list -> RED"
    - "GTFS-Flex: let block_id leak through as an unmapped_extension -> RED"
