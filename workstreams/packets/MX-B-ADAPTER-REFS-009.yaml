evidence_to_emit:
  - "49 tests, 0 skipped. Both canonical-store engines RAN (SQLite + PostgreSQL 17) and so did the PostGIS observation store -- no leg of either chain was skipped on this machine."
  - "TIDES end to end: top_runs == [('BLK-3', 155.0)] with segment_count 2 and attributable True; unattributable == 60.0 over 1 segment; total 215.0 -- every figure re-derived from outcomes READ BACK OUT of the store."
  - "GTFS-RT: three positions for y1860 and two naming no vehicle at all round-trip through PostGIS with the absence intact (2 of 5 come back None, and '1860' -- the LABEL -- appears nowhere), then rank as one vehicle with the rest unattributable."
  - "TLC: the FHVHV column list read directly from both parquet footers, proving the negative rather than asserting it."
  - "GTFS-Flex: every stop_times row of the REAL acquired feed carries a block_id key resolved through trips.txt, and it is None throughout -- an observation, not a claim inherited from the spec text."
compatibility_matrix:
  - "SYNTHETIC OR PUBLIC OPEN DATA ONLY. TIDES fixtures are hand-built against the real acquired header; GTFS-Flex is MobilityData's Apache-2.0 spec example; GTFS-RT mirrors an MBTA feed and the google/transit example; TLC FHVHV is publicly published trip data. NO consented operator data exists in this repository, so Status stays Demonstrated and cannot reach Validated."
  - "SQLite (demo engine) + PostgreSQL 17 for the TIDES chain, one parametrized fixture. PostGIS for the GTFS-RT observation leg (PostgreSQL-only -- there is no SQLite vehicle-observation store, so that leg SKIPS where the database is absent)."
upstream_blockers: []
downstream_consumers:
  - "packages/replay/teardown.py -- can now be fed segments built from persisted TIDES outcomes and from persisted GTFS-RT observations, not only from operator exports"
  - "packages/connect/ingest_report.py -- unchanged; the new TLC quarantine reason classifies through classify_quarantine_reason like any other"
  - "packages/sdk/client.py and demo/golden_path.py -- unchanged, because parse() was deliberately left alone"
limitations:
  - "TIDES HAS TWO ENTRY POINTS FOR ONE ROW, AND THAT IS THE PACKET'S BIGGEST COMPROMISE. ADR-0054's pattern is that parse() returns the composite. Here parse() still returns AdapterResult[ServiceRequest] and parse_performed_trip() returns the composite. The divergence is bounded by construction -- parse_performed_trip CALLS parse and returns its request unmodified, pinned by a test that mutation-checks RED -- but nothing STRUCTURALLY prevents a future edit to one path only, and a caller who reaches for the obvious method name gets the output with no reference in it. Collapsing them into one is a contract change for a packet that owns the affected files."
  - "THE ADAPTER CONFORMANCE TESTS ARE NOT IN THIS PACKET'S OWNED PATHS, AND THAT IS WHAT FORCED THE PREVIOUS LIMITATION. They live in conformance/fixtures/test_connect_*.py and conformance/adversarial/, not conformance/property-tests/. conformance/fixtures/test_connect_tides_trips.py pins `lost['vehicle_id'].disposition == 'dropped'` and `source_value == 'VH-07'` and `lost['block_id'].disposition == 'dropped'` -- i.e. it pins in place the exact records a correct wiring must move. So every change here had to be ADDITIVE: new loss records are fine, but no existing record's source_field, source_value or disposition could change. This is the same owned-path wall ADR-0043 hit from the other side, and it is now the second consecutive packet to hit it on this field."
  - "AN EARLIER DRAFT OF THIS PACKET CLAIMED FIVE UNOWNED CALL SITES FOR TidesTripsAdapter.parse, INCLUDING packages/sdk/client.py AND demo/golden_path.py. That was wrong and is corrected here: those two use TlcTripsAdapter and the structural SourceAdapter protocol, not TIDES. The real count is 5 assertions across 2 unowned test files plus 1 builder. The constraint is narrower than first stated, and the binding half of it is the semantic-loss assertion above rather than the return type."
  - "THE GTFS-RT DURABLE LEG HAS A SEAM. PostgisObservationStore's only read that returns a vehicle reference (observations_within) does not return observed_at, and there is no vehicle_observations(tenant_id) reader; adding one is outside the owned paths. So the reference is proven to persist by reading every value back out of PostGIS and asserting it matches, and the teardown is then built from the in-memory observations. The two legs are joined by an assertion rather than by one continuous data path -- strictly weaker than the TIDES chain, which has no such seam."
  - "GTFS-RT RANKS A VEHICLE, NOT A RUN, AND A READER COULD MISS THAT. VehicleSegment has ONE run_ref slot documented as a 'run/block/vehicle id', so a vehicle-keyed teardown is a legitimate use of it -- but the resulting ranking is NOT comparable with a run-level ranking from another source. The only thing preventing the confusion is the manifest's run_ref_source string, which is a free-text field the caller supplies. Nothing enforces that it is honest."
  - "TIDES `served` IS A MODELLING JUDGMENT, NOT A MAPPED FIELD. TIDES has no served column. A cancellation in schedule_relationship gives served=False and a present actual_trip_start gives served=True; anything else is quarantined. The cancellation vocabulary recognised is exactly {canceled, cancelled} -- a TIDES export writing 'CANCELLED_NO_SHOW' or a numeric code would fall into the quarantine branch, which is the safe direction but means such an export imports zero performed trips with no explanation naming the vocabulary as the cause."
  - "TIDES on_time, excess_ride_time_minutes and deadhead_minutes are all left None. on_time would need a scheduled-vs-actual tolerance nobody has agreed; excess ride time needs a dropoff this adapter does not map; deadhead_minutes is the teardown's OUTPUT. All three are recoverable from data TIDES actually publishes (actual_trip_end in particular), and none of it is mapped."
  - "THE TIDES TEARDOWN MINUTES ARE NOT A MEASUREMENT, for the same reason ADR-0054 gave. The whole inter-trip interval is labelled `deadhead` by the test's own segment builder. TIDES DOES publish actual_trip_end, so unlike the operator export this is a mapping gap rather than a source gap -- the revenue portion is knowable here and is simply not mapped. The tests therefore assert WHICH BLOCK the time is attributed to, never the quantity."
  - "THE TLC GATE IS A NAME-BASED BACKSTOP, exactly like ADR-0051's. A column called `notes` holding a driver's licence in free text is not caught, and no value-level scan was added. It is a defence against schema drift and against someone's upstream join, not a PII scanner."
  - "THE TLC GATE IS UNTESTED AGAINST REAL DRIFT because no TLC release has ever carried these columns. Every refusal test uses a synthetic column added to a real row. If TLC ships a differently-named identifier (`driver_ref`, `operator_hack`), the gate misses it and it becomes an unmapped_extension with its raw value echoed into the loss report -- the pre-existing behaviour this packet only partially closes."
  - "GTFS-FLEX'S ABSENCE IS MEASURED ON A ONE-TRIP FEED. The acquired Aspen 'Downtowner' feed has exactly ONE row in trips.txt, with an empty block_id. 'Empty throughout the acquired feed' is therefore a statement about a single trip. A flex feed from an agency that does populate block_id would still be reported correctly (a test covers that path with a synthetic value) but has never been seen."
  - "THE PII GATE ONLY EXISTS ON TWO OF THE FIVE ADAPTERS. operator_export.py has ADR-0051's full gate; tlc_trips.py now has a narrower one. tides_trips.py, gtfs_flex.py, gtfs_realtime.py and reference_agency_trips.py have NO PII gate at all -- so the requirement to prove 'the gate still runs first' is only literally testable on the two that have one. For the other three this packet proves the weaker property that its own wiring creates no path by which a person-identifying value becomes a vehicle/run reference. Whether those adapters should have a gate is a real open question: TIDES operator_id in particular is a person-adjacent field that currently flows into a semantic-loss record with its raw value."
  - "NOTHING RESOLVES A LABEL TO AN ENTITY, unchanged from ADR-0054. Outcome.vehicle_ref/run_ref stay plain source-system strings with no foreign key to vehicles/blocks/run_pieces, and no Block/RunPiece row is minted -- a trips_performed row describes ONE trip, and a Block needs a whole service day's pull-out and pull-in. So the same block id from two agencies is not one block, and pull-out/pull-in deadhead is invisible rather than zero."
  - "THE FOUR ADAPTERS' PARSE PATHS WERE NOT OTHERWISE AUDITED. This packet looked at one field family. It did not review the other mappings, the timezone coercions, or the quarantine vocabulary in any of the four files."
notes: >
  NO ADR was written (the orchestrator writes it from this packet). No git add,
  commit or push. Did NOT touch packages/replay/** (byte-identical per ADR-0056),
  packages/decide/**, packages/core/**, packages/api/**, packages/canonical/**,
  outreach/**, conformance/fixtures/**, conformance/adversarial/**, contracts,
  pyproject, CI, IMPLEMENTATION_STATUS, JOURNAL or any ADR.
  packages/connect/__init__.py DID change: it exports TidesPerformedTrip, the
  three per-format "no reference" field constants, and the TLC refusal surface,
  so a consumer can ask what a source carries without importing four modules.
  Status stays Demonstrated for all four adapters. Validated requires consented
  operator data; every fixture here is synthetic or public open data, so none of
  this can be promoted.
