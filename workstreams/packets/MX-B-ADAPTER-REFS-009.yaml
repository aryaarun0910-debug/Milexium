id: MX-B-ADAPTER-REFS-009
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
result: >
  49 new tests (test_adapter_vehicle_references.py), 0 skipped -- both the SQLite
  and PostgreSQL halves of the canonical-store fixture RAN, and so did the
  PostGIS observation store. The four adapters ADR-0054 left unchanged now each
  have an ANSWER rather than a silence, and the answers differ: TIDES carries
  both references and is wired end to end; GTFS-Realtime carries a vehicle and
  no run, so the vehicle chain is proven and the run absence is recorded; TLC
  FHVHV and GTFS-Flex carry NEITHER, verified rather than assumed, and record
  it. 23 mutation checks, all RED. The connect surface (adapter conformance +
  adversarial + operator-export + messy-data + teardown + observation + golden
  path) goes 426 -> 475 passed, with no existing test changed and none removed.
objective: >
  ADR-0054 named its own limitation: "This closes the chain for the
  operator-export adapter only. The other adapters (TIDES, GTFS-Flex, TLC,
  GTFS-Realtime) are unchanged; where they carry a vehicle reference it is still
  unwired." Determine, per adapter, whether the source format ACTUALLY carries a
  vehicle or run reference; wire the ones that do following ADR-0054's pattern;
  and where a format has none, RECORD that it has none rather than synthesizing
  one. Deadhead is measurable only by chaining one vehicle's consecutive trips
  (ADR-0039), so this is the single field the whole teardown depends on.
