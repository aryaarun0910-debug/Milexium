id: MX-C-OPERATOR-INTAKE-003
status: completed
completed_date: "2026-07-24"
adr: architecture/decisions/0038-operator-data-intake.md
result: "107 tests; PII fail-closed checked BEFORE all other validation; surfaced that vehicle_ref/run_ref has no canonical home"
dispatched_date: "2026-07-24"
objective: >
  The path that converts an operator's "yes" into data safely. Today there is no
  documented way for an agency to hand over a trip export: no stated format, no
  minimum field list, no data-sharing terms, no retention/deletion story pointed
  at operator data. That gap -- not model quality -- is what blocks the Validated
  gate. Programs C (estate/governance) + B (Connect).
owned_paths:
  - packages/connect/operator_export.py       # generic operator trip-export adapter
  - docs/OPERATOR_DATA_INTAKE.md              # the format + field list + terms an agency reads
  - conformance/property-tests/test_operator_export.py
read_only_dependencies:
  - packages/connect/adapter.py (SourceAdapter contract, ADR-0007 -- conform to it)
  - packages/connect/tides_trips.py, gtfs_flex.py (sibling adapters: follow their quarantine + semantic-loss discipline)
  - packages/canonical/entities.py (ServiceRequest, Outcome)
  - packages/estate/manifest.py (rights/retention fields already modelled)
  - packages/canonical/sql/rls_postgres.sql (tenant isolation already built -- cite it, do not modify)
normative_contracts:
  - blueprint/03-connect-and-standards.md, blueprint/17 (governed estate)
  - ADR-0007 (adapter contract), ADR-0013 (estate governance), ADR-0018 (RLS)
required_outputs:
  - packages/connect/operator_export.py
  - docs/OPERATOR_DATA_INTAKE.md
  - conformance/property-tests/test_operator_export.py
acceptance_commands:
  - "py -3 -m pytest conformance/property-tests/test_operator_export.py -q"
  - "py -3 -m pytest packages/ conformance/ -q   # whole suite still green (603 baseline)"
the_document_must_state:
  - "MINIMUM FIELD LIST -- the smallest set that makes a teardown possible: trip/booking ref, requested/scheduled/actual times, pickup+dropoff zone (NOT address), vehicle or run ref, outcome (served/no-show/denied/cancelled). Explicitly: no names, no phone numbers, no addresses, no DOB, no medical or eligibility detail."
  - "ACCEPTED FORMATS -- CSV and Parquet, with a worked column mapping example."
  - "WHAT WE DO WITH IT -- purpose limited to the agreed analysis; per-tenant isolation (Postgres RLS with FORCE, ADR-0018, already built and adversarially tested); no onward sharing."
  - "RETENTION AND DELETION -- a stated period, a deletion-on-request commitment, and how deletion is confirmed."
  - "WHAT WE DO NOT WANT -- rider PII of any kind. Say it plainly; an agency's lawyer reads this line first."
  - "STATUS HONESTY -- Milexium is Demonstrated on public data, not operator-Validated. The document must not imply existing customers or a track record."
security_and_privacy_invariants:
  - "The adapter REJECTS (quarantines) any row carrying an obvious direct identifier -- name, email, phone, full street address, national/medical id -- rather than importing and ignoring it. Fail closed, and prove it in a test."
  - "rider_ref is TOKENISED on ingest (hash), never stored raw, mirroring the sibling adapters."
  - "Every unmapped source column is recorded as semantic loss (never silently dropped), per ADR-0007."
failure_injections:
  - "export containing a 'rider_name' / 'phone' / 'address' column -> quarantined with a reason naming the field"
  - "missing required time fields, malformed timestamps, unknown outcome values -> quarantine, not a guess"
  - "an export with extra vendor columns -> imports cleanly, extras reported as unmapped_extension"
compatibility_matrix:
  - "Prove the adapter against at least two structurally different synthetic exports (a wide vendor-style CSV and a minimal one) so it is not overfitted to one shape. NO real operator data exists -- label all fixtures synthetic."
evidence_to_emit:
  - "test count; the field list as implemented; proof the PII-rejection path fires"
upstream_blockers:
  - "The data-sharing AGREEMENT itself is a legal document, not code. Draft the technical//privacy schedule an agreement would reference, and flag clearly in the doc that a signed agreement is a founder/legal task, NOT something this packet completes."
downstream_consumers: [MX-H-DEADHEAD-TEARDOWN-003 consumes exactly this adapter's output]
notes: >
  Disjoint from the teardown packet (packages/replay) and the canonical-debt
  packet (packages/canonical). Do NOT touch pyproject, CI, IMPLEMENTATION_STATUS,
  JOURNAL, ADRs, or git. Do not overclaim: this is Exists (v0.1), Demonstrated on
  synthetic exports only.
