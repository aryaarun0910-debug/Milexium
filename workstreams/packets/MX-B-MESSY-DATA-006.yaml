id: MX-B-MESSY-DATA-006
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
adr: architecture/decisions/0051-graduated-repair-messy-data.md
result: >
  24 tests. Graduated repair: 10 unambiguous rules, each recording a `coerced`
  SemanticLossRecord naming the rule; genuinely ambiguous input still
  quarantined. Plus an ingest quality report that diagnoses CORRELATED
  missingness rather than only counting gaps.
objective: >
  Make operator ingest survive real, messy vendor exports without ever guessing.
  Paratransit/NEMT operators export whatever Ecolane/TripSpark/RouteMatch emits;
  the first design partner will send something ugly. Quarantining 40% of it and
  replying "your export is malformed" ends the engagement -- but guessing is
  worse, and is the failure mode this repository exists to avoid.
owned_paths:
  - packages/connect/operator_export.py
  - packages/connect/ingest_report.py
  - packages/connect/__init__.py
  - conformance/property-tests/test_messy_operator_data.py
read_only_dependencies:
  - packages/connect/adapter.py (SemanticLossRecord.disposition is already coerced|dropped|unmapped_extension -- extended, not replaced)
  - packages/replay/teardown.py (the downstream consumer; ADR-0039's correlated-missingness finding motivates the diagnosis)
normative_contracts: [blueprint/03-connect-and-standards.md, ADR-0007, ADR-0038]
the_principle: >
  A GRADUATED response, never a silent guess. Unambiguously repairable -> repair
  and record. Genuinely ambiguous -> quarantine. PII -> fails closed FIRST,
  before any repair logic runs.
repair_rules_implemented:
  - "trim_whitespace -- surrounding whitespace incl. non-breaking and zero-width spaces"
  - "integral_float_identifier -- an id or zone arriving as '412.0' (a spreadsheet round-trip artifact)"
  - "enum_synonym -- an outcome mapped onto the canonical vocabulary via the published synonym table"
  - "iso8601_variant -- a YEAR-FIRST date spelled with / or . separators; the year pins the order, so unambiguous"
  - "iso8601_utc_designator -- a trailing textual 'UTC'/'GMT' read as the +00:00 it means"
  - "twelve_hour_clock -- an am/pm time read onto the 24-hour clock"
  - "date_order_ddmm -- slash/dot/dash date read DAY-first ONLY because the first component exceeds 12"
  - "date_order_mmdd -- read MONTH-first ONLY because the second component exceeds 12"
  - "requested_at_date_only -- a booking DATE with no time-of-day anchored at 00:00 UTC"
  - "boolean_like -- Y/YES/TRUE/T/1 and N/NO/FALSE/F/0 read as a boolean"
deliberately_refused:
  - >
    AN AMBIGUOUS DD/MM vs MM/DD DATE. `03/04/2026` is 3 April and 4 March and
    nothing in the row decides it. Picking either silently would shift a trip by
    a month, and every hour-of-day and day-of-week bucket in the teardown would
    be wrong WHILE LOOKING WELL-FORMED. Quarantined with a reason naming both
    readings, so the operator can fix it at source. This is the line between
    "repaired with a recorded reason" and "guessed".
  - "Any repair that would run BEFORE the PII gate -- a normalisation could tidy a rider name into acceptable form and admit it."
  - "Inferring a missing vehicle/run reference. The teardown reports unattributable time as a first-class output (ADR-0039); inventing an id would corrupt that rather than improve it."
security_and_privacy_invariants:
  - "PII still fails closed FIRST, before any normalisation. Proven by a test where the row is BOTH malformed and carries a rider name: it is rejected on PII grounds and the value survives nowhere in the quarantine record."
  - "Every repair records the original value and the rule applied, so it is auditable and reversible in review -- a repair nobody can see is a guess."
failure_injections:
  - "ambiguous DD/MM date -> quarantined, not guessed (the key negative test)"
  - "PII + malformed in the same row -> PII path wins"
  - "repeated header row mid-file, empty rows, ragged/extra vendor columns"
  - "trip crossing midnight and zero-duration trip -> ACCEPTED (they are real, not defects)"
  - "entirely empty export -> usable report, no ZeroDivisionError"
  - "export where EVERY row quarantines -> report still names reasons and missing fields"
  - "identifier changing format mid-file -> surfaced"
  - "correlated missingness -> diagnosed, not merely counted"
compatibility_matrix:
  - "All fixtures SYNTHETIC and labelled. No real operator data exists in this repository."
  - "The 107 pre-existing test_operator_export.py tests and the 21 test_api_teardown.py tests pass unchanged."
evidence_to_emit:
  - "24 tests; 10 repair rules each with a published explanation; report counts reconcile to the row total"
upstream_blockers: []
downstream_consumers:
  - "MX-H-DEADHEAD-TEARDOWN-003 -- a teardown is only as good as the rows that reached it"
  - "docs/OPERATOR_DATA_INTAKE.md -- the report turns 'your export is malformed' into a diagnosis an operator can act on"
notes: >
  Finished by the orchestrator after the implementing agent was stopped
  mid-packet: packages/connect/ingest_report.py and the operator_export.py
  changes were complete and non-breaking on disk, but the test file and this
  packet record were missing. The orchestrator wrote both and verified against
  the implementation rather than assuming it -- two initial test assumptions
  (that `headline` was a method, and that a space-separated ISO timestamp needed
  repair) were WRONG and were corrected against observed behaviour.
