id: MX-RND-HYPOTHESIS-MINING-011
status: completed
dispatched_date: "2026-07-26"
completed_date: "2026-07-26"
adr: none — this packet is R&D. It writes no ADR, changes no mechanism, and
  ships nothing. Its output is a set of tested hypotheses, most of which died.
mode: >
  DELIBERATELY DIFFERENT FROM EVERY OTHER PACKET IN THIS REPO. Everywhere else a
  hard honesty gate is applied before anything is published; that bar is correct
  for claims made to people and wrong for GENERATING ideas, because nothing
  survives a strict gate and so nothing gets explored. Here the job is to
  generate and test many hypotheses fast and report honestly which died. A dead
  hypothesis is a successful output. The bar on WHICH QUESTIONS TO ASK is
  lowered; the bar on whether a NUMBER IS TRUE is not lowered at all — every
  figure is computed by a named script in research/ from a named governed file.
objective: >
  Mine the governed data on disk for hypotheses worth having, test them, and
  report which survived, which died, and which survivors would clear the
  outreach gate in outreach/build_panel_findings.py versus which are
  interesting-but-not-publishable.
owned_paths:
  - research/**
  - workstreams/packets/MX-RND-HYPOTHESIS-MINING-011.yaml
read_only_dependencies:
  - data/raw/public/ntd-monthly-ridership-all-modes.529952083544f257.csv
  - data/raw/public/ntd-service-opex-by-mode-timeseries.e6e821f63751d429.csv
  - data/raw/public/ntd-gtfs-weblinks.9c73ba1b2ddf3bc5.csv
  - data/raw/public/calitp-gtfs-*.csv
  - data/catalog/calitp-scheduled-deadhead.summary.json   (read only; ADR-0062 output)
  - ntd/agency_economics.csv
  - ntd/census_latent_demand.csv
  - realdata/WEATHER_ABLATION_RESULTS.md
  - outreach/build_panel_findings.py   (read only — the gate findings are marked against)
untouched_by_this_packet:
  - packages/**
  - outreach/**
  - data/catalog/**
  - demo/**
  - conformance/**
external_apis_used:
  - "US Census ACS 2019-2023 5-year, geography `urban area` (2020 vintage).
     CENSUS_API_KEY read from the environment; never printed, never written to
     any output file."
  - "NOAA: NCEI access API (global-summary-of-the-month, no account required),
     with NOAA_CDO_TOKEN as a fallback path. Token never printed or persisted."
inflation_policy: >
  CPI-U with the brief-mandated anchors 2015=237.017 and 2024=313.689;
  intermediate years are published CPI-U annual averages, held in
  research/lib.py. Every multi-year money figure is reported nominal AND in
  2024 dollars.
hypotheses:
  - id: H1
    question: "Is the gap between GTFS-derived SCHEDULED deadhead and NTD OPERATED deadhead a stable calibration?"
    verdict: DIED
    reason: >
      Not merely unstable — undefined. `DR` appears ZERO times in the NTD GTFS
      weblinks register (1,539 rows, 15 modes), and only 3 of 4,283 Cal-ITP
      routes are route_type 715. GTFS deadhead is fixed-route; agency_economics
      deadhead is demand-response. Forced comparison across 9 name-matched CA
      agencies gives an operated/scheduled ratio spanning 0.22x-9.28x and a
      correlation of -0.930 that decomposes entirely into agency scale.
    script: research/h1_deadhead_gap.py
    gate: GATE-FAIL (mode_provenance, by construction)
  - id: H2
    question: "Is next-year cost-per-trip deterioration predictable from prior-year structure?"
    verdict: DIED (point prediction) / INCONCLUSIVE (ranking)
    reason: >
      Out-of-sample R2 vs a zero-change baseline is -0.06 to +0.03 across 2023
      and 2024 target years; no fitted model beats predicting no change.
      A ranking signal exists (AUC 0.58-0.61 for the worst-deteriorating
      quintile) but a ONE-VARIABLE rule using only the current cost level
      reproduces it (AUC 0.592-0.603), and substituting the year-earlier level
      collapses it back to the structural-only baseline — i.e. it is mean
      reversion in a noisy self-reported series, not foresight.
    scripts: [research/h2_deterioration.py, research/h2b_ablation.py]
    gate: GATE-FAIL (would not survive as a forward-looking claim)
  - id: H3
    question: "Does weather explain demand-response demand at monthly resolution?"
    verdict: DIED
    reason: >
      25 metro operators paired with their airport GHCND station, 1,994 complete
      agency-months, within-agency and within-calendar-month anomalies. Weather
      explains R2 = 0.0012 of the log-trip anomaly (temperature alone 0.00083).
      Pooled correlations: temp -0.029, precipitation -0.013, snow +0.024. The
      snow coefficient has the WRONG SIGN, and the per-agency temperature
      correlation is positive for 9 of 18 agencies -- a coin flip. Corroborates
      the existing daily-resolution null in realdata/WEATHER_ABLATION_RESULTS.md.
    script: research/h3_weather.py
    gate: "n/a — a null; safe to state, nothing to publish"
  - id: H3b
    question: "Independent check: do snow metros have a deeper winter demand trough?"
    verdict: DIED (the prediction is falsified, not merely unsupported)
    reason: >
      Needs no weather API — only which cities have winters. Trips per WEEKDAY,
      each agency normalised to its own mean, COVID excluded, 19 metros. Median
      winter-minus-summer index gap: snow metros -0.0551, warm metros -0.0647.
      The difference is +0.0096 — snow metros lose LESS demand in winter than
      warm ones. Dallas has the deepest winter trough of any metro tested and
      Milwaukee's winter is busier than its summer. The month-of-year profile is
      the same shape in both groups (January dip, April and October peaks),
      which is a holiday and standing-order pattern, not a climate one.
    script: research/h3b_seasonality.py
    gate: "n/a — a null"
  - id: H4
    question: "Does ADA-eligible population explain demand-response volume, and is there unmet need?"
    verdict: SURVIVED
    reason: >
      Exact UACE-code join to ACS urban areas, 453 UZAs. Ambulatory-difficulty
      population explains only R2=0.449 of log DR volume — LESS than raw
      population (R2=0.526). Service intensity spans 1.37 to 18.41 trips per
      ambulatory-difficulty person per year (p10-p90, 13.5x), median 5.60, with
      no relationship to metro size (r=-0.009). Lifting every below-median UZA
      to the median implies 13.77M additional trips, 14.1% of current volume.
    script: research/h4_census_unmet_need.py
    gate: GATE-RISK (mode_provenance caveat — `DR` is not only ADA paratransit)
  - id: H5a
    question: "How much of the sector cost story is a reporting artifact?"
    verdict: SURVIVED — and the headline is CONSERVATIVE
    reason: >
      2.6% of agency-year transitions show money moving while vehicle revenue
      hours do not. The largest is MTA New York City Transit, whose DR opex
      falls 53.3% in 2024 while its DR trips rise 4.1% and its four other modes
      all grow opex. Removing it RAISES the sector real cost-per-trip rise from
      +34.0% to +40.2%; removing all 343 flagged agencies gives +38.3%.
    script: research/h5a_reporting_discontinuities.py
    gate: GATE-PASS
  - id: H5c
    question: "Is the cost rise a wage story or a productivity story?"
    verdict: SURVIVED
    reason: >
      Exact identity decomposition on a balanced panel (n=1,355): real cost per
      trip +34.0% (nominal +77.3%), of which 61.6% is real cost per revenue
      hour (+19.8%) and 38.4% is falling trips per revenue hour (-10.6%).
      Pre-COVID 2015-2019 the split reverses: 57.6% productivity. Stable at
      59-65% / 35-41% under every drop-largest-k treatment to k=50.
    script: research/h5c_cost_decomposition.py
    gate: GATE-PASS
  - id: H5e
    question: "Is the productivity loss longer trips (not addressable) or lost ride-sharing (addressable)?"
    verdict: SURVIVED — and it reverses the naive reading
    reason: >
      Passenger miles separate the two exactly. On the 355 agencies filing
      passenger miles in both years, vehicle revenue miles per trip rose 6.0%
      while REAL trip length FELL 4.6% and occupancy fell 10.0% (1.213 -> 1.092
      passenger miles per vehicle mile). The whole move is lost ride-sharing.
      66.8% of agencies lost occupancy. Subsample is not representative (larger,
      costlier agencies; 66.3% of panel trips) and is scoped accordingly.
    scripts: [research/h5d_productivity_anatomy.py, research/h5e_ridesharing.py]
    gate: GATE-RISK (balanced but non-random subsample; must be disclosed)
required_outputs:
  - research/lib.py — shared governed-file loaders, CPI table, pure-python stats
  - research/build_dr_panel.py + research/dr_panel.json — the 18,621-row
    demand-response agency-year panel every downstream script uses
  - one script per hypothesis, each emitting its own results JSON so that a
    run interrupted part-way still leaves usable, machine-readable evidence
  - id: H5b
    question: "Which structural levers move demand-response cost per trip?"
    verdict: DIED (deadhead as a diagnostic; purchased transportation) / INCONCLUSIVE (taxi-TNC)
    reason: >
      Deadhead share has essentially NO cross-sectional association with cost per
      trip: Pearson +0.017, OLS R2 = 0.0003, n = 405 (2024, the only year with
      deadhead). Quintile medians of cost per trip run $53.10, $48.30, $52.21,
      $53.10, $55.00 — flat. Purchased transportation shows no cost advantage
      within-agency (+36.6% for agencies raising contracted share >25pp vs
      +35.1% for the stable). Taxi/TNC is suggestive but underpowered: the 22
      agencies above 75% taxi/TNC share have a median cost per trip of $24.55 vs
      $36.14 at zero, and the 18 within-agency increasers rose +21.7% vs +35.3%,
      but the pooled correlation is -0.025. Not enough to claim anything.
    script: research/h5b_structure_vs_cost.py
    gate: GATE-FAIL for taxi/TNC (underpowered); the deadhead null is safe to state
acceptance_commands:
  - "python research/build_dr_panel.py"
  - "python research/h1_deadhead_gap.py"
  - "py -3 research/h2_deterioration.py"
  - "py -3 research/h2b_ablation.py"
  - "py -3 research/h3_weather.py"
  - "py -3 research/h4_census_unmet_need.py"
  - "python research/h5a_reporting_discontinuities.py"
  - "python research/h5b_structure_vs_cost.py"
  - "python research/h5c_cost_decomposition.py"
  - "python research/h5d_productivity_anatomy.py"
  - "python research/h5e_ridesharing.py"
notes_for_the_next_packet:
  - >
    H5e is the finding with the largest commercial consequence and the one most
    in need of hardening. Occupancy is what a scheduling optimiser sets, it fell
    10% and has not recovered, and no published source we know of states it. The
    weakness is sample selection, not arithmetic: only 26% of the balanced panel
    files passenger miles. A follow-up should test whether the occupancy decline
    holds on the full panel using an alternative occupancy proxy, and whether
    NTD passenger miles for DR are sampled or counted per agency.
  - >
    H5b found deadhead share has NO cross-sectional association with cost per
    trip (Pearson +0.017, R2 0.0003, n=405). That does not make deadhead
    reduction worthless — the arithmetic saving is still real — but it kills the
    DIAGNOSTIC claim that high deadhead identifies a high-cost agency. Any
    outreach that ranks prospects by deadhead share should be re-examined.
  - >
    A defect was found and fixed inside this packet: quantile bucketing sorted
    (x, y) tuples, so ties in a zero-inflated x were ordered by y and produced a
    perfectly monotone relationship out of noise. Fixed in
    research/h5b_structure_vs_cost.py by random tie-breaking plus explicit
    groups. Worth grepping for the same pattern elsewhere.
