performance_budget:
  note: >
    No hot path introduced and NONE MEASURED. A write is one tenant-scoped SELECT
    (the chain head, LIMIT 1) plus one INSERT; a read is one tenant-scoped SELECT
    ordered by an INTEGER. The UNIQUE (tenant_id, request_id, sequence) index
    serves the per-request read as a prefix. There is no index on decided_at, so
    a cross-request query like "every denial in July" would seq-scan; no such
    query exists yet. No benchmark was run and no latency budget is claimed.
    test_lifecycle_record.py runs in ~25s and test_lifecycle_rls.py in ~9s, almost
    entirely PostgreSQL schema setup/teardown (one disposable mx_<uuid> schema per
    test, per ADR-0008).

security_and_privacy_invariants:
  - "tenant_id NOT NULL with a FOREIGN KEY to tenants, and ENABLE **and** FORCE row-level security with exactly ONE symmetric policy keyed on the milexium.tenant_id GUC -- the same shape ADR-0048/0055 use for Program D."
  - "The acting role is asserted NON-SUPERUSER and NON-BYPASSRLS *and* table owner BEFORE any isolation result in the file is read as evidence (ADR-0046/0052). PostgreSQL checks both attributes before ownership and before FORCE, so a privileged credential would make every policy decoration."
  - "FORCE is proved load-bearing by LIFTING it, watching the boundary collapse, and restoring it -- not by asserting the bit the file sets."
  - "The deny-all default is proved for the case that ACTUALLY OCCURS: after RESET the GUC reads back as the EMPTY STRING (asserted explicitly, value == '' and is_null is False) and still returns zero rows. The never-set case is proved separately on a SEPARATE connection, because the fixture's connection has necessarily had the GUC set during seeding."
  - "The policy's OWN TEXT is read back out of pg_policy and refused if it is written as an IS NOT NULL guard -- ADR-0043's trap, checked at the shape level so a future 'fix' cannot reintroduce it."
  - "WHAT IS SENSITIVE HERE is not obvious and is stated in the SQL: this is a per-rider record of REFUSALS. A row saying request R was DENIED for NO_ACCESSIBLE_CAPACITY, or negotiated ninety minutes from what the rider asked for, decided by dispatcher token 7, is exactly the material an agency would be examined on in a civil-rights complaint, and request_id ties it to a tokenised rider."
  - "actor_id follows rider_ref's rule: a tokenised reference, never a raw name (blueprint 10). Enforced only as non-empty -- see limitations."
  - "PostgreSQL-dependent tests skip cleanly when the instance is absent so CI stays green -- but they RAN here (0 skipped)."

failure_injections:
  - "every illegal (from, to) pair, exhaustively -- 54 of the 64, from a real chain head in each of the 8 states -> TransitionError at the STORE, both engines, with the stored history asserted unchanged after each refusal"
  - "any transition appended after any of the four terminal states -> TransitionError, both engines"
  - "a first transition that does not start at the derived entry state -> LifecycleOrderError"
  - "a transition whose from_state disagrees with the stored head -> LifecycleOrderError, nothing written"
  - "a decision time earlier than the decision it follows -> LifecycleOrderError (equal is accepted -- positive control)"
  - "recorded_at before decided_at -> BackdatedRecordError in Python, CheckViolation/IntegrityError in the database via raw SQL (with a positive control that the same statement succeeds the right way round)"
  - "a whole-second decided_at with a sub-second recorded_at -> ACCEPTED (this is the case a naive timestamp format makes the database reject)"
  - "a denial with no reason code / a negotiation with no reason code / a negotiation missing either window -> refused, nothing written"
  - "free text in place of a reason code, and an extra 'note' field -> refused"
  - "an unrecognised actor_type, and an empty actor_id -> refused"
  - "a reversed TimeWindow -> refused (equal bounds accepted)"
  - "an illegal pair forced in by raw SQL past the vocabulary CHECKs -> cannot be READ BACK as a record"
  - "cross-tenant raw scan with NO WHERE clause -> zero foreign rows (with positive control)"
  - "the store's own read with only its tenant filter deleted -> zero foreign rows (with positive control)"
  - "RESET milexium.tenant_id (GUC reads as EMPTY STRING) -> zero rows"
  - "a connection that never set the GUC -> zero rows"
  - "raw INSERT stamped with a foreign tenant -> psycopg InsufficientPrivilege, and the victim's record stays empty"
  - "unqualified DELETE FROM request_state_transitions as tenant B -> tenant A's rows survive"
  - "ALTER TABLE ... NO FORCE ROW LEVEL SECURITY -> the boundary collapses, then is restored"

compatibility_matrix:
  - "SQLite and PostgreSQL expose the same 3 methods -- names, signatures (inspect.signature equality) and ORDER BY, so both engines return the same SEQUENCE, not merely the same set"
  - "the two engines produce an IDENTICAL OutcomeExplanation for an identical history, compared whole (model_dump), not field by field"
  - "schema_v0_1.sql: one file, executed unmodified by both stores and by a bare sqlite3 connection"
  - "additive only: every table that existed before this packet still exists, asserted"
  - "no existing policy in rls_postgres.sql modified -- appended only"

status_claim:
  label: Demonstrated
  why_not_validated: >
    Validated requires consented operator data and none exists in this
    repository. Every fixture here is synthetic. Nothing in this packet is
    Validated and nothing should be described as such.
  what_demonstrated_means_here: >
    The RECORD exists, is durable on both engines, is tenant-isolated by a
    database policy, refuses illegal and self-stamping writes, and answers the
    explain question from stored rows. It does NOT mean a running pipeline
    populates it -- see limitations.

limitations:
  - "NOTHING WRITES TO IT YET. This is the largest limitation and it bounds every other claim. No production code path calls `record_transition`: `packages/decide` produces Denials that are written nowhere, `packages/connect` ingests operator trips without any state history, and `packages/api` exposes no lifecycle endpoint. All three are other agents' owned paths and were deliberately not touched. So the sentence is now true of the STORE -- 'what we have built records...' -- and is NOT yet true of any running system. If the WMATA contact asks to see this, what can honestly be shown is the store, the conformance suite and a synthetic worked example, not a live feed."
  - "`service_requests` STILL HAS NO WRITER. Confirmed by grep: the table appears in no Python file in packages/ outside the DDL. Consequently `request_state_transitions.request_id` is plain TEXT with NO `REFERENCES service_requests` -- a transition can name a request that has no aggregate row, and the record cannot today be joined to rider, zone or mobility-device context. Adding the FK would break every write until a request writer exists."
  - "'LATE' IS NOT A STATE, and the sentence names it. ServiceRequestState has no LATE member; lateness lives in `outcomes.on_time` and `RequestTimes.actual_pickup_at`, neither of which this record touches. `explain_outcome` on a trip that ran forty minutes late returns COMPLETED with no reason codes. Four of the sentence's five outcomes are covered (booked/offered/negotiated/denied); the fifth is not, and no part of this packet claims it is."
  - "THE 'REQUESTED WINDOW' IS NOT IN THE CANONICAL TIME MODEL. `RequestTimes` has `requested_at` (an instant) and negotiated window bounds, but no requested WINDOW; the requested pickup window exists only on `packages/decide.RideRequest`. This packet carries it on the transition instead. So the canonical time model and the lifecycle record currently disagree about what 'requested' means, and nothing reconciles them. If a `service_requests` writer lands later, its window figures and this record's could differ with no mechanism to detect it."
  - "NO HASH CHAIN AND NO TAMPER EVIDENCE. `decision_events` is hash-chained (prev_hash/hash) with an independent verifier; this table is not. It is append-only by discipline (no UPDATE/DELETE in packages/canonical, asserted by a source scan) and protected by RLS, but a party with direct database access can UPDATE a stored row and NOTHING WILL DETECT IT. For a record intended as evidence this is a real gap versus the ledger next to it, and it should be closed before anyone is invited to rely on the record adversarially."
  - "THE INDEPENDENT VERIFIER DOES NOT READ IT. `packages/verify/state_verifier.py` still takes an in-memory list of statuses; nothing feeds the stored chain into it. The 'independently verified' story therefore does not yet cover the lifecycle record. packages/verify is not an owned path."
  - "decided_at IS STILL THE CALLER'S ASSERTION. What is enforced structurally is that THIS SYSTEM did not invent it -- no default, no clock on the write path, no SQL default. It is NOT enforced that the value is true. A caller can pass a fabricated instant. The honest claim is 'the record was not stamped by the writer', not 'the decision time is correct', and the difference is exactly what an expert will probe."
  - "NO IDEMPOTENCY KEY. `append_event` has one; `record_transition` does not. A retried command (a timeout, an at-least-once queue) that re-issues the same transition is refused by the chain-continuity rule -- so it fails loudly rather than double-writing, which is safe -- but there is no way to make the retry a no-op returning the original row. Callers must treat LifecycleOrderError as 'possibly already applied' and re-read."
  - "NO CONCURRENCY CONTROL, AND NO CONCURRENCY TEST. The head read and the INSERT are two statements, not one locked transaction. Two writers for the same request both read head N and both build N+1; UNIQUE (tenant_id, request_id, sequence) makes the loser fail rather than corrupting the chain (verified by hand on SQLite: the second write raises IntegrityError and one row survives). But the error surfaced is a raw sqlite3.IntegrityError / psycopg UniqueViolation, NOT a typed LifecycleOrderError, and no test in this packet exercises the concurrent case."
  - "ONLY ONE RULE IS ENFORCED BY THE DATABASE. `recorded_at >= decided_at` is a CHECK; transition legality, chain continuity, decided_at monotonicity and the reason-code rules are Python-only, with a read-time re-validation as a second net. Raw SQL CAN insert an illegal transition -- it simply cannot be read back through the store. A consumer querying the table directly in SQL (a BI tool, an analyst) would see it."
  - "THE COLLATION FIX IS TESTED ON ONE COLLATION AND ONE SERVER. Correct under `English_United Kingdom.1252` (asserted live) and under byte order by construction. NOT tested under ICU, `C.UTF-8`, or any PostgreSQL other than 17.10. `test_the_collation_would_break_a_naive_timestamp_format` will FAIL loudly on a server where the naive format happens to compare correctly -- deliberate, with the reason in the test body, but it means the suite is not collation-portable in the strict sense and CI on a differently-configured cluster will need that test re-derived."
  - "NOT IN THE GENERATED CONTRACT. `contracts/generate.py` is not an owned path and was NOT run, so RequestTransition and OutcomeExplanation do not appear in contracts/jsonschema/canonical-v0.1.json, the OpenAPI surface, or the proto seed. No TypeScript or Rust client can see this entity, and the contract-drift CI gate does not cover it."
  - "NO MIGRATION PATH. Program A has no migration mechanism (Program D has core_schema_migrations.sql; ADR-0055). Both canonical stores CREATE the schema at construction, so an existing database created before this packet does not gain the table without being re-created. Any operator estate already carrying canonical data would need a hand-written ALTER."
  - "actor_id IS UNVALIDATED FREE TEXT beyond being non-empty. The docstring says tokenised-never-a-name; nothing enforces it, so a caller can put a dispatcher's real name in it. The same limitation `rider_ref` already has, restated because this table is the one most likely to be exported in a complaint response."
  - "REASON CODES ARE THE EXISTING SEVEN. No new code was added, so the vocabulary available to explain a denial is exactly what packages/decide can already produce. Whether those seven are sufficient to explain a real ADA paratransit denial is an open question this packet does not answer and cannot answer without operator data."
  - "THE EXPLAIN VIEW REPORTS THE LAST NEGOTIATION, not every one. A request negotiated twice reports the offer that finally stood; the earlier offer is in `transitions` but is not summarised. Deliberate (the rider experienced the final offer) and untested for the multi-negotiation case, because the state machine has no NEGOTIATED -> NEGOTIATED self-loop, so a second negotiation is not currently expressible at all."
  - "NO PERFORMANCE MEASUREMENT of any kind. See performance_budget."

