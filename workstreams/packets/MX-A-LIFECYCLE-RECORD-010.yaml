problem: >
  VERIFIED BEFORE BUILDING, as instructed. `packages/canonical/state_machine.py`
  is a normative TABLE of legal transitions and `check_transition` is a
  predicate over it. `packages/verify/state_verifier.py` verifies a list of
  statuses handed to it IN MEMORY. `schema_v0_1.sql` has a `service_requests`
  table with a `status` column and a `version` -- and NO STORE METHOD ANYWHERE
  IN packages/ WRITES IT (confirmed by grep: `service_requests` appears in no
  Python file outside the DDL). There was therefore no durable per-request
  history of any kind: nothing recorded that request R moved
  REQUESTED -> NEGOTIATED at 09:14:03 because the 08:00 window had no accessible
  capacity, then NEGOTIATED -> SCHEDULED at 09:14:07. The sentence we sent was a
  claim about a rulebook, described as if it were a record.

what_existed_before:
  - "SERVICE_REQUEST_TRANSITIONS + check_transition -- the normative contract, no history"
  - "verify_state_sequence -- an independent checker over an IN-MEMORY list of statuses"
  - "RequestTimes -- requested/negotiated/scheduled/predicted times kept separate, on an entity NOTHING PERSISTS"
  - "Denial(request_id, reason_codes) in packages/decide/ir.py -- produced by the solver, written nowhere"
  - "service_requests table -- DDL only, zero writers, zero readers"
  - "decision_events -- an append-only hash-chained ledger of generic events, NOT a state history (no from/to state, no decision-vs-record clock split)"

what_was_built:
  table: >
    `request_state_transitions` in schema_v0_1.sql: transition_id, tenant_id,
    request_id, sequence, from_state, to_state, decided_at, recorded_at,
    actor_type, actor_id, reason_codes, and the four window-bound columns.
    UNIQUE (tenant_id, request_id, sequence); CHECK (recorded_at >= decided_at);
    NO DEFAULT on either timestamp column. Additive: no existing table or column
    altered.
  module: >
    `packages/canonical/lifecycle.py` -- TimeWindow, RequestTransition,
    OutcomeExplanation, BackdatedRecordError, LifecycleOrderError, and the two
    PURE functions `next_transition` (the chain rules) and `explain` (the view).
    Both stores call those two functions, so the rules and the view are one
    implementation with two callers rather than two implementations that drift.
  store_methods: >
    `record_transition`, `request_lifecycle`, `explain_outcome` on BOTH
    SqliteCanonicalStore and PostgresCanonicalStore, with signatures asserted
    equal by inspect.signature and ordering asserted identical.
  state_machine_anchors: >
    SERVICE_REQUEST_INITIAL_STATE and SERVICE_REQUEST_TERMINAL_STATES, DERIVED
    from the transition table (the one state nothing transitions into; the states
    with empty allowed sets) rather than declared beside it. A second declaration
    would be a second place for the same fact to drift, and the drift would be
    silent in the worst way -- every chain anchored at the wrong state while every
    individual transition in it stayed legal.

decision_time_capture__how_it_is_enforced_structurally:
  - "1. NO DEFAULT IN THE SIGNATURE. `decided_at` and `recorded_at` are KEYWORD-ONLY arguments with no default on both stores. Not even `None` -- a `None` default invites `decided_at or now()` two lines later. Keyword-only so the two clocks can never be swapped by position. Asserted by inspect.signature for both engines and both arguments."
  - "2. NO CLOCK ON THE WRITE PATH, asserted by AST over the actual parsed source of lifecycle.py, storage.py and postgres_storage.py: no call to now/utcnow/today/monotonic/time.time anywhere in any of the three. Deliberately module-wide rather than scoped to the three methods -- a helper that reads a clock is one refactor away from the write path, and 'no clock in this file at all' is checkable in a second."
  - "3. NO DEFAULT IN THE SCHEMA. The `decided_at` column carries no SQL DEFAULT, so the DATABASE cannot stamp a row either. Asserted twice: parsed out of the DDL text, and read back out of the LIVE information_schema on PostgreSQL. Both assertions carry a POSITIVE CONTROL -- `reason_codes` DOES have a default and must come back WITH one, so a parse or a query that simply sees nothing cannot pass."
  - "4. recorded_at < decided_at IS AN ERROR with its own type (BackdatedRecordError), refused in Python before any write AND by a CHECK constraint the database enforces against raw SQL that never reaches Python."
  - "5. THE MODEL IS A SECOND NET. RequestTransition re-validates the clocks, the transition legality and the reason-code rules in its own validator, so a record built anywhere -- a fixture, a future importer, an evidence-pack reader -- cannot hold a self-stamping or illegal history either. This is also what makes the READ path a net: a row forced in by raw SQL cannot be read back as a valid record."

design_calls_recorded:
  - "THE CHAIN STARTS AT THE MACHINE'S ENTRY STATE, so `from_state` is mandatory on EVERY row and there is no nullable-genesis special case. A `from_state IS NULL` first row would be a row `check_transition` could not be applied to -- an escape hatch in the one place the packet says there must not be one. Instead the store requires the first transition to start at SERVICE_REQUEST_INITIAL_STATE (derived), and every row without exception is a real (from, to) pair the contract judges."
  - "SEQUENCE IS ASSIGNED BY THE STORE FROM WHAT IS ALREADY STORED, never supplied by the caller. Two writers cannot both believe they are writing position 3. It is also what makes the numbering per-tenant: the head read is tenant-scoped (and on PostgreSQL policy-scoped), so two operators sharing a request_id each get their own 1, 2, 3 -- a globally-derived counter would collide on the UNIQUE constraint under RLS and would leak the other operator's activity through the gaps in one's own."
  - "THE WINDOWS LIVE ON THE TRANSITION, not on a request row. `RequestTimes` is the natural home and NOTHING PERSISTS IT -- there is no writer for `service_requests`. Carrying the requested and negotiated windows on the negotiation transition is also the more honest shape for a decision-time record: it stores the offer as it stood AT THAT MOMENT, which is what the negotiated-vs-requested delta has to be computed from. TimeWindow is one object rather than two loose timestamps so a half-recorded window is impossible."
  - "A NEGOTIATION MUST CARRY BOTH WINDOWS AND A REASON CODE. A negotiation is by definition 'you asked for X, we offer Y, because Z'. Without X the delta a rider actually experienced becomes uncomputable FOREVER, because nothing else in the schema records what was originally asked for at the moment the offer was made. This is a real constraint on callers and it is deliberate: `RideRequest` already carries a mandatory pickup window, so the value is always available in this system."
  - "A DENIAL MUST CARRY A REASON CODE. 'Denied, reason unrecorded' is the single outcome this packet exists to make impossible. Mirrors Denial.reason_codes(min_length=1) in packages/decide/ir.py rather than inventing a second rule."
  - "DECISION TIMES DO NOT GO BACKWARDS along a chain (>= is allowed; an automated scheduler really does reach two conclusions in the same microsecond). Without this, a back-dated row could make a denial look as though it were decided before the negotiation that caused it -- a rewritten history composed entirely of individually-legal rows."
  - "FIXED-WIDTH TIMESTAMPS FOR THIS TABLE ONLY, and this is a FINDING rather than a style choice. See collation_finding below."
  - "TWO ERROR TYPES, not one. TransitionError means the CONTRACT forbids the move; LifecycleOrderError means the caller's view of where the request is disagrees with what is stored (a lost update, a replay, two writers racing). The remedies are different -- re-read the chain vs. re-model the machine -- so collapsing them would send callers to the wrong fix."
  - "THE ACTOR VOCABULARY IS decision_events' ('system' | 'human'), not a new one. A third value would mean 'who decided' no longer means the same thing in the lifecycle record as in the decision ledger, and an evidence pack drawing on both would be silently comparing two vocabularies."
  - "NO TAMPER HELPER. decision_events has a deliberate test-only `tamper_with_row` UPDATE. This table has none, so 'append-only' needs no exception clause -- asserted by a source scan over all of packages/canonical for any UPDATE or DELETE naming the table."

collation_finding:
  what: >
    `CHECK (recorded_at >= decided_at)` is a TEXT comparison, and on PostgreSQL a
    TEXT comparison runs under the DATABASE COLLATION, not byte order. This
    repository's dev instance runs `English_United Kingdom.1252`. Under it,
    '2026-07-01T09:14:03.250000+00:00' >= '2026-07-01T09:14:03+00:00' evaluates
    to FALSE -- the wrong way round -- because punctuation and digits are weighted
    differently.
  consequence_if_missed: >
    The repository's everyday `datetime.isoformat()` rendering elides a zero
    fraction. A perfectly ordinary row -- a whole-second decision time written
    down a quarter of a second later, which is the COMMON shape because operator
    exports state times to the second -- would have been REJECTED by the CHECK,
    and a genuinely backdated row would have been ACCEPTED. Verified on the live
    server, both directions.
  fix: >
    `lifecycle.py:iso_fixed_utc` always emits six fractional digits and the
    literal `+00:00`, so every stored value has identical punctuation in
    identical positions and the comparison reduces to a digit-by-digit one that
    is correct under any collation. Applied ONLY to this table's timestamps -- no
    existing column changes format.
  pinned: >
    `test_the_collation_would_break_a_naive_timestamp_format` asserts BOTH that
    the fixed-width form compares correctly on the live server AND that the naive
    form does not, so the format cannot be "simplified" back without the reasoning
    being re-derived. Its failure mode is documented in the test itself: a failure
    means the server's collation changed, not that the code broke.

mutation_findings:
  method: >
    Each mutation was applied to the source, the specific test that claims to
    cover it was run, and the source was restored. 17 mutations, all RED.
  all_red:
    - "M1  decided_at acquires a default                        -> RED"
    - "M2  the write path reads a clock                          -> RED"
    - "M3  legality not enforced when building the record        -> RED"
    - "M3b the read layer no longer re-checks legality           -> RED"
    - "M4  the SQL CHECK on the two clocks is removed            -> RED"
    - "M5  timestamps revert to isoformat                        -> RED (only after the test was fixed -- see below)"
    - "M6  decided_at gains a SQL DEFAULT                        -> RED (both the DDL and the live-database assertions)"
    - "M7  RLS is ENABLE-only, no FORCE                          -> RED (3 tests)"
    - "M8  the chain counter ignores the tenant                  -> RED"
    - "M9  a negotiation no longer needs the requested window    -> RED"
    - "M10 an absent window delta is reported as zero            -> RED"
    - "M11 decision times may go backwards along a chain         -> RED"
    - "M12 a denial no longer needs a reason code                -> RED"
    - "M13 the first transition need not start at the entry state-> RED"
    - "M14 the entry state is declared instead of derived        -> RED"
    - "M15 the postgres write no longer scopes its session       -> RED"
    - "M16 explain reports only the final transition's codes     -> RED"
    - "M17 the explain view ignores the negotiated window        -> RED"
  the_one_that_came_back_green_first: >
    M5 initially came back GREEN. Per the packet's own instruction the MUTATION
    was investigated first -- and it was correct. The TEST was wrong. Its
    original version only exercised a pair where BOTH timestamps carry a non-zero
    fraction ('...03.500000' vs '...03.750000'), and that is precisely the shape
    the collation defect does NOT touch: two same-shaped strings compare
    correctly even under the bad collation. The test was asserting the one case
    the bug cannot reach. It is now parametrised over five shapes, three of which
    have a whole-second `decided_at` (the common real-world shape), and M5 is
    RED. This is recorded because it is the seventh near-miss of the class this
    repository keeps finding -- a test that passes while proving nothing -- and it
    was caught by the mutation discipline, not by review.

