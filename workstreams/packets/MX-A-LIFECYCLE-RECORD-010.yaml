result: >
  112 tests, 0 skipped, 0 failed. PostgreSQL + RLS RAN against native PG17.10
  (not skipped): ENABLE/FORCE read out of pg_class, exactly one policy read out
  of pg_policy, the policy's own text read back and refused if written as an
  IS NOT NULL guard, cross-tenant deny with positive control, the RESET /
