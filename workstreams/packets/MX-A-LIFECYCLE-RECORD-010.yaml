objective: >
  Make one sentence we have already put in writing to a former WMATA
  accessibility chief literally and demonstrably true, end to end: that the
  system "records why each trip received the outcome it did -- booked, offered,
  negotiated, denied or late -- created at the moment of the decision rather
  than reconstructed afterwards." Program A.

