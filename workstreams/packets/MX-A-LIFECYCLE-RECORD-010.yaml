  - ADR-0003   # append-only; a correction is a new record, never a mutation
  - ADR-0004   # both stores expose the same method contract
  - ADR-0018   # RLS: ENABLE *and* FORCE, keyed on the milexium.tenant_id GUC
  - ADR-0037   # a tenant-scoped table without a policy is a defect, not a to-do
