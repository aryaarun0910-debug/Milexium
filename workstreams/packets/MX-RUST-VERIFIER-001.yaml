id: MX-RUST-VERIFIER-001
status: completed
completed_date: "2026-07-24"
objective: >
  An independent Rust implementation of the evidence hash-chain verifier with
  byte-for-byte differential parity against the Python reference -- the first
  polyglot proof crate, strengthening the verifiability moat.
owned_paths: [Cargo.toml, Cargo.lock, crates/verifier/, architecture/decisions/0028-rust-verifier-parity.md]
read_only_dependencies: [packages/canonical/events.py, packages/verify/hash_chain_verifier.py, contracts/jsonschema/]
normative_contracts: [architecture/decisions/0003-append-only-hash-chained-event-log.md, ADR-0026]
required_outputs: [crates/verifier/src/{lib,main}.rs, conformance/property-tests/test_rust_verifier_parity.py]
acceptance_commands: ["cargo test --all", "cargo fmt --all --check", "cargo clippy --all-targets -- -D warnings", "py -3 -m pytest conformance/property-tests/test_rust_verifier_parity.py -v"]
security_and_privacy_invariants:
  - "canonical_json + compute_hash byte-identical to Python (incl. ensure_ascii UTF-16 surrogate pairs)"
  - "differential test asserts identical violation tuples on clean/tampered/non-ascii/multi-aggregate chains"
failure_injections: ["payload tamper, deleted-middle gap, forged-hash chain break -- Rust and Python agree on every violation"]
evidence_to_emit: ["11 Rust unit + 6 Python differential tests; 461 total suite"]
known_limitations: ["exotic float formatting not covered (no float payloads in the domain) -- must extend parity contract before float payloads enter"]
compatibility_matrix: ["differential test skips cleanly when cargo absent"]
downstream_consumers: [future Rust data-plane crates (each ships a differential parity test, ADR-0026)]
