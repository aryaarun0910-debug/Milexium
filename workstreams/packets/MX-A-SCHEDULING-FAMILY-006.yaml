scope_honesty:
  what_this_is: >
    The canonical HOME for the scheduling concepts, proven durable, isolated and
    portable.
  what_this_is_NOT: >
    A TODS adapter. NO TODS SUPPORT IS CLAIMED. Nothing in packages/connect was
    touched, no TODS file is parsed anywhere in this repository, and no TODS
    fixture exists. TODS and NeTEx remain **Specified**.
  status_label: >
    Demonstrated at most -- synthetic scheduling fixtures only. No operator crew
    or block data exists in this repository (ADR-0038), so nothing here is
    Validated.
  what_a_tods_adapter_would_still_need:
    - "A reader for the TODS feed itself: it is a GTFS-style set of CSV files in a zip (deadhead, deadhead-time, and run/piece tables, plus the GTFS files they extend), not a single document -- so the adapter needs multi-file parsing plus GTFS-companion resolution, which no existing Connect adapter does. Every current adapter reads ONE table or ONE protobuf message. The exact file/field list must be read off the published TODS revision at build time rather than assumed."
    - "A SourceAdapter implementation against the ADR-0007 contract, with the quarantine + semantic-loss discipline the sibling adapters keep, plus mapping tests and adversarial malformed-input tests."
    - "Block boundary derivation. TODS does not state pull_out_at / pull_in_at directly: a block's extent is implied by its first and last associated trip/deadhead times. Block.pull_out_at and pull_in_at are therefore DERIVED, and the derivation rule (and what to do when a block has deadheads but no revenue trip) is an adapter decision that must be recorded, not assumed."
    - "A classification map from TODS deadhead semantics onto DeadheadKind. TODS identifies a deadhead largely by its from-trip / to-trip linkage, so pull_out / pull_in / interline are inferred from which of the two is absent rather than read off a named type field -- an inference the adapter must state explicitly, with anything ambiguous landing in 'other' rather than being guessed. If the published revision does carry an explicit type, the map is a lookup instead, but it is still the adapter's decision to record."
    - "GTFS calendar resolution to turn service_id + a service date into concrete UTC instants. TODS/GTFS times are local wall-clock and may exceed 24:00:00 (a 25:10:00 pull-in is the next morning); the canonical entities are strictly UTC-aware, so the adapter needs the agency timezone and the >24h rollover rule. This is the single largest fidelity risk in a TODS adapter and it is entirely in the adapter, not in the canonical model."
    - "A rights/manifest record through the estate pipeline (ADR-0013) for whatever TODS sample is acquired, and a real published TODS feed to acquire -- adoption is currently thin, so sample availability is itself a risk to check before committing."
    - "Fields this family deliberately does NOT model, each needing its own decision: TODS shapes/geometry for deadhead paths (a PostGIS concern, and postgis_postgres.sql is another packet's path), run_events at sub-piece granularity, and operator work rules / labour-agreement constraints (a Program F policy concern, not canonical state)."
    - "NeTEx is a further step again: an XML profile far larger than TODS, whose scheduling subset maps onto this family but whose fare, network topology and accessibility parts do not, and would surface their own canonical gaps."

