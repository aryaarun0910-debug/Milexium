problem: >
  ADR-0031 found the canonical model entirely rider-request-keyed and therefore
  homeless for operational data. ADR-0035 closed the TELEMETRY half
  (VehicleObservation / StopTimeObservation -- what a vehicle was OBSERVED doing)
  and explicitly left the other half open, recording that "the scheduling
  operational family TODS needs (Block/RunCut/PieceOfWork) is a different family
  again and remains deferred". That deferral is the whole reason TODS and NeTEx
  are still Specified: not because the adapters are hard, but because runs,
  blocks, pieces-of-work and deadhead segments had nowhere canonical to land, so
  an adapter would have routed most of each standard to semantic loss. The same
  gap made the deadhead teardown (packages/replay/teardown.py) un-re-derivable
  from stored state -- it could only ever be handed segments built in memory from
  a Connect-layer export.

entities_designed:
  Block: >
    One vehicle's continuous work between pull-out and pull-in -- the vehicle's
    unit of work, and the parent a DeadheadSegment belongs to and a RunPiece is
    worked on. Own key `block_id` (BlockId); source refs `block_ref` (GTFS
    trips.block_id / TODS), `service_ref`, `vehicle_ref`, `garage_ref`;
    valid time `pull_out_at` / `pull_in_at`, transaction time `recorded_at`.
    Validator: a vehicle cannot return before it leaves.
  RunPiece: >
    One continuous piece of an operator's run (TODS runs_pieces). ONE ROW PER
    (run, piece), NOT per run: TODS gives a run no attribute of its own -- the run
    is the grouping key its pieces share -- so a separate `runs` table would be an
    aggregate holding nothing but an id, and a second place for the same fact to
    disagree. The run's identity therefore lives on every piece as `run_ref`; a
    single-piece run is exactly one row; a piece whose export named no run is
    unattributable and says so. Carries `piece_ref`, `piece_sequence`,
    `operator_ref`, an optional canonical `block_id` plus the source's own
    `block_ref`, `start_type`/`end_type` (report / pull-out / relief / pull-in as
    the source writes them), and started/ended/recorded times.
  DeadheadSegment: >
    One non-revenue movement -- pull-out, pull-in, interlining, relief,
    repositioning. Shaped for its waiting consumer: `started_at` / `ended_at` /
    `run_ref` are deliberately packages.replay.teardown.VehicleSegment's OWN field
    names, so a stored segment maps onto a teardown field-for-field instead of
    being translated, and `run_ref=None` keeps the teardown's absence semantics
    exactly (unattributable, never guessed onto a neighbouring run).
    `deadhead_type` is the one mandatory descriptive field.

design_calls_recorded:
  - "REQUEST-INDEPENDENCE IS STRUCTURAL, not conventional. `_Canonical`'s extra='forbid' means a `request_id` cannot be attached to any of the three -- ADR-0031's synthetic foreign-key-to-a-row-that-does-not-exist is impossible here rather than merely discouraged. Asserted two ways: construction raises, and no field whose name contains 'request' exists on any of the three models."
  - "SOURCE REFS STAY PLAIN STRINGS (ADR-0035's design call 1, applied unchanged). block_ref / vehicle_ref / garage_ref / run_ref / operator_ref name an EXTERNAL agency's entities, not Milexium aggregates; typing vehicle_ref as VehicleId would assert a canonical Vehicle row no operator export creates, and would additionally force real identifiers like 'B-101' through UUIDv7 validation they cannot satisfy."
  - "THREE ID KINDS, not one shared kind -- the deliberate divergence from ADR-0035. ObservationId is shared by the two telemetry entities because neither references the other. The scheduling family DOES reference itself (RunPiece.block_id, DeadheadSegment.block_id), so one opaque type would let a deadhead id be passed where a block id belongs and insert a dangling reference: exactly the 'a VehicleId where a DriverId belongs' error ids.py exists to reject."
  - "deadhead_type IS A CLOSED LITERAL, unlike the telemetry family's current_status / schedule_relationship which keep the source string. Those are lossless detail; this is the field a consumer BRANCHES on, so an unrecognised value would be a silently unhandled branch, not detail. 'other' is an honest landing place for an unclassified movement -- it counts the time without guessing 'interline' and inflating the one number an interlining change is measured by. It is a Literal in entities.py rather than an enum in vocab.py because the portable DDL mirrors it as CHECK ... IN (...) (ADR-0002 bans ENUM types), and a conformance test pins the two vocabularies equal in both directions."
  - "TIME ORDERING IS REJECTED AT CONSTRUCTION. A reversed pair is a parsing artefact that yields a NEGATIVE duration, which would SUBTRACT from every derived total -- and the headline figure of a deadhead teardown is exactly such a derivation. Equal timestamps are accepted (a zero-second relief is degenerate but real); only end < start is impossible."
  - "operator_ref IS A PERSON REFERENCE and follows ServiceRequest.rider_ref's rule: a tokenised badge/signup reference, never a name (blueprint 10). extra='forbid' makes that a boundary -- an ingest carrying the operator's actual name alongside the token fails at construction."
  - "THE PARENT-BLOCK REFERENCE IS RESOLVED UNDER THE ACTING TENANT before any write, in both stores, raising the existing CrossTenantWriteError. A foreign key alone does NOT keep it inside the tenant: PostgreSQL evaluates referential integrity with RLS bypassed by design, and the tables' WITH CHECK clauses constrain only tenant_id. Same shape as append_decision_alternative's parent-run resolution."
  - "RLS LANDED IN THE SAME PACKET AS THE TABLES. The observation tables sat unguarded for two packets because they were added to schema_v0_1.sql after rls_postgres.sql was written, and ADR-0037 had to fix it retroactively. Not repeated: a new tenant-scoped table and its policy land together or neither lands."

