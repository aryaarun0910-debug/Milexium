performance_budget:
  note: >
    No hot path introduced. Writes are single-row INSERTs and reads are single
    tenant-filtered SELECTs, the same shape as record_outcome / outcomes. The new
    test module runs in ~86s, almost entirely PostgreSQL schema setup/teardown
    (one disposable mx_<uuid> schema per test, per ADR-0008).

security_and_privacy_invariants:
  - "All three tables are tenant-scoped and get ENABLE **and** FORCE row-level security. The application role OWNS them and a table owner bypasses RLS by default, so ENABLE alone would be a false green (ADR-0018)."
  - "The deny-all default is proven for the case that ACTUALLY OCCURS: current_setting(name, true) returns NULL only when the GUC was NEVER set; after a RESET -- a pooled connection handed back and reused -- it returns the EMPTY STRING. The test asserts the GUC reads as '' *first*, then that zero rows come back, so it is not silently proving the NULL branch. These policies survive it only because tenant_id = '' is false for any real UUID, which is incidental and therefore pinned."
  - "run_pieces.operator_ref is a PERSON reference: tokenised, never a raw name (blueprint 10 data minimisation). The three tables together are an operator's crew roster and depot geography -- who worked which vehicle, out of which garage, at what hour -- commercially sensitive to the agency and personal to the driver."
  - "schema_v0_1.sql stays portable: TEXT ids, ISO-8601 UTC strings, CHECK ... IN (...) instead of ENUM. Asserted by executing the file's actual bytes on a bare sqlite3 in-memory connection, plus a named-construct regression guard."
  - "PostgreSQL-dependent tests skip cleanly when the instance is absent so CI stays green -- but they RAN here (0 skipped)."

failure_injections:
  - "a rider request key attached to any of the three entities -> rejected at construction (all 3)"
  - "reversed time ordering (pull-in before pull-out / end before start) -> rejected at construction (all 3)"
  - "an unrecognised deadhead kind ('pull-out' with a hyphen) -> rejected, not stored verbatim"
  - "a run piece or deadhead segment naming ANOTHER TENANT's block -> CrossTenantWriteError on both engines, and nothing is written"
  - "cross-tenant raw scan with NO WHERE clause of blocks / run_pieces / deadhead_segments -> zero foreign rows"
  - "RESET milexium.tenant_id (GUC reads as the EMPTY STRING) -> zero rows, all three tables"
  - "raw INSERT stamped with a foreign tenant id -> psycopg InsufficientPrivilege, all three tables"
  - "ALTER TABLE ... NO FORCE ROW LEVEL SECURITY -> the boundary collapses (proving FORCE is load-bearing, not decorative), then is restored"
  - "an unmodelled personal field (operator_name) smuggled onto a RunPiece -> rejected"

