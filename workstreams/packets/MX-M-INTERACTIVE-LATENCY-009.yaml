  - "ADR-0042: the OpenAPI document is the contract. A latency fix that moved the schema would be a breaking change wearing a performance costume."
  - "ADR-0019 / blueprint-01: a teardown is a MODELLED localisation. A cache must never change the answer -- proved byte-for-byte, not asserted."
  - "ADR-0026: this packet does not re-open the polyglot question. It is the surface fix ADR-0056 named."
