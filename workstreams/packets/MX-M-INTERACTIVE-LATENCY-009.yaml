id: MX-M-INTERACTIVE-LATENCY-009
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
maturity: Demonstrated
adr: null   # the orchestrator writes the ADR; this packet supplies the measurements and the limitations
extends_adrs:
  - architecture/decisions/0056-teardown-scale-measurement.md (the evidence; teardown.py MEASURED, never modified -- still byte-identical after this packet)
  - architecture/decisions/0042-http-sdk-surface.md           (the surface the defect lives on)
  - architecture/decisions/0039-deadhead-teardown.md          (the analysis, read-only)
  - architecture/decisions/0026-polyglot-triggers.md          (the trigger that did NOT fire; unchanged)
result: >
  Both open entries closed, and MEASURING THE SURFACE MOVED THE DEFECT. ADR-0056
  recorded "46 s synchronous on the interactive surface". On this machine the
  ACCEPTED HTTP path was never 46 s -- MAX_TEARDOWN_SEGMENTS already bounded it at
  1.53 s for a 20,000-segment (2.37 MB) body. What was actually broken was the
  REFUSAL: the segment-count guard sits inside the handler, so FastAPI validated
  every segment BEFORE the ceiling was consulted, and a 600,000-segment body --
  the top of ADR-0056's own operator-year band, the exact request that ADR invites
  -- burnt 7.4-31.3 s of server CPU to compute nothing and answer 413. Fixed with
  a pre-parse byte guard (295-411x faster) and a content-addressed result cache
  keyed on the raw request bytes (33-55x on an identical repeat of a
  20,000-segment body). Ranges, not points, because the identical measurement run
  twice on the same code swung 4.2x with nothing but how busy the laptop was --
  ADR-0056 warned of 2.8x and this beat it. THE COLD PATH IS UNCHANGED: after was
  1.30x slower on the busy run and 0.89x (faster) on the quiet one, bracketing
  1.0 in both directions. The cache does add one 26.9 ms SHA-256 per miss, which
  is arithmetic this instrument cannot resolve. Async job+poll was
  REJECTED with three reasons (no auth to hand a job id to; a GIL-bound teardown
  in a BackgroundTask blocks every other request, i.e. strictly worse; and 1.7 s
  is not the defect). packages/replay/teardown.py is byte-identical. The stale TS
  client was regenerated, both CI drift gates were proven to go RED and back to
  GREEN by mutation, and a local half was added in BOTH languages so drift now
  fails on a developer's machine and not only on a runner. 34 new tests
  (28 pytest + 6 node); 11 mutation checks, every one GREEN -> RED -> restored.
  Two of the 11 came back NOT PROVEN on the first pass and both were real: one
  mutation was a no-op (it deleted only half the guard), and the other exposed
  that `test_a_refusal_is_never_cached` was asserting an UNREACHABLE branch --
  refusals are raised past the caching wrapper entirely -- so the test was
  rewritten to assert that mechanism rather than its symptom.
objective: >
  Close the two entries left open under "Still open after this tranche": the
  teardown latency ADR-0056 found on the ADR-0042 HTTP/SDK surface, and the
  stale generated TypeScript client with no drift check covering it. Design the
  latency fix AT THE SURFACE -- ADR-0056 already proved the analysis is linear and
  that a rewrite would optimise the wrong thing (~50% of its runtime is the
  optional audit fingerprint), so any change to packages/replay/teardown.py would
  contradict the ADR's own central claim that it was measured, not modified.

