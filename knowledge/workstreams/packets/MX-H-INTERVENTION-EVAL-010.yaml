id: MX-H-INTERVENTION-EVAL-010
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
result: >
  73 new tests (test_intervention_eval.py 64, test_intervention_ntd.py 9), 0
  skipped locally; 20/20 mutations caught. Demonstrated on the REAL FTA NTD
  monthly demand-response panel with the single most useful negative result this
  program has produced: on a PLACEBO cut (2016-01, where NTD records no
  intervention of any kind), the uncontrolled before/after correctly declines to
  call a +0.047 trips/vehicle-revenue-hour movement (p=0.195), while
  difference-in-differences against 34 real peer agencies -- the STRONGER design
  -- returns +0.129 at p=0.0072. The controlled estimate is bigger and more
  "significant" for an intervention that did not happen, because the treated
  agency was reverting to its own long-run mean while its peers drifted down.
  The evaluator refuses to attribute either, and the refusal comes from the
  regression-to-the-mean confounder rather than from the p-value.
objective: >
  A senior paratransit consultant working on newly-installed AI scheduling
  systems wrote: "there is insufficient new data to support any conclusion that
  the new software has done any better, but I am persuaded that they are on the
  right track" -- while also reporting those systems "yielded improved on-time
  performance; reduction in cost due to greater efficiency". Both halves are true
  at once and the gap between them is the product. Build an HONEST before/after
  intervention evaluation: a pre-registered pre/post comparison over an
  operational metric, difference-in-differences where a peer control exists, and
  -- the substance -- every confounder named in a structured field with a status
  vocabulary that has no "ruled out" value, so the artifact states what it cannot
  support instead of burying it.
