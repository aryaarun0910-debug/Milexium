id: MX-B-TLC-ADAPTER-002
status: completed
completed_date: "2026-07-23"
objective: >
  Implement a second, structurally different Connect adapter against real
  (not fictional) NYC TLC FHVHV trip data, proving cross-source
  heterogeneity onto the same ServiceRequest contract.
owned_paths:
  - app/connect/tlc_trips.py
  - knowledge/architecture/decisions/0011-tlc-adapter-design-decisions.md
read_only_dependencies:
  - app/canonical/ (ServiceRequest, ids, time, state_machine -- schema only)
  - app/connect/adapter.py (SourceAdapter contract, not edited)
  - realdata/raw_tlc/*.parquet (read only, e.g. via duckdb LIMIT queries -- no full-file loads)
normative_contracts:
  - blueprint/03-connect-and-standards.md (expansion plan)
  - blueprint/01-north-star-and-boundaries.md, "unavoidable" test #1
inputs_and_fixtures:
  - evidence/conformance/fixtures/builders_connect_tlc.py
required_outputs:
  - app/connect/tlc_trips.py
  - evidence/conformance/fixtures/test_connect_tlc_trips.py
  - evidence/conformance/adversarial/test_connect_tlc_malformed_rows.py
acceptance_commands:
  - "py -3 -m pytest evidence/conformance/fixtures/test_connect_tlc_trips.py evidence/conformance/adversarial/test_connect_tlc_malformed_rows.py -v"
performance_budget: {}
security_and_privacy_invariants:
  - "rider_ref is a synthetic non-joinable per-row placeholder -- FHVHV has no rider identifier and none is fabricated to look like one"
failure_injections:
  - "null request_datetime -> quarantined"
  - "TLC placeholder zone codes 264/265 -> quarantined, not treated as real zones"
  - "invalid wav_request_flag value -> quarantined"
  - "unmapped 25th column (cbd_congestion_fee, real observed schema drift) -> unmapped_extension semantic loss, not an error"
compatibility_matrix: []
evidence_to_emit:
  - "12 passing tests, including a real-sample-from-disk test (skips cleanly if the corpus is absent)"
forbidden_interface_changes: []
upstream_blockers: []
downstream_consumers:
  - Future adapters needing a template for a real (non-fictional) heterogeneous source
