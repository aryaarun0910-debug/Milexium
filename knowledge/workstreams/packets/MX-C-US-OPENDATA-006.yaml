id: MX-C-US-OPENDATA-006
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
adr: none — this packet acquires under the EXISTING governance (blueprint 17,
  ADR-0032/ADR-0036); it introduces no new mechanism, so it writes no ADR.
objective: >
  Quantify what US open transit/mobility data is actually available and
  rights-clean, then acquire the high-value rights-clean subset THROUGH the
  existing governed pipeline (manifest -> free-space guard -> quarantine ->
  checksum -> content-addressed promotion -> catalog record), mirrored into the
  free local MinIO. Prioritise real bytes on disk over exhaustive cataloguing,
  and be honest where a source is large but low-value for demand forecasting.
owned_paths:
  - data/US_OPEN_DATA_SURVEY.md                                    # the survey
  - data/catalog/ntd-monthly-ridership-all-modes.manifest.json
  - data/catalog/ntd-service-opex-by-mode-timeseries.manifest.json
  - data/catalog/ntd-gtfs-weblinks.manifest.json
  - data/catalog/mobility-database-catalog.manifest.json
  - data/catalog/ntm-stops-national.manifest.json
  - data/catalog/ntm-routes-national.manifest.json
  - data/catalog/*.acquired.json                                   # the six acquired-records
  - evidence/conformance/property-tests/test_us_opendata_manifests.py
  - knowledge/workstreams/packets/MX-C-US-OPENDATA-006.yaml
  - data/raw/public/**                                             # gitignored raw zone acquire() writes to
read_only_dependencies:
  - app/estate/manifest.py    (AcquisitionManifest + load_manifest — import only, do NOT modify)
  - app/estate/acquire.py     (acquire(..., back_with_object_store=True) — call only, do NOT modify)
  - app/estate/catalog.py     (free_space_report — call only)
  - data/README.md                 (zone layout; NOT edited by this packet)
  - _legacy/third_party/VENDORING_PROCESS.md (the "nothing lands blindly" gate — applied, not amended)
normative_contracts:
  - blueprint/17 (governed estate; every retained byte carries a manifest with
    declared rights; raw objects immutable and content-addressed)
  - ADR-0032 / ADR-0036 (MinIO-backed raw zone; local disk authoritative, object
    store additive and content-addressed under the same sha256)
required_outputs:
  - data/US_OPEN_DATA_SURVEY.md — measured, source-cited survey of the US open
    transit data landscape with per-source licence, commercial-use position,
    volume, and an honest usefulness verdict
  - six committed acquisition manifests with real, non-placeholder rights
  - six acquired-records proving the objects passed the governed pipeline
  - evidence/conformance/property-tests/test_us_opendata_manifests.py
acceptance_commands:
  - "py -3 -m pytest evidence/conformance/property-tests/test_us_opendata_manifests.py -q  # 31 passed"
  - "py -3 -m pytest app/ evidence/conformance/ -q  # whole suite still green, baseline preserved"
security_and_privacy_invariants:
  - "HARD CONSTRAINT: free sources only. NO paid API keys, NO paid cloud, NO
    registration. Transitland's REST API was verified to return
    {\"error\":\"Unauthorized\"} without a key and was therefore SKIPPED and
    recorded in the survey rather than quietly omitted. Every acquired source
    downloads with plain unauthenticated curl."
  - "Rights are stated, not assumed. Each acquired source's licence was verified
    at acquisition time from a machine-readable field or the licence text
    itself: USDOT Socrata licenceId=USGOV_WORKS for the three NTD tables, the
    usa.gov/publicdomain/label/1.0 licence field on the data.gov records for the
    two National Transit Map layers, and both the repository LICENSE file and
    the GitHub metadata API (spdx_id Apache-2.0) for the Mobility Database
    catalogue. 'US federal work therefore public domain' is asserted per-source
    with its evidence, never as a blanket default."
  - "Rights-encumbered sources were surveyed and REFUSED. The CTA developer
    licence was fetched and read in full; its purpose limitation ('sole purpose
    of assisting mass transportation riders'), revocability, no-resale clause
    and deletion-on-termination make it unusable for a decision runtime other
    software integrates, so CTA GTFS was NOT acquired. Divvy (bespoke Lyft data
    agreement) likewise skipped pending review."
  - "No secrets touched. MinIO credentials stay in the gitignored
    platform/infra/compose/.env and were resolved only through the existing
    acquire(back_with_object_store=True) seam."
  - "No raw data committed. data/raw/ is gitignored by the pre-existing rules in
    .gitignore; only the small JSON manifests and acquired-records under
    data/catalog/ enter git, which is exactly the governance record blueprint 17
    requires to travel with the code."
  - "app/** untouched. Two objects promote with a .bin extension because
    their download URLs carry a query string and acquire() derives the suffix
    from the URL path; this is DOCUMENTED in their manifests rather than fixed
    by editing app/estate/acquire.py, which this packet does not own."
failure_injections:
  - "Placeholder rights: test_rights_statement_is_real_not_a_placeholder is
    deliberately STRICTER than manifest.rights_are_declared(), which only rejects
    the literal words unknown/tbd/todo/?. A rights field reading 'open data'
    would pass the base gate and still tell an auditor nothing, so the test also
    requires a named licence family and an explicit commercial-use position."
  - "Silent corruption / truncated re-download: the acquired object's sha256 and
    byte count are recomputed from disk and compared to the catalog record, and
    the promoted filename is asserted to carry its own content address."
  - "Governance-record drift: the acquired-record's rights statement, zone and
    source_url are asserted equal to the manifest's, so a post-hoc manifest edit
    cannot leave two disagreeing versions of the ledger."
  - "Fresh clone with no bytes on disk: raw zones are gitignored, so the checksum
    tests skip cleanly when the acquired-record exists but the object does not,
    and when a manifest is declared but not yet acquired (the legitimate 'queued'
    state in data/README.md)."
compatibility_matrix:
  - "Six datasets acquired through the real pipeline against live sources; all
    six mirrored into the running MinIO with object_store_key == sha256"
  - "All twelve manifests now in data/catalog/ (six pre-existing + six new) load
    through load_manifest -- the new rows do not break the existing ledger"
evidence_to_emit:
  - "Acquired: 252.4 MB across six objects, 1,531,677 data rows, all rights-clean
    (five US federal public domain, one Apache-2.0). Estate retained total
    0.2856 GB; ~1.7% of the 15 GB budget used, deliberately."
  - "Survey headline: 3,362 catalogued mobility feeds worldwide; 1,166 US GTFS
    static entries (825 active, 816 keyless) and 445 US GTFS-Realtime entries
    (413 active, 246 keyless: 77 vp / 78 tu / 80 sa / 11 combined) across 768 US
    providers and 53 subdivisions. Only 123 of 825 active US static feeds declare
    any licence URL and only 6 declare a standard open licence."
  - "Demand-model breadth gain, quantified: the repo previously held only the
    DR/DT slice of NTD monthly ridership (151,991 rows, 637 agencies). The full
    table is 368,937 rows across 834 agencies, 293 months (Apr 2002 - Sep 2025)
    and 19 modes -- +216,946 rows (+143%) and +197 agencies, including 143,804
    fixed-route bus rows."
  - "Join coverage proved on the acquired bytes: 585 of 834 NTD-ridership
    agencies have National Transit Map stop geometry, 565 have route geometry,
    590 have an FTA-registered GTFS weblink."
  - "test counts: 31 passed in the new file; full suite unchanged."
upstream_blockers: []
downstream_consumers:
  - Program E forecasting (the NTD all-modes panel is the cross-agency
    pretraining corpus expansion; realdata/TRANSFER_RESULTS.md measured a 15%
    MAE reduction from exactly this mechanism on a 3-panel corpus)
  - Program B Connect (mobility-database-catalog + ntd-gtfs-weblinks are the
    governed inputs to choosing which agency feed to certify next)
  - Canonical entity work (this packet surfaces, and declines to invent, the
    absence of Stop, Route and aggregate-ridership canonical entities)
notes: >
  Scope discipline is the point of this packet, so what was deliberately NOT
  pulled is recorded as carefully as what was. Skipped with reasons in
  data/US_OPEN_DATA_SURVEY.md: OSM us-latest (11.5 GB, and no routing engine has
  cleared the _legacy/third_party/ vendoring gate, so it would sit inert); NOAA GHCN
  (~12 GB, and realdata/WEATHER_ABLATION_RESULTS.md already measured weather at
  within-noise value on this repo's own holdout); Census LODES (>100 GB, real
  spatial value but essentially no temporal signal for lag-dominated time-series
  models); NHTS (cross-sectional national survey, no agency identity, no time
  index); NYC TLC fhv (~3 GB legacy segment; the fhvhv segment that matters is
  already held at 39.9 GB); Divvy and CTA GTFS (rights not clean); ~50 further
  NTD annual tables (facilities, employees, funding -- asset-management data,
  not demand). Four of the six acquisitions (weblinks, catalogue, NTM stops,
  NTM routes) add ZERO forecasting features today and are stated as join and
  rights infrastructure rather than signal; ntm-stops-national at 104 MB is the
  largest object acquired and contributes nothing to any current model, which is
  a deliberate and stated trade. Do NOT commit raw data, edit app/,
  contracts, pyproject, CI, IMPLEMENTATION_STATUS, JOURNAL, any ADR, or git.
