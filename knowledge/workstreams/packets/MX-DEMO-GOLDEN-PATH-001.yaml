objective: >
  A one-command end-to-end demo on REAL public data producing independently-
  verifiable artifacts -- the proof a skeptic can run without a pilot.
owned_paths: [demo/, evidence/artifacts/golden-path/ (gitignored output), knowledge/architecture/decisions/0023-golden-path-real-data-demo.md]
