id: MX-D-ADAPTIVE-MEMORY-002
status: completed
dispatched_date: "2026-07-24"
completed_date: "2026-07-24"
adr: knowledge/architecture/decisions/0034-adaptive-memory-feature-store-promotion-drift.md
result: "52 tests (feature_store 13 + promotion 22 + drift 17); mechanical leakage guarantee proved on real AAR panel; COVID-2020 detected as CUSUM change-point"
objective: >
  Phase-3 gate item D. A real v0.1 slice of Program D's adaptive memory: a
  leakage-safe point-in-time feature store, a champion/challenger/canary
  promotion controller (beyond ADR-0010's single champion pointer), and a
  drift / change-point detection service. Demonstrated on real-aggregate or
  public data, never faked.
owned_paths:
  - app/core/feature_store.py
  - app/core/promotion.py
  - app/core/drift.py
  - evidence/conformance/property-tests/test_feature_store.py
  - evidence/conformance/property-tests/test_promotion.py
  - evidence/conformance/property-tests/test_drift.py
read_only_dependencies:
  - app/core/model_registry.py
  - app/core/task_registry.py
  - app/canonical/entities.py
  - app/canonical/time.py
  - realdata/leakage_audit.py
  - realdata/ (real aggregate panels, read-only, for the demonstration)
normative_contracts:
  - blueprint/05-core-model-runtime-and-forecast.md (Champion/challenger, Model resolution, drift)
  - ADR-0010 (model-registry single-champion pointer this extends)
required_outputs:
  - app/core/feature_store.py
  - app/core/promotion.py
  - app/core/drift.py
  - three conformance test modules above
acceptance_commands:
  - "py -3 -m pytest evidence/conformance/property-tests/test_feature_store.py evidence/conformance/property-tests/test_promotion.py evidence/conformance/property-tests/test_drift.py -q"
  - "py -3 -m pytest app/ evidence/conformance/ -q  # whole suite still green"
security_and_privacy_invariants:
  - "FEATURE STORE IS LEAKAGE-SAFE: an as-of read for entity at label time t returns only feature values whose knowledge/valid time is strictly < t (honor realdata/leakage_audit.py's future-corruption discipline). Include a mechanical leakage test: corrupt future rows, rebuild, assert every as-of feature at/<=cutoff is bit-identical."
  - "No raw PII; features keyed by opaque entity ids only (mirrors ServiceRequest.rider_ref tokenization)."
failure_injections:
  - "as-of read at t must NOT see a value stamped exactly at t or later (strict past-only)"
  - "promotion: a challenger cannot become champion without passing an explicit evaluated gate; a canary carries a traffic fraction in [0,1); demoting/rolling back is possible and recorded"
  - "drift: a stationary stream reports no change-point; an injected mean shift is detected; PSI/KS flag a shifted distribution and pass an unshifted one"
compatibility_matrix:
  - "at least one of the three services demonstrated on a REAL aggregate panel from realdata/ (label real-vs-synthetic in-artifact)"
evidence_to_emit:
  - "test counts; a short in-code demo or docstring showing the leakage test passing and a real-data drift/feature-store run"
upstream_blockers: []
downstream_consumers:
  - "app/forecast runtime (champion resolution); a future serve-time drift monitor"
notes: >
  Do NOT edit model_registry.py/task_registry.py (import them read-only); build
  promotion.py as a controller that composes ModelRegistry rather than mutating
  it. Do NOT touch pyproject (numpy/pandas/pydantic already present). Do NOT edit
  any shared doc (IMPLEMENTATION_STATUS, JOURNAL, README) or write ADRs/commit —
  the orchestrator does that. Status stays Demonstrated; never claim Validated.
