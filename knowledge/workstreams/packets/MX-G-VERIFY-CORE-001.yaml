id: MX-G-VERIFY-CORE-001
status: completed
completed_date: "2026-07-23"
objective: >
  Ship an independent verifier package -- schema, state-transition, and
  hash-chain checks -- that is organizationally separate from the
  app/canonical generator, per blueprint 19's requirement that
  candidate generators and independent verifiers remain separate.
owned_paths:
  - app/verify/
  - knowledge/architecture/decisions/0005-semantic-index-interface.md
read_only_dependencies:
  - app/canonical/entities.py (schemas only, not the appender/storage write paths)
  - app/canonical/state_machine.py (the SERVICE_REQUEST_TRANSITIONS table, which is the contract itself)
  - app/canonical/events.py (compute_hash/canonical_json only -- the hash function IS the contract)
normative_contracts:
  - blueprint/19-agent-swarm-execution-system.md, "Verifier and formal swarm"
  - blueprint/07-explain-replay-and-evidence.md (expansion plan)
inputs_and_fixtures:
  - evidence/conformance/fixtures/builders.py
required_outputs:
  - app/verify/{schema_verifier,state_verifier,hash_chain_verifier}.py
  - evidence/conformance/adversarial/test_tamper_and_isolation.py
acceptance_commands:
  - "py -3 -m pytest app/verify/ evidence/conformance/adversarial/ -v"
performance_budget: {}
security_and_privacy_invariants:
  - "verifier never imports HashChainAppender.append or SqliteCanonicalStore.append_event"
  - "verifier reads raw rows independently of the ORM-ish reconstruction path (raw_rows_for_tenant)"
failure_injections:
  - "tampered payload without hash recompute -> hash_mismatch"
  - "deleted middle event -> sequence_gap or prev_hash_mismatch"
  - "forged hash matching tampered payload but breaking the next link -> prev_hash_mismatch"
  - "cross-tenant read of the same aggregate_id -> empty result"
compatibility_matrix: []
evidence_to_emit:
  - "7 adversarial tests passing -- see evidence/conformance/adversarial/test_tamper_and_isolation.py"
forbidden_interface_changes: []
upstream_blockers: []
downstream_consumers:
  - Any future program needing a trusted, independent check (H replay, I evidence exports)
