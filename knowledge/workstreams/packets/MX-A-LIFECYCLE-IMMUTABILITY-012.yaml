id: MX-A-LIFECYCLE-IMMUTABILITY-012
status: completed
completed_date: "2026-07-26"
dispatched_date: "2026-07-26"
adr: null   # ADRs are the orchestrator's to write; this packet wrote none

objective: >
  Close the two P0 defects an external audit found in the durable lifecycle
  record -- the table Milexium presents as the answer to "what happened to this
  trip, who decided, and when?" -- so that the claims already made in writing to
  an industry contact are enforced by the DATABASE and the DEPLOYMENT CREDENTIAL
  rather than by a coding convention. Program A.

the_two_defects:
  p0_1_transaction_time_was_a_caller_assertion: >
    `record_lifecycle_transition` took BOTH `decided_at` and `recorded_at` as
    required arguments, and the only database rule was
    CHECK (recorded_at >= decided_at). The auditor inserted a transition whose
    decided_at was 2020-01-01 and whose recorded_at was one second later; it was
    accepted. The system proved that two CALLER assertions were ordered and
    nothing whatever about when the row entered Milexium. ADR-0063's claim that
    the record "refuses backdating" was therefore false as a general statement,
    and its stated limitation ("we can prove a record was not back-written
    relative to its own recording") was hollow, because that clock was
    caller-controlled too.
  p0_2_the_table_was_mutable_history: >
    The schema called the table append-only because no application code issued
    UPDATE or DELETE against it. The auditor wrote a valid denial, issued a
    direct SQL UPDATE changing actor_id, committed it, and read the forged actor
    back through the normal lifecycle API with no violation reported. There was
    no hash chain, no immutability trigger and no privilege boundary. Reproduced
    at the start of this packet under `milexium_app` on the container -- all
    three probes (backdate, forge, delete) succeeded.

the_irony_this_packet_records: >
  ADR-0063's own commit message argued that "a guard living only in the
  application is a guard a future direct-SQL path walks around" -- and then left
  append-only as exactly that. The same sentence applies one layer down and is
  why a trigger alone was not the fix: a table's OWNER can DROP TRIGGER, DISABLE
  TRIGGER, and CREATE OR REPLACE the function a trigger calls, so a guard
  installed by the application credential is removable by the application
  credential.

owned_paths:
  - app/canonical/lifecycle.py                       # late-arrival vocabulary, lag, chain, hash
  - app/canonical/lifecycle_verify.py                # NEW: the chain checker, separate from the writer
  - app/canonical/transaction_clock.py               # NEW: the ONE clock the write path may read
  - app/canonical/storage.py                         # SQLite store: stamp, chain, raw rows, verify
  - app/canonical/postgres_storage.py                # Postgres store: same + the seal
  - app/canonical/sql/schema_v0_1.sql                # 4 additive columns + 2 CHECKs on ONE table
  - app/canonical/sql/lifecycle_immutability_sqlite.sql       # NEW
  - app/canonical/sql/lifecycle_immutability_postgres.sql     # NEW (unprivileged fallback)
  - app/canonical/__init__.py                        # exports
  - platform/infra/compose/initdb/02-lifecycle-ledger-bootstrap.sql # NEW: the privileged, once-per-cluster step
  - evidence/conformance/property-tests/test_lifecycle_immutability.py       # NEW
  - evidence/conformance/property-tests/test_lifecycle_record.py
  - evidence/conformance/property-tests/test_lifecycle_rls.py
  - knowledge/workstreams/packets/MX-A-LIFECYCLE-IMMUTABILITY-012.yaml

read_only_dependencies:
  - MILEXIUM_INTERNAL_AUDIT_2026-07-26.md
  - knowledge/architecture/decisions/0063-lifecycle-decision-record.md
  - knowledge/architecture/decisions/0003-append-only-hash-chained-event-log.md
  - knowledge/architecture/decisions/0006-dedicated-postgres-dev-role.md
  - knowledge/architecture/decisions/0046-container-store-rls.md
