what_enforces_each_guarantee_and_at_what_layer:
  transaction_time:
    application: >
      `record_transition` has NO `recorded_at` parameter and no **kwargs (both
      asserted). The value comes from app/canonical/transaction_clock.py,
      which is the only module in the canonical package that reads a wall clock --
      so lifecycle.py, storage.py and postgres_storage.py stay literally
      clock-free and the AST assertion protecting `decided_at` keeps its full
      strength.
    database_postgres: >
      A `clock_timestamp()` DEFAULT on the column, PLUS a BEFORE INSERT trigger
      that refuses any recorded_at more than 60s from clock_timestamp()
      (SQLSTATE MX002). The trigger is the part that closes the audit finding: a
      DEFAULT fires only when the column is OMITTED, and the auditor's insert
      supplied it.
    database_sqlite: >
      The same 60s bound as a BEFORE INSERT trigger using julianday('now').
      SQLite has no expression that renders the fixed-width six-fraction form,
      so the WRITER stamps and the database bounds.
    credential: "not applicable -- the bound is a data rule, not a permission"
  late_arrival:
    application: >
      `ingest_lag_seconds` is measured, stored, re-derived on read from the two
      timestamps (a disagreement raises), and surfaced on `OutcomeExplanation`.
      Past 300s a row must name a `LateRecordingReason` from a CLOSED vocabulary
      of five, and a row INSIDE the bound may not name one.
    database: >
      CHECK (ingest_lag_seconds <= 300 OR late_recording_reason IS NOT NULL) and
      CHECK (late_recording_reason IN (...)), both in the portable DDL, both
      proven against raw SQL. The 300 literal is pinned against the Python
      constant by a conformance test.
  immutability:
    application: "no UPDATE/DELETE statement in app/canonical, asserted by source scan (unchanged)"
    database: >
      Four triggers owned by `milexium_ledger_owner`: reject UPDATE, reject
      DELETE, reject TRUNCATE (SQLSTATE MX001), bound recorded_at (MX002). SQLite
      gets the equivalent three.
    credential: >
      The table is OWNED by `milexium_ledger_owner` (NOLOGIN, NOSUPERUSER,
      NOBYPASSRLS), which is a member of the application roles and never the
      reverse -- so the ledger owner can reach a table the application created
      and the application can never SET ROLE to the ledger owner. The deployment
      credential holds exactly INSERT and SELECT, read out of
      information_schema.table_privileges.
  tamper_evidence:
    application: >
      prev_hash/hash per row, computed by the SAME normative `compute_hash`
      ADR-0003 made canonical for the decision ledger, over a domain-separated
      payload ("request_state_transition/v1"). `RequestTransition` recomputes and
      refuses a row whose hash disagrees with its contents, so a tampered row
      cannot be READ back as history. `lifecycle_verify.py` re-derives the chain
      from RAW stored rows and reports rather than raises.
    database: "CHECK ((sequence = 1) = (prev_hash IS NULL)) -- a chain cannot be silently re-rooted"
    credential: "none -- see limitations: the chain is evidence, not authentication"

adversarial_probes_run:
  - "the audit's backdated insert (decided_at 2020-01-01, recorded_at +1s), raw SQL, as milexium_app -> REFUSED, SQLSTATE MX002 (was: accepted)"
  - "the audit's forged-actor UPDATE, raw SQL, as milexium_app -> REFUSED, SQLSTATE 42501; stored actor unchanged; chain still verifies (was: accepted and read back)"
  - "raw DELETE of a recorded denial -> REFUSED 42501 (was: accepted, row gone)"
  - "raw TRUNCATE -> REFUSED 42501"
  - "UPDATE erasing reason_codes to '[]' -> REFUSED; the denial keeps its grounds"
  - "UPDATE backdating decided_at to 2020 -> REFUSED"
  - "DROP TRIGGER milexium_lifecycle_reject_update -> REFUSED 42501, 4 guards still enabled"
  - "ALTER TABLE ... DISABLE TRIGGER (named, and ALL) -> REFUSED 42501"
  - "ALTER TABLE ... OWNER TO CURRENT_USER -> REFUSED 42501"
  - "CREATE OR REPLACE of the guard function as a no-op -> REFUSED 42501"
  - "ALTER TABLE ... NO FORCE / DISABLE ROW LEVEL SECURITY / DROP POLICY -> REFUSED 42501"
  - "DROP TABLE request_state_transitions -> SUCCEEDED. A finding, not a pass: PostgreSQL allows DROP TABLE to the SCHEMA owner as well as the table owner, and the application credential owns the disposable schema. Recorded as the top residual risk and asserted by a test that documents the weakness rather than hiding it."
  - "GRANT UPDATE ON the table TO CURRENT_USER -> SUCCEEDED WITH A WARNING and granted nothing. A second finding about test design: a GRANT without grant option is not an error in PostgreSQL, so a `pytest.raises` test here fails and reads as 'the credential CAN grant itself UPDATE', which is false. The assertion is on the resulting privilege set instead, which stays {INSERT, SELECT}."
  - "pg_has_role(current_user, 'milexium_ledger_owner', 'USAGE') -> FALSE on both instances"
  - "recorded_at 61s in the past and 61s in the future (one second past the bound) -> REFUSED MX002; 30s off -> ACCEPTED (positive control)"
  - "raw INSERT omitting recorded_at entirely -> stamped by the server inside the window the insert happened in"
  - "raw INSERT 3 days late with no declared reason -> CheckViolation; the same row with INTEGRATION_OUTAGE declared -> accepted"
  - "SQLite: UPDATE, qualified DELETE, and UNQUALIFIED DELETE (the truncate-optimization shape) -> all IntegrityError"
  - "SQLite: raw INSERT with a 2020 recorded_at -> IntegrityError from the clock-bound trigger"
  - "chain: four fields mutated on raw rows (actor_id, to_state, reason_codes, decided_at) -> each detected"
  - "chain: a well-formed forged row APPENDED after a terminal denial -> detected as a broken link AND a state discontinuity"
  - "a row inserted with a wrong hash -> refused on READ (LifecycleChainError)"
  - "an append at sequence 2 with a NULL prev_hash -> refused by the genesis CHECK before the verifier saw it, so a forger cannot omit the link"

mutations_checked:
  method: >
    Each mutation was applied, the test that claims to cover it was run, and the
    change was reverted. Where a mutation came back GREEN the MUTATION was
    checked first, per the packet's instruction.
  results:
    - "M1  drop the append-only UPDATE trigger from the unprivileged fallback -> RED"
    - "M1b disable the SQLite append-only UPDATE trigger (WHEN 0)              -> RED (see the_two_that_came_back_green_first)"
    - "M3  give record_transition a `recorded_at` parameter again              -> RED"
    - "M6  remove the late-arrival CHECK from the portable schema              -> RED"
    - "M7  raise the Python threshold without changing the SQL                 -> RED"
    - "M8  drop actor_id from the hashed payload                               -> RED"
    - "M9  make the chain verifier ignore prev_hash linkage                    -> RED"
    - "M10 make the seal a no-op that still reports success                    -> RED"
    - "M11 stamp recorded_at from decided_at instead of the clock              -> RED"
    - "M12 revert the fixed-width timestamp format to isoformat                -> RED (see the_two_that_came_back_green_first)"
    - "M13 let the read path skip the stored-hash check                        -> RED"
  the_two_that_came_back_green_first:
    M1b_the_mutation_was_wrong: >
      The first M1b renamed the SQLite trigger rather than removing it, so the
      trigger still existed and still fired -- the mutation did not remove the
      guard it claimed to. Re-run as `WHEN 0` on the same trigger (a real
      disable): RED. The TEST was sound; the mutation was not.
    M12_the_test_was_wrong_and_it_was_this_packet_that_broke_it: >
      M12 reverts `iso_fixed_utc` to `.isoformat()`, which is the collation defect
      MX-A-LIFECYCLE-RECORD-010 was built to survive. It came back GREEN. The
      mutation was checked first and was correct -- so the TEST had stopped
      covering it, and this packet is what stopped it.

      The trap only bites when the two timestamps share a SECOND: that is when the
      comparison reaches the punctuation the collation weighs wrongly. The
      original test used a fixed `decided_at` and a caller-supplied `recorded_at`
      a fraction later. When `recorded_at` became the stamped NOW, the pair became
      2026-07-01 vs 2026-07-26 -- strings that differ in the DATE, decided long
      before any fraction. The test still passed, and would have kept passing with
      the format reverted and the CHECK constraint quietly unsound.

      Rewritten to build the pair from ONE instant: `recorded_at` is a real stamped
      time and `decided_at` is that same instant with its microseconds cleared, so
      they share a second by construction, and the row goes in by raw SQL so both
      sides are controlled. M12 is now RED, and the test asserts the same-second
      property explicitly so a future edit cannot silently un-cover it again.

      This is the ninth vacuous-test near-miss this repository has recorded, and
      the first one introduced BY a repair rather than found in existing work.

