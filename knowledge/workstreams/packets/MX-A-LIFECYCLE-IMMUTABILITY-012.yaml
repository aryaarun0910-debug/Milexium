tests_fixed_because_they_only_passed_under_the_weak_guarantee:
  - "test_the_decision_time_is_a_required_argument_with_no_default was parametrised over BOTH clocks. The `recorded_at` half asserted the defect: that a caller must supply transaction time. It now covers `decided_at` only, and a new test asserts `recorded_at` is not a parameter AT ALL (and that there is no **kwargs to smuggle it through)."
  - "test_the_decided_at_column_carries_no_default_in_the_live_database asserted `recorded_at` had NO database default. That was the defect stated as a guarantee. It now asserts the column HAS a clock_timestamp() default, with the decided_at half unchanged."
  - "test_the_stored_decision_time_is_the_callers_and_is_not_the_write_time passed a recorded_at of 2 July and asserted it round-tripped -- i.e. it proved the store stores what it is given, which is exactly what the audit exploited. It now asserts the stamped value falls inside the window the write actually happened in."
  - "test_a_write_recorded_before_it_was_decided_is_refused could only be reached by passing an earlier recorded_at. Renamed and re-aimed: the reachable case is now a decision claimed in the FUTURE, and the positive control asserts a prompt row is accepted with NO late reason."
  - "test_the_check_constraint_accepts_ordinary_rows_across_the_fractional_second_boundary was WEAKENED BY THIS PACKET before being fixed by it. Making recorded_at the stamped NOW moved the two timestamps into different DATES, so the collation trap the test exists to guard was no longer reachable and mutation M12 came back GREEN. Rebuilt so the pair shares a second by construction; M12 is RED and the same-second property is now asserted in the test itself."
  - "test_a_delete_cannot_reach_another_tenants_transitions asserted an unqualified DELETE removed only the ACTING tenant's rows -- true, and an admission that the credential could destroy an operator's denial history as long as it was the right operator's. It now asserts the DELETE fails and BOTH tenants' rows survive."
  - "test_the_acting_role_owns_the_lifecycle_table asserted the acting role OWNED the table. Ownership by the application credential is the defect this packet removed, so it now asserts the opposite, and the FORCE-collapse demonstration moved to an explicitly unsealed schema with a companion test proving the sealed credential cannot lift FORCE."
  - "The engine-comparison test excluded only transition_id. It now excludes the transaction-time fields and the hashes -- and ASSERTS the two engines' recorded_at values DIFFER, because equality there would mean one engine was copying a value rather than reading its own clock."

design_calls_recorded:
  - "A BOUNDING TRIGGER, NOT ONLY A SERVER DEFAULT. The packet asked for a trusted server-side default; a default alone would not have closed the finding, because a DEFAULT fires only when the column is omitted and the auditor's insert supplied it. The column has the default AND a BEFORE INSERT trigger that refuses any value far from the server clock. This also keeps recorded_at inside the hash chain: a trigger that OVERWROTE the value would force the writer to hash a value it cannot know until after the insert."
  - "THE LATE-ARRIVAL REASON IS A CLOSED VOCABULARY, not free text with a length rule. The audit's P1 on data governance found exactly that failure mode -- a rights assertion accepted because it was over 40 characters and contained the word 'commercial'. Five members, none of them meaning 'test' or 'unknown', because a vocabulary member that exists to let a caller past the rule is the rule not existing."
  - "A PROMPT ROW MAY NOT DECLARE A LATE REASON. Without the complement, the rule would be satisfiable by declaring BATCH_IMPORT on everything, and the field would stop carrying information."
  - "THE LAG IS RE-DERIVED ON READ rather than trusted. A stored measurement that can disagree with the two values it was measured from is a place to hide an edit."
  - "MEMBERSHIP RUNS ONE WAY. milexium_ledger_owner is granted membership IN the application roles so it can take ownership of a table they created; the reverse grant would hand the application the owner's powers and make the whole separation cosmetic. pg_has_role is asserted FALSE in the direction that would break it."
  - "THE SEAL IS A SECURITY DEFINER FUNCTION the unprivileged store calls on its own schema. Its reach is the ledger owner's reach -- the union of the application roles' own rights -- and its only effect is to REMOVE the caller's ability to mutate a table it owned."
  - "AN UNSEALED FALLBACK EXISTS AND IS REPORTED AS WEAKER. On a cluster where nobody has run the privileged bootstrap, the store installs the same triggers as the acting role and records `lifecycle_immutability == 'trigger_only'`. The conformance suite asserts the SEALED properties rather than accepting what it finds, so a machine without the bootstrap fails loudly instead of passing at a lower standard."
  - "DOUBLE PRECISION, NOT REAL, for ingest_lag_seconds -- caught in smoke testing. PostgreSQL's REAL is float4, so a lag of 2158626.005228s came back as 2158626.0 and the row could no longer be read. SQLite's REAL is already 8-byte, so the defect existed on ONE engine only: exactly the class ADR-0004's mirrored contract exists to catch."
  - "transition_payload MUST NOT ASSUME VALID INPUTS -- it runs before the model validates, so reading .value off a free-text reason code turned an intended ValidationError into an AttributeError from inside the hasher. Caught by an existing test, which is what that test is for."
  - "PYDANTIC WRAPS VALIDATOR EXCEPTIONS, so a rule that needs its own error TYPE at the API boundary cannot live only in the model. UndeclaredLateRecordError is raised by next_transition (before the model) and LifecycleChainError by the store's read path (before reconstruction); the model keeps both as second nets for records built outside a store. Without that, 'this record has been altered since it was written' would reach a caller as a generic ValidationError, indistinguishable from a bad enum."
  - "THE UNSEALED FIXTURE MUST STILL INSTALL THE FALLBACK TRIGGERS. A first version of `_leave_lifecycle_unsealed` skipped immutability entirely, which made the trigger tests pass vacuously against a table that had no trigger at all -- the ninth vacuous test this repository has caught. The flag now chooses between the two REAL configurations, and a test asserts the fixture is genuinely the weaker one."

status_claim:
  label: Demonstrated
  why_not_validated: >
    Validated requires consented operator data and none exists in this
    repository. Every fixture here is synthetic. Nothing in this packet is
    Validated and nothing should be described as such -- what is demonstrated is
    the mechanism, on two engines and two real deployment credentials, not that
    any agency's history is protected, because no agency's history is here.

what_a_determined_attacker_with_the_application_credential_can_still_do:
  - "APPEND A WELL-FORMED FORGED TRANSITION. INSERT is granted, by design, because appending is the credential's job. There is no secret in the hash, so an attacker with this source code can compute a valid one. Appending to a request whose chain is already terminal, or with a from_state that does not continue it, IS detected by the verifier -- but a plausible transition appended to an IN-FLIGHT request (a denial on a request currently negotiated) is indistinguishable from a real one. Preventing that needs authentication -- signed rows, or checkpoint roots anchored outside this database -- and this repository has neither."
  - "DESTROY THE RECORD WHOLESALE -- `DROP TABLE request_state_transitions` SUCCEEDS, and so does `DROP SCHEMA ... CASCADE`. Found while writing the conformance suite, not predicted: PostgreSQL permits DROP TABLE to the table's owner OR to the owner of the SCHEMA containing it, and the disposable per-run schema is created by, and therefore owned by, the application credential. There is a test asserting this weakness explicitly (test_the_credential_CAN_still_destroy_the_table_and_this_is_the_residual_risk) so that no future reader mistakes 'immutable' for 'indestructible'. The credential cannot alter one field of one row; it CAN delete the whole table, loudly. The deployment fix -- schema owned by a migration role, application granted USAGE only -- is Specified and NOT implemented, and the per-run disposable schema this test harness depends on is what stands in the way."
  - "LIE ABOUT decided_at. Unchanged from ADR-0063 and still the largest honest limit. What is enforced is that MILEXIUM did not invent the decision time; nothing enforces that the caller told the truth about it. The new ingest-lag machinery narrows this -- a decision claimed in the future is refused, and a gap from the transaction time must be declared -- but a caller who states a plausible recent decision time is believed."
  - "WRITE A ROW THAT IS ILLEGAL AS A HISTORY BUT LEGAL AS SQL. Only the timestamp ordering, the lag/reason implication, the vocabulary CHECKs and the genesis-link rule are enforced by the database. Transition legality and chain continuity are enforced in Python and re-checked on read, so raw SQL can insert an illegal transition; it simply cannot be read back through the store, and the verifier reports it. An analyst querying the table directly in SQL would see it."
  - "SEE ITS OWN TENANT'S ENTIRE REFUSAL HISTORY. RLS is tenant isolation, not need-to-know. Nothing here restricts which rows within a tenant the credential may read."
  - "STAMP recorded_at ANYWHERE INSIDE A 60-SECOND WINDOW of the true instant, by controlling the writer's clock. The database bounds the value; it does not force it. The window is RECORDED_AT_TOLERANCE_SECONDS and it exists to absorb host clock skew."
  - "ON SQLITE, EVERYTHING. Any process that can open the file can drop the triggers; there are no roles. The credential boundary is a PostgreSQL claim only, and SQLite (ADR-0004's dev/demo engine) must never be cited as evidence for it."

limitations:
  - "NOTHING WRITES TO THIS TABLE IN PRODUCTION CODE YET. Unchanged from MX-A-LIFECYCLE-RECORD-010 and it still bounds every claim above: app/decide, app/connect and app/api do not call record_transition. What is now immutable is a record nothing populates."
  - "THE VERIFIER SHARES A PACKAGE WITH THE WRITER. lifecycle_verify.py is a separate module and does not use the store's reconstruction path, but it is not the organizationally separate verifier app/verify is, and app/verify is not an owned path. The independent-verifier story does not yet cover the lifecycle chain."
  - "NO EXTERNAL ANCHOR. The audit's required repair says: if hostile or evidentiary timestamping matters, anchor signed checkpoint roots outside the database. This packet does not do that. Both clocks are still local, the chain is unsigned, and 'tamper-evident' must not be read as 'authenticated'."
  - "THE POSTGIS OBSERVATION STORE CREATES THIS TABLE UNSEALED. PostgisObservationStore applies the portable schema (so the table exists in its disposable schemas) and was deliberately NOT modified -- its RLS conformance test is another agent's owned path. It never writes lifecycle rows, but the table it creates has no guards."
  - "THE PRIVILEGED BOOTSTRAP IS NOT RUN BY ANYTHING AUTOMATIC ON AN EXISTING DATABASE. /docker-entrypoint-initdb.d runs only on an empty data directory and the native instance has no hook, so both were bootstrapped by hand for this packet (the same caveat ADR-0052 records). A checkout on a new machine gets `trigger_only` until someone runs it -- and the conformance suite FAILS there rather than skipping, which is deliberate."
  - "NO MIGRATION PATH. Four columns were added to an existing table and Program A still has no migration mechanism; both stores CREATE the schema at construction, so any database created before this packet needs a hand-written ALTER."
  - "NOT IN THE GENERATED CONTRACT. platform/contracts/generate.py is not an owned path and was not run, so the new fields do not appear in the JSON Schema, OpenAPI or proto surfaces and no TypeScript or Rust client can see them."
  - "THE 60s AND 300s CONSTANTS ARE JUDGEMENTS, not measurements. No operator integration has been observed to calibrate either."
  - "CONCURRENCY IS STILL UNTESTED. The head read, the hash computation and the INSERT are separate statements; UNIQUE (tenant_id, request_id, sequence) makes the loser of a race fail rather than corrupt the chain, but the error is still a raw IntegrityError/UniqueViolation and no test exercises it."

forbidden_interface_changes_observed:
  - "additive only in schema_v0_1.sql: 4 columns and 2 CHECKs on ONE table; ingest_lag_seconds is DOUBLE PRECISION, which SQLite takes as REAL affinity, so the portable file still executes unmodified on a bare sqlite3 connection (asserted)"
  - "no existing policy in rls_postgres.sql modified"
  - "record_transition's signature CHANGED deliberately -- `recorded_at` removed, `late_reason` added. Grepped first: no caller exists outside app/canonical and the lifecycle conformance tests, all of which are owned paths"
  - "app/canonical/observation_store.py deliberately NOT touched (its conformance test is another agent's path)"
  - "no ADR written; no git add/commit/push; knowledge/docs/**, research/** and test_realdata_governance.py untouched"

notes: >
  BASELINE: the three audit probes were re-run against the unmodified code as
  `milexium_app` on the container before any change, and all three succeeded --
  the backdated insert was accepted, the forged actor read back through the
  normal API, and the delete removed the row. That is the state this packet
  changed.

  The privileged bootstrap was applied by hand to BOTH local instances (native
  PostgreSQL 17.10 as `postgres`, containerized PostgreSQL 16.4 as its bootstrap
  superuser), because neither picks up an initdb hook on an existing data
  directory. No credential was printed, logged or committed.

  CONCURRENCY NOTE FOR THE INTEGRATOR, because it affects one reported number. A
  full `pytest app/ evidence/conformance/` run could not be completed from this
  packet: two sessions belonging to ANOTHER agent's concurrent work deadlocked on
  `ontology_facts` (one holding `UPDATE ontology_facts` idle-in-transaction, one
  blocked on `DROP TRIGGER ... ON ontology_facts`), and any run that reaches
  evidence/conformance/property-tests/test_ontology_store.py stalls behind that lock. The
  suite was therefore run with the three ontology/decision-snapshot files ignored.
  Nothing in that deadlock touches `request_state_transitions` or any owned path
  here, and the four lifecycle suites were run in full separately.
