problem: >
  Milexium could forecast in one place, solve in another and export evidence in a
  third. Nothing in the repository could hold one decision episode. The unit
  intelligence learns from -- what was knowable, what was chosen, what else was on
  the table, what was predicted, who decided, and what followed -- had no home,
  so the platform could describe outcomes and could not describe DECISIONS.

  Worse, the substrate it would have been built on was defective. The external
  audit of 2026-07-26 found the canonical lifecycle record's two clocks BOTH
  caller-supplied ("I inserted a transition today whose decided_at was 2020-01-01
  and whose recorded_at was one second later; it was accepted") and its
  "append-only" table rewritable by a direct SQL UPDATE that read back through
  the normal API with no violation reported. A decision-episode record built on
  those two properties would have inherited both.

what_was_built:
  ontology_v1: >
    OBJECTS (28 kinds) carry IDENTITY ONLY. There is no attribute field on
    `OntologyObject` and there is no attribute column on `ontology_objects`.
    Everything time-varying is a `SnapshotFact` with a receipt time. This is the
    modelling decision the whole package rests on: an attribute that could live
    on an object would have no receipt time, so a decision replayed at time T
    would read whatever it says NOW -- the commonest way leakage enters a
    warehouse, and it enters invisibly because the row IS correct, just not as of
    the decision instant. Statelessness makes that row unrepresentable rather
    than discouraged.

    RELATIONSHIPS (23 kinds) are first-class rows with a validity interval, an
    optional probability `weight`, a `retracts_relationship_id`, and a LEGALITY
    TABLE (`RELATIONSHIP_SIGNATURES`) that is total over the enum and enforced at
    construction. A foreign key could not have carried the packet's own vignette:
    "consumed two likely future pooling opportunities" needs cardinality > 1, a
    probability, and non-destructive contradiction, and a column has none of
    those.

    EVENTS (16 kinds) are receipt-stamped, hash-chained into the tenant's single
    receipt order, and carry a STORED `ingest_lag_seconds`. Beyond 300 seconds an
    event must name a `LateArrivalReason` from a closed vocabulary -- late arrival
    is declared, never hidden.

    ACTIONS (11 kinds) are typed and permissioned. `OntologyStore` exposes NO
    generic writer; its public surface is pinned by a conformance test. An
    `ActionRecord` cannot be constructed without an `Authority` holding the
    action's permission, an input snapshot id AND its content hash, the
    alternatives considered, the verifier verdict, and the policy version. A
    SYSTEM authority may not APPROVE or REJECT a recommendation, because a system
    approving its own recommendation is the recommendation under a second name.
    Outcomes are SEPARATE rows with their own receipt times, at their own
    horizons.

  decision_snapshot: >
    `DecisionSnapshot` is the point-in-time information set: what could
    reasonably have been KNOWN at the decision instant, not what turned out to be
    true. It carries facts, relationships, events and identity resolutions, all
    admitted by one rule, plus the scope and purpose it was taken under.

  provenance_envelope: >
    Every `SnapshotFact` carries: source system, source record id, event
    /observation time, MILEXIUM RECEIPT TIME (writer-assigned), quality state,
    confidence, repair kind + backward-only repair lineage + repair note, privacy
    classification (`SensitivityClass`, reused from app/canonical unforked)
    + a `special_category` flag, legal-use basis, and missingness reason. A fact
    must carry a VALUE XOR a MISSINGNESS REASON -- an unexplained null cannot be
    stored, in Python or in the DDL.

  identity: >
    `IdentityResolution` retains match candidates with probabilities. An
    ambiguous match stays UNRESOLVED (an honest state, not an error), dependent
    facts carry `MissingnessReason.UNRESOLVED_IDENTITY`, and every candidate
    survives. Resolving to a non-candidate, to a weaker candidate, or to a tie is
    refused (`ForcedMatchError`). A later resolution is a NEW receipt-stamped
    record, so a snapshot taken before it correctly does not see it.

how_the_information_set_boundary_is_enforced:
  layer_1_sql: >
    `OntologyStore._select_content` issues `receipt_time < ?` as a WHERE-clause
    predicate over fixed-width ISO-8601 UTC text, on every one of the four
    streams a snapshot admits. A post-boundary row is never fetched and then
    filtered -- it is never fetched. Same mechanism, same spelling, as
    `app/core/feature_store.PersistentFeatureStore`'s `knowledge_time < ?`;
    that module's `_iso_utc` is IMPORTED here rather than re-implemented, so
    there is one timestamp convention in the repository and not two. A test
    parses `store.py`'s AST and asserts at least four `receipt_time <` literals
    inside `_select_content` and zero `receipt_time <=` anywhere.
  layer_2_construction: >
    `DecisionSnapshot`'s model validator re-checks every admitted item against
    `as_of` and raises `SnapshotLeakageError`. Redundant with layer 1 ON PURPOSE:
    an in-memory snapshot built without a database obeys the identical rule, and
    the boundary is asserted by two independent implementations.
  layer_3_structure: >
    A `DecisionSnapshot` holds NO reference to a store. Tuple-valued collections
    (a `list` field would let a caller append a future fact into an
    already-validated snapshot); no callable field; and an AST test asserts
    `snapshot.py` imports nothing whose module name contains "store" and reads no
    clock. The audit view that deliberately has NO time filter (`fact_history`)
    lives on the STORE, never on the snapshot -- that is the "read path other than
    the obvious one" a leakage test must cover, and it is covered by placement,
    not by discipline.
  layer_4_content_hash: >
    `content_hash` is a COMPUTED PROPERTY, not a stored field, over the admitted
    content INCLUDING `as_of`. `record_action` compares it against the value
    recorded when the snapshot was taken and raises `ForgedSnapshotError` on
    mismatch. This exists because pydantic's `model_copy(update=...)` and
    `model_construct` skip validators by design: a forged snapshot with extra
    facts, or with a later `as_of`, is one line away and passes layer 2 because
    layer 2 never runs.
  layer_5_receipt_monotonicity: >
    THE PROPERTY THAT MAKES AN INFORMATION SET FINAL, and the one the packet did
    not ask for by name. Receipt times are non-decreasing per tenant, enforced
    (a) in `receipt.next_stamp`, (b) by a BEFORE INSERT trigger on
    `ontology_receipt_log` on BOTH engines (MX002/MX003), and (c) detectably, by
    a per-tenant hash chain covering every stream. Consequence: once a snapshot at
    T has been taken, nothing can afterwards appear before T -- so a snapshot
    rebuilt tomorrow for the same T is byte-identical, and `load_snapshot` (which
    RE-DERIVES rather than caches, because the content is deliberately not stored)
    is a LEAK DETECTOR rather than a tautology.

leakage_probes_run:
  - "Read-path totality: the test enumerates `dir(DecisionSnapshot)` PLUS `model_fields` and fails unless every public member is either probed against a poisoned store or listed in a short justified `_NOT_A_READ_PATH`. 56 members enumerated: 36 PROBED (11 fields, 15 projections, 7 serialisation paths including the deprecated v1 shims, `content_hash`, `verify`, `redacted`/`for_training`), 20 justified as non-read (class-level schema/config and CONSTRUCTORS -- two of which, `construct`/`model_construct`, are forgery paths and get their own dedicated test rather than being waved through). Adding a read path without a probe breaks the suite; so does listing a probe for a member that no longer exists."
  - "Sentinel poisoning, not equality assertions: post-boundary writes carry a unique string, a unique number and a unique attribute prefix, and every probe's rendered output is searched for all three. A probe cannot pass by returning a shape the author did not anticipate."
  - "POSITIVE CONTROL: `store.fact_history` (the audit view, no time filter) MUST show `[None, 14.0]` -- the decision-time absence and the later actual. Without this the corruption could be inert and every no-leak assertion vacuous."
  - "The label case specifically: `actual_pickup_delay_minutes` is NOT_YET_KNOWN at decision time and 14.0 afterwards; the snapshot reads None, and reads the MISSINGNESS REASON, not an unexplained null."
  - "Boundary exactness: a fact stamped at exactly `as_of` is excluded; the same fact one microsecond earlier is admitted."
  - "Serialisation paths: `model_dump`, `model_dump_json`, the deprecated `dict`/`json`/`copy` shims, and a full JSON round trip that goes back through the validator and still refuses an injected future fact."
  - "Projection paths: `feature_vector` (the most dangerous -- where a future value would be laundered into a float), `provenance_manifest`, `redacted`, `for_training`."
  - "Forgery paths: `model_copy(update={facts})`, `model_copy(update={as_of})`, `model_construct` -- all caught by `verify()` and/or the store's hash comparison; an action citing a forged or unknown snapshot is refused."
  - "Reproducibility: a snapshot rebuilt AFTER the future arrives is byte-identical (`model_dump_json` equality, not just hash equality)."
  - "Drift detection: with the monotonicity trigger DROPPED, a raw INSERT behind the boundary makes `load_snapshot` raise `SnapshotDriftError` -- proving the detector is not decorative."
  - "Retraction: a relationship retracted after the boundary still holds in the earlier snapshot ('who did the dispatcher believe was driving?'), and is gone from a later one."
  - "Identity: a resolution recorded after the boundary is invisible to the earlier snapshot, which still shows every candidate."
  - "Tenant: a cross-tenant item is refused at construction and by `verify()`; a second tenant's snapshot over the same scope is empty."
  - "Structural: `snapshot.py` imports no store module, reads no clock, holds no callable field, and its collections are tuples (append raises)."
  - "Signature: NO store method accepts `receipt`/`receipt_time`/`recorded_at`/`receipt_sequence`, read back with `inspect.signature` rather than asserted in prose."

mutations_checked:
  method: >
    25 single-point source mutations, applied one at a time to the shipped
    source (including the two .sql trigger files), with the named test files
    re-run and the file restored afterwards. Harness lived in the scratchpad, not
    the repo. After every batch the restored tree was re-run and confirmed green.
  all_red_first_time:
    - "M1  SQL boundary `receipt_time <` -> `<=`                          -> RED (2 failed)"
    - "M2  construction-time boundary check made a no-op                  -> RED (2 failed)"
    - "M3  `verify()` made a no-op                                        -> RED (2 failed)"
    - "M4  `as_of` dropped from the content hash                          -> RED"
    - "M5  clock-regression guard removed from `next_stamp`               -> RED (3 failed)"
    - "M6  SQLite receipt-monotonicity trigger neutered                   -> RED"
    - "M7  SQLite append-only trigger neutered on ontology_facts          -> RED (2 failed)"
    - "M8  PostgreSQL append-only trigger neutered (WHEN false)           -> RED (5 failed)"
    - "M9  `record_action` stops comparing the snapshot content hash      -> RED"
    - "M10 tenant conjunct removed from the point-in-time facts query     -> RED"
    - "M11 observation-cannot-precede-receipt rule removed                -> RED"
    - "M12 unique-argmax identity check removed (forced merge allowed)    -> RED"
    - "M13 relationship legality table ignored                            -> RED"
    - "M14 action permission check removed                                -> RED"
    - "M15 `load_snapshot` stops comparing hashes (drift detector off)    -> RED"
    - "M16 row digest becomes a constant (integrity check vacuous)        -> RED (2 failed)"
    - "M17 `ReceiptStamp.precedes` becomes non-strict                     -> RED"
    - "M18 model-training lawful-basis filter removed from the store      -> RED"
    - "M19 SQL splitter loses BEGIN/END awareness (triggers truncated)    -> RED (3 failed, 15 errors)"
    - "M21 value-XOR-missingness rule removed                             -> RED"
    - "M23 special-category lawful-basis guard removed                    -> RED"
    - "M24 late-arrival declaration requirement removed                   -> RED"
    - "M25 conflicted attributes silently enter the feature vector        -> RED"
  came_back_green_and_were_real_gaps:
    - id: M20
      mutation: "`DecisionSnapshot.for_training()` returns the UNFILTERED fact tuple."
      why_it_was_green: >
        Two independent paths reach a training snapshot -- `take_snapshot(purpose=
        MODEL_TRAINING)` and the `for_training()` projection -- and only the first
        was covered. `_probes` did call `for_training()`, but on an episode whose
        facts were ALL trainable, so the filter had nothing to remove and its
        absence was invisible. The mutation was correct; the test was the gap.
      closed_by: "test_for_training_drops_a_fact_with_no_lawful_basis -- re-run: RED."
    - id: M22
      mutation: "The cross-tenant admission check in `DecisionSnapshot._validate` deleted."
      why_it_was_green: >
        The store's own `tenant_id = ?` conjunct means it never PRODUCES a
        cross-tenant item, so the object-layer defence had nothing exercising it
        and could have been removed silently. It is defence in depth that matters:
        a snapshot can be constructed by something other than this store (an
        evidence-pack reader, a replay importer, a future adapter) and those have
        no SQL predicate protecting them. The mutation was correct; the test was
        the gap.
      closed_by: "test_a_snapshot_cannot_admit_another_tenants_item -- re-run: RED."
  additional_defect_found_while_writing_the_tests:
    - >
      `test_every_ontology_table_refuses_update` initially reported ALL NINE
      tables as unguarded. The tables were guarded; the TEST was wrong -- it ran
      `UPDATE <table> SET tenant_id = tenant_id` against EMPTY tables, and a
      BEFORE UPDATE row-level trigger does not fire when there are no rows, so
      the statement succeeds on both engines whatever guards exist. Had the
      assertion been written the other way round it would have been GREEN with
      every trigger deleted. Fixed by writing one row into all nine streams
      first, and by asserting the rows are VISIBLE before attempting the update.
      The same failure shape recurred in the PostgreSQL reopen test, where RLS
      (not emptiness) was hiding the row: fixed by scoping the session and
      asserting visibility first.

