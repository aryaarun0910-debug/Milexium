result: >
  147 tests, 0 skipped, in a NEW package `app/ontology/`. PostgreSQL 17 +
  RLS RAN against the native dev instance (not skipped): ENABLE and FORCE
  asserted from pg_class for all 9 tables, cross-tenant raw scan, the RESET /
  EMPTY-STRING deny case, foreign-tenant write rejection, a FORCE-lifted
  boundary-collapse control, and statement-level TRUNCATE refusal. 25 mutations
  applied and checked: 23 went RED first time; 2 came back GREEN, BOTH were real
  test gaps rather than wrong mutations, and both are now closed and RED.

objective: >
  Give Milexium a representation for a complete DECISION EPISODE -- the request
  that arrived, the vehicle expected free, the trips that were compatible, the
  pooling opportunities the assignment consumed, the dispatcher's override, and
  the fourteen-minute-late pickup that followed -- and make the point-in-time
  INFORMATION SET behind each decision a first-class, provably leakage-safe
  object. This is the connective tissue between forecasting, solving and
  evidence export, and it is designed to be loadable the day an operator's
  8-12 weeks of records arrive.

