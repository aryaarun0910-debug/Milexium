security_and_privacy_invariants:
  - "All 9 tables are tenant-scoped and get ENABLE **and** FORCE row-level security. The application role OWNS them and an owner bypasses RLS by default, so ENABLE alone is a false green (ADR-0018). Both flags are read out of pg_class, and a FORCE-lifted control shows the boundary collapsing and then restores it."
  - "The deny-all default is proven for the case that ACTUALLY OCCURS: after a RESET (a pooled connection reused) `current_setting(name, true)` returns the EMPTY STRING, not NULL. The test asserts the GUC reads as '' FIRST, then that zero rows come back, so it is not silently proving the NULL branch."
  - "The SAME GUC name (`milexium.tenant_id`) as app/canonical and app/core, so one connection carrying all three contracts cannot be scoped to two tenants at once."
  - "Person references are tokenised everywhere: `Authority.actor_ref`, `OntologyEvent.actor_ref`, rider pseudonyms. `extra='forbid'` on every model means an ingest carrying a real name alongside a token fails at construction."
  - "`MatchCandidate.evidence` holds opaque feature tokens ('surname_exact'), never the surname -- an evidence string containing the value would be a disclosure inside an audit field."
  - "Field-level legal basis: a `NOT_ESTABLISHED` fact may be used for OPERATIONAL DISPATCH and may NOT enter a MODEL_TRAINING snapshot. Enforced at snapshot construction, not left to a downstream feature builder."
  - "Special-category (health-adjacent) data cannot be held with `legal_basis='not_established'` -- in Python AND as a CHECK. Deliberately the WEAKEST defensible rule: which bases actually suffice is a jurisdiction-specific legal question this repository is not entitled to answer."
  - "`redacted()` replaces a protected value with SUPPRESSED_PRIVACY rather than deleting it, so a redacted export stays distinguishable from a field the operator never collected."
  - "`provenance_manifest()` deliberately excludes VALUES: it is the artefact most likely to leave the tenant boundary, so it carries no personal data by construction rather than by a redaction step someone must remember."

failure_injections:
  - "direct SQL UPDATE / DELETE on any of the 9 tables (populated) -> MX001, both engines"
  - "TRUNCATE on PostgreSQL -> MX001 via a STATEMENT-level trigger (a row-level trigger does not fire for TRUNCATE; a suite that only tried UPDATE would have been green)"
  - "raw INSERT into the receipt ledger with an earlier receipt_time -> MX002, both engines"
  - "raw INSERT with a gapped receipt sequence -> MX003, both engines"
  - "a store clock wound backwards -> ReceiptClockRegressionError"
  - "a rejected write (unexplained null) -> the receipt sequence is UNCHANGED (the ledger row rolls back with it), then the next accepted write takes it"
  - "trigger dropped + row mutated -> the forgery is readable through the normal API (the audit's exact finding, reproduced deliberately) AND `verify_integrity` reports it"
  - "a snapshot forged with model_copy / model_construct -> `verify()` raises; `record_action` raises ForgedSnapshotError"
  - "an action citing a snapshot this store never took -> UnknownSnapshotError"
  - "a row written behind an already-taken boundary (guard removed) -> SnapshotDriftError on reload"
  - "an illegal relationship (incident -> forecast) -> IllegalRelationshipError"
  - "a foreclosed pooling edge with no weight -> refused"
  - "a system authority approving its own recommendation -> PermissionDenied"
  - "an action against a FAILING verifier with no justification -> UnverifiedActionError"
  - "an identity resolved to a weaker or tied candidate -> ForcedMatchError"
  - "candidate probabilities summing above 1 -> refused"
  - "an imputed value classed as an observation -> refused"
  - "an observation timestamped after its receipt -> refused"
  - "an event more than 300s late with no declared reason -> refused"
  - "a cross-tenant item admitted to a snapshot -> SnapshotLeakageError"
  - "an unmodelled personal field smuggled onto a fact -> refused"

compatibility_matrix:
  - "ontology_v0_1.sql executes unmodified on a bare `sqlite3` in-memory connection (the file's ACTUAL BYTES, with nothing from this repo in the loop) and on PostgreSQL 17."
  - "Portable subset asserted by reading the file: no JSONB, no CREATE TYPE, no ENUM, no SERIAL, no GENERATED ALWAYS, no GEOMETRY, no `$$`."
  - "DOUBLE PRECISION everywhere, never REAL: PostgreSQL's REAL is float4 while SQLite's is 8-byte, so a REAL column silently loses precision on one engine. Asserted by a test that greps the schema."
  - "15 store tests are parametrised [sqlite]/[postgres] and run the SAME assertions on both, so a behaviour that holds on the reference engine and not on the production target cannot pass unnoticed."
  - "Statement counts of all four .sql files are pinned (13 / 20 / 40 / 36), because the BEGIN/END- and `$$`-aware splitter is load-bearing: a naive splitter truncates every SQLite trigger body at its inner semicolon and silently installs triggers that do nothing. The counterexample against app.core.migrations.split_statements is itself a test."

guesses_about_operator_data:
  preamble: >
    THE MOST VALUABLE SECTION OF THIS PACKET. Every item below is a place where
    the design had to assume a shape for data nobody has yet handed us. Each is
    stated with what was assumed, why, what it costs to be wrong, and -- since the
    packet asked for the guesses to be cheap to change -- where exactly to change
    it. None of these is Validated; all fixtures are synthetic.
  ask_the_first_operator_for:
    - guess: "MILEXIUM'S RECEIPT TIME IS A USABLE PROXY FOR THE OPERATOR'S OWN KNOWLEDGE TIME."
      assumed: >
        The snapshot boundary is keyed on when MILEXIUM received a fact. If an
        operator's system knew a vehicle was unavailable at 10:30 and exported it
        at 11:00, a 10:45 snapshot correctly does not contain it -- correctly for
        Milexium, but the DISPATCHER knew at 10:30.
      cost_if_wrong: >
        Replaying operator decisions would systematically credit them with less
        information than they had, biasing any "we would have done better"
        comparison in OUR favour. This is the single most dangerous assumption in
        the package.
      ask_for: >
        A source-side knowledge/entry timestamp on every exported row -- the
        instant the record became visible IN THEIR system, distinct from both the
        operational event time and the export time. Ask whether their booking /
        AVL / dispatch systems record one at all; many do not.
      change_cost: "One nullable column and one extra conjunct. Low, IF asked for before an operator's history is loaded; retrofitting it later is impossible for data already ingested."

    - guess: "INGEST LAG SEPARATES CLEANLY AT ~300 SECONDS."
      assumed: "`LATE_ARRIVAL_THRESHOLD_SECONDS = 300` -- long enough to exclude any plausible queue/polling delay, short enough to catch a human typing it in later."
      cost_if_wrong: "Either every row demands a late-arrival reason (noise) or none does (the declaration becomes decorative)."
      ask_for: "The distribution of (entry time - event time) per event type, for 8-12 weeks. Especially no-shows and cancellations, which are the ones entered by hand."
      change_cost: "One integer in events.py, mirrored by one CHECK. Trivial."

    - guess: "0.95 IS THE RIGHT IDENTITY-MATCH THRESHOLD."
      assumed: "`DEFAULT_MATCH_THRESHOLD = 0.95`, chosen conservatively because an unresolved identity is recoverable and a wrong merge, once trained on, is not."
      cost_if_wrong: "Too high and most riders stay unresolved, so rider-history features are mostly missing. Too low and trips are attributed to the wrong people."
      ask_for: "A labelled sample of duplicate/near-duplicate rider records, and their own dedup rules -- most operators already have one, usually undocumented."
      change_cost: "One constant; `would_resolve` already takes the threshold as an argument. Trivial."

    - guess: "OPERATORS TRACK VEHICLE CONFIGURATION SEPARATELY FROM THE VEHICLE."
      assumed: "`ObjectKind.CAPACITY_PROFILE` exists because a bus with fold-up seats has a time-varying effective capacity."
      cost_if_wrong: "An unused object kind -- harmless. The reverse is the real risk: if they DO reconfigure and do NOT record it, wheelchair capacity is unknowable at decision time and every accessibility-denial analysis is built on a fiction."
      ask_for: "Whether securement positions are fixed per vehicle or configurable, and whether any system records the configuration in force on a given day."
      change_cost: "Additive. Low."

    - guess: "'WHY WAS THIS TRIP DENIED' IS ANSWERABLE FROM A CLOSED VOCABULARY."
      assumed: "`ReasonCode` (reused from app/canonical) has 7 members, and `ActionAlternative.failed_constraints` uses it."
      cost_if_wrong: "Real denial reasons land nowhere and reappear as free text, which is exactly what the closed vocabulary exists to prevent."
      ask_for: "Their actual denial/refusal code list, and 8-12 weeks of denials with codes attached. Expect a long tail and expect most of it to be one code meaning 'other'."
      change_cost: "Adding members to ReasonCode is additive BUT it lives in app/canonical, which this packet does not own. Coordinate."

    - guess: "ALTERNATIVES ARE RECOVERABLE FOR DECISIONS THE OPERATOR'S OWN SYSTEM MADE."
      assumed: "`ActionRecord.alternatives` is required (possibly empty). For a Milexium-solved decision we know the alternatives; for a historical operator decision we almost certainly do not."
      cost_if_wrong: "Every backfilled historical action has `alternatives=()`, which reads as 'nothing else was considered' when it means 'we do not know'."
      ask_for: >
        Whether their scheduler logs rejected candidate assignments at all. If
        not, this needs a THIRD state (empty vs unknown) rather than being
        silently backfilled as empty.
      change_cost: "MEDIUM and worth pre-empting: an `alternatives_known: bool` field, or a distinguished sentinel. Do NOT backfill empty tuples onto historical actions before deciding this."

    - guess: "AN OPERATOR CAN STATE A LAWFUL BASIS PER FIELD."
      assumed: "`LegalBasis` is per-field with `NOT_ESTABLISHED` as the honest default, and training excludes it."
      cost_if_wrong: "If an operator can only answer at table or system granularity, either everything is NOT_ESTABLISHED (nothing trainable) or the field-level structure is filled in with a uniform value and stops meaning anything."
      ask_for: "Their DPIA / records-of-processing, and whoever owns it. Ask early: this is a legal-team calendar problem, not an engineering one."
      change_cost: "The mechanism is fine either way; the risk is data quality, not schema."

    - guess: "SOURCES DISAGREE OFTEN ENOUGH FOR CONFLICT TO BE WORTH MODELLING."
      assumed: "Facts resolve latest-per-(subject, attribute, SOURCE), so two sources produce two retained facts and `value_of` refuses to guess."
      cost_if_wrong: "If conflicts are rare this is harmless. If they are COMMON (AVL vs dispatcher console on securement availability is the likely case), `value_of` raises constantly and callers need a documented precedence rule the ontology deliberately does not supply."
      ask_for: "Which systems are authoritative for which fields, in their own words. Expect the answer to be 'it depends' and to differ by shift."
      change_cost: "MEDIUM: a per-(tenant, attribute) source-precedence table. Deliberately not built on a guess."

    - guess: "A DECISION EPISODE'S PARTICIPANTS ARE KNOWN WHEN THE SNAPSHOT IS TAKEN."
      assumed: "`SnapshotScope.subject_ids` is required and non-empty; an unscoped snapshot is not offered."
      cost_if_wrong: "If a dispatcher's real information set is 'the whole board', a per-trip scope understates it and any replay is scored against a narrower view than the human had."
      ask_for: "A screen recording, or the actual dispatch UI. What is on screen IS the information set, and no data dictionary will tell you."
      change_cost: "Scope is persisted with the snapshot, so widening it later is a new snapshot, not a migration. Low mechanically, high in re-derivation cost."

    - guess: "8-12 WEEKS ARRIVES AS ROWS, NOT AS A STREAM."
      assumed: "Backfill works: `LateArrivalReason.BACKFILL` exists and receipt monotonicity permits any ORDER of ingestion as long as receipt times do not go backwards."
      cost_if_wrong: >
        A backfilled history has receipt times equal to INGEST time, not to when
        the operator knew things -- so every snapshot over backfilled data has the
        same boundary and the information-set property degenerates. THIS IS THE
        BIGGEST OPEN ISSUE IN THE PACKAGE and it is why the first guess above
        matters so much.
      ask_for: "A source-side knowledge timestamp (see guess 1). Without it, backfilled data supports outcome analysis but NOT decision replay, and the packet says so rather than pretending otherwise."
      change_cost: "See guess 1."

scope_honesty:
  what_this_is: >
    A representation for decision episodes and their point-in-time information
    sets, durable on two engines, tenant-isolated by the database, append-only by
    the database, and proven leakage-safe through every enumerated read path with
    25 mutations checked.
  what_this_is_NOT:
    - "NOT an adapter. Nothing in app/connect was touched; no operator format is parsed anywhere in this package. Loading an operator's 8-12 weeks still needs an adapter that maps their export onto these objects, facts and events."
    - "NOT wired into the solver, the forecaster, the evidence packs or the API. `app/decide`, `app/forecast`, `app/evidence`, `app/api` and `app/replay` are untouched. Nothing produces an ActionRecord from a real schedule run yet."
    - "NOT a migration path from app/canonical. The two models coexist; no canonical record is copied into the ontology and no reconciliation exists."
    - "NOT authenticated tamper evidence. The hash chain has no secret, so a party who can write can recompute. It catches a row changed WITHOUT recomputation. Anchoring signed roots outside the database is a separate piece of work."
    - "NOT privilege-separated on PostgreSQL. The application role owns the tables and could DROP the triggers. See limitations."
  status_label: >
    Demonstrated. Every fixture is synthetic; there is no consented operator data
    in this repository. NOTHING here is Validated, and the `guesses_about_operator_data`
    section above is the list of reasons it cannot be until an operator's records
    arrive.

limitations:
  - "PRIVILEGE SEPARATION IS ABSENT AND IS THE LARGEST REMAINING HOLE. The append-only guarantee rests on triggers the owning role can DROP (proven: a test drops one and shows the forgery succeed). The complete repair needs the tables owned by a role no application credential can assume, with the application holding INSERT/SELECT only. Creating a role requires a superuser, which `milexium_dev` deliberately is not (ADR-0006), so this packet CANNOT install it. The exact SQL is written out in sql/ontology_immutability_postgres.sql as a deployment task rather than left as a discovery. On SQLite there is no privilege model at all; there, detection (the hash chain) is the honest claim and prevention is not."
  - "THE CLOCK SEAM IS A TRUST BOUNDARY. `OntologyStore` takes its clock as a constructor argument so tests can drive receipt times. A process constructing the store with a lying clock gets lying receipt times. It is categorically different from the audited defect (a per-write parameter lets any caller lie differently on every row; a construction-time clock is one reviewable substitution that STILL cannot go backwards), but it is not a defence against a hostile operator of the Milexium process. That needs signed checkpoint roots anchored outside the database."
  - "NO CONCURRENCY TESTING. `_stamp` reads the tenant's head and inserts; two concurrent writers would race on `receipt_sequence`. On PostgreSQL the primary key on (tenant_id, receipt_sequence) makes the loser fail rather than corrupt, and `_atomic` rolls it back -- but there is no retry, no advisory lock, and no test. Single-writer-per-tenant is an untested assumption."
  - "SNAPSHOT COST IS UNMEASURED AT SCALE. `take_snapshot` issues four queries with an `IN (...)` over the scope. Indexes exist on (tenant_id, subject_id, receipt_time). Nothing has been run against more than a few dozen rows, and an operator's 8-12 weeks is the first real test."
  - "NO OPERATOR-FACING SEMANTICS FOR CONFLICT PRECEDENCE. `value_of` raises on disagreement by design; no precedence table exists because none should be guessed. Callers must handle it."
  - "REPAIR LINEAGE IS BACKWARD-ONLY BY DESIGN, so 'what did this fact become?' is a query (`WHERE repairs_fact_id = ?`) with no index on that column. Cheap to add; not added speculatively."
  - "THE ATTRIBUTE VOCABULARY IS OPEN. `SnapshotFact.attribute` is a free string -- deliberately, because a closed enum would mean an operator's genuinely-held field could not be loaded at all. The cost is that two adapters could name the same concept differently and nothing would notice. A per-tenant attribute registry is the obvious next step and is not built."
  - "`ObjectKind.CAPACITY_PROFILE`, `PROTECTED_ZONE`, `SERVICE_RULE`, `ELIGIBILITY_PROFILE` and `JOURNEY` have no adapter, no fixture beyond synthetic ones, and no operator has confirmed they exist in the shape modelled. See guesses."
  - "The PostgreSQL suite runs ~25s locally because each test builds a disposable schema. CI does not provision PostgreSQL, so these tests SKIP there -- the same narrower-CI-signal limitation the 2026-07-26 audit recorded for the repository as a whole. They RAN here."

forbidden_interface_changes_observed:
  - "app/canonical/** NOT modified (read-only imports of ids, time, vocab, events)."
  - "app/decide/**, knowledge/docs/**, research/** NOT touched."
  - "evidence/conformance/property-tests/test_realdata_governance.py NOT touched."
  - "app/core/feature_store.py NOT modified -- `_iso_utc` is imported from it."
  - "No ADR written. No git add/commit/push. platform/contracts/ NOT regenerated. IMPLEMENTATION_STATUS.md and knowledge/docs/JOURNAL.md NOT edited -- the orchestrator's to make."
  - "No secret committed: the PostgreSQL password is read from %USERPROFILE%\\.milexium_pg_app_password.txt at connection time (ADR-0006), never hardcoded and never logged."

downstream_consumers:
  - "Program B (adapters): an operator export now has a target that preserves receipt time, missingness reason and legal basis per field. An adapter can be written the day a sample arrives."
  - "Program D (adaptive memory): `DecisionSnapshot.for_training()` is the leakage-safe feature source; `ActionRecord` + `ActionOutcome` is the (state, action, outcome) triple a policy learner needs."
  - "Program F (solver): a schedule run can emit one ActionRecord per assignment carrying its probed alternatives, which the DecisionAlternative table already holds in canonical form."
  - "Program H (replay): `load_snapshot` re-derives a decision's exact information set, which is what an honest counterfactual replay requires and what the current replay does not have."
  - "Evidence packs: `provenance_manifest()` is a value-free, per-fact provenance view already shaped for export."

notes: >
  BASELINE NOTE FOR THE INTEGRATOR. Four other packets were building concurrently
  in app/canonical, app/decide, knowledge/docs/ and research/. This packet is
  disjoint from all four: it adds a NEW package and three NEW test files, and
  modifies no existing file anywhere in the repository. Its only coupling to the
  concurrent work is READ-ONLY imports of app/canonical/{ids,time,vocab,
  events}.py, none of which were among the files those packets had modified at
  the time this one ran.

  ONE THING WORTH THE ORCHESTRATOR'S ATTENTION: this package re-implements, in
  app/ontology/sql/, the same three-layer append-only discipline that the
  concurrent MX-A-LIFECYCLE-IMMUTABILITY-012 packet is landing for
  app/canonical. The two were built independently and reached the same
  design (trigger + privilege note + hash chain, SQLSTATE marker MX001). They
  should probably converge on one shared implementation later; they were not
  merged here because app/canonical is another packet's owned path.
