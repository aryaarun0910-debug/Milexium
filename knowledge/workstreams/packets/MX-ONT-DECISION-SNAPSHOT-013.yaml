full_suite_result: >
  2689 passed, 1 skipped, 0 failed, 4 warnings in 693.70s, run with the
  concurrent packets' work also present in the tree. The single skip is the
  pre-existing missing generated GTFS scheduled-deadhead narrative the
  2026-07-26 audit already recorded; it is not caused by this packet and this
