failure_injections:
  - >
    MUTATION-CHECKED, 7 injections, all RED, all reverted. (1) v3 dollar line
    restored to generate_v3_emails.py -> caught by the emitted-string sweep.
    (2) "$94,399,949 per year" restored to market_sizing.md -> caught. (3)
    "validated as the right objective" restored to platform/tools/build_model_cards.py
    -> caught by regenerating the model cards into a temp path. (4)
    value_10pct_deadhead_cut restored to build_economics.py and the table
    rebuilt -> caught twice, by the column check and the sweep. (5) a SENT
    agency's hook rewritten into the new wording -> caught (see next entry).
    (6) a savings hook injected into a live worksheet row -> caught. (7)
    compute_savings() re-added to peer_position.py -> caught.
  - >
    MUTATION 5 PASSED ON THE FIRST ATTEMPT AND THE TEST WAS WRONG. The
    sent-record check asserted ">= 13 rows still carry the old hook"; because 14
    rows qualify, overwriting SamTrans's record left 13 and the suite stayed
    green. A count is satisfied by the wrong thirteen. The check now pins the
    exact organisations by name. This is recorded because the failure mode —
    a threshold that a fourteenth row silently covers for — is the same shape
    as the defect the packet exists to fix.
  - >
    MUTATION 2 INITIALLY ESCAPED THE GENERAL SWEEP. The first version excused
    any hit sitting within three lines of retirement language ("removed",
    "rejected", ...), so a restored $94M line in market_sizing.md was excused by
    the paragraph underneath it, which says the relationship was rejected. Only
    the targeted "$94M is back" assertion caught it. The excuse is now OPT-IN
    via a four-file allowlist of hand-written documents and is unavailable to
    generated artifacts, since a generated file never legitimately narrates its
    own history.
  - >
    The Python half of the sweep parses the AST and scans EMITTED STRING
    LITERALS, excluding comments and docstrings, rather than raw lines. A line
    scan cannot tell a claim the code prints from a comment explaining that the
    claim was deleted, and this packet adds a lot of the latter. It is also
    strictly stronger: f-strings and implicit concatenation are reassembled, and
    the original offending copy was split across source lines.
  - >
    Two numbers in the dispatch brief were NOT written because they do not
    trace to a JSON artifact. The cost-per-trip QUINTILE medians
    ($53.10/$48.30/$52.21/$53.10/$55.00) quoted in business/outreach/README.md cite
    research/h5b_structure_vs_cost.PY, which computes quintiles but persists
    none of them; h5b_structure_vs_cost.JSON has no quintile field. The README
    now cites the gate-passed QUARTILE medians ($48.53 / $53.34 / $52.30 /
    $54.09) from business/outreach/panel_findings.json instead. Same correction 012
    made in docs; the outreach copy still had the untraceable version.
  - >
    The occupancy finding is published with its own rejection attached. The
    brief presents occupancy as the replacement for deadhead, and it is — but
    the closely related pooling claim `dr_pooling_efficiency_declined` was
    REJECTED by the panel gate on BOTH effect size (|-4.6%| vs a 5.0% floor)
    and composition (only 363 of 1,607 balanced-panel agencies, 22.6%, file
    Passenger Miles Traveled at all; it is a Full Reporter obligation so the
    filers skew large and urban). Occupancy at -10.0% clears the effect floor
    where trip length does not, but it inherits the identical selection bias.
    business/outreach/README.md therefore scopes it as a hypothesis for shadow mode
    rather than a sector finding, and names the rejection.
