    pipeline still generated business/outreach/drafts/V3_anne_arundel_county.txt
    addressed to transportation@aacounty.org, the exact inbox that asked to be
    removed. generate_expert_emails.py has always honoured it; the agency
    pipeline did not, and an opt-out enforced by only one of two pipelines is
    not an opt-out. Now enforced in both, at both layers: no insight is computed
    for an opted-out organisation, and any stale draft on disk is deleted on
    every run — a stale draft is indistinguishable from a fresh one at send
    time. This predates the packet; the draft was on disk before any change.
  - >
    business/ntd/build_outreach_targets.py described a filtered median as national. The
    panel was computed AFTER `df = df[df.trips >= 20_000]`, so every hook that
    said "the national median is $X" quoted $36.61, the median of operators
    above 20k trips, rather than the true national $37.97 over 1,920 filers.
    Fixed by taking the comparison panel before the targeting filter. The same
    shape of error is now avoided explicitly in build_contact_worksheet.py and
    generate_design_partner_emails.py.
  - >
    Ranking the national panel on cost per trip alone puts 20-trip tribal and
    rural programs at the top — arithmetically the most expensive operators in
    the country and completely wrong targets. The old deadhead-dollar ranking
    hid this by accident because it scaled with size. The mid-size band from
    design_partner_pitch.md is now applied in the generator too, and the trap is
    written into the pitch document.
  - >
    platform/tools/build_model_cards.py would have deleted the ADR-0001 status paragraph
    ("**Status: Demonstrated, never Validated.** ...") from knowledge/docs/MODEL_CARDS.md
    on its next run. 012 added it to the document by hand; the generator never
    carried it. This is the same defect class as the two strings the brief
    named, and strictly worse in effect — it removes the strongest honesty
    statement in the file rather than adding a weak one. The paragraph is now a
    STATUS_CONTRACT constant in the generator with its own test.
  - >
    platform/tools/build_model_cards.py called OUT.write_text() with no encoding. On
    Windows that is cp1252, which cannot represent the em dash the corrected
    wording uses. Now explicit UTF-8.
  - >
    NOT FIXED, OUTSIDE OWNED PATHS, REPORTED. app/replay/teardown.py:82
    and :759 justify DEFAULT_REDUCTION_FRACTION = 0.10 by appeal to
    "business/ntd/agency_economics.csv's value_10pct_deadhead_cut convention". That
