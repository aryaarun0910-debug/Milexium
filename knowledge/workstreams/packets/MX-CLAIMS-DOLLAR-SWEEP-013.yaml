id: MX-CLAIMS-DOLLAR-SWEEP-013
status: completed
dispatched_date: "2026-07-26"
completed_date: "2026-07-26"
adr: >
  none — this packet writes no ADR. It repairs claim language and deletes claim
  MACHINERY in artifacts that generate outbound copy, against contracts that
  already exist: ADR-0001 (status vocabulary), ADR-0058 (panel-findings gate)
  and the refusal already implemented in app/replay/teardown.py, which
  will not emit a savings envelope without an operator's own fixed/variable
  cost split. It introduces no platform mechanism, no schema and no runtime
  behaviour. The standing rule it leaves behind (business/outreach/README.md, business/ntd/README.md)
  restates those contracts where copy actually gets written; it does not amend
  them.
objective: >
  MX-DOCS-CLAIM-SWEEP-012 removed the $94M deadhead opportunity figure from the
  YC draft and reported four live defects it did not own. This packet closes
  those, and they outrank the documents 012 fixed: unlike a draft, these
  artifacts GENERATE claims and send them to real US transit agencies, and one
  of them is the backend for a self-serve widget destined for a public website.
  A public tool that hands any agency an unsupported savings number is the
  single most damaging artifact this repo could ship.

  The finding that invalidates all of it: deadhead share does not identify an
  expensive agency. Pearson +0.017, OLS R2 0.0003 at n=405
  (research/h5b_structure_vs_cost.json); Spearman +0.024 against cost per trip
  across 406 operators versus +0.738 for cost per HOUR, with cost-per-trip
  quartile medians flat at $48.53 / $53.34 / $52.30 / $54.09
  (business/outreach/panel_findings.json, `dr_deadhead_predicts_cost_per_trip`, REJECTED
  by the panel gate on effect size). The arithmetic cost of empty running is
  real. The diagnostic and causal claim built on it is not.

  Repair, not retreat: replace the unsupported SAVINGS framing with a
  defensible COMPARISON framing, so outreach ends up with a hook that is more
  checkable than the one it lost, not with an apologetic gap.
