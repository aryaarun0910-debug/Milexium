    business/ntd/peer_position.py replacing business/ntd/savings_calculator.py, with
    compute_savings() removed outright and compare_agency() in its place.
  - >
    business/ntd/build_economics.py no longer computing value_10pct_deadhead_cut, and
    business/ntd/market_sizing.md carrying a national reference distribution instead of
    the $94,399,949 line.
  - >
    Position-based hooks in business/ntd/build_outreach_targets.py,
    business/outreach/build_contact_worksheet.py and
    business/outreach/generate_design_partner_emails.py, with one shared definition.
  - >
    business/outreach/build_peer_insight.py no longer computing modelled_gap_value_usd
    and business/outreach/generate_v3_emails.py no longer rendering it.
  - >
    platform/tools/build_model_cards.py reproducing the corrected knowledge/docs/MODEL_CARDS.md
    byte-for-byte apart from the generation date.
  - >
    evidence/conformance/property-tests/test_claim_discipline.py, mutation-checked.
