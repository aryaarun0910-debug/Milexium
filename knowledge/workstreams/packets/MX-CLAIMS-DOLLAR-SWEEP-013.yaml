  - knowledge/architecture/decisions/0058-panel-findings-gate.md
  - knowledge/docs/MODEL_CARDS.md                          # read to match corrected wording; NOT written
  - app/replay/teardown.py                  # the refusal copy is held to
  - knowledge/workstreams/packets/MX-DOCS-CLAIM-SWEEP-012.yaml
  - app/**                                  # NOT touched — agents concurrent
  - knowledge/docs/**                                      # NOT touched
  - research/**                                  # NOT touched — read only
  - evidence/conformance/property-tests/test_realdata_governance.py   # NOT touched
normative_contracts:
  - >
    No savings, ROI or "opportunity" figure may be published while no operator
    fixed/variable cost split exists. app/replay/teardown.py already
    refuses to emit a savings envelope without one; copy does not get a lower
    standard than code.
  - >
    A dollar figure that is pure arithmetic on the agency's own filing ("these
    empty vehicle-hours cost $X at your own reported average cost per hour")
    may be stated ONLY while labelled an accounting identity and paired with an
    explicit statement that recoverability is unknown. It may never be
    presented as a saving, an opportunity, or a benefit of adopting Milexium.
  - >
    Where a function's entire purpose is to produce an unsupported number, the
    function is REMOVED rather than watered down. A hedge on a figure whose
    premise is false makes the falsehood harder to notice, not safer.
  - >
    ADR-0001 status vocabulary: Exists / Specified / Demonstrated / Validated /
    Production. Nothing here is Validated. Every artifact in this packet
    describes what agencies FILED, which is not what happened, and no operator
    has confirmed any of it against their own books.
  - >
    Every published number names the artifact it came from: research/*.json,
    business/outreach/panel_findings.json, or an ADR. An unsourceable number is deleted,
    not softened.
  - >
    A record of what was SENT to an agency is evidence and is never edited to
    make a check pass. Preserving it beats a green test.
required_outputs:
