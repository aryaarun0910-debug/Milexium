found_beyond_the_dispatch:
  - >
    SEVERITY-1, FIXED, NOT A CLAIM DEFECT. Anne Arundel County explicitly opted
    out on 2026-07-25 ("please remove us from your mailing list", NEVER contact
    again) and is correctly marked do_not_contact — but business/outreach/build_peer_insight.py
