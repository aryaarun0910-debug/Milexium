notes: >
  Deliberately NOT done, and why. No ADR, no git operations, no email. The
  worksheet was not regenerated wholesale — build_contact_worksheet.py refuses
  to overwrite hand-entered research and that guard was respected; only the
  email_hook column of unsent rows was rewritten in place, because that column
  is the live paste-ready sending surface and 40 rows were marked ready to send.
  A consequence worth flagging: the live worksheet's 109 agencies were selected
  under the OLD criteria (deadhead >= 15%), and the generator's criteria have
  changed, so a future regeneration will not reproduce the same pool. That is
  intended — the old pool was selected on a signal now known to be flat — but
  the hand-researched contacts must be carried across rather than blown away,
  and the docstring says so at the point of use.
