id: MX-H-SCALE-BENCHMARK-008
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
adr: null   # no ADR: a NULL result changes no decision. ADR-0026 stands unamended.
result: >
  NULL RESULT, WHICH IS THE SUCCESS: the ADR-0026 measured-bottleneck trigger has
  NOT fired. 17 new tests (0 skipped locally, 6 skip cleanly without the corpus);
  whole suite 1411 passed. A 7-rung ladder on REAL NYC TLC FHVHV rows -- 40,000 /
  66,940 (the ADR-0039 anchor) / 200,000 / 500,000 / 1,000,000 / 2,000,000 /
  5,000,000 segments -- ran to the top with no rung failing and no wall found.
  Wall clock 2.80s -> 156.54s: 125x the input for 56x the time, overall log-log
  slope 0.83, per-segment cost flat between 31 and 92 us/segment with NO upward
  trend. THE TEARDOWN IS LINEAR. Memory is likewise linear and is the constraint
  that eventually binds: 519 B/segment of transient heap (tracemalloc, 517-521
  across the whole 125x range -- a ~1% band) plus 654 B/segment to hold the
  segments, about 1.1 KB/segment total. WHERE THE TIME GOES: ~50%
  segment_set_fingerprint (two ISO strings per segment + sort + canonical JSON +
  SHA-256 -- deliberate ADR-0039 audit cost, not analysis), ~26% the
  hour-boundary split, ~7% each run grouping / bucket rollup / headline totals;
  shares stable across every rung. VERDICT against the real target (a mid-size
  operator's YEAR = ~300k-600k segments, not millions): 500,000 real segments
  tear down in 46.1s, and 600,000 at the WORST rate seen anywhere on the ladder
  is ~55s, on a 4-core 2019 ultrabook that was also running a browser and Docker.
  Python is adequate; crate #2 is not justified. Two honest findings recorded
  rather than glossed: (1) that ~55s sits close to the pre-registered ~60s
  threshold, and it passes only BECAUSE this is a once-per-export batch job --
  on the ADR-0042 interactive HTTP/SDK surface 46s is already unacceptable
  TODAY, whose fix is caching/async, not a language; (2) the single largest cost
  is optional bookkeeping, so a rewrite would optimise the wrong thing.
objective: >
  ADR-0026 gates the polyglot Rust rewrite behind THREE triggers and no others: a
  real user, a MEASURED bottleneck, or a second engineer to own Rust. "The
  programs are complete" is deliberately NOT a trigger. The ADR-0039 deadhead
  teardown was demonstrated on a 40,000-row sample of one TLC week (~4.9M rows);
  a design partner sending a YEAR of trip data is one to two orders of magnitude
  more, and nobody has measured whether pure-Python pandas/pydantic holds there.
  This packet MEASURES it: a reproducible scale ladder over the real TLC corpus,
  wall-clock and peak memory, a coarse profile saying where the time goes, and an
  explicit verdict against a realistic operator workload. A NULL RESULT IS A
  SUCCESS -- if Python is adequate, the measured-bottleneck trigger has NOT fired
  and the polyglot question is closed for now instead of speculated about.
