  - ADR-0047 (the scheduling entity family: DeadheadSegment's field semantics,
    and DeadheadKind's rule that the kind is carried by the source and never
    inferred)
  - ADR-0040 (PLATFORM_TENANT_ID owns records derived from public data that
    belong to no customer — which is exactly what public GTFS is)
