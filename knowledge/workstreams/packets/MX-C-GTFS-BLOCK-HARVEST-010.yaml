id: MX-C-GTFS-BLOCK-HARVEST-010
status: completed
dispatched_date: "2026-07-25"
completed_date: "2026-07-25"
adr: none — this packet acquires under the EXISTING governance (blueprint 17,
  ADR-0032/ADR-0036) and consumes Program A's EXISTING scheduling entities
  (ADR-0047). It introduces no new mechanism and amends no contract, so it
  writes no ADR.
objective: >
  Close the gap between INFERRED and RECONSTRUCTED deadhead. Everything the
  estate could previously say about non-revenue vehicle time came from the NTD
  Service form — one self-reported number per operator, per mode, per YEAR.
  GTFS trips.txt carries block_id, a day's chained vehicle work, and chaining
  consecutive trips within a block yields a measured DeadheadSegment: the exact
  Program A entity that had no real data feeding it. De-risk that capability on
  the Cal-ITP statewide assembly (CC-BY, keyless, ~200 California operators)
  rather than the national harvest, whose rights position depends on an FTA
  answer the founder has not received. Report honestly what fraction of
  agencies can be measured at all, and label the result SCHEDULED deadhead
  everywhere it appears so it is never mistaken for NTD's operated figure.
