security_and_privacy_invariants:
  - "HARD CONSTRAINT HONOURED: no paid services, no paid cloud. All seven
    objects download with plain unauthenticated curl from data.ca.gov. The only
    object store touched is the local MinIO at localhost:9000. California TIDES
    — by some distance the best dataset in the acquisition plan — was NOT
    acquired, because it is served from a requester-pays GCS bucket and would
    require a billing-enabled Google Cloud project. It stays out."
  - "RIGHTS VERIFIED FROM THE SOURCE, NOT FROM THE PLAN. The acquisition plan's
    own §5 says its sizes are estimates and its licence reads may be stale, so
    the CKAN record was fetched and read directly:
    https://data.ca.gov/api/3/action/package_show?id=cal-itp-gtfs-ingest-pipeline-dataset
    returns license_id='cc-by', rights='No restrictions on public use',
    accessLevel='public', isopen=true, organization='Caltrans'."
  - "THE PLAN'S EXPECTATION ABOUT THE LICENCE VERSION DID NOT HOLD, AND THE
    MANIFEST SAYS SO. The plan directed us to 'capture license_id / license_url
    from the CKAN API into the manifest rather than assuming 4.0'. We did — and
    license_url is http://www.opendefinition.org/licenses/cc-by, the Open
    Definition's VERSION-AGNOSTIC entry, which itself lists 4.0, 3.0 and 2.5.
    The source therefore still does not pin a version. The manifests record
    https://creativecommons.org/licenses/by/4.0/ as OUR choice of the current
    text, explicitly not as Caltrans' declaration. The commercial-use verdict is
    unaffected: every published CC-BY version grants commercial use."
  - "THE PUBLISHER'S OWN USE NOTE IS CARRIED VERBATIM. Caltrans states the
    assembly is 'for analysis purposes only. Do not use for trip planner
    ingestion'. That is not a CC-BY term and does not restrict commercial use,
    but it is the publisher's stated intent and is preserved in all seven
    manifests so a later reader cannot wire these bytes into a passenger-facing
    planner without seeing it."
  - "THE GRANT IS NOT LAUNDERED DOWNSTREAM. CC-BY covers CALTRANS' AGGREGATION.
    The ~200 upstream operator feeds keep their own terms — several of them the
    revocable click-through kind the estate has already refused (CTA, CapMetro,
    511 SF Bay). Every manifest carries an explicit SCOPE LIMIT saying this
    record is NOT authority to fetch any agency feed directly, and a test
    asserts that sentence is present."
  - "NO SECRETS TOUCHED. MinIO credentials stay in the gitignored
    platform/infra/compose/.env and were reached only through the existing
    acquire(back_with_object_store=True) seam. No source_url carries a key or
    token, and a test asserts it."
  - "NO BULK DATA COMMITTED. data/raw/ and data/canonical/ are gitignored by
    pre-existing rules (.gitignore lines 33-35, verified with git check-ignore).
    Only the seven manifests, seven acquired-records, and the two small derived
    summaries enter git."
  - "NO PERSONAL DATA. GTFS schedules contain no rider or operator identity.
    gtfs_datasets.csv carries an authentication_contact_details column that may
    hold operator staff contacts; it is declared in sensitive_fields, and is
    never read, joined, or reproduced in any derived artifact."
failure_injections:
  - "The 'probably public domain' shortcut: rejected structurally. The estate's
    base gate only blocks the literal words unknown/tbd/todo/?, so
    test_estate_calitp_manifests adds seven stricter assertions — the rights
    must name the licence, take an explicit commercial position, cite the
    machine-readable field they were read from, record the version as OUR
    choice, carry the CC-BY attribution obligation, carry the publisher's use
    note verbatim, and state the upstream scope limit."
  - "Silent divergence of the ledger: all seven manifests must carry a
    BYTE-IDENTICAL rights statement. Seven slightly different answers to one
    legal question would mean an auditor's verdict depended on which file they
    opened."
  - "After-midnight service: GTFS writes a 01:10 arrival on the following
    morning as 25:10:00. Wrapping that to a 24-hour clock sorts the last trip of
    a block before the first and turns a 20-minute gap into minus 23 hours.
    Asserted, and mutation-checked."
  - "block_id reused across physical vehicles: produces trips that overlap in
    time. These are DROPPED and COUNTED rather than chained into fictional
    movements — and the count is published, because a high overlap rate means
    that agency's block_id is not a real vehicle block."
  - "Layover mistaken for deadhead: a gap that begins and ends at the SAME stop
    is the schedule asserting the vehicle does not move. No DeadheadSegment is
    emitted for it; it is reported separately as layover-in-place. This is the
    single easiest way to overstate the measurement."
  - "Frequency-defined trips: their stop_times rows are relative TEMPLATES, not
    absolute schedules. Chaining them would place a vehicle at a clock time it
    never occupies. frequencies.csv is acquired purely as an exclusion list."
  - "Guessing the deadhead kind: DeadheadKind's contract forbids inferring the
    classification from geometry or timing, and warns specifically that a wrong
    'interline' inflates the number an interlining change is judged by. Every
    emitted segment is 'other'. Mutation-checked with the most tempting wrong
    version — inferring 'interline' when the route changes."
  - "Minting a canonical Block: Block requires pull_out_at/pull_in_at and GTFS
    publishes neither. Setting them to the first departure and last arrival
    would redefine a block as its revenue envelope and erase the pull-out/pull-in
    exclusion by construction. No Block is created; block_id stays None."
  - "The label getting separated from the data: asserted IN the artifacts, not
    just in docstrings. Every JSONL row carries measurement='scheduled_deadhead'
    per-row (a file-level label would not survive a split-and-rejoin), and the
    summary's incomparability note is asserted to name the definitional gap
    BEFORE the operational one."
