notes: >
  STATUS IS **Demonstrated**, NOT Validated, and the distinction is load-bearing.
  Public GTFS is not operator-consented data: no California operator agreed to
  Milexium measuring their deadhead, no operator has confirmed these figures
  describe their service, and nothing here has been checked against an
  operator's own scheduling system. Validated requires that confirmation. What
  is demonstrated is that the reconstruction runs end-to-end on real
  multi-operator data through the governed estate and produces canonical
  entities Program A already defines.

  WHAT WAS DELIBERATELY NOT DONE. The national 1,214-agency harvest was not
  attempted — its rights basis is an FTA statement that conflicts with live
  agency click-through licences, and the founder's email has not been answered.
  California TIDES was not acquired (requester-pays GCS; a paid cloud
  relationship). gtfsrt.io was not touched (no data licence stated; the bytes
  are verbatim upstream agency feeds carrying their own terms). No calendar.csv
  was acquired, so service_ids are grouped but not resolved to real dates —
  which is why the emitted instants are anchored to one NOMINAL reference
  service date and say so in every row.

  THE HONEST HEADLINE. This measures what a timetable IMPLIES, not what
  vehicles DID. It excludes pull-out and pull-in entirely, which on many
  operators is the largest deadhead component; it cannot see lateness,
  short-turns, swaps or pull-downs; and it can only measure agencies that
  publish block_id at all. The numbers in
  data/catalog/calitp-scheduled-deadhead.summary.json must never be subtracted
  from an NTD operated-deadhead figure. Where the two are discussed together,
  the difference is FIRST definitional and only SECOND operational — and this
  packet cannot say how much is which.
evidence_to_emit:
  - "SEE data/catalog/calitp-scheduled-deadhead.summary.json — the measured
    figures are recorded there rather than duplicated here, so there is one
    place for them to be right."
