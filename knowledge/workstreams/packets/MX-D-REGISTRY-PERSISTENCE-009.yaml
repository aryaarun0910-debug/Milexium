the_mechanism:
  - "TWO TABLES, NOT ONE. `core_model_versions` is the catalog (the canonical `ModelVersion` fields plus `registered_at` and a per-tenant `registered_sequence`). `core_model_champions` is the registry's OWN ADR-0010 single champion pointer. Persisting that pointer into `promotion_champions` would have been the obvious saving and would have been wrong: `PersistentPromotionController` documents that it never touches the registry's pointer so the two mechanisms do not fight over one piece of state, and sharing a row would have let `registry.promote()` silently install a SERVING champion that no `promotion_decisions` row authorised -- making the ledger incomplete for the first time. A second table is the cost of keeping that promise."
  - "THE NAME IS `core_model_versions` BECAUSE `model_versions` IS ALREADY TAKEN. app/canonical/sql/schema_v0_1.sql declares a table of that name, and a Program D store can legally be opened against a database that also carries the canonical contract -- these tables deliberately hold no foreign key into it, which is exactly what makes that combination legal. The collision would NOT have been an error: every core CREATE is `IF NOT EXISTS`, so whichever contract created the table first would silently ABSORB the other's writes and each would read the other's rows as its own. Same reasoning that named the ledger `core_schema_migrations` (ADR-0055), applied where the other table genuinely exists rather than might."
  - "A MIGRATION, VERSION 2 -> 3, because the schema now has a ledger. Additive: `CREATE TABLE IF NOT EXISTS` for two tables and an index, no rebuild, no rewrite, not one existing row disturbed (asserted on the rows, not inferred from the absence of code that would move them). Detected, ordered, idempotent, stamped, and refusing an unknown or newer version exactly as ADR-0055 built it."
  - "EACH STEP NOW PRODUCES EXACTLY ITS OWN VERSION'S SHAPE -- a change to the EXISTING 1 -> 2 step, and the reason legacy/core_v0_2_pre_catalog.sql exists and (unlike the version-1 file) is APPLIED. While 2 and CURRENT were the same thing there was no difference to observe. They are not any more: a 1 -> 2 step that created the version-3 shape leaves the TABLES at 3 while the LEDGER says 2 for the real, committed window between two stamps, and a crash there produces a SchemaShapeMismatchError on the next open that nobody introduced by hand and no tool can resolve. Proved by calling _migrate_1_to_2 directly and asserting detect_shape() == 2, not 3."
  - "SHAPE DETECTION NOW MATCHES THE TABLE SET EXACTLY, not as a subset. Version 3 is version 2 plus two tables, so a subset test would report a version-3 database as version 2 (its seven tables DO match version 2, column for column) and the runner would re-apply a migration that had already run."
  - "ONE STORE CLASS, TWO ENGINES, as for the other two Program D stores: `PersistentModelRegistry` over the engine-parametrised `CoreDatabase`. Method-for-method signature parity with the in-memory `ModelRegistry` is asserted structurally, and the two are then run through the SAME sequence of operations with every observable compared -- after the persistent one has been closed and reopened, so what is compared is a restored database and not a warm object."
the_hazard_adr_0055_named_and_how_it_was_handled:
  - "WHAT ADR-0055 WROTE DOWN: 'A future data-moving migration on PostgreSQL will hit RLS. From v2 onward the tables are FORCEd, so a 2 -> N migration that counts or copies rows with no GUC in scope sees zero rows and \"succeeds\" having moved nothing. 1 -> 2 is safe only because v1 predates RLS.' The 2 -> 3 migration COUNTS ROWS, so it is that migration."
  - "WHY IT COUNTS AT ALL, which is the part worth arguing with. The catalog starting empty is not a neutral fact about a database that already has promotion state: promotion_champions, promotion_champion_history, promotion_challengers, promotion_canaries and both ledgers name model_version_ids that until now pointed at a Python dict. After this migration they point at a durable table that does not describe them, and that inherited obligation -- 'N model versions must be re-registered before a restored controller can validate them' -- is exactly the kind of thing a migration ledger exists to record. It CANNOT be discharged automatically: a champion pointer records an id, not a training manifest, a feature schema version, an evaluation window or an artifact hash. So the migration counts, and a WRONG count is not a wrong log line, it is a false reassurance written permanently into core_schema_migrations that an operator will later act on."
  - "STEP 1 -- SUSPEND. `CoreDatabase.suspend_row_level_security()`: `ALTER TABLE ... DISABLE ROW LEVEL SECURITY` on every table core_rls_postgres.sql guards, plus `SET LOCAL row_security = off` so PostgreSQL itself RAISES rather than filtering if anything was missed. It grants nothing -- the acting connection OWNS these tables and could have issued NO FORCE at any moment -- what it buys is that the lowering is written down, bounded and checkable rather than assumed."
  - "STEP 2 -- REFUSE IF STEP 1 DID NOT WORK. `_require_countable_rows` reads `pg_class.relrowsecurity` back for every table about to be read and raises `RowSecurityInForceError` if any is still guarded. This is the guard the whole packet turns on, and it exists because ZERO IS A PLAUSIBLE ANSWER: there is no result the migration could inspect that would distinguish 'the policy hid everything' from 'the table was empty', so the check has to be about the TABLE's catalog state. It reads relrowsecurity ALONE, deliberately, not relforcerowsecurity -- a table with RLS enabled but not forced happens to be fully readable by its owner and the acting role IS the owner, so a force-aware check would pass and rest the correctness of a migration on who owns a table, which is precisely the false green ADR-0046 records."
  - "STEP 3 -- RESTORE BEFORE THE COMMIT, NOT AFTER IT. `migrate()` commits after each migration's stamp, so a step that lowered the boundary and left restoring it to the runner's final apply_row_level_security() would publish a real, COMMITTED interval in which nine tables of operator data had no policy. `_migrate_2_to_3` re-applies core_rls_postgres.sql itself, inside its own transaction. The window is therefore never committed, never visible to another session (ALTER TABLE holds ACCESS EXCLUSIVE throughout it anyway), and rolled back in full if the migration raises."
  - "THE SAME GUARD WAS ADDED TO 1 -> 2 (which does not need it today). Version 1 predates RLS so its counts have always been honest -- but 'has always been' is a property of history, and if a version-1 database ever DID carry a policy the precheck would count zero and the migration would rebuild seven empty tables over seven populated ones. Free when the assumption holds."
  - "PROVED, NOT ASSERTED, IN FOUR TESTS: (a) the hazard is REAL -- a blind COUNT(*) under the version-2 policy returns 0 while a scoped positive control proves the row is there; (b) the migration gets the RIGHT number anyway -- the ledger note is asserted to contain the exact count 3, over three DISTINCT ids referenced from EIGHT columns across SIX tables, so a migration that counted rows or stopped at one table produces a plausible wrong number rather than an obviously wrong one; (c) neuter suspend_row_level_security and the migration REFUSES with RowSecurityInForceError instead of recording the zero; (d) a refused migration leaves relrowsecurity AND relforcerowsecurity TRUE on all seven tables after rollback."
security_and_privacy_invariants:
  - "tenant_id TEXT NOT NULL on both new tables, LEADING both primary keys, read out of each engine's own catalog (PRAGMA table_info / information_schema + pg_index) rather than from the DDL's text -- so a column that exists only in the file, or on one engine, fails."
  - "ENABLE *and* FORCE, and exactly one policy named tenant_isolation, per new table -- both bits read straight from pg_class, never inferred from behaviour, so an ENABLE-only outcome fails explicitly. FORCE is the bit that matters because the acting role OWNS these tables and a table owner bypasses RLS by default."
  - "THE FALSE-BEFORE / TRUE-AFTER CONTROL IS ON THE SAME RELATION. The portable DDL is applied alone -- both pg_class bits read FALSE, because core_v0_1.sql may contain no Postgres-only construct and therefore cannot enable anything -- and only then does core_rls_postgres.sql turn them on. Plus the stronger absence on the migration path: on a genuine version-2 database these relations are not merely unguarded, they are ABSENT from pg_class entirely."
  - "THE ACTING ROLE IS ASSERTED NON-SUPERUSER AND NON-BYPASSRLS before any policy result is believed (ADR-0006/0046/0052 -- PostgreSQL checks both BEFORE ownership and before FORCE, so a privileged credential would make every isolation assertion pass for the wrong reason), and asserted to OWN the new tables, so FORCE is what stands in the way rather than an ordinary privilege error."
  - "FORCE IS PROVED LOAD-BEARING, not assumed: lifted on core_model_versions, the other tenant's row becomes visible (asserted), FORCE restored, the boundary comes back."
  - "THE ONE ASYMMETRIC POLICY (ADR-0040/0043), and this is the first Program D table to need one. core_model_versions' USING admits PLATFORM_TENANT_ID so any SCOPED tenant may READ a platform model; its WITH CHECK omits it so a session acting as a customer cannot FORGE one -- proved adversarially with the Python guard deliberately bypassed, in BOTH directions (forged write -> InsufficientPrivilege; platform read by an unrelated customer -> the row comes back, so the refusal above is not just a policy that denies everything). The literal is asserted to appear exactly ONCE in the file and to be in the USING half and not the WITH CHECK half."
  - "THE EMPTY-STRING TRAP IS LIVE HERE FOR THE FIRST TIME IN THIS FILE (ADR-0043). Every other core policy survives a RESET session only INCIDENTALLY, because tenant_id = '' is false for any real UUIDv7. The platform branch has no such accident protecting it: tenant_id = '<PLATFORM>' is true whatever the GUC says, so without the non-empty conjunct a RESET session would read every platform model. The test asserts `value == '' and is_null is False` EXPLICITLY -- with a positive control first showing both rows ARE visible to a scoped session -- before deny-all is claimed, and no clause this packet added is written as IS NOT NULL (checked statically over the comment-stripped file as well as behaviourally)."
  - "core_model_champions is SYMMETRIC on purpose even though it points at rows that may be platform-owned. A platform MODEL is shared; the CHOICE to serve it is one operator's, and admitting the platform id there would have exposed another operator's serving decision. Proved: a cross-tenant read of the pointer returns nothing even when the model it names is the platform's."
  - "THE MIGRATION LEDGER RECORDS COUNTS AND NOT TENANT IDS. core_schema_migrations carries no RLS (deliberately -- a policied version record is unreadable at the moment it must be read), so anything written into a note is readable by any session holding the application credential. ADR-0055 already accepted that for the ONE legacy tenant id version 2 records; this migration would have had to write N of them, so it writes counts instead. Stated in the note itself."
  - "No PII: a ModelVersion is a record about a model. Entity ids elsewhere in Program D remain opaque and are untouched by this packet."
