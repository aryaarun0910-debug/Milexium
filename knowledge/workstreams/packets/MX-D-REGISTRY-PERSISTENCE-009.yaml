  - "a blind COUNT(*) on a genuine FORCEd version-2 database with the GUC RESET -> 0, with a scoped control proving the row is present (the hazard demonstrated before anything claims to handle it)"
  - "a version-2 database that has acquired a core_model_versions table -> UnknownSchemaVersionError (the table set is matched exactly), and the same condition reached by calling _migrate_2_to_3 directly -> CoreSchemaError naming the table"
  - "a cross-tenant INSERT into core_model_versions -> psycopg.errors.InsufficientPrivilege"
  - "a customer session forging a PLATFORM-stamped catalog row in raw SQL -> psycopg.errors.InsufficientPrivilege"
  - "PersistentModelRegistry(db, A).register(model owned by B) -> ForeignTenantModelError, on BOTH engines (SQLite has no policy and cannot have one)"
  - "PersistentModelRegistry(db, customer).register(platform model) -> ForeignTenantModelError whose message names the platform tenant"
  - "RESET milexium.tenant_id after migrating -> the GUC reads back as the EMPTY STRING (asserted) and BOTH new tables return zero rows, platform rows included"
  - "FORCE lifted on core_model_versions -> the other tenant's row becomes visible -> FORCE restored -> the boundary returns"
  - "register() with an unknown task -> UnknownTaskError AND zero rows in the table afterwards (rejected before the write, not after it)"
  - "CONTROL that the RLS assertions are not fixture artefacts: the SAME relations are asserted (False, False) after the portable DDL alone and (True, True) after core_rls_postgres.sql, and asserted ABSENT from pg_class on a genuine version-2 database"
  - "CONTROL that the hazard fixture is genuine: all seven version-2 tables asserted (True, True) out of pg_class BEFORE the migration runs -- without it, 'the migration counted correctly' would be evidence about the fixture"
  - "CONTROL that cross-tenant denials are not empty tables: every one is paired with a positive read as the owning tenant"
  - "CONTROL that unregistered_references() is live and not a snapshot: registering one of the three referenced ids removes exactly that id from the list"
