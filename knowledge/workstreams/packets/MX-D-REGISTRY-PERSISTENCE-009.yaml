objective: >
  Close the named open defect in IMPLEMENTATION_STATUS.md: "`ModelRegistry` is still
  in-memory: promotion roles survive a restart, the model catalog does not." That
  asymmetry is worse than either half of it alone. `promotion_champions` durably records a
  `model_version_id`; the `ModelVersion` it names lived in a Python dict, so a restored
  `PersistentPromotionController` held a champion pointer it could not resolve, could not
  validate a challenger against, and could not describe -- a dangling reference WITH an
  audit trail, which has every appearance of durability and none of the content.
  app/core/promotion.py named it in its own class docstring rather than hiding it.
  Persist the catalog in the same store and style as the rest of Program D's persistence
  (SQLite + PostgreSQL, one code path, idempotent DDL), WITHOUT weakening ADR-0002
  portability, ADR-0041's leakage guarantee, ADR-0048's tenant isolation or ADR-0043's
  platform-tenant rule -- and, because the schema now has a version ledger (ADR-0055), as
  a real MIGRATION rather than as an edit that reaches new databases and silently misses
  every existing one.
