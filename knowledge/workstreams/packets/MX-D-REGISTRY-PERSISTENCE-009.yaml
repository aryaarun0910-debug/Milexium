notes: >
  MUTATION-CHECKED (broken, seen red, restored) -- recorded because a green suite after a
  security change is a weaker signal than it looks, and because four tests this month
  passed while proving nothing:
    1. `suspend_row_level_security()` AND the `_require_countable_rows` guard both removed
       from _migrate_2_to_3 -> the ledger note records ZERO model versions and
       test_the_two_to_three_migration_counts_rows_the_policy_would_have_hidden FAILS. This
       is the mutation that matters: it reproduces exactly the ADR-0055 failure mode, and
       the test catches it on the number rather than on an exception.
    2. Only the suspension removed (guard left in) -> RowSecurityInForceError, and
       test_the_migration_refuses_rather_than_counting_through_a_live_policy is what
       demands that.
    3. `apply_row_level_security()` removed from the END of _migrate_2_to_3 ->
       test_row_security_is_restored_before_the_migration_commits FAILS, naming the
       unguarded table. (The runner's final call would have made this green AFTER a commit
       -- which is the committed window the test exists to forbid.)
    4. The `AND coalesce(current_setting(...), '') <> ''` conjunct deleted from the
       core_model_versions policy ->
       test_a_reset_guc_reads_back_empty_and_still_denies_platform_rows FAILS, exactly as
       ADR-0043 predicts.
    5. PLATFORM_TENANT_ID added to the policy's WITH CHECK ->
       test_a_customer_session_cannot_forge_a_platform_model and the literal-drift test
       both FAIL.
    6. detect_shape's exact set comparison relaxed to a subset test ->
       test_a_version_two_database_carrying_a_catalog_table_is_refused FAILS.
    7. The 1 -> 2 step pointed back at the CURRENT DDL ->
       test_the_one_to_two_step_produces_the_version_two_shape_and_stops FAILS.
    8. `self._db.commit()` deleted from PersistentModelRegistry.register ->
       test_the_model_catalog_survives_a_restart FAILS on both engines.

  AND MUTATION 8 FOUND A REAL DEFECT IN A TEST THIS PACKET HAD JUST WRITTEN, which is
  recorded because it is the exact class of vacuity the brief warned about.
  test_a_restored_controller_can_resolve_the_champion_it_was_left_holding was originally
  written the obvious way -- register, enrol a challenger, close, reopen -- and it stayed
  GREEN with the registry's commit deleted. `PersistentPromotionController` shares the same
  `CoreDatabase`, so ITS commit swept the registry's pending INSERT along with it and the
  durability the test appeared to prove was borrowed from a neighbour. The test now commits
  and REOPENS the catalog write on its own, before any controller exists, and fails under
  mutation 8. Found by mutation-testing rather than by review.

  HONEST LIMITS (v0.1, Demonstrated -- never operator-Validated; this packet cannot reach
  Validated because it has no consented operator data):

  - THE DANGLING REFERENCES A MIGRATED DATABASE INHERITS ARE COUNTED AND LISTED, NOT
    REPAIRED, and they cannot be. A champion pointer records a model_version_id; a
    ModelVersion also needs a training_data_manifest_hash, a feature_schema_version, an
    evaluation window and an artifact_hash, none of which exists anywhere in the version-2
    schema. Synthesising them would be the ADR-0055 sin (inventing a value that names
    nothing and is discovered late), so the migration records the size of the obligation
    and PersistentModelRegistry.unregistered_references() lists it per tenant. Until a
    caller re-registers them, a restored PersistentPromotionController composed with a
    persistent registry will refuse operations on them -- which is the correct behaviour
    and is also a REAL, USER-VISIBLE REGRESSION relative to composing an in-memory registry
    that the caller re-populated by hand. Named rather than smoothed over.
  - THE MIGRATION DOES NOT REFUSE ON A NON-ZERO COUNT, and that is a decision. Refusing
    would leave every existing database unopenable with no argument the caller could pass
    to proceed (there is no way to supply full ModelVersion records through
    CoreDatabase.sqlite/postgres), so the refusal would be a dead end rather than a
    decision point. The count is recorded and surfaced instead. If that turns out to be too
    quiet, the fix is a required acknowledgement argument, not a silent default.
  - A REFUSAL FROM INSIDE `apply` STILL LEAVES THE 'adopted' STAMP COMMITTED. ADR-0055's
    "a refused database is left byte-identical" holds for every PRECHECK refusal, which is
    where LegacyTenantRequiredError lives. RowSecurityInForceError is raised from inside
    _migrate_2_to_3, after migrate() has already stamped and committed the adopted version.
    The database is left at a consistent version-2 (shape and stamp agree) and a retry
    resumes correctly, so nothing is lost -- but "byte-identical" is not true of this
    refusal and the distinction is worth knowing before someone quotes the stronger claim.
  - MODEL VERSION IDS ARE UNIQUE PER TENANT, NOT GLOBALLY. The primary key is
    (tenant_id, model_version_id) and register() rejects only ids THIS registry can already
    see (its own plus the platform's). A global uniqueness check would have to read every
    other tenant's rows, which is the boundary. So two customers can each hold the same id,
    invisibly to each other. `_find` asks own-tenant BEFORE platform so the answer is
    deterministic if a customer id and a platform id ever coincide, but the narrow race
    (the platform registering an id a customer already holds) is not prevented, only made
    to resolve in the customer's favour.
  - THE PERSISTENT REGISTRY HAS NO UNSCOPED CATALOG VIEW, and this is a genuine contract
    divergence rather than an implementation gap. `ModelRegistry.list_for_task()` without a
    tenant returns EVERY registered version regardless of owner -- "the platform's own
    catalog view". The persistent one returns this tenant's plus the platform's, because a
    shared table under a policy must not do otherwise. Signature parity holds; that one
    behaviour does not, and a caller relying on the unscoped view gets a narrower answer
    rather than an error.
  - `get()` NOW ANSWERS 'not registered' FOR 'not yours'. That closes a gap ADR-0043
    recorded ("ModelRegistry.get remains un-scoped") for the persistent path -- deliberately,
    since an existence oracle over every tenant's catalog is worse than the inconvenience --
    but it means the two backends raise UnknownModelVersionError under different conditions.
  - SQLITE HAS NO POLICY AND CANNOT HAVE ONE. There the boundary is the store's
    `tenant_id = ?` predicates and the ForeignTenantModelError check -- application code,
    not a database boundary. Every isolation claim proved on SQLite is a claim about this
    class; only the PostgreSQL half is a claim about the database.
  - THE SUSPENSION LOWERS A REAL BOUNDARY, briefly and inside one transaction. It grants no
    privilege (the connection owns the tables and could issue NO FORCE at will) and no other
    session can observe it (ALTER TABLE holds ACCESS EXCLUSIVE; the DISABLE is never
    committed unguarded). But it IS a lowering, it is the first in this repository, and a
    future migration that copies it without also copying `_require_countable_rows` and the
    in-transaction restore would have the mechanism without the guard.
  - `SET LOCAL row_security = off` IS BELT-AND-BRACES AND IS NOT INDEPENDENTLY TESTED. Its
    effect (an ERROR instead of a silent filter) is unreachable in the suite because the
    DISABLE always precedes it and succeeds. It is there for the case where a future table
    is added to core_rls_postgres.sql and missed by ALL_CORE_TABLES.
  - THE 2 -> 3 PRECHECK REFUSES ONLY ONE THING (a catalog table that already exists), and
    through migrate() that condition is caught earlier by shape detection. It is reachable
    only on the direct-call path. Stated rather than counted as coverage it does not have.
  - SHAPE DETECTION STILL COMPARES COLUMN NAMES ONLY -- not types, primary keys, CHECK
    constraints or indexes (ADR-0055's existing limitation, unchanged). The new index
    ix_core_model_versions_task is created by the DDL and is NOT part of any version's
    detected shape, so a database missing it would still be adopted as version 3.
  - REGISTRATION ORDER ACROSS TENANTS RESTS ON A WALL-CLOCK TIMESTAMP. registered_sequence
    is per-tenant (forced by RLS), so a listing spanning a customer and the platform is
    ordered by registered_at with the sequence and tenant_id as tiebreaks. Deterministic,
    but two registrations in the same microsecond by two tenants order arbitrarily.
  - NO LOCKING AND NO DOWNGRADE (ADR-0055's stance, unchanged). Two processes migrating the
    same database at once are refused by the ledger's PRIMARY KEY, which is refusal rather
    than coordination.
  - THE IN-MEMORY `ModelRegistry` IS UNCHANGED and stays tenant-free, for the reason
    ADR-0048 gave: the gap was a shared TABLE, and a dict key is not a boundary.

  OUT OF SCOPE AND NOT TOUCHED: app/replay (byte-identical per ADR-0056),
  app/decide, app/connect, app/api, app/sdk-typescript, business/outreach/,
  app/canonical, evidence/benchmarks/, contracts, pyproject, CI. IMPLEMENTATION_STATUS.md,
  JOURNAL and the ADR are the orchestrator's -- the defect line at
  IMPLEMENTATION_STATUS.md:358-359 ("ModelRegistry is still in-memory...") and the
  "A future 2->N Program D migration will hit RLS" bullet above it are both now closed by
  this packet and were deliberately NOT edited here. No git operations. No new dependencies.
  No secrets.
